# Keeps only the newest Vercel deployments (see scripts/prune-vercel-deployments.mjs), so
# old previews do not pile up in Deployment Storage. Runs after each successful Vercel
# deployment, once a day, and on demand (manual runs default to a dry run).
# Needs the repository secret VERCEL_TOKEN; without it the job does nothing.
name: Prune Vercel deployments

on:
  deployment_status:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: true
      keep:
        description: "Newest ready deployments to keep (production and builds in progress are always kept)"
        default: "3"

permissions:
  contents: read

concurrency:
  group: prune-vercel-deployments
  cancel-in-progress: false

jobs:
  prune:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/prune-vercel-deployments.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prune
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          KEEP: ${{ inputs.keep || '3' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/prune-vercel-deployments.mjs
