:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#273831;background:#f4f2ec}*{box-sizing:border-box}body{margin:0}header{padding:34px max(24px,calc((100vw - 780px)/2));background:#fffdf7;border-bottom:1px solid #d9e0d7}.meta{font-size:12px;color:#61756a;letter-spacing:.09em}h1{font-size:clamp(27px,4vw,38px);line-height:1.45;letter-spacing:-.025em;margin:15px 0 22px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px}button{border:1px solid #acbfb0;border-radius:8px;padding:10px 18px;font:inherit;font-size:14px;background:#fff;color:#2e5640;cursor:pointer}button[aria-pressed=true]{background:#28543f;color:#fff;border-color:#28543f}.home{font-size:13px;margin-left:auto}main{max-width:828px;padding:24px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:10px 18px;padding:5px 0 24px;font-size:13px;border-bottom:1px solid #d8e0d8}a{color:#296b4b;text-underline-offset:4px}article{padding:10px 0 35px}p{font-size:17px;line-height:2;letter-spacing:.005em;margin:23px 0;overflow-wrap:anywhere}h2{font-size:23px;margin:48px 0 18px;scroll-margin-top:24px}code{font: .86em ui-monospace,SFMono-Regular,monospace;background:#e8eee5;border-radius:4px;padding:2px 5px;overflow-wrap:anywhere}pre{overflow:auto;background:#e8eee5;padding:20px;border:1px solid #d8e2d4;border-radius:8px;line-height:1.8}pre code{padding:0;font-size:14px}figure{margin:28px 0;padding:15px;background:#fff;border:1px solid #dbe2d8;border-radius:8px}img{display:block;width:100%;height:auto;object-fit:contain}figcaption{font-size:12px;line-height:1.7;color:#647268;text-align:center;margin-top:12px}footer{border-top:1px solid #d9e0d7;padding:20px 0;font-size:12px;color:#647268}:focus-visible{outline:3px solid #ba7741;outline-offset:4px}@media(max-width:600px){header{padding:25px 20px}main{padding:20px}p{font-size:16px;line-height:1.95}.home{width:100%;margin:10px 0 0}img{height:auto}h2{font-size:21px}nav{gap:12px 16px}}
</style></head><body><header><div class="meta" id="meta">学习笔记 02 · 已定稿 · 2026.09.06</div><h1 id="title"></h1><div class="toolbar"><button id="zh" aria-pressed="true">中文</button><button id="en" aria-pressed="false">English</button><a class="home" id="home" href="https://www.66ccff-labs.com/work/arduino-smart-car-line-tracker" target="_blank" rel="noopener">查看项目主页 ↗</a></div></header><main><nav aria-label="文章目录" id="toc"></nav><article id="article"></article><footer id="footer"></footer></main><script>const data={"zh":{"title":"Arduino 小车的循迹信号与输入采集","body":"<p>重新读小车的<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/testing-code/without-led/test-4-ir/test-4-ir.ino\" target=\"_blank\" rel=\"noopener\">红外测试程序<\/a>，我留意到 <code>if(sensor.ir_left_3)<\/code> 后面的一句注释，说的是左侧最外面的传感器“测到黑线或悬空”。黑线和悬空居然会进入同一个判断分支。这个细节让我想顺着代码往前找，看看地面反射的光经过了什么，最后才变成变量里的一个 <code>1<\/code>。<\/p><h2 id=\"section-1\">反射光与电压<\/h2><p>循迹部分使用 ITR20001。它把红外发光管和光敏三极管放在同一个封装里，朝向被测表面，<a href=\"https://everlightamericas.com/datasheets/ITR20001_T.pdf\" target=\"_blank\" rel=\"noopener\">Everlight 的器件资料<\/a>给出了这种反射式结构。发光管照亮车底的一小块区域，接收端根据返回的红外光产生电流。在合适的安装高度下，浅色地面和黑胶带的反射差异就可以用来判断线路位置。<\/p><figure><a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/manual-ir-sensor-schematic.png\" target=\"_blank\" rel=\"noopener\"><img src=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/manual-ir-sensor-schematic.png\" alt=\"循迹与轮速传感器电路，上半部分为 ITR20001 循迹电路\"><\/a><figcaption>循迹与轮速传感器电路，上半部分为 ITR20001 循迹电路<\/figcaption><\/figure><p>我先看图中上半部分的 ITR20001 电路。R1 为发光管限流，光敏三极管的发射极接地，集电极接在 <code>OUT<\/code> 上，R2 则从电源把这个节点上拉。接收到的反射光较强时，集电极电流增大，<code>OUT<\/code> 电压降低；反射光较弱时，R2 会把输出拉向电源电压。黑胶带和传感器悬空都可能使返回的光变少，开头那句注释由此就有了电路上的解释。<\/p><p>因此，读到高电平时，我首先知道的是接收端得到的反射光偏弱。要把它理解成车底有黑线，还得让传感器与赛道保持合适的相对位置。车身翘起、安装倾斜或离地过高，都可能改变接收到的光。<a href=\"https://www.pololu.com/docs/0J13/3\" target=\"_blank\" rel=\"noopener\">Pololu 的反射式传感器实验<\/a>也展示了高度变化的影响：在它的对照中，传感器离表面越远，黑白区域的输出电压差越小。看到这个结果，再读小车手册里把传感器移到黑胶带上方的测试方法，我会更注意移动时有没有顺手把高度也变了。<\/p><p>地面材质和环境光也会参与其中。肉眼看起来同样黑的两种材料，在红外波段的反射未必一样；表面光泽和角度还会影响有多少光返回接收端。环境中的红外光同样可能被接收。若换一块地面后判断变得不稳定，我会先保持位置和高度不变，比较输出电压，再观察遮挡外来光线后的变化。这样才能逐项看出是哪一个条件改变了读数。<\/p><h2 id=\"section-2\">输入电平<\/h2><p>顺着<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/smart-car-manual-teas1-en.pdf#page=45\" target=\"_blank\" rel=\"noopener\">总原理图<\/a>继续看，循迹传感器的输出接到了两片 74HC165 中的一片，传感器和这两片芯片的供电都标为 <code>3V3<\/code>。前面的光敏三极管电路没有单独的比较器，<code>OUT<\/code> 可以在一段电压范围内变化。进入 74HC165 后，输入电路按逻辑电平阈值识别高或低。程序稍后拿到的那个比特，只保留了这个判断结果，原来的电压值已经读不出来了。<\/p><p>这里我容易想当然地把 3.3 V 的一半当作分界。<a href=\"https://assets.nexperia.com/documents/data-sheet/74HC_HCT165.pdf#page=6\" target=\"_blank\" rel=\"noopener\">74HC165 数据手册<\/a>列的是保证识别为低电平的电压上限 <code>VIL<\/code>，以及保证识别为高电平的电压下限 <code>VIH<\/code>，两者随供电条件变化。中间那段电压不能预先指定成可靠的 <code>0<\/code> 或 <code>1<\/code>。要让黑白判断稳定，两个表面的输出就应分别进入可靠的高、低电平区，并留出余量；读数若只在门限附近摆动，光照或位置的小变化就可能让结果翻转。<\/p><p>这也让我更清楚地理解了这套电路取舍在哪里。程序只需处理几个开关量，读起来很方便；代价是接收光强的细节没有保留下来。面对一串 <code>1<\/code>，我还需要结合相邻传感器和车身位置，判断是经过了较宽的黑色区域，还是整个传感器排离地太远。单看一个变量名里的 <code>ir<\/code>，很容易略过这些条件。<\/p><h2 id=\"section-3\">并行装载与串行读取<\/h2><p>主板把七路循迹输入、六个碰撞开关和两个按键接到两片 74HC165 上，共用十五个输入位置。每片提供八位，两片串接后可以读出十六位。对照<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/testing-code/without-led/test-4-ir/comm.h\" target=\"_blank\" rel=\"noopener\">课程库的引脚定义<\/a>，Nano 用 D8 控制装载，用 D13 提供时钟，再从 D12 读取串行数据。多路输入在芯片旁边分别接好，到主控这边就沿同一根数据线依次传回来。<\/p><p>我读 <code>reload_shift_reg()<\/code> 时，先停在了循环前面的 <code>LOAD<\/code>。这个宏把 D8 拉低，等待 1 ms，再拉高。按 <a href=\"https://assets.nexperia.com/documents/data-sheet/74HC_HCT165.pdf#page=1\" target=\"_blank\" rel=\"noopener\">74HC165 的工作方式<\/a>，<code>PL<\/code> 为低时并行输入会异步装入；恢复为高后结束并行装载，随后可以用时钟移出内容。两片芯片共用这根装载线，所以这一轮读到的十六位来自同一次装载。串行传输有先后，输入状态却是在同一次装载结束时保留下来的；各路输入需要在装载结束前后满足手册规定的建立、保持时间。<\/p><p>接下来的时钟负责把已装入的内容逐位向输出端移动。这里有个很容易写反的顺序，课程代码先读 D12，再产生一次时钟上升沿。装载后，第一位已经出现在串行输出端，先读它，再把下一位移过来。若凭直觉改成先打时钟再读数，第一位就会被跳过去，后面的位也会跟着错位。<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/testing-code/without-led/test-4-ir/comm.cpp\" target=\"_blank\" rel=\"noopener\"><code>comm.cpp<\/code><\/a>中第一个八次循环如下，第二个循环用同样的方法填入 <code>reg1<\/code>。<\/p><pre><code>for (i = 0; i &lt; 8; i++)\n{\n    sensor.reg0 &lt;&lt;= 1;\n    if (MISO)\n        sensor.reg0 |= 0x01;\n    CLK_1;\n    CLK_0;\n}<\/code><\/pre><p>每轮先把之前读到的内容左移一位，再把当前输入放进最低位。八轮之后，第一次读到的比特到了 <code>reg0<\/code> 的 bit 7，最后一次读到的比特留在 bit 0。第一组八位填满 <code>reg0<\/code>，下一组填入 <code>reg1<\/code>。宏名 <code>MISO<\/code> 在这里展开为 <code>digitalRead(12)<\/code>，时钟也由 <code>digitalWrite()<\/code> 产生；沿着宏读下去，就能看见这段代码实际是怎样逐位采集的。<\/p><h2 id=\"section-4\">比特与传感器位置<\/h2><p>十六位读完以后，还要把存储位置和车上的实际位置对应起来。课程库把 <code>reg0<\/code> 的 bit 0 到 bit 6，依次分给左侧最外、左侧中间、左侧靠内、正中、右侧靠内、右侧中间和右侧最外的七颗传感器。正中那颗对应 <code>ir_mid<\/code>，判断时用的是 <code>1 &lt;&lt; 3<\/code>。我可以拿 <code>reg0 = 0b00001000<\/code> 作一个计算例子，这时只有 bit 3 为高，解码后就是 <code>ir_mid = 1<\/code>，其余六路为 <code>0<\/code>。最先传进来的那一位在字节的最高位，车上最左边的传感器却被分配在最低位，传输顺序和空间顺序要分别对照。<\/p><p>解码表达式里还有一个小细节。循迹输入用了 <code>!!(sensor.reg0 &amp; (1 &lt;&lt; 3))<\/code> 这样的双重逻辑非，把掩码得到的零或非零数统一成 <code>0<\/code> 或 <code>1<\/code>，同时保留原来的真假关系。碰撞开关和按键则只用一次 <code>!<\/code>，因为按下时输入被拉低，需要反过来表示按下状态。于是，结构体里同样的 <code>1<\/code>，在循迹字段中对应较弱反射形成的高电平，在按键字段中却对应按下形成的低电平。以后读这一类接口，我会连着输入电路和取反表达式一起看。<\/p><p>黑线和悬空都可能让 <code>sensor.ir_left_3<\/code> 为真。74HC165 把电平读得再准确，也不会替程序分辨这两种情况；判断还要依赖传感器实际放在哪里、收到了多少反射光。代码里的一个 <code>if<\/code>，因此也要连着车底的安装条件一起理解。<\/p>","toc":[[1,"反射光与电压"],[2,"输入电平"],[3,"并行装载与串行读取"],[4,"比特与传感器位置"]]},"en":{"title":"Arduino Car Line Sensing and Input Acquisition","body":"<p>One comment in the car&#x27;s <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/testing-code/without-led/test-4-ir/test-4-ir.ino\" target=\"_blank\" rel=\"noopener\">infrared test sketch<\/a> caught my attention while reading it again. Beside <code>if(sensor.ir_left_3)<\/code>, it describes the outermost left sensor detecting a black line or being lifted clear of the surface. Both conditions take the program into the same branch. I want to trace that <code>1<\/code> back through the circuit and find out what happens between light reflecting off the floor and a sensor variable becoming true.<\/p><h2 id=\"section-1\">Reflection and Voltage<\/h2><p>The line sensors are ITR20001 devices. An infrared emitter and a phototransistor share the package, facing the target surface, as shown in <a href=\"https://everlightamericas.com/datasheets/ITR20001_T.pdf\" target=\"_blank\" rel=\"noopener\">Everlight&#x27;s component documentation<\/a>. The emitter illuminates a small area beneath the car, and the returning infrared light produces current in the receiver. At a suitable mounting height, the difference in reflection between a light floor and black tape can indicate where the line lies.<\/p><figure><a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/manual-ir-sensor-schematic.png\" target=\"_blank\" rel=\"noopener\"><img src=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/manual-ir-sensor-schematic.png\" alt=\"Tracking and wheel-speed sensor circuits, with the ITR20001 line-sensing circuit above\"><\/a><figcaption>Tracking and wheel-speed sensor circuits, with the ITR20001 line-sensing circuit above<\/figcaption><\/figure><p>In the upper circuit, R1 limits current through the emitter. The phototransistor has its emitter connected to ground and its collector connected to <code>OUT<\/code>, with R2 pulling that node up toward the supply. Stronger reflected light increases collector current and lowers the output voltage. As reflection weakens, the pull-up brings the voltage back up. Black tape and an unobstructed view into the distance can both reduce the light returning to the receiver, which explains why the comment groups them together.<\/p><p>I would therefore read a high input first as weak reflected light reaching the receiver. Interpreting it as a black line also depends on the sensor&#x27;s position relative to the track. Raising the chassis, tilting the sensor, or mounting it too far above the floor can change the received light. In <a href=\"https://www.pololu.com/docs/0J13/3\" target=\"_blank\" rel=\"noopener\">Pololu&#x27;s reflectance-sensor experiment<\/a>, increasing the distance reduced the voltage difference between the black and white regions. That gives me something specific to watch when following the car manual&#x27;s test of moving a sensor over black tape: whether my hand changes its height at the same time.<\/p><p>Surface material and ambient light matter as well. Two materials that look equally black to my eyes can reflect infrared differently, while gloss and angle affect how much light returns toward the receiver. Ambient infrared can also reach it. If a change of floor makes the readings erratic, I would hold the position and height steady, compare output voltages, and then observe what changes when external light is screened out. Keeping those changes separate would help identify which condition affects the reading.<\/p><h2 id=\"section-2\">Logic Inputs<\/h2><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/smart-car-manual-teas1-en.pdf#page=45\" target=\"_blank\" rel=\"noopener\">main schematic<\/a> takes the line-sensor outputs into one of the two 74HC165 chips. Both the sensors and the registers have supplies labelled <code>3V3<\/code>. There is no separate comparator in the phototransistor circuit shown above; <code>OUT<\/code> can vary over a range of voltages. The 74HC165 input circuit classifies that voltage as a logic level. By the time the program reads a bit, it has the result of that decision, with no way to recover the original voltage from it.<\/p><p>It is tempting to put the dividing point at half of 3.3 V. The <a href=\"https://assets.nexperia.com/documents/data-sheet/74HC_HCT165.pdf#page=6\" target=\"_blank\" rel=\"noopener\">74HC165 datasheet<\/a> instead specifies <code>VIL<\/code>, the maximum voltage guaranteed to count as low, and <code>VIH<\/code>, the minimum guaranteed to count as high, under the stated supply conditions. Between them, I cannot assign a dependable <code>0<\/code> or <code>1<\/code> in advance. Reliable detection calls for the two surfaces to produce voltages inside their respective valid logic regions, with margin. Small changes in light or position can flip a reading that sits near a switching threshold.<\/p><p>I can now see the tradeoff in this circuit more clearly. The program gets convenient binary inputs, but the detail in the received light level is lost. Faced with several <code>1<\/code>s, I would also consider neighbouring sensors and the chassis position to distinguish a wide dark region from the whole sensor row being too far above the floor. An <code>ir<\/code> field name makes those physical conditions easy to overlook.<\/p><h2 id=\"section-3\">Parallel Load and Serial Read<\/h2><p>Seven line sensors, six collision switches, and two buttons occupy fifteen inputs across the two 74HC165 chips. Each register holds eight bits, so cascading them provides a sixteen-bit readout. The <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/testing-code/without-led/test-4-ir/comm.h\" target=\"_blank\" rel=\"noopener\">course library&#x27;s pin definitions<\/a> assign load control to Nano D8, clock to D13, and serial data input to D12. The individual signals connect locally to the registers, then travel back to the controller one after another along the same data wire.<\/p><p>Before reaching the loops in <code>reload_shift_reg()<\/code>, I stop at <code>LOAD<\/code>. This macro drives D8 low, waits 1 ms, and raises it again. The <a href=\"https://assets.nexperia.com/documents/data-sheet/74HC_HCT165.pdf#page=1\" target=\"_blank\" rel=\"noopener\">74HC165 loads its parallel inputs asynchronously while <code>PL<\/code> is low<\/a>. Raising <code>PL<\/code> ends parallel loading so the contents can be shifted out. Both chips share the load wire, giving all sixteen bits the same loading event. Although transmission is sequential, the input states are retained when that common load ends, subject to the specified setup and hold times around its end.<\/p><p>Clock pulses then move the loaded contents toward the serial output. The course code uses an order I could easily reverse by accident: read D12 first, then generate a rising clock edge. The first bit is already at the output after loading. Reading it before shifting brings in the full sequence; clocking first would skip that bit and offset the following ones. This is the first eight-iteration loop in <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-smart-car-line-tracker/testing-code/without-led/test-4-ir/comm.cpp\" target=\"_blank\" rel=\"noopener\"><code>comm.cpp<\/code><\/a>. A second loop fills <code>reg1<\/code> the same way.<\/p><pre><code>for (i = 0; i &lt; 8; i++)\n{\n    sensor.reg0 &lt;&lt;= 1;\n    if (MISO)\n        sensor.reg0 |= 0x01;\n    CLK_1;\n    CLK_0;\n}<\/code><\/pre><p>Each iteration shifts the accumulated value left and places the current input in its least significant bit. After eight iterations, the first bit read has reached bit 7 of <code>reg0<\/code>, while the last remains in bit 0. The first group fills <code>reg0<\/code>; the next fills <code>reg1<\/code>. Here, <code>MISO<\/code> expands to <code>digitalRead(12)<\/code>, and <code>digitalWrite()<\/code> generates the clock. Following those macros reveals how this routine actually collects the sequence one bit at a time.<\/p><h2 id=\"section-4\">Bits and Sensor Positions<\/h2><p>Once the sixteen bits are in memory, their positions still need to be matched to the physical sensors. The course library assigns bits 0 through 6 of <code>reg0<\/code> to the outer, middle, and inner left sensors, the centre sensor, then the inner, middle, and outer right sensors. The centre field, <code>ir_mid<\/code>, uses the mask <code>1 &lt;&lt; 3<\/code>. As a worked example, <code>reg0 = 0b00001000<\/code> has only bit 3 high, producing <code>ir_mid = 1<\/code> and six other fields set to <code>0<\/code>. The first bit received ends up at the top of the byte, while the leftmost sensor is assigned to its lowest bit. I need to check transmission order and physical order separately.<\/p><p>There is another small detail in the decoding expressions. Line inputs use a double logical NOT, such as <code>!!(sensor.reg0 &amp; (1 &lt;&lt; 3))<\/code>, to turn a zero or nonzero masked value into <code>0<\/code> or <code>1<\/code> without changing its truth value. Collision switches and buttons use a single <code>!<\/code>: pressing them pulls the input low, so the inversion makes a press true. A <code>1<\/code> in the resulting structure consequently has different electrical origins. In a line-sensor field, it corresponds to a high input caused by weaker reflection; in a button field, it corresponds to the low input from a press. I would read the circuit and the inversion expression together when examining this kind of interface.<\/p><p>The same <code>sensor.ir_left_3<\/code> field can be true over black tape or with the sensor lifted clear of the surface. Accurate capture by the 74HC165 cannot distinguish those situations on its own. Interpreting the bit still depends on the sensor&#x27;s position and the reflected light reaching it. The mounting conditions beneath the car belong in the interpretation of that small <code>if<\/code>, too.<\/p>","toc":[[1,"Reflection and Voltage"],[2,"Logic Inputs"],[3,"Parallel Load and Serial Read"],[4,"Bits and Sensor Positions"]]}};function show(lang){const p=data[lang];document.getElementById('title').textContent=p.title;document.getElementById('article').innerHTML=p.body;document.getElementById('toc').innerHTML=p.toc.map(([i,t])=>'<a href="#section-'+i+'">'+t+'</a>').join('');document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('zh').setAttribute('aria-pressed',lang==='zh');document.getElementById('en').setAttribute('aria-pressed',lang==='en');document.getElementById('meta').textContent=lang==='zh'?'学习笔记 02 · 已定稿 · 2026.09.06':'LEARNING NOTE 02 · APPROVED COPY · 2026.09.06';document.getElementById('home').textContent=lang==='zh'?'查看项目主页 ↗':'Project homepage ↗';document.getElementById('footer').textContent=lang==='zh'?'点击电路图可查看原图。第二篇笔记已审阅确认，当前为本地定稿。':'Select the circuit diagram to open the original. The second note has been reviewed and approved. This is the local final copy.';document.getElementById('toc').setAttribute('aria-label',lang==='zh'?'文章目录':'Article sections')}document.getElementById('zh').onclick=()=>show('zh');document.getElementById('en').onclick=()=>show('en');show('zh');</script></body></html>
