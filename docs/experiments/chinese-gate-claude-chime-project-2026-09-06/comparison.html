<header><div class="eyebrow">CLAUDE CHIME · COPY REVIEW · 2026.09.06</div><h1>电源板项目主页<br>中英全文前后对比</h1><span class="status">待审阅 · 尚未替换网站文案</span><p>左侧是本次重写前的完整文案，右侧是使用最新写作技能完成的重构稿。中文经过六类病句检查，英文沿用现有改写与双语一致性规则。两种语言均包含标题、摘要和全部正文。</p><p><a href="00-before.mdx">原稿 MDX</a> · <a href="01-after.mdx">重构稿 MDX</a> · <a href="comparison.md">文字版全文对比</a> · <a href="review.md">事实与门禁复核</a></p></header>

<main id="content"></main><footer>原稿与重构稿保留同一组封面、三张正文插图及技术元数据。此页专门比较文案，不重复展示相同插图。技术来源链接保留在对应段落中。全文对比使用原稿快照生成；原稿不做修饰或删节。</footer>
<script type="application/json" id="data">{"before": {"meta": {"title": "Claude Chime Power Board", "titleZh": "Claude Chime 电源板", "summary": "Commissioned by Accele AI, I independently built a roughly 28 × 27 mm ESP32 peripheral power board for Claude Chime: single-cell charging, two separate boost rails, gated battery sensing, and a 5 V push-pull solenoid driver. The first hand-assembled PCB passed my scoped bring-up, and the client's firmware engineer later reported normal complete-device operation from their side.", "summaryZh": "受 Accele AI 委托，我为 Claude Chime 独立完成一块约 28 × 27 mm 的 ESP32 外围电源板：单节锂电池充电、两路独立升压、受控电量采样和 5 V 推拉式电磁铁驱动都收进第一版手焊 PCB。我完成基础 bring-up，客户固件工程师后来反馈整机运行正常。"}, "sections": [{"heading": {"zh": "电磁铁驱动", "en": "Solenoid Drive"}, "paragraphs": {"zh": ["Claude Chime 干的是很实在的活。电脑里的 Claude 把一件事做完，ESP32 就驱动 5 V 推拉式电磁铁，让 Accele AI 的 Clawdy Family 3D 打印螃蟹连跳几下。人可能正低头看手机，这个提醒还是得把视线拉回来。", "他们最早想的是用继电器驱动电磁铁。我接下这次付费独立硬件委托后，先把这一段换成低边 MOSFET。产品本来就要做小，继电器在这里只会占体积。`SOL_CTRL` 经过 33 Ω 栅极电阻驱动 AO3400A，10 kΩ 下拉让它默认关断，SS34 给感性负载留一条续流路径。", "如果需求到这里为止，这颗开关的活也就到头了。但设备还要靠单节锂电池无线运行，要从 Type-C 充电，核心板又得继续用客户现成的 ESP32-S3。这几条凑到一起以后，插没插线已经跟开没开电磁铁一样成了设计变量。插入、拔出、动作，每一种组合都在改变电流从哪里来、又流到哪里去。一颗 MOSFET 的活，从这里开始变成电源系统的活。"], "en": ["Claude Chime had one very physical job. When Claude finished a task on the computer, an ESP32 drove a 5 V push-pull solenoid and made Accele AI's 3D-printed Clawdy Family crab jump a few times. A person could be looking down at a phone, and the reminder still had to pull their gaze back.", "Their first idea was a relay driving the solenoid. After I took the paid independent hardware commission, I swapped that part of the design to a low-side MOSFET. The product was meant to stay compact, and a relay would have spent the budget on volume. `SOL_CTRL` reaches an AO3400A through a 33 Ω gate resistor, a 10 kΩ resistor holds the default state low, and an SS34 gives the inductive load a flyback path.", "If the requirement stopped there, the job would have stayed one switch. The device also had to run wirelessly from a single-cell battery, charge through Type-C, and keep the client's existing ESP32-S3 core board. Once those joined the list, the cable state mattered as much as the switch: insertion, removal, and actuation each changed where current came from and where it went. What began as one MOSFET became a power-system problem."]}}, {"heading": {"zh": "两路升压", "en": "Two Boost Rails"}, "paragraphs": {"zh": ["我最早考虑过 IP5306 这类集成电源方案，也认真想过让一颗 Boost 同时带两个负载。这笔账一开始就不小。按项目期间围绕 5 V、1.5 A 电磁铁负载做的估算，输出功率已经到 7.5 W，从 3.7 V 电池取电、暂按 85% 效率算，输入约 2.38 A，电池电压和效率再往下走时电流还要加大。这些是设计估算，不是负载实测。", "真正的别扭是两个负载脾气不同。ESP32 要的是持续供电，电磁铁动作时却可能猛拉一段瞬态。塞进同一颗转换器能省一条支路，可螃蟹每跳一下，ESP32 都可能跟着吃一次压降。最后我把问题拆给两颗 [TLV61048](https://www.ti.com/product/TLV61048)。一路专门出 `SOL_5V`，另一路负责 ESP32 的电池备用供电。", "两路电源在 `BAT+` 之后各走各的，再用六针 SH1.0 排线把 `ESP_5V_BUS`、`SOL_CTRL`、`CHARGE_CTRL`、`ADC_ENABLE`、`ADC_BAT` 和 GND 交给核心板。图纸把电磁铁支路配成 600 kHz，ESP32 支路配成 1 MHz。[Texas Instruments 的 TLV61048 资料](https://www.ti.com/product/TLV61048)把 600 kHz 与较高效率联系在一起，把 1 MHz 与更小的磁性器件和输出电容联系在一起。落到这块 PCB 上，更直接的要求是把两边的开关节点，连同输入、整流、输出电容回路都收紧。"], "en": ["I first looked at integrated power-bank devices such as the IP5306, and I also weighed one boost converter for both loads. The arithmetic already ran large. Around the 5 V, 1.5 A solenoid load, the project-time estimate reached 7.5 W. From a 3.7 V cell at an assumed 85 percent efficiency, the input came to about 2.38 A, and it would climb further as battery voltage or efficiency fell. Those were design estimates, not load measurements.", "The friction came from the two loads wanting different behavior. The ESP32 wanted continuous power, while the solenoid could pull a much sharper transient during actuation. One converter would save a branch, but each jump of the crab could also cause a supply dip for the ESP32. I split the problem across two [TLV61048](https://www.ti.com/product/TLV61048) converters instead. One supplies `SOL_5V`, and the other carries the battery-backed path for the ESP32.", "After `BAT+` the two rails stay separate, and a six-pin SH1.0 cable carries `ESP_5V_BUS`, `SOL_CTRL`, `CHARGE_CTRL`, `ADC_ENABLE`, `ADC_BAT`, and GND to the core board. The schematic sets the solenoid branch at 600 kHz and the ESP32 branch at 1 MHz. [Texas Instruments associates 600 kHz with higher efficiency](https://www.ti.com/product/TLV61048) and 1 MHz with smaller magnetics and output capacitance. On this PCB, the practical consequence was keeping both switch nodes and their input, rectifier, and output-capacitor loops compact."]}}, {"heading": {"zh": "供电优先级", "en": "Supply Priority"}, "paragraphs": {"zh": ["ESP32 核心板上的 Type-C 动不了，USB 5 V 和电池升压最后都汇到 `ESP_5V_BUS`。我一度想把备用升压设成 5.5 V，用多出来的电压补偿串联肖特基的压降，当时还挺安心，可顺着电流路径走一遍就不对了。电池侧一旦高过 USB 5 V，原本负责备用的那路电源，会在 Type-C 还插着的时候抢回供电权。", "最终反馈网络把 SS12 前面的目标输出算在约 4.984 V。这个数是图纸算出来的，不是总线实测值，过完二极管后正好 5.000 V 保证不了。真正要守住的是顺序：Type-C 插着时由 USB 供电，拔掉以后再让电池路径接手。", "同一条总线还给 MCP73831 的输入供电，它的 VBAT 输出又回到电池。沿着图纸绕一圈，这里藏着的回路就清楚了。充电器如果一直保持开启，电池能量就可能经过升压和二极管进入充电器，再绕回原来那块电池。我用 `CHARGE_CTRL` 加一颗 2N7002 控制 3.3 kΩ 的 PROG 电阻，只在允许充电时接通。[Microchip 的 MCP73831 数据手册](https://ww1.microchip.com/downloads/aemDocuments/documents/APID/ProductDocuments/DataSheets/MCP73831-Family-Data-Sheet-DS20001984H.pdf)写得很干脆，PROG 开路或悬空，充电器直接关。", "走到这一段，这块板子在我眼里已经收拢成一条路径。USB 有没有插着，电池该不该接手，充电器能不能工作，电磁铁什么时候动作，都是同一条电源路径里的状态。"], "en": ["The Type-C connector on the ESP32 core board was fixed in place, so the USB 5 V and the battery-derived source both ended up at `ESP_5V_BUS`. I briefly wanted to set the backup converter to 5.5 V so the extra voltage could absorb the series Schottky drop. It looked comfortable, until I traced the current path: once the battery side sat above USB 5 V, the rail meant for backup would take supply priority while Type-C was still plugged in.", "The final feedback network targets about 4.984 V before the SS12 isolates the battery path. The number is a calculation, not a bus measurement, and it cannot promise exactly 5.000 V after the diode. It preserves the order: Type-C supplies the system while connected, and the battery path takes over after removal.", "The same bus feeds the MCP73831 input, whose VBAT output returns to the cell. Following the diagram one loop around made the catch visible. If the charger stayed unconditionally enabled, battery energy could travel through the boost path and the diode into the charger and back toward the same battery. I used `CHARGE_CTRL` and a 2N7002 to connect the 3.3 kΩ PROG resistor only when charging was permitted. [Microchip documents](https://ww1.microchip.com/downloads/aemDocuments/documents/APID/ProductDocuments/DataSheets/MCP73831-Family-Data-Sheet-DS20001984H.pdf) that an open or floating PROG pin disables the MCP73831.", "By this point the board had stopped being several separate modules in my head. USB presence, battery takeover, charger permission, and solenoid actuation were all states of one power path."]}}, {"heading": {"zh": "电池采样", "en": "Battery Sensing"}, "paragraphs": {"zh": ["电池采样看起来简单得有点过头。15 kΩ 和 22 kΩ 负责把电池电压分给 ADC，可如果这两颗电阻一直跨在电池两端，就会给整块板留一条常开的漏电路径。我把分压器放到 `ADC_ENABLE` 后面，AO3401 和 2N7002 负责通断，要测的时候接通，空闲时断开。图纸上的换算关系是 `VBAT = VADC × 1.682`。", "桌上的测试到模拟接口这一层就停了：手动拉高 `ADC_ENABLE` 以后，分压节点符合图纸算出的关系，能确认的都确认了。客户的 ESP32 核心板不在我手上，ADC 固件我也没写，采样链后段的数字精度不归我这张桌子管。", "现在再回看这条链，我又多想了一层。[Espressif 的 ESP32-S3 ADC 文档](https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-reference/peripherals/adc/index.html)提到芯片之间存在参考电压差异，也提供校准方法。最终读数精度不能只靠理想电阻比保证。这个判断来自现在的复盘，不是当时做出来的测试结果。"], "en": ["Battery sensing looked almost too simple. The 15 kΩ and 22 kΩ divider scaled the cell voltage for the ADC, but keeping both resistors permanently across the battery left a continuous leakage path for the whole board. I put the divider behind `ADC_ENABLE`, with an AO3401 and a 2N7002 doing the switching. Connect for a measurement, disconnect while idle. The schematic relation is `VBAT = VADC × 1.682`.", "My bench verification stopped at that analog boundary. With `ADC_ENABLE` driven high by hand, the divided node followed the calculated relation, and that was as far as I could check. I did not have the client's ESP32 core board, I did not write the ADC firmware, and the digital accuracy downstream of the sampling chain sat outside my bench.", "Reading the chain over again, I thought one layer deeper. [Espressif's ESP32-S3 ADC documentation](https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-reference/peripherals/adc/index.html) describes chip-to-chip reference-voltage variation and offers calibration, so final reading accuracy cannot rest on the ideal resistor ratio alone. That is present-day understanding, not a test result from project time."]}}, {"heading": {"zh": "第一版打板", "en": "First Spin"}, "paragraphs": {"zh": ["V1.0 是第一次，也是唯一一次打板。需求拆解、电源架构、计算与器件选型、原理图、PCB 布局、BOM 与 Gerber、下单、手工焊接、基础 bring-up、排查，到软件交接，都由我做下来。图纸上这块板约 28 × 27 mm，最高点约 4.75 mm。焊完排查完，没有割线，没有飞线，没有换阻值，没有补电容，也没有第二版。", "我亲手验证的这部分是有明确边界的。3.8 V、限流 50 mA 的台式电源下，两路空载升压分别读到约 5.12 V 和 5.08 V，只是现在再回头看，我想不起哪个数属于哪一路。我用电流表确认了 MCP73831 的充电电流，随后用万用表看到电池电压上升。`ADC_ENABLE` 手动接通后分压符合计算，模拟 3.3 V 的高低电平反复驱动 `SOL_CTRL`，空载输出能连续切换，升压轨上也没有看到掉压。", "使用这块带保护的小电池时出了一个意外。冷接入时，电池包输出端从 4.03 V 跌进 1.49 至 1.57 V 的区间，而同一块板此前能从限流 50 mA 的电源启动。测量支持一个有限推断：上电瞬间的需求可能使电池包上由 DW01A 和 8205A 构成的保护路径断开。电流峰值和确切的状态切换都没有量到，因此触发原因没有得到直接证明。完整排查放在单独的[冷启动笔记](/notes/claude-chime-cold-start-battery-protection)里。", "真实电磁铁没接，那只螃蟹也没在我桌上待过，ESP32 固件也没写，整机这一层不在我手里。客户的固件工程师后来在项目期间的聊天里反馈，ESP32 通信、ADC 电量读取、充电控制、实际电磁铁反复动作、整机运行都正常。这是客户侧的联调结果，不是我亲眼完成的验收。对方还提到，这块小电源板和六针排线给外壳省了地方。", "硬件交出去之前，软件边界也得说清楚。我另外整理了[软件交接文档](/uploads/projects/claude-chime-hardware/software-handoff.md)，覆盖六针接口、三路高有效控制、ADC 换算、充电控制，以及 Type-C 插入拔出后各状态该是什么样子。", "项目从一只跳起来的螃蟹开始。交付的时候，真正难的部分在它周围的电源问题上：每一种状态下谁来供电，哪条路径要退后，哪项测量离证明还差一步。MOSFET 负责让电磁铁动作，剩下的都归电源架构解释。"], "en": ["V1.0 was the first and only PCB spin. I completed the requirements breakdown, power architecture, calculations and component selection, schematic, PCB layout, BOM and Gerber, ordering, hand assembly, basic bring-up, debugging, and the software handoff. The drawing marks a board of roughly 28 × 27 mm and about 4.75 mm at its highest point. After assembly and the scoped bring-up, it needed no cuts, no flywires, no component-value changes, no added capacitors, and no second order.", "What I verified by hand has a clear boundary. From a 3.8 V bench supply limited to 50 mA, the unloaded boost outputs measured about 5.12 V and 5.08 V, though I can no longer assign those readings to individual rails. I confirmed charging current through the MCP73831 with an ammeter and later watched the battery voltage rise with a multimeter. I enabled the ADC branch by hand and the divider matched the calculation; I then drove `SOL_CTRL` repeatedly from a simulated 3.3 V logic level, and the unloaded outputs switched continuously without a boost-rail drop.", "The protected battery pack added one surprise. On a cold connection, its output fell from 4.03 V into the 1.49 to 1.57 V range, even though the same board had started from the 50 mA-limited supply. The measurements support a bounded hypothesis: first-power-up demand may have opened the pack's DW01A-and-8205A protection path. I did not measure the current peak or the exact state transition, so the trigger was never proved directly. The full investigation lives in a separate [cold-start note](/notes/claude-chime-cold-start-battery-protection).", "I did not connect the real solenoid, the crab never sat on my bench, and I did not write the ESP32 firmware. The client's firmware engineer later reported in project-time chat that ESP32 communication, ADC battery reading, charging control, repeated real-solenoid actuation, and complete-device operation were all normal. Those are client-side integration results, not an acceptance test I personally witnessed. The client also mentioned that the compact board and six-pin cable saved enclosure space.", "Before the hardware left my hands, the software boundary needed to be exact. I prepared a separate [software handoff](/uploads/projects/claude-chime-hardware/software-handoff.md) covering the six-pin interface, the three active-high controls, ADC conversion, charge control, and the expected states around Type-C insertion and removal.", "The project began with one jumping crab. By delivery, the harder part had moved to the power problem around it: who supplied the system in each state, which path had to step back, and which measurement still stopped short of a proof. The MOSFET switches the solenoid. The power architecture explains everything around it."]}}], "sha256": "2e5f1d9e53c56f945d0567ef5c2e6d5c11c7d5c308a06e3453525561513e1be0"}, "after": {"meta": {"title": "Claude Chime Power Board", "titleZh": "Claude Chime 电源板", "summary": "For an independent hardware commission from Accele AI, I designed and hand-assembled Claude Chime's ESP32 peripheral power board. The roughly 28 × 27 mm PCB combines single-cell charging, two separate boost rails, gated battery-voltage sensing, and a 5 V push-pull solenoid driver. I completed basic power-up and interface checks; the client's firmware engineer later reported normal complete-device operation.", "summaryZh": "受 Accele AI 委托，我独立设计并手工焊接了 Claude Chime 的 ESP32 外围电源板。约 28 × 27 mm 的 PCB 集成单节锂电池充电、两路独立升压、受控电池电压采样和 5 V 推拉式电磁铁驱动。我完成了基础上电与接口测试，客户固件工程师随后反馈整机运行正常。"}, "sections": [{"heading": {"zh": "电磁铁驱动", "en": "Solenoid Drive"}, "paragraphs": {"zh": ["电脑里的 Claude 干完活，桌上的螃蟹就跳几下。Accele AI 的 Claude Chime 想用这种动静，让低头看手机的人也能注意到任务已经完成。螃蟹是 Clawdy Family 的 3D 打印模型，动作由 ESP32 控制的 5 V 推拉式电磁铁完成。", "我接下的是这套装置的付费独立硬件委托。对方起初想用继电器控制电磁铁，我考虑到外壳里的空间，把驱动改成了低边 MOSFET。`SOL_CTRL` 通过 33 Ω 栅极电阻控制 AO3400A，10 kΩ 下拉电阻保证默认关断，SS34 则在电磁铁断电时提供续流路径。这套开关电路占的空间更小，更适合螃蟹的外壳。", "但设备还要脱离电源线运行，要给单节锂电池充电，又必须沿用客户现成的 ESP32-S3 核心板。我得继续想清楚，插着 Type-C 时怎么供电，拔掉以后谁来接手，电磁铁动作时又会不会影响主控。开关电路之外，这几种工作状态也得一起设计。"], "en": ["A few jumps from a desktop crab announce that Claude has finished a task on the computer. That is the idea behind Accele AI's Claude Chime: make the reminder noticeable even to someone looking down at a phone. The crab is a 3D-printed Clawdy Family model, moved by a 5 V push-pull solenoid under ESP32 control.", "Accele AI commissioned me to develop the hardware independently. Their initial proposal used a relay for the solenoid, but enclosure space led me to a low-side MOSFET instead. `SOL_CTRL` drives an AO3400A through a 33 Ω gate resistor, with a 10 kΩ pull-down keeping it off by default. An SS34 provides the flyback path when the solenoid is switched off. The smaller switching circuit was a better fit inside the crab.", "Battery operation made the job broader. The device needed to run without a power cable, charge a single lithium-ion cell, and work with the client's existing ESP32-S3 core board. I had to account for power with Type-C connected, battery takeover when it was unplugged, and the effect of solenoid actuation on the controller. I needed to work through those states as part of the circuit design."]}}, {"heading": {"zh": "两路升压", "en": "Two Boost Rails"}, "paragraphs": {"zh": ["选方案时，我看过 IP5306 这类集成电源芯片，也考虑过让一颗 Boost 同时给 ESP32 和电磁铁供电。先按项目期间采用的 5 V、1.5 A 电磁铁负载估算，输出功率就是 7.5 W。电池电压取 3.7 V，效率暂按 85% 算，输入电流约为 2.38 A；如果电池电压或效率继续降低，要维持同样的输出功率，输入电流还会增加。这几个数是选型时的估算，我没有做实际负载电流测试。", "电流之外，我更在意电磁铁动作时对主控的影响。ESP32 需要持续供电，电磁铁的负载却会随着动作变化。两者共用一路升压输出，螃蟹跳一下，就可能连带着让 ESP32 的供电电压往下掉。最后我用了两颗 [TLV61048](https://www.ti.com/product/TLV61048)，从 `BAT+` 分成两条升压支路：一路输出 `SOL_5V`，专供电磁铁；另一路在电池供电时给 ESP32 核心板供电。", "原理图中，电磁铁支路的开关频率设为 600 kHz，ESP32 支路设为 1 MHz。[TI 对这两档频率的说明](https://www.ti.com/product/TLV61048)是，600 kHz 更有利于效率，1 MHz 则有利于减小电感和输出电容的尺寸。这是器件的选型取舍，不能直接当成这块板的效率实测结果。", "现在对照 [TLV61048 的布局指南](https://www.ti.com/lit/ds/symlink/tlv61048.pdf#page=15)看这块板，布局要求可以说得更具体。连接 SW 引脚的走线应尽量短，占用的铜箔面积也应尽量小；输入电容要靠近 VIN 和 GND 引脚。开关管、整流二极管、输出电容和开关管地端构成的电流回路，同样需要缩短连接路径。这些要求要分别用到两路升压电路上。"], "en": ["During selection, I considered integrated power devices such as the IP5306 as well as a single boost converter for both loads. The project-time estimate used a 5 V, 1.5 A solenoid load, which puts output power at 7.5 W. Supplying that from a 3.7 V battery at an assumed 85 percent efficiency would require about 2.38 A at the input. Maintaining the same output power would demand still more input current as battery voltage or efficiency fell. These were sizing calculations; I did not measure the actual load current.", "My other concern was what a solenoid pulse could do to the controller's supply. The ESP32 needs continuous power, while the solenoid load changes with actuation. Sharing one boost output could let a jump from the crab pull down the ESP32 supply too. I chose two [TLV61048](https://www.ti.com/product/TLV61048) converters, branching from `BAT+`: one feeds the solenoid through `SOL_5V`, and the other powers the ESP32 core board during battery operation.", "In the schematic, the solenoid converter runs at 600 kHz and the ESP32 converter at 1 MHz. [TI describes the frequency choice](https://www.ti.com/product/TLV61048) as a trade-off between higher efficiency at 600 kHz and smaller inductors and output capacitors at 1 MHz. That informs component selection; it is not a measurement of this board's efficiency.", "Revisiting the PCB against [TI's layout guidance](https://www.ti.com/lit/ds/symlink/tlv61048.pdf#page=15) makes the physical requirements more precise. Connections to SW should be short and occupy little copper area. The input capacitor belongs close to both VIN and GND. The current path through the switching FET, rectifier, output capacitor, and back to the FET ground also needs short connections. These layout requirements apply to both converters."]}}, {"heading": {"zh": "供电与充电控制", "en": "Supply and Charge Control"}, "paragraphs": {"zh": ["两路升压分开以后，ESP32 这一侧还得处理 USB 和电池之间的供电切换。Type-C 接口在客户的核心板上，位置不能改，USB 5 V 和电池升压最终都接到 `ESP_5V_BUS`。我一度想把备用升压调到 5.5 V，给串联肖特基二极管的压降留点余量，刚想到这里还觉得挺稳妥。再沿着电流路径看一遍，才发现电池侧电压如果高过 USB 5 V，插着 Type-C 时也可能优先用掉电池的电。", "因此，反馈电阻最后选出的目标输出约为 4.984 V，再通过 SS12 接到总线。我想实现的是插线时由 USB 供电，拔线后由电池接替。4.984 V 是 SS12 前的计算值，二极管之后的实际总线电压还要考虑压降，不能把它写成精确的 5.000 V。", "同一条总线还接着 MCP73831 的输入，充电芯片的输出则接回电池。这样一来，拔掉 Type-C 后如果仍然允许充电，就可能形成电池经升压和二极管给充电芯片供电、充电芯片又向同一块电池送电的回路。我用 `CHARGE_CTRL` 驱动 2N7002，控制 3.3 kΩ 的 PROG 电阻是否接地。[MCP73831 数据手册](https://ww1.microchip.com/downloads/aemDocuments/documents/APID/ProductDocuments/DataSheets/MCP73831-Family-Data-Sheet-DS20001984H.pdf)说明，PROG 悬空时会停止充电，因此硬件可以通过断开这颗电阻禁止充电。", "到这里，我已经不能只按充电、升压、驱动三个模块分别看这块板了。USB 有没有接入，会影响系统由谁供电，也决定软件该不该允许充电；电磁铁的控制又要建立在供电状态合适的前提下。几块电路之间的配合，得在交接时一起讲清楚。"], "en": ["Separating the boost outputs still left the ESP32 supply to share a bus with USB. Type-C was on the client's core board and could not be moved; both USB 5 V and the battery-derived supply reached `ESP_5V_BUS`. I briefly felt comfortable setting the backup converter to 5.5 V to allow for the series Schottky drop. Tracing the current path exposed the problem. If the battery-derived voltage exceeded USB 5 V, the system could prefer battery power even with Type-C plugged in.", "The selected feedback resistors instead target about 4.984 V before an SS12 connects the converter to the bus. The intended order is USB power while connected, followed by battery takeover when unplugged. That 4.984 V comes from the feedback calculation. The diode drop still affects the actual bus voltage, so it cannot be presented as an exact 5.000 V supply.", "The bus also feeds the MCP73831, whose output connects back to the battery. Leaving charging enabled after unplugging Type-C could therefore send battery energy through the boost converter and diode into the charger, then back toward the same battery. I used `CHARGE_CTRL` to drive a 2N7002 that connects or disconnects the 3.3 kΩ PROG resistor from ground. [Microchip specifies](https://ww1.microchip.com/downloads/aemDocuments/documents/APID/ProductDocuments/DataSheets/MCP73831-Family-Data-Sheet-DS20001984H.pdf) that a floating PROG pin disables charging, so disconnecting that resistor provides a hardware way to inhibit it.", "I now had to consider the charging, boost, and driver circuits together. USB presence affects both the source supplying the system and whether software should permit charging; solenoid control also depends on a suitable supply state. Their interactions belonged in the handoff as much as the individual circuits did."]}}, {"heading": {"zh": "电池电压采样", "en": "Battery-Voltage Sensing"}, "paragraphs": {"zh": ["电池电压采样用的是 15 kΩ 和 22 kΩ 分压电阻，换算关系为 `VBAT = VADC × 1.682`。两个电阻很好理解，可一直跨接在电池两端，就会一直消耗电流。我加了 AO3401 和 2N7002，由 `ADC_ENABLE` 控制这条分压支路，需要读电压时接通，读完后断开。这样，采样电路只在需要时工作。", "我在测试台上手动拉高 `ADC_ENABLE`，确认了分压节点的电压符合计算关系。不过，客户的 ESP32 核心板不在我手上，ADC 固件也不由我写，所以我测到的是送往 ADC 的模拟电压。程序最终读出多少、电压换算有多准，还要在核心板上继续验证。", "现在复盘时，我又查了 [Espressif 的 ESP32-S3 ADC 文档](https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-reference/peripherals/adc/index.html)。不同芯片的参考电压会有差异，需要通过校准改善读数。电阻分压只是换算链路的一部分，ADC 本身的误差也得考虑。这个理解来自后来的复盘，不能算作项目期间完成的精度测试。"], "en": ["A 15 kΩ and 22 kΩ divider gives the battery-sensing relation `VBAT = VADC × 1.682`. The two resistors are straightforward, but a permanent connection across the battery would draw current continuously. I added an AO3401 and a 2N7002 so `ADC_ENABLE` could switch the divider on for a reading and disconnect it afterward. The sensing circuit only needs to run when a measurement is wanted.", "On the bench, I drove `ADC_ENABLE` high by hand and checked that the divided voltage followed the calculation. I did not have the client's ESP32 core board or write its ADC firmware, so the quantity I could verify was the analog voltage presented to the ADC. The eventual software reading and conversion accuracy still needed checking on the core board.", "Looking back, I also revisited [Espressif's ESP32-S3 ADC documentation](https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-reference/peripherals/adc/index.html). Reference voltage varies between chips, and calibration helps improve the readings. The divider is only one part of the conversion chain; ADC error matters too. That is a later understanding, not an accuracy test completed during the project."]}}, {"heading": {"zh": "打板与交接", "en": "Board Bring-Up and Handoff"}, "paragraphs": {"zh": ["从需求拆解、电源架构、计算选型，到原理图、PCB、BOM、Gerber、下单和手工焊接，再到基础上电测试、故障排查与软件交接，这些工作都由我独立完成。图纸标注的板子约 28 × 27 mm，最高点约 4.75 mm。V1.0 只打了一次板，焊接和排查后没有割线、飞线、换阻值或补电容，也没有再投第二版。", "最初的上电测试用的是 3.8 V、限流 50 mA 的台式电源。两路升压空载输出分别量到约 5.12 V 和 5.08 V，不过现在已经记不清这两个读数各自对应哪一路。我还用电流表确认了 MCP73831 的充电电流，随后用万用表观察到电池电压上升。除了前面提到的分压测试，我也用模拟的 3.3 V 高低电平反复驱动 `SOL_CTRL`，空载输出能够连续切换，测试时没有观察到升压输出掉压。", "换成带保护的电池包冷接入，情况就没这么顺利了。接入前，电池包输出端是 4.03 V；一接上板子，就降到了 1.49 至 1.57 V。同一块板明明能从限流 50 mA 的台式电源启动，换成电池却起不来，我也就顺着这个差别继续查。现有测量让我怀疑，上电瞬间的电流需求可能使 DW01A 和 8205A 构成的保护路径断开。但我没有测到电流峰值，也没有记录到确切的保护状态切换，原因还不能定下来。这里量到的是电池包输出端的电压，不能据此认定电芯本身跌到了同样的数值。完整过程写在[冷启动排查笔记](/notes/claude-chime-cold-start-battery-protection)里。", "至于真正带着螃蟹跳起来的测试，是客户那边做的。真实电磁铁和螃蟹都没到过我的测试台，ESP32 固件也由对方负责。客户固件工程师在项目期间的聊天里反馈，ESP32 通信、ADC 电量读取、充电控制、电磁铁反复动作和整机运行都正常，还提到小电源板配合六针排线节省了外壳空间。这些是对方的联调反馈，我没有在场见证。", "两块板通过六针 SH1.0 排线连接，接口包含 `ESP_5V_BUS`、`GND`、`SOL_CTRL`、`CHARGE_CTRL`、`ADC_ENABLE` 和 `ADC_BAT`。交付前，我把这些接口以及三路高有效控制、ADC 换算、充电允许条件、Type-C 插拔前后的工作状态写进了[软件交接文档](/uploads/projects/claude-chime-hardware/software-handoff.md)。电磁铁的开关由 `SOL_CTRL` 控制。要让这块电源板和客户的核心板一起工作，插线、拔线、采样、充电时该怎么处理，也都得交代清楚。"], "en": ["I handled the requirements breakdown, power architecture, calculations and component selection, schematic, PCB, BOM, Gerber, ordering, and hand assembly, then the basic power-up checks, debugging, and software handoff. The drawing marks the board at roughly 28 × 27 mm, with a maximum height of about 4.75 mm. V1.0 was the only PCB spin. Assembly and debugging required no cuts, flywires, resistor-value changes, or added capacitors, and there was no second board order.", "Initial power-up used a 3.8 V bench supply with a 50 mA current limit. The two unloaded boost outputs measured about 5.12 V and 5.08 V, although I can no longer associate each reading with its rail. I confirmed MCP73831 charging current with an ammeter, then observed the battery voltage rising with a multimeter. Alongside the divider check, I repeatedly drove `SOL_CTRL` using simulated 3.3 V logic levels. The unloaded output kept switching, with no boost-output voltage drop observed during that test.", "The board did not start as expected when I connected the protected battery pack. Before connection, its output measured 4.03 V; on connecting the board, it fell to between 1.49 and 1.57 V. A board that started from a 50 mA-limited supply would not start from this battery, so I kept investigating that difference. The measurements suggest that startup demand may have opened the protection path formed by the DW01A and 8205A. I captured neither the current peak nor the exact protection-state transition, leaving the cause unresolved. The voltage was measured at the pack output; it does not establish that the cell itself fell to the same level. The full investigation is in the [cold-start debugging note](/notes/claude-chime-cold-start-battery-protection).", "The tests that actually made the crab jump happened on the client's side. Neither the real solenoid nor the crab reached my bench, and the client handled the ESP32 firmware. During the project, their firmware engineer reported normal ESP32 communication, ADC battery reading, charge control, repeated solenoid actuation, and complete-device operation. They also said the small power board and six-pin cable saved enclosure space. These were client integration reports, not tests I witnessed.", "The boards connect through a six-pin SH1.0 cable carrying `ESP_5V_BUS`, `GND`, `SOL_CTRL`, `CHARGE_CTRL`, `ADC_ENABLE`, and `ADC_BAT`. Before delivery, I documented the interface, the three active-high controls, ADC conversion, charge permissions, and the expected states around Type-C insertion and removal in the [software handoff](/uploads/projects/claude-chime-hardware/software-handoff.md). `SOL_CTRL` handles the solenoid switch. Getting the power board and core board to work together also required clear instructions for plugging in, unplugging, sensing, and charging."]}}], "sha256": "a2698f058b8171ac1c5bcca35bec8cb9e5e8e81677dbc79bc0cb5f3188ea0ffa"}, "notes": ["先交代螃蟹如何提醒人，再解释继电器改 MOSFET 和供电需求。", "把电流估算、双路取舍、频率选择和布局要求分清，修复节点与回路的搭配问题。", "围绕 USB、电池和充电器的具体关系，讲清 5.5 V 误判与 PROG 控制。", "直接说明测过的模拟电压、客户负责的 ADC 固件，以及后来补充的校准理解。", "保留首版打板和所有测试记录，把六针接口移到交接处，以实际交付内容收尾。"]}</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent);let lang='zh';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return s.split(/(`[^`]+`|\[[^\]]+\]\([^)]+\))/g).map(x=>{if(x.startsWith('`'))return '<code>'+esc(x.slice(1,-1))+'</code>';const m=x.match(/^\[([^\]]+)\]\(([^)]+)\)$/);if(m){const url=m[2].startsWith('/')?'https://www.66ccff-labs.com'+m[2]:m[2];return '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(m[1])+'</a>'}return esc(x)}).join('')}
function panel(d,side,idx){const labels=lang==='zh'?{before:'改前 · 原稿',after:'改后 · 重构稿'}:{before:'BEFORE · ORIGINAL',after:'AFTER · REWRITE'};const title=idx<0?d.meta[lang==='zh'?'titleZh':'title']:d.sections[idx].heading[lang];const ps=idx<0?[d.meta[lang==='zh'?'summaryZh':'summary']]:d.sections[idx].paragraphs[lang];return '<article class="panel '+side+'" lang="'+(lang==='zh'?'zh-CN':'en')+'"><div class="label">'+labels[side]+'</div><h3>'+esc(title)+'</h3>'+(idx<0?'<div class="summary-title">'+(lang==='zh'?'摘要':'Summary')+'</div>':'')+'<div class="prose">'+ps.map(p=>'<p>'+inline(p)+'</p>').join('')+'</div></article>'}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';const names=[lang==='zh'?'标题与摘要':'Title and Summary',...data.after.sections.map(s=>s.heading[lang])];document.getElementById('index').innerHTML=names.map((n,i)=>'<a href="#section-'+i+'">'+(i===0?(lang==='zh'?'摘要':'Summary'):String(i).padStart(2,'0'))+'</a>').join('');document.getElementById('content').innerHTML=names.map((n,i)=>'<section class="section" id="section-'+i+'"><div class="section-top"><span class="num">'+String(i).padStart(2,'0')+'</span><h2>'+esc(n)+'</h2></div>'+(i>0&&lang==='zh'?'<p class="note">'+esc(data.notes[i-1])+'</p>':'')+'<div class="pair">'+panel(data.before,'before',i-1)+panel(data.after,'after',i-1)+'</div></section>').join('')}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.body.classList.toggle('only-after',b.dataset.mode==='after');document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));render();
</script></body></html>
