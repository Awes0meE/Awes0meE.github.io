he encoder, TIM3 set the pace for slower tasks, TIM4 produced PWM, and the temperature, humidity and light reads waited for a timer flag before running.</p><p>I wrote the application flow, encoder mapping, mode switching and the integrated main loop; the OLED, DHT11, encoder and servo drivers were standard drivers from online and ST examples that I reworked heavily. I had not met an RTOS yet, so it was all bare metal, interrupts plus timer-driven polling, and every delay a blocking <code>delay()</code>. The logic was nothing elegant. All these tasks ran at very low rates, though, and it worked fine.</p><h3>Light Calibration</h3><p>To turn a target light value into an LED output, I stepped the PWM point by point, read the ADC, recorded 16 pairs on this breadboard, and wrote a <a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-pwm-lookup-excerpt.c\" target=\"_blank\" rel=\"noopener\">lookup and interpolation function</a>. PWM runs from 0 to 1000 while ADC falls from 1600 to 480, and a target between two records gets its output by linear interpolation. The program looks up PWM from the target; measured ADC is only displayed and printed. I definitely thought about feedback correction at the time, but it never went in, and the demo kept this feedforward version. The interpolation, where to add calibration points and which way feedback should correct are worked through in <a href=\"https://www.66ccff-labs.com/notes/tianjin-stm32-light-calibration-control\" target=\"_blank\" rel=\"noopener\">Light Calibration and Lookup Control</a>.</p><h3>End of the Placement</h3><p>In about 20 working days I covered the whole route on my own. The engineer ran things hands-off and never set a target for me. At the end I showed him the demo and talked through how I understood the peripherals working together and what I had found along the way, and he said I had learned it solidly.</p><p>The training material also covered PID and the ATP, ATO and ATS systems common in rail transit. I read them closely, though I never wrote or tuned a PID loop. The first time I read about PID it seemed almost magical that one formula could bring something to the position you want, quickly and stably. I also found myself mapping the bench exercises onto a train: carriage lighting and ventilation fans, station-entry signals, all of it needs microcontrollers, just with sturdier, more reliable hardware and designs. The breadboard on my desk felt like a miniature of those systems.</p><p>When I later took on <a href=\"https://www.66ccff-labs.com/work/sensorless-foc-learning-route\" target=\"_blank\" rel=\"noopener\">FOC</a>, Timer, ADC, PWM and interrupts all came up again at once. This time sampling had to line up exactly with switching, and each calculation had to finish before the next cycle began. The peripherals I had learned one by one in Tianjin were now bound together in motor control, and bound far more tightly.</p>"}, "cb": 893, "ca": 1533}, {"group": "Tianjin STM32", "kind": "笔记", "label": "Tianjin STM32 · 笔记 · I²C 通信与 OLED 调试", "route": "https://www.66ccff-labs.com/notes/tianjin-stm32-i2c-oled-debugging", "before": {"zh": "<h2>I²C 通信与 OLED 调试</h2><p class=\"summary\">从上拉、电平、地址与应答，研究软件和硬件 I²C 的区别，以及 OLED 不显示时怎样定位问题。</p><p>我在折腾 STM32 的时候，遇到过程序编译、烧录都正常，OLED 却不显示的情况。后来换了一组普通 GPIO，用软件模拟 I²C，显示恢复了。这个结果让我想继续弄清楚，两种实现最终都通过 SDA 和 SCL 通信，它们究竟在哪些地方不同？要把这个问题看明白，我会先从引脚上的电压开始。</p><h3>I²C 开漏输出与上拉电阻</h3><p>I²C 通常采用开漏输出。输出管导通时，器件把信号线拉低；关断时，则释放这根线，由上拉电阻把它拉回高电平。主控和外设都可以拉低 SDA，发送方释放后，接收方才有机会应答。<a href=\"https://www.nxp.com/docs/en/user-guide/UM10204.pdf\" target=\"_blank\" rel=\"noopener\">NXP 的 I²C 规范</a>用这种连接解释了总线上的电平关系。写软件 I²C 时，我会把输出高电平理解成释放引脚，同时还要读取引脚，确认线上已经变高。</p><p>这样理解以后，程序里的一个赋值就和电路接上了。如果我用推挽输出强行把 SDA 拉高，而外设此时正在拉低它，两边就会争着驱动同一根线。换成开漏以后，高电平的建立速度又取决于上拉电阻和总线电容。模块、连线和输入引脚都会增加电容，释放信号线之后，电压需要一段时间才能升上来。</p><p>上拉电阻因此不能只凭常用值挑一个。<a href=\"https://www.ti.com/lit/an/slva689/slva689.pdf\" target=\"_blank\" rel=\"noopener\">TI 的 SLVA689</a>给出从上拉电压的 30% 升到 70% 所需时间的近似式 <code>tr = 0.8473 × Rp × Cb</code>。假设总线电容为 100 pF，上拉为 4.7 kΩ，算出的上升时间约 398 ns。它低于标准模式的 1000 ns 上限，却超过快速模式的 300 ns 上限。把软件中的延时缩短，并不能让这根线充电更快。</p><p>减小电阻可以加快上升，但拉低时的电流也会增大。这个电流要按上拉电压、低电平电压和电阻计算，再对照器件允许的灌电流。如果两块模块各带一组上拉，接在一起后电阻还会并联。接线前看模块电路、接线后测实际电平，比在程序里反复改延时更容易判断问题出在哪里。</p><h3>I²C 传输流程</h3><p>在时序图里，我最先会找 START、地址和紧接着的应答。<a href=\"https://www.ti.com/lit/an/slva704/slva704.pdf\" target=\"_blank\" rel=\"noopener\">TI 的总线说明</a>画出了这些动作：SCL 为高时，SDA 由高变低表示 START；随后发送地址和读写位，每个字节后再安排一个时钟，让接收方应答。普通数据位传输时，SDA 要在 SCL 为高的期间保持稳定。</p><p>拿一个假设的 7 位地址 <code>0x3C</code> 来算，写操作发出的第一个字节是 <code>(0x3C &lt;&lt; 1) | 0 = 0x78</code>。代码传的是 7 位地址，还是已经拼好读写位的字节，要看所调用接口的约定。否则程序里数字看起来都熟悉，线上发出的地址却可能移位两次。这是读驱动接口时值得顺手算一遍的地方。</p><p>地址发完以后，发送方释放 SDA。若接收方在第九个时钟把它拉低，就是 ACK；保持高电平则是 NACK。只看见八个数据脉冲，还需要继续看第九个时钟和 SDA 上是谁在驱动。收到 ACK 后，我会继续核对后续初始化命令和显示数据。字节被接收与屏幕出现预期内容，中间还有显示控制器自己的处理过程。</p><h3>软件与硬件 I²C</h3><p>软件 I²C 由程序安排引脚翻转、读取和等待，步骤比较直观，也容易换到其他可用 GPIO。代价是 CPU 要参与这些时序；处理中断或执行别的任务时，两次操作之间的间隔可能被拉长。要支持时钟拉伸，还得在释放 SCL 后检查它是否真的变高，不能只等待一个固定延时就当作时钟已经到位。</p><p>硬件 I²C 把位传输交给片上的专用外设，软件负责配置引脚、外设时钟、速率和事务流程，并处理状态与错误。ST 的 <a href=\"https://github.com/STMicroelectronics/stm32f1xx-hal-driver/blob/master/Src/stm32f1xx_hal_i2c.c\" target=\"_blank\" rel=\"noopener\">F1 系列 I²C 驱动说明</a>列出了这些配置环节，也方便对照理解外设需要哪些准备。通信仍然使用相同的总线规则，上拉和信号质量照样要满足要求。排查时我会先固定接线、上拉、总线速率和要发送的内容，再比较两种实现，尽量一次只改变一个条件。</p><p>当时我同时换了 GPIO 和通信实现，这里面已经有两个变化。如果要继续研究，我会在硬件 I²C 对应的同一组引脚上先运行软件版本，再切回外设版本，分别观察 START、地址和 ACK。这样比较，才能逐步分清差异来自引脚配置、电气连接，还是驱动处理过程。</p><h3>BUSY 与芯片勘误</h3><p>STM32F103 的 I²C 确实有值得查的芯片问题。<a href=\"https://www.st.com/resource/en/errata_sheet/es096-stm32f101x8b-stm32f102x8b-and-stm32f103x8b-mediumdensity-device-limitations-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">ST 的 ES096 勘误 2.8.7</a>描述了一种情况：SDA、SCL 实际已经为高，内部模拟滤波器却可能保持低电平状态，导致 BUSY 置位，主机无法发出 START。它给出的恢复步骤包含用 GPIO 产生指定电平变化、读取引脚确认，以及重新设置外设。</p><p>这个现象值得研究的地方，是引脚电平和内部状态可能对不上。检查 BUSY 时，我会同时观察 SDA、SCL，区分信号线真的被拉低，还是两根线已经释放而内部仍显示忙。然后再结合芯片版本和勘误条件选择处理办法，避免把任何一次黑屏都归到同一个原因上。</p><p>屏幕不亮时，可以沿着供电、总线电平、地址应答和显示数据逐段检查。每多看清一步，下一次测量就能更有针对性。对我来说，软件 I²C 的学习价值也在这里：把释放引脚、等待时钟和读取应答写清楚以后，再去读硬件外设的状态位，就更容易理解程序正在等什么。</p>", "en": "<h2>I²C Communication and OLED Debugging</h2><p class=\"summary\">Studying pull-ups, transfer timing and acknowledgment, then comparing software and peripheral I²C when troubleshooting an OLED.</p><p>I ran into a blank OLED while working with an STM32, even though the firmware compiled and flashed successfully. Moving to another pair of ordinary GPIO pins and using software I²C restored the display. I want to understand that result more closely. Both implementations ultimately communicate through SDA and SCL, so where do their differences arise? I would begin with the voltages on those pins.</p><h3>I²C Open-Drain Outputs and Pull-Ups</h3><p>I²C normally uses open-drain outputs. A conducting output transistor pulls the line low; switching it off releases the line, allowing a pull-up resistor to bring it high. Both controller and peripheral can pull SDA low, and releasing it gives the receiver room to acknowledge. The <a href=\"https://www.nxp.com/docs/en/user-guide/UM10204.pdf\" target=\"_blank\" rel=\"noopener\">NXP I²C specification</a> explains the electrical relationship through this shared connection. In software I²C, I would treat a high output as a request to release the pin, then read the input to check that the line has actually risen.</p><p>That interpretation connects a software assignment to the circuit. Driving SDA high with a push-pull output while the peripheral pulls it low makes the two outputs contend. With open-drain operation, the next question becomes how quickly the released line rises. Modules, wiring and input pins all add capacitance, which takes time to charge through the pull-up resistor.</p><p>Choosing a familiar resistor value without checking the bus can miss that timing requirement. <a href=\"https://www.ti.com/lit/an/slva689/slva689.pdf\" target=\"_blank\" rel=\"noopener\">TI's SLVA689</a> gives <code>tr = 0.8473 × Rp × Cb</code> for the approximate rise from 30% to 70% of the pull-up voltage. As a worked example, 100 pF with 4.7 kΩ gives about 398 ns. That fits the 1000 ns Standard-mode limit but exceeds the 300 ns Fast-mode limit. Shortening a software delay cannot make the line charge faster.</p><p>A smaller resistance speeds up the rise while increasing current when the line is low. I would calculate that current from the pull-up voltage, low-level voltage and resistance, then compare it with the device's sink capability. Pull-ups fitted to two modules also appear in parallel when the modules are connected. Checking the module circuit and measuring the assembled bus levels gives a clearer basis for troubleshooting than repeatedly changing delays.</p><h3>I²C Transfer Sequence</h3><p>The first landmarks I would look for in a trace are START, the address and its acknowledgment. <a href=\"https://www.ti.com/lit/an/slva704/slva704.pdf\" target=\"_blank\" rel=\"noopener\">TI's bus guide</a> illustrates the sequence. SDA falling while SCL is high generates START; the controller then sends the address and direction bit. An acknowledgment clock follows every byte. During ordinary data bits, SDA must remain stable throughout SCL's high period.</p><p>For a hypothetical 7-bit address of <code>0x3C</code>, the first byte of a write is <code>(0x3C &lt;&lt; 1) | 0 = 0x78</code>. The software interface may expect the 7-bit address or a value that already incorporates the direction-bit position. I need to check its convention. Otherwise, familiar-looking numbers can hide an address that was shifted twice. It is a small calculation worth doing while reading a driver interface.</p><p>After sending the address, the transmitter releases SDA. The receiver acknowledges by holding it low during the ninth clock; leaving it high gives NACK. Eight visible data pulses are only part of the transaction, so I would inspect the ninth clock and which device controls SDA there. Once ACK is present, the next checks are the initialization commands and display data. Accepting a byte still leaves the display controller's own processing between the transfer and the intended image.</p><h3>Software and Peripheral Implementations</h3><p>Software I²C schedules pin writes, reads and waits directly. The sequence is easy to follow and can move to other suitable GPIO pins, at the cost of CPU involvement in the timing. Interrupt handling or other work can stretch the gap between operations. An implementation that supports clock stretching must also read SCL after releasing it, waiting for the line to become high rather than assuming a fixed delay is enough.</p><p>With hardware I²C, a dedicated peripheral handles the bit transfers. Software still configures pins, peripheral clocks, rate and transaction handling, then deals with status and errors. ST's <a href=\"https://github.com/STMicroelectronics/stm32f1xx-hal-driver/blob/master/Src/stm32f1xx_hal_i2c.c\" target=\"_blank\" rel=\"noopener\">F1 I²C driver instructions</a> list those setup tasks and provide a useful way to understand the peripheral's dependencies. The same bus rules apply, including pull-ups and signal quality. For a comparison, I would hold wiring, pull-ups, bus rate and transmitted content constant, changing one condition at a time where possible.</p><p>My original change involved both GPIO selection and the communication implementation. To investigate further, I would first run a software version on the same pins used by the I²C peripheral, then switch those pins back to peripheral operation. Comparing START, address and ACK in the two cases would help separate pin configuration, electrical connections and driver handling.</p><h3>BUSY and Device Errata</h3><p>The STM32F103 does have I²C issues worth checking. <a href=\"https://www.st.com/resource/en/errata_sheet/es096-stm32f101x8b-stm32f102x8b-and-stm32f103x8b-mediumdensity-device-limitations-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">Section 2.8.7 of ST's ES096 errata</a> describes SDA and SCL being physically high while the internal analogue filters can retain a low state. BUSY becomes set and the controller cannot generate START. The documented recovery includes prescribed GPIO transitions, input reads to confirm the levels and peripheral reconfiguration.</p><p>What interests me here is the possible disagreement between physical pins and internal state. I would examine SDA and SCL alongside BUSY to distinguish a line actually held low from released lines with an internal busy indication. Silicon revision and the erratum's conditions would then guide the response, instead of assigning every blank display to the same cause.</p><p>A blank screen can be investigated through power, bus levels, address acknowledgment and display data. Resolving one stage makes the next measurement more focused. This is also what I value in studying software I²C: spelling out pin release, clock waits and acknowledgment reads makes it easier to understand what a hardware driver's status checks are waiting for.</p>"}, "after": {"zh": "<h2>I²C 通信与 OLED 调试</h2><p class=\"summary\">从上拉、电平、地址与应答，研究软件和硬件 I²C 的区别，以及 OLED 不显示时怎样定位问题。</p><p>程序编译、烧录都没问题，OLED 就是不亮，最后换了一组普通 GPIO、改用软件模拟 I²C 才亮起来。这是天津实习时碰上的事，那时我连两种 I²C 的区别都说不上来。两种实现最后都靠 SDA 和 SCL 这两根线通信，差别到底出在哪？先从这两根线上的电压看起。</p><h3>I²C 开漏输出与上拉电阻</h3><p>I²C 一般用开漏输出。输出管导通，器件把线拉低；关断，就把线放开，由上拉电阻把它拉回高电平。主控和外设都能拉低 SDA，发送方松了手，接收方才有机会应答。<a href=\"https://www.nxp.com/docs/en/user-guide/UM10204.pdf\" target=\"_blank\" rel=\"noopener\">NXP 的 I²C 规范</a>就是用这种共用连接来解释总线电平的。写软件 I²C 时，输出高电平要理解成松开引脚，然后还得读一下，确认线真的升上去了。</p><p>这么一想，程序里的一个赋值就和电路接上了。用推挽输出硬把 SDA 推高，偏偏外设这时在拉低，两边就会抢同一根线。换成开漏，问题就变成松手以后线升得有多快。模块、连线、输入引脚都会添电容，电压要靠上拉电阻一点点充上去。</p><p>所以上拉电阻不能只按常用值随手挑一个。<a href=\"https://www.ti.com/lit/an/slva689/slva689.pdf\" target=\"_blank\" rel=\"noopener\">TI 的 SLVA689</a> 给了从上拉电压 30% 升到 70% 的近似式 <code>tr = 0.8473 × Rp × Cb</code>。假设总线电容 100 pF、上拉 4.7 kΩ，算出来约 398 ns，在标准模式 1000 ns 的上限以内，却超出了快速模式 300 ns 的上限。软件里的延时改得再短，这根线也不会因此充得更快。</p><p>电阻减小，上升是快了，线被拉低时的电流也跟着变大。这个电流要按上拉电压、低电平电压和电阻算出来，再对照器件允许的灌电流。两块模块各自带着上拉，接到一起以后电阻还会并联。接线前看看模块电路，接好后量量实际电平，比在程序里一遍遍改延时更容易找到问题。</p><h3>I²C 传输流程</h3><p>看时序图，我最先找的是 START、地址和紧跟着的应答。<a href=\"https://www.ti.com/lit/an/slva704/slva704.pdf\" target=\"_blank\" rel=\"noopener\">TI 的总线说明</a>把这串动作画得很清楚：SCL 为高时，SDA 由高变低就是 START；接着发地址和读写位，每个字节后面再给一个时钟，让接收方应答。传普通数据位时，SCL 为高的这段时间里，SDA 必须稳住不动。</p><p>拿一个假设的 7 位地址 <code>0x3C</code> 算一下，写操作发出去的第一个字节是 <code>(0x3C &lt;&lt; 1) | 0 = 0x78</code>。接口要的是 7 位地址，还是已经拼好读写位的字节，得看它自己的约定。不然程序里的数字个个眼熟，线上的地址却可能被移了两次位。读驱动接口时，这笔账值得顺手算一遍。</p><p>地址发完，发送方松开 SDA。接收方在第九个时钟把它拉低就是 ACK，一直是高就是 NACK。所以只看到八个数据脉冲还不够，得接着看第九个时钟上 SDA 被谁拉着。有了 ACK，再往下核对初始化命令和显示数据。字节被收下，到屏幕上出现想要的画面，中间还隔着显示控制器自己的处理。</p><h3>软件与硬件 I²C</h3><p>软件 I²C 由程序自己安排引脚翻转、读取和等待，步骤一目了然，换到别的可用 GPIO 也方便。代价是 CPU 得亲自盯着时序，一来中断或者有别的活，两次操作之间的间隔就可能被拉长。要支持时钟拉伸，还得在松开 SCL 以后读一下它是不是真变高了，不能等一个固定延时就当时钟已经到位。</p><p>硬件 I²C 把位传输交给片上的专用外设，软件负责配引脚、开外设时钟、设速率、安排事务流程，再处理状态和错误。ST 的 <a href=\"https://github.com/STMicroelectronics/stm32f1xx-hal-driver/blob/master/Src/stm32f1xx_hal_i2c.c\" target=\"_blank\" rel=\"noopener\">F1 系列 I²C 驱动说明</a>把这些配置环节列得很全，对照着看，外设要做哪些准备就清楚多了。总线规则还是那一套，上拉和信号质量照样要达标。拿两种实现比较时，接线、上拉、速率和发送内容最好都固定住，尽量一次只动一个条件。</p><p>当时我其实同时改了两样东西，换了 GPIO，也换了通信实现。要接着往下查，我会在硬件 I²C 对应的那组引脚上先跑软件版本，再切回外设版本，分别看 START、地址和 ACK。这么一比，差别出在引脚配置、电气连接还是驱动处理上，才能一层层分开。</p><h3>BUSY 与芯片勘误</h3><p>STM32F103 的 I²C 确实有值得查的芯片问题。<a href=\"https://www.st.com/resource/en/errata_sheet/es096-stm32f101x8b-stm32f102x8b-and-stm32f103x8b-mediumdensity-device-limitations-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">ST 的 ES096 勘误 2.8.7</a> 描述过这样一种情况：SDA 和 SCL 实际已经是高电平，内部的模拟滤波器却可能还停在低电平状态，BUSY 于是被置位，主机发不出 START。勘误给的恢复步骤，是先用 GPIO 产生规定的电平变化、读引脚确认，再重新配置外设。</p><p>这个问题有意思的地方在于，引脚上的电平和芯片内部的状态可能对不上。查 BUSY 时，我会同时看 SDA 和 SCL，分清是线真的被拉低了，还是两根线早已松开、内部却还显示忙，再结合芯片版本和勘误的触发条件决定怎么处理，别把每一次黑屏都算到同一个原因头上。天津那块屏要是重新摆到桌上，这条勘误会是我最先排查的方向。</p><p>屏幕不亮，可以顺着供电、总线电平、地址应答、显示数据一段段查，每看清一段，下一次测量就更有的放矢。软件 I²C 对我的价值也在这儿：自己把松开引脚、等时钟、读应答一步步写出来以后，再去读硬件外设的状态位，就知道程序到底在等什么了。</p>", "en": "<h2>I²C Communication and OLED Debugging</h2><p class=\"summary\">Studying pull-ups, transfer timing and acknowledgment, then comparing software and peripheral I²C when troubleshooting an OLED.</p><p>The program compiled and flashed without complaint, and the OLED simply would not light; only after moving to another pair of ordinary GPIO pins with software-emulated I²C did it come on. That happened during the Tianjin internship, when I could not have said what separated the two kinds of I²C. Both end up talking over the same two lines, SDA and SCL, so where does the difference come from? The voltages on those two lines are the place to start.</p><h3>I²C Open-Drain Outputs and Pull-Ups</h3><p>I²C normally uses open-drain outputs. When the output transistor conducts, the device pulls the line low; when it switches off, the device lets go and a pull-up resistor brings the line back high. Controller and peripheral can both pull SDA low, and only after the sender lets go does the receiver get a chance to acknowledge. The <a href=\"https://www.nxp.com/docs/en/user-guide/UM10204.pdf\" target=\"_blank\" rel=\"noopener\">NXP I²C specification</a> explains the bus levels through exactly this shared connection. In software I²C, writing a high level should be read as releasing the pin, followed by reading it back to confirm the line has actually risen.</p><p>Seen that way, an assignment in the program connects to the circuit. Forcing SDA high with a push-pull output while the peripheral happens to be pulling it low makes the two fight over one wire. With open drain, the question becomes how fast the line rises once released. Modules, wiring and input pins all add capacitance, and the voltage has to charge up through the pull-up resistor.</p><p>So a pull-up cannot be picked just because the value is familiar. <a href=\"https://www.ti.com/lit/an/slva689/slva689.pdf\" target=\"_blank\" rel=\"noopener\">TI's SLVA689</a> gives <code>tr = 0.8473 × Rp × Cb</code> for the approximate rise from 30% to 70% of the pull-up voltage. Assume 100 pF of bus capacitance and a 4.7 kΩ pull-up, and the rise comes to about 398 ns, inside the 1000 ns Standard-mode limit and over the 300 ns Fast-mode limit. However short the software delay becomes, the line charges no faster.</p><p>A smaller resistor speeds the rise and also raises the current while the line is held low. That current follows from the pull-up voltage, the low-level voltage and the resistance, and it has to stay within the device's sink capability. Two modules that each carry pull-ups put them in parallel once connected. Looking at the module circuits before wiring and measuring real levels afterwards finds problems faster than changing delays in the program again and again.</p><h3>I²C Transfer Sequence</h3><p>In a timing diagram, the first things I look for are START, the address and the acknowledgment right after it. <a href=\"https://www.ti.com/lit/an/slva704/slva704.pdf\" target=\"_blank\" rel=\"noopener\">TI's bus guide</a> draws the sequence clearly: SDA falling while SCL is high is START, then come the address and direction bit, and every byte is followed by one more clock for the receiver to acknowledge. During ordinary data bits, SDA must hold still for the whole time SCL is high.</p><p>Take a hypothetical 7-bit address of <code>0x3C</code>: the first byte of a write is <code>(0x3C &lt;&lt; 1) | 0 = 0x78</code>. Whether an interface wants the 7-bit address or a byte with the direction bit already in place depends on that interface's own convention. Get it wrong and every number in the code looks familiar while the address on the wire has been shifted twice. It is a small sum worth doing whenever I read a driver interface.</p><p>Once the address is sent, the transmitter releases SDA. A receiver holding it low during the ninth clock means ACK; leaving it high means NACK. Seeing eight data pulses is not enough, then; the ninth clock, and who is driving SDA during it, matter just as much. With ACK in hand, the next checks are the initialization commands and display data. Between a byte being accepted and the right picture appearing on screen lies the display controller's own processing.</p><h3>Software and Hardware I²C</h3><p>In software I²C the program itself schedules pin toggles, reads and waits. Every step is visible, and moving to other free GPIO pins is easy. The price is that the CPU has to babysit the timing, so an interrupt or some other job can stretch the gap between two operations. Supporting clock stretching also means reading SCL after releasing it to check that it really went high, instead of assuming a fixed delay was enough.</p><p>Hardware I²C hands bit transfers to a dedicated on-chip peripheral, while software configures the pins, enables the peripheral clock, sets the rate, runs the transaction flow and handles status and errors. ST's <a href=\"https://github.com/STMicroelectronics/stm32f1xx-hal-driver/blob/master/Src/stm32f1xx_hal_i2c.c\" target=\"_blank\" rel=\"noopener\">F1 I²C driver notes</a> list those setup steps, which makes it much clearer what the peripheral needs before it works. The bus rules are the same, pull-ups and signal quality included. When comparing the two implementations, wiring, pull-ups, rate and transmitted content are best held fixed, changing one condition at a time wherever possible.</p><p>Back then I changed two things at once, the GPIO pins and the communication implementation. To dig further, I would first run the software version on the very pins the I²C peripheral uses, then switch those pins back to the peripheral, watching START, the address and ACK each time. Only a comparison like that separates pin configuration, electrical connection and driver handling, one layer at a time.</p><h3>BUSY and Device Errata</h3><p>The STM32F103's I²C does have silicon issues worth checking. <a href=\"https://www.st.com/resource/en/errata_sheet/es096-stm32f101x8b-stm32f102x8b-and-stm32f103x8b-mediumdensity-device-limitations-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">Section 2.8.7 of ST's ES096 errata</a> describes SDA and SCL already sitting high while the internal analogue filters can stay stuck at low, so BUSY gets set and the controller cannot generate START. The documented recovery uses GPIO to produce prescribed level changes, reads the pins to confirm them, and then reconfigures the peripheral.</p><p>What makes it interesting is that the pin levels and the chip's internal state can disagree. When checking BUSY, I would watch SDA and SCL alongside it to tell a line genuinely held low from two released lines with the inside still reporting busy, then let the silicon revision and the erratum's conditions decide the fix, rather than blaming every dark screen on the same cause. If that Tianjin screen were back on my desk, this erratum is the first thing I would check.</p><p>A dark screen can be traced section by section through power, bus levels, address acknowledgment and display data, and each section that becomes clear makes the next measurement better aimed. That is also what software I²C has been worth to me. After writing out pin release, clock waits and acknowledgment reads step by step myself, reading a hardware peripheral's status bits finally tells me what the program is actually waiting for.</p>"}, "cb": 1500, "ca": 1467}, {"group": "Tianjin STM32", "kind": "笔记", "label": "Tianjin STM32 · 笔记 · 光照标定与查表控制", "route": "https://www.66ccff-labs.com/notes/tianjin-stm32-light-calibration-control", "before": {"zh": "<h2>光照标定与查表控制</h2><p class=\"summary\">从目标 ADC 到 PWM 的一次插值计算，研究采样点分布、标定条件和环境光变化后的修正思路。</p><p>天津实习的光照小实验里，我用编码器设定目标，再让 STM32 调节 LED。程序中有个很具体的问题：目标填 1000，TIM4 的比较值应该填多少？我当时测了 16 组 PWM 与 ADC 数据，写进<a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-pwm-lookup-excerpt.c\" target=\"_blank\" rel=\"noopener\">查表函数</a>。顺着这个问题算下去，209 从哪来、哪些区间值得补测，以及环境光变化后怎样修正输出，就能放在一起理解了。</p><h3>PWM 与 ADC 标定数据</h3><p>这张表从 <code>PWM = 0, ADC = 1600</code> 开始，到 <code>PWM = 1000, ADC = 480</code> 结束。LED 输出增大时，ADC 读数反而减小。对这套接法来说，较小的 ADC 码对应较强的光照，因此目标从 1200 调到 1000，要求的是把灯调亮。屏幕上虽然写着光照，程序真正处理的是 ADC 采样码；要换成 lux，还需要传感器与照度之间的换算关系。</p><p>标定表里的读数还会受到测量环境的影响。LED 离传感器多远、朝向怎样、房间原本有多亮，都会参与最后的读数。标定时保持这些条件不变，才方便把 PWM 的变化和 ADC 的变化对应起来。这里挑出几组相邻记录，后面的计算就用它们。</p><table><thead><tr><th>PWM 设置</th><th>ADC 采样码</th></tr></thead><tbody><tr><td>100</td><td>1180</td></tr><tr><td>200</td><td>1015</td></tr><tr><td>300</td><td>850</td></tr><tr><td>800</td><td>551</td></tr><tr><td>900</td><td>515</td></tr></tbody></table><h3>线性插值与输出限幅</h3><p>目标 1000 处在 ADC 1015 和 850 之间，对应的 PWM 分别是 200 和 300。我先求目标在这段区间里走了多少，再把相同比例用到 PWM 上。两边的 ADC 都按表中顺序相减，分子、分母同时为负，比例仍然为正。</p><pre><code>fraction = (1000 - 1015) / (850 - 1015)\n         = 15 / 165\nPWM      = 200 + fraction * (300 - 200)\n         = 209.0909...</code></pre><p>函数最后加 <code>0.5f</code> 再转成整数，于是返回 209。这是按表算出的指令值。四舍五入对这次计算只改动了约 0.09 个比较计数，真实光照离目标多远，还要把灯调到这个输出以后再读取 ADC。算式的小数位和实物的控制精度，需要分别看。</p><p>沿着调用再往下看，还有一处很容易漏掉。表格末端会返回 1000，但 <code>Set_LED_Brightness()</code> 把大于 999 的输入截成 999，最后写入 TIM4。若重新采集这张表，我会记录实际写入的比较值，让标定、显示和执行用同一套数值范围。比较值怎样对应占空比，则要结合定时器的周期和输出模式一起换算。</p><h3>标定点与补测</h3><p>16 个点分布得很不均匀。前面 PWM 从 0 到 100，每隔 10 就有一个点；后面从 300 直接跳到 800。线性插值等于用一条直线连接这两个记录，函数照样能返回中间值，但这一大段的真实曲线到底弯不弯，得在中间选点测一下。</p><p>例如把 PWM 设成 550，按两端的直线计算，ADC 应为 <code>(850 + 551) / 2 = 700.5</code>。这里的 700.5 是预测值。固定 LED 和传感器的位置，等读数稳定后多读几次，再把平均值与预测值比较，就能检查这段直线是否合适。我会优先在偏差较大或曲线变化较快的位置补点，而不会仅仅为了凑整，把 16 个点扩成 32 个。</p><p>不同区间的换算灵敏度也不同。从 PWM 0 到 10，ADC 变化了 70；从 PWM 300 到 800，ADC 只变化了 299。反过来算，目标 ADC 码每改变 1，前一段约需改变 <code>10 / 70 = 0.143</code> 个 PWM 比较计数，后一段约需 <code>500 / 299 = 1.672</code> 个。用同样的目标步长转动旋钮，各区间的输出步长会相差不少。这个比值能解释调节手感，却不能单独告诉我哪一段的标定误差最大。</p><p>补点之前，我还会先检查采样本身。<a href=\"https://www.st.com/resource/en/application_note/an2834-how-to-get-the-best-adc-accuracy-in-stm32-microcontrollers-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">ST 的 ADC 应用说明 AN2834</a>讨论了信号源阻抗与采样电容的充电时间。光敏电路输出阻抗较高时，要给 ADC 留够采样时间，参考电压也要稳定。重复取样有助于观察波动；如果采样条件一直不对，把同一个偏差测很多遍，平均之后它仍然在。</p><h3>环境光与反馈修正</h3><p>这套程序的<a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-environment-main-excerpt.c\" target=\"_blank\" rel=\"noopener\">主循环</a>把目标 <code>set_light_value</code> 交给查表函数，实测 <code>light_value</code> 则送去显示。目标保持 1000 时，查表就一直得到 209。假设此时房间变亮，传感器读数降到了 900，屏幕上的数字会变，LED 指令仍然保持原值。这就是固定标定关系遇到环境变化时的表现。</p><p>要让输出跟着修正，我会从误差的方向开始推。这里光照越强，ADC 码越小；实测 900、目标 1000，灯应当调暗。沿用原表提供起始输出，可以设想增加一个比例修正项，让 <code>实测 ADC − 目标 ADC</code> 乘以正的系数后加到查表结果上。这样误差为负时，PWM 随之减小。这个符号必须根据实际接法确定，直接套一个惯用的误差公式，很容易越调越偏。</p><p>这个修正还要等新的采样结果到来再计算，并结合采样间隔和 LED、传感器的响应选择系数，最后把输出限制在允许范围内。环境光足够强时，即使 LED 已经关闭，读数也可能达不到目标，继续减小指令便没有作用。查表能帮我快速给出一个起始值，反馈负责根据当前读数调整；而灯能调多亮、能暗到什么程度，最终还是由这套实物决定。</p>", "en": "<h2>Light Calibration and Lookup Control</h2><p class=\"summary\">Working through an ADC-to-PWM interpolation example, uneven calibration intervals and a possible correction for changing ambient light.</p><p>In my Tianjin lighting exercise, an encoder set the target and the STM32 adjusted an LED. A target of 1000 leaves a very specific question: what value should go into TIM4's compare register? During the placement, I measured 16 PWM and ADC pairs and put them into a <a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-pwm-lookup-excerpt.c\" target=\"_blank\" rel=\"noopener\">lookup function</a>. Working through that question connects the resulting command, 209, to two further concerns: where extra calibration measurements would help, and how the output could respond to a change in ambient light.</p><h3>PWM and ADC Calibration Data</h3><p>The table starts at <code>PWM = 0, ADC = 1600</code> and ends at <code>PWM = 1000, ADC = 480</code>. Increasing the LED output produces a lower ADC reading in this setup. A smaller target code therefore requests more light: changing the target from 1200 to 1000 asks for a brighter LED. The display calls it light, but the program works in ADC codes. Expressing the result in lux would require a relationship between the sensor reading and illuminance.</p><p>Those readings also depend on the measurement conditions. Distance and orientation between the LED and sensor matter, as does the light already in the room. Holding those conditions steady during calibration makes it easier to relate a PWM change to the resulting ADC change. These selected adjacent records are enough for the calculations below.</p><table><thead><tr><th>PWM setting</th><th>ADC code</th></tr></thead><tbody><tr><td>100</td><td>1180</td></tr><tr><td>200</td><td>1015</td></tr><tr><td>300</td><td>850</td></tr><tr><td>800</td><td>551</td></tr><tr><td>900</td><td>515</td></tr></tbody></table><h3>Linear Interpolation and Output Limits</h3><p>ADC codes 1015 and 850 bracket the target of 1000; their PWM settings are 200 and 300. I can locate the target within that ADC interval, then apply the same fraction to the PWM interval. Subtracting both ADC differences in table order gives two negative numbers, so their ratio is positive.</p><pre><code>fraction = (1000 - 1015) / (850 - 1015)\n         = 15 / 165\nPWM      = 200 + fraction * (300 - 200)\n         = 209.0909...</code></pre><p>Adding <code>0.5f</code> before the integer conversion makes the function return 209. Rounding changes this particular calculation by about 0.09 compare counts. To find the actual lighting error, I would still need to apply the command and take another ADC reading. The decimal places in the calculation and the accuracy of the physical response answer different questions.</p><p>There is another small detail further down the call path. The table can return 1000, but <code>Set_LED_Brightness()</code> clips anything above 999 before writing TIM4. For a new calibration, I would record the compare value actually written, keeping calibration, display and actuation in the same numerical range. Converting that value into duty cycle also requires the timer period and output mode.</p><h3>Calibration Coverage</h3><p>The 16 points are unevenly spaced. Between PWM 0 and 100 there is a record every 10 counts, followed later by a jump from 300 straight to 800. Linear interpolation connects the two records with a straight line and can readily return intermediate values. Measurements inside that large interval would establish how closely the real curve follows the line.</p><p>At PWM 550, the line predicts an ADC value of <code>(850 + 551) / 2 = 700.5</code>. That is a prediction to check. With LED and sensor positions fixed, I would let the reading settle, collect several samples and compare their mean with 700.5. Additional points would be most useful where the discrepancy is large or the curve changes quickly; expanding the table from 16 to 32 entries merely to reach a round number would not guide the work.</p><p>The inverse mapping also has different sensitivities across the table. PWM 0 to 10 changes ADC by 70 codes, whereas PWM 300 to 800 changes it by 299. A one-code change in the target therefore corresponds to about <code>10 / 70 = 0.143</code> PWM compare counts in the first interval and <code>500 / 299 = 1.672</code> in the second. Equal target increments from the knob can produce quite different output steps. That ratio helps explain the adjustment sensitivity, although it cannot by itself identify the interval with the largest calibration error.</p><p>Before adding points, I would check how the samples are acquired. <a href=\"https://www.st.com/resource/en/application_note/an2834-how-to-get-the-best-adc-accuracy-in-stm32-microcontrollers-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">ST's ADC application note AN2834</a> relates source impedance to the time needed to charge the sampling capacitor. A high-impedance light-sensing circuit needs sufficient ADC sampling time, along with a stable reference voltage. Repeated readings help reveal variation. A persistent error caused by the sampling conditions can survive averaging, however many times I measure it.</p><h3>Ambient Light and Feedback</h3><p>In the <a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-environment-main-excerpt.c\" target=\"_blank\" rel=\"noopener\">main loop</a>, <code>set_light_value</code> enters the lookup function while the measured <code>light_value</code> goes to the display. Holding the target at 1000 keeps the calculated command at 209. Suppose the room becomes brighter and the sensor reading falls to 900. The displayed value changes, but the LED command stays where it was. The conditions have changed while the calibrated mapping remains fixed.</p><p>For a feedback correction, I would first work out which direction the error should move the output. More light gives a smaller ADC code here, so a reading of 900 against a target of 1000 calls for dimming the LED. One possible extension would keep the table's initial command and add a positive coefficient times <code>measured ADC - target ADC</code>. A negative error would then reduce PWM. The actual sensor arrangement determines this sign; copying a familiar error formula without checking it could drive the adjustment further away from the target.</p><p>That correction should run when a new sample arrives, with its coefficient chosen in relation to the sampling interval and the LED and sensor response. The final command also needs output limits. If ambient light is strong enough, even switching the LED off may leave the reading short of the requested target, so further reductions have no effect. The table can supply an initial setting and feedback can adjust it using the current reading. The range of light the hardware can actually produce sets the final limit on both.</p>"}, "after": {"zh": "<h2>光照标定与查表控制</h2><p class=\"summary\">从目标 ADC 到 PWM 的一次插值计算，研究采样点分布、标定条件和环境光变化后的修正思路。</p><p>天津实习的光照小实验里，编码器设定目标，STM32 去调 LED。代码里有个特别具体的问题：目标填 1000，TIM4 的比较值该填多少？当时我测了 16 组 PWM 和 ADC 数据，写进了<a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-pwm-lookup-excerpt.c\" target=\"_blank\" rel=\"noopener\">查表函数</a>。顺着这个问题算下去，209 是怎么来的、哪几段值得补测、环境光一变输出该怎么修，就能串在一起看了。</p><h3>PWM 与 ADC 标定数据</h3><p>这张表从 <code>PWM = 0, ADC = 1600</code> 开始，到 <code>PWM = 1000, ADC = 480</code> 结束。LED 越亮，ADC 读数反而越小。在这套接法里，ADC 码小代表光强，所以目标从 1200 调到 1000，其实是要把灯调亮。屏幕上写的是光照，程序里处理的始终是 ADC 采样码，想换成 lux，还得有传感器读数和照度之间的换算关系。</p><p>表里的读数也离不开测量环境。LED 离传感器多远、朝哪个方向、房间本来有多亮，都会掺进最后的读数。标定时把这些条件固定住，PWM 的变化和 ADC 的变化才对得上。下面挑几组相邻记录，后面的计算就用它们。</p><table><thead><tr><th>PWM 设置</th><th>ADC 采样码</th></tr></thead><tbody><tr><td>100</td><td>1180</td></tr><tr><td>200</td><td>1015</td></tr><tr><td>300</td><td>850</td></tr><tr><td>800</td><td>551</td></tr><tr><td>900</td><td>515</td></tr></tbody></table><h3>线性插值与输出限幅</h3><p>目标 1000 落在 ADC 1015 和 850 之间，对应的 PWM 是 200 和 300。先算目标在这段 ADC 区间里走了几成，再把同样的比例套到 PWM 区间上。两边的 ADC 都按表里的顺序相减，分子分母同时为负，比例还是正的。</p><pre><code>fraction = (1000 - 1015) / (850 - 1015)\n         = 15 / 165\nPWM      = 200 + fraction * (300 - 200)\n         = 209.0909...</code></pre><p>函数最后加上 <code>0.5f</code> 再转整数，返回 209，这是按表算出的指令值。四舍五入只让这次结果差了约 0.09 个比较计数；灯实际离目标有多远，还得把输出调到 209 以后再读一次 ADC。算式算到小数点后几位，和实物能控制得多准，是两码事。</p><p>顺着调用再往下看，还有一处很容易漏。表格末端会返回 1000，但 <code>Set_LED_Brightness()</code> 会把大于 999 的输入截成 999 再写进 TIM4。要是重新采这张表，我会记下真正写进去的比较值，让标定、显示和执行用同一套数值范围。比较值对应多少占空比，还要结合定时器的周期和输出模式来换算。</p><h3>标定点与补测</h3><p>这 16 个点分布得很不均匀。PWM 0 到 100 之间每隔 10 就有一个点，到了后面，却从 300 一下跳到 800。线性插值等于在这两个点之间拉一条直线，函数照样能返回中间值，但这一大段真实曲线弯不弯，得在中间挑点测一测。</p><p>比如把 PWM 设成 550，按两端连的直线算，ADC 应该是 <code>(850 + 551) / 2 = 700.5</code>。这个 700.5 只是预测。把 LED 和传感器的位置固定好，等读数稳定后多读几次，用平均值和它比，就知道这段直线靠不靠谱。补点我会优先放在偏差大、曲线变化快的地方，不会为了凑个整数把 16 个点扩成 32 个。</p><p>反过来换算时，各段的灵敏度也不一样。PWM 从 0 到 10，ADC 变了 70；PWM 从 300 到 800，ADC 只变了 299。也就是说，目标 ADC 每改 1，前一段 PWM 大约动 <code>10 / 70 = 0.143</code> 个比较计数，后一段要动 <code>500 / 299 = 1.672</code> 个。旋钮转同样一格，不同区间的输出步长能差出一大截。这个比值能解释调节手感，光凭它却看不出哪一段的标定误差最大。</p><p>补点之前，还得先查采样本身。<a href=\"https://www.st.com/resource/en/application_note/an2834-how-to-get-the-best-adc-accuracy-in-stm32-microcontrollers-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">ST 的 ADC 应用说明 AN2834</a>讨论了信号源阻抗和采样电容充电时间的关系。光敏电路输出阻抗偏高时，要给 ADC 留够采样时间，参考电压也得稳。多次取样能看出读数在晃；可要是采样条件本身就不对，同一个偏差测上一百遍，平均下来它还在那儿。</p><h3>环境光与反馈修正</h3><p><a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-environment-main-excerpt.c\" target=\"_blank\" rel=\"noopener\">主循环</a>把目标 <code>set_light_value</code> 交给查表函数，实测的 <code>light_value</code> 只拿去显示。目标一直是 1000，查表就一直给 209。假设这时房间变亮，传感器读数降到 900，屏幕上的数字变了，LED 的指令却纹丝不动。标定关系是固定的，环境却在变，前馈就是这个样子。</p><p>想让输出跟着修，先得把误差的方向想清楚。这里光越强 ADC 码越小，实测 900、目标 1000，灯应该调暗。可以设想在查表结果的基础上加一个比例修正项，用 <code>实测 ADC − 目标 ADC</code> 乘一个正系数再加上去，误差为负时 PWM 就跟着减小。这个符号必须按实际接法推，照搬一个惯用的误差公式，很可能越调越偏。</p><p>修正要等新的采样到了再算，系数也要结合采样间隔和 LED、传感器的响应来选，算出来的输出还得限幅。环境光够强时，就算把 LED 关掉，读数也可能够不着目标，再往下减指令也没用。查表负责快速给一个起点，反馈负责按当前读数微调，至于灯最亮能多亮、最暗能多暗，到头来还是这套实物说了算。</p>", "en": "<h2>Light Calibration and Lookup Control</h2><p class=\"summary\">Working through an ADC-to-PWM interpolation example, uneven calibration intervals and a possible correction for changing ambient light.</p><p>In the Tianjin lighting exercise, an encoder set the target and the STM32 adjusted an LED. The code raises a very specific question: with a target of 1000, what goes into TIM4's compare register? Back then I measured 16 PWM and ADC pairs and put them into a <a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-pwm-lookup-excerpt.c\" target=\"_blank\" rel=\"noopener\">lookup function</a>. Following that question through ties together where the answer 209 comes from, which stretches of the table deserve extra measurements, and how the output should be corrected once the ambient light changes.</p><h3>PWM and ADC Calibration Data</h3><p>The table starts at <code>PWM = 0, ADC = 1600</code> and ends at <code>PWM = 1000, ADC = 480</code>. The brighter the LED, the lower the ADC reading. In this wiring a small ADC code means strong light, so moving the target from 1200 to 1000 actually asks for a brighter LED. The screen says light, but the program only ever handles ADC codes; converting to lux would need a relationship between the sensor reading and illuminance.</p><p>The readings also depend on how they were taken. How far the LED sits from the sensor, which way it faces and how bright the room already is all end up in the number. Holding those conditions fixed during calibration is what lets a PWM change line up with an ADC change. A few adjacent records from the table are enough for the calculations that follow.</p><table><thead><tr><th>PWM setting</th><th>ADC code</th></tr></thead><tbody><tr><td>100</td><td>1180</td></tr><tr><td>200</td><td>1015</td></tr><tr><td>300</td><td>850</td></tr><tr><td>800</td><td>551</td></tr><tr><td>900</td><td>515</td></tr></tbody></table><h3>Linear Interpolation and Output Limits</h3><p>A target of 1000 falls between ADC 1015 and 850, whose PWM settings are 200 and 300. First find how far into that ADC interval the target sits, then apply the same fraction to the PWM interval. Both ADC differences are taken in table order, so numerator and denominator are both negative and the fraction comes out positive.</p><pre><code>fraction = (1000 - 1015) / (850 - 1015)\n         = 15 / 165\nPWM      = 200 + fraction * (300 - 200)\n         = 209.0909...</code></pre><p>The function adds <code>0.5f</code> before converting to an integer and returns 209, the command the table calculates. Rounding moves this particular result by only about 0.09 compare counts; how far the light actually lands from the target is only known after setting 209 and reading the ADC again. How many decimal places the arithmetic carries and how precisely the hardware can be controlled are two separate matters.</p><p>Following the call further down turns up one more easy-to-miss detail. The end of the table can return 1000, but <code>Set_LED_Brightness()</code> clips anything above 999 to 999 before writing TIM4. If I recollected this table, I would record the compare value actually written, so calibration, display and actuation all share one numerical range. Turning that value into a duty cycle also needs the timer period and output mode.</p><h3>Calibration Coverage</h3><p>The 16 points are spread very unevenly. Between PWM 0 and 100 there is a point every 10 counts, yet later the table jumps from 300 straight to 800. Linear interpolation draws a straight line between those two points, and the function will happily return values in between, but whether the real curve bends across that long stretch can only be found by measuring somewhere in the middle.</p><p>At PWM 550, for example, the line between the two ends predicts an ADC value of <code>(850 + 551) / 2 = 700.5</code>. That 700.5 is only a prediction. With the LED and sensor fixed in place, I would let the reading settle, take several samples and compare their average with it to see whether the straight line holds up. Extra points belong where the error is large or the curve changes quickly; growing 16 points to 32 just for a rounder number would not guide anything.</p><p>Converting in the other direction, sensitivity also differs along the table. PWM 0 to 10 moves the ADC by 70, while PWM 300 to 800 moves it by only 299. Each one-code change of target therefore needs about <code>10 / 70 = 0.143</code> compare counts of PWM in the first interval and <code>500 / 299 = 1.672</code> in the second. The same click of the knob can produce very different output steps in different intervals. That ratio explains how the adjustment feels, though on its own it cannot say which interval carries the largest calibration error.</p><p>Before adding points, the sampling itself needs a check. <a href=\"https://www.st.com/resource/en/application_note/an2834-how-to-get-the-best-adc-accuracy-in-stm32-microcontrollers-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">ST's ADC application note AN2834</a> relates source impedance to the time the sampling capacitor needs to charge. A light-sensing circuit with fairly high output impedance needs enough ADC sampling time and a stable reference voltage. Repeated samples show how much the reading wobbles, but if the sampling conditions are wrong to begin with, the same offset measured a hundred times is still there after averaging.</p><h3>Ambient Light and Feedback</h3><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-environment-main-excerpt.c\" target=\"_blank\" rel=\"noopener\">main loop</a> hands the target <code>set_light_value</code> to the lookup function and sends the measured <code>light_value</code> only to the display. With the target held at 1000, the lookup keeps returning 209. Suppose the room gets brighter and the sensor reading drops to 900: the number on screen changes, and the LED command does not move at all. The calibrated mapping is fixed while the surroundings change, and that is exactly how feedforward behaves.</p><p>Making the output follow starts with getting the direction of the error right. Here stronger light means a smaller ADC code, so a reading of 900 against a target of 1000 calls for dimming the LED. One possible extension keeps the table's result as the starting output and adds a proportional term, <code>measured ADC − target ADC</code> times a positive coefficient, so a negative error reduces PWM. That sign has to be derived from the actual wiring; borrowing a habitual error formula without checking could easily push the light further from the target.</p><p>The correction should run only when a new sample arrives, its coefficient chosen with the sampling interval and the LED and sensor response in mind, and the resulting output limited to its allowed range. When ambient light is strong enough, even an LED switched fully off may leave the reading short of the target, and reducing the command further does nothing. The table supplies a quick starting point and feedback trims it against the current reading; how bright and how dim the light can actually go is, in the end, up to this particular hardware.</p>"}, "cb": 1301, "ca": 1237}, {"group": "Nanjing Turing", "kind": "主页", "label": "Nanjing Turing · 主页 · 南京图灵 Seamly2D 开发实习", "route": "https://www.66ccff-labs.com/work/nanjing-turing-qt-embedded-learning", "before": {"zh": "<h2>南京图灵 Seamly2D 开发实习</h2><p class=\"summary\">三周实习里，我从配置 Qt、编译陌生代码库开始，为 Seamly2D 加入本地账户和角色管理，再完成 Windows 安装包与 macOS 无签名包的演示和交接。</p><h3>进入 Seamly2D</h3><p>2025 年全国大学生电子设计竞赛结束后，我留在南京，开始了三周全职实习。我原先以为会接触嵌入式设备的 UI，真正要改的却是 <a href=\"https://github.com/FashionFreedom/Seamly2D\" target=\"_blank\" rel=\"noopener\">Seamly2D</a>，一个 C++ 与 Qt 编写的大型服装纸样软件。此前我只上过学校的 C++ 入门课，程序基本还停在命令行，Qt 和多人协作仓库都要现学。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/nanjing-turing/seamly2d-banner.png\" alt=\"Seamly2D 上游项目标识\"><figcaption>Seamly2D 上游项目标识</figcaption></figure></div><p>公司想验证继续二次开发的可行性。我接到的任务是在主界面前加入本地注册、登录和角色管理，再把修改版构建、打包并交接。带教工程师每天给任务，我完成后汇报。三周的终点很具体，要让别人能够安装、打开并检查我的改动。</p><h3>环境与构建</h3><p>第一天先耗在下载上。Qt 在线安装器连海外服务器，三个小时大约下了 10%，我还以为大软件本来就这么慢，老老实实等了大半天。第二天工程师告诉我可以换清华镜像，剩余安装一个多小时就结束了。后来看到 <a href=\"https://mirrors.tuna.tsinghua.edu.cn/help/qt/\" target=\"_blank\" rel=\"noopener\">TUNA 的 Qt 镜像说明</a>，再想起那一天，多少有点好笑。</p><p>装好也没马上能用。最初我选 Qt 5.15.2，把 <code>core5compat</code> 改为条件加载后，qmake 通过，完整编译却继续报三十多个错误。当前分支已经用了 Qt 6 的头文件和 API，继续补 Qt 5 兼容会偏离这次任务。我改用 Qt 6.5.3 MSVC2019 64-bit、Qt 5 Compatibility Module 与 v142 编译器，删除旧 build 目录和 <code>Seamly2D.pro.user</code>，重新配置 Kit，才把完整构建跑通。</p><p>这段排查让我开始把分支、Qt 包、编译器和架构放在一起核对。此前我把 GitHub 当成下载代码的地方，这次才实际练习 clone、切分支、commit、push、merge、pull request、fork 与 tag，用 Git 保存和交接自己的改动。<a href=\"https://www.66ccff-labs.com/notes/turing-qt-seamly2d-first-run\" target=\"_blank\" rel=\"noopener\">首跑原始记录</a>保留了环境配置与具体报错处理。</p><h3>账户与角色</h3><p>程序启动后，我加入注册、登录窗口，并在 <code>main()</code> 附近整理进入主界面的顺序。账户信息由 <a href=\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">QSettings</a> 在本机保存，密码从早期明文比较改成哈希存储与校验，输入框增加遮蔽，再分别处理用户已存在、用户不存在和密码错误。</p><p>真正使用界面时，小问题一个也绕不开。回车默认触发取消，用户名框弹联想，密码框在中文输入法状态下发生过闪退，我逐项修正这些行为。到了角色管理，重点又从窗口长什么样，变成谁可以对谁执行什么操作。第一个账号必须是 <code>admin</code>；普通用户看不到管理入口；管理员只能删除或升级普通用户，删除还要二次确认；其他管理员的降级只能由 <code>admin</code> 执行。</p><p>我把每项操作按当前用户、目标用户和允许的状态变化拆开实现，再逐项演示。</p><h3>安装与换机</h3><p>第三周转做 Release，我在 <code>windeployqt</code> 上卡了约三天。工具明明在硬盘里，构建步骤却找不到，重装和查路径的过程确实很烦。最后，我给 Qt Creator 的 Build Environment 补上 Qt <code>bin</code>，并让两个 <code>.pro</code> 文件通过 <code>QT_INSTALL_BINS</code> 定位部署工具，只在 Release 配置执行。</p><p>部署目录里已经堆满 DLL，程序还缺 <code>xerces-c_3_2.dll</code>。我补上这个 XML 库，才继续完成 Windows 自签名、Inno Setup 打包、安装与启动。<a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Qt 部署文档</a>也明确提醒，额外第三方库不在 <code>windeployqt</code> 的自动处理范围内。前面读过的 <code>.sm2d</code>、<code>.smis</code> 样例，这时与程序需要的 XML 解析依赖对上了。</p><p>我同期整理过 <a href=\"https://www.66ccff-labs.com/notes/turing-cmake-build-logic\" target=\"_blank\" rel=\"noopener\">CMake 与编译原理资料</a>，用来分清生成器、编译器、链接器和运行时依赖，手上的 Seamly2D 则一直使用 qmake。<a href=\"https://www.66ccff-labs.com/notes/turing-release-packaging-cross-platform\" target=\"_blank\" rel=\"noopener\">打包原始记录</a>与 <a href=\"https://www.66ccff-labs.com/notes/turing-sm2d-xml-data-format\" target=\"_blank\" rel=\"noopener\">XML 样例</a>里有操作和数据细节。</p><p>实习正式验收时，Windows 安装与功能检查都在开发机上进行。结束约半个月后，我又在家中一台新装的 Windows 台式机上补测，那台电脑没有 Qt 和 Visual Studio。运行安装程序后，注册、登录和角色功能都能实际操作。</p><h3>Mac 与交接</h3><p>我也把同一份源码迁到自己的 Mac，重新处理 Qt 路径、架构与 Kit，跑通 Debug 和 Release，再用 <code>macdeployqt</code> 收集依赖。应用能够启动，无签名 DMG 也生成并在这台 Mac 上打开过，带教工程师现场看了演示。随后我创建自签名证书，尝试 <code>codesign</code>、<code>spctl</code> 与打包脚本，应用签名没有做完。</p><p>最后，工程师检查了注册登录、角色管理、Windows 安装和 Mac 演示，还认真肯定了我三周里的进步。源码、周日志、环境文档和脚本提交到了公司的实习生 <code>develop</code> 分支。我当时非常兴奋，第一次确认自己能进入陌生的大型代码库，完成一组实际修改，再交给别人检查。</p>", "en": "<h2>Seamly2D Qt Development Internship</h2><p class=\"summary\">In a three-week internship, I brought an unfamiliar Qt codebase into operation, added local accounts and role management, and prepared a Windows installer and an unsigned macOS package for review and handoff.</p><h3>Joining the Seamly2D Project</h3><p>After the 2025 National Undergraduate Electronics Design Contest, I stayed in Nanjing for a three-week full-time internship. I had expected to encounter UI work for embedded devices. The actual assignment involved <a href=\"https://github.com/FashionFreedom/Seamly2D\" target=\"_blank\" rel=\"noopener\">Seamly2D</a>, a large C++ and Qt patternmaking application. My prior experience was an introductory university C++ course, mostly in the terminal; both Qt and a collaborative codebase were new territory.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/nanjing-turing/seamly2d-banner.png\" alt=\"Upstream Seamly2D wordmark\"><figcaption>Upstream Seamly2D wordmark</figcaption></figure></div><p>The company wanted to assess further development on the application. My task was to add local registration, login, and role management before the main interface, then build, package, and hand off the modified version. The supervising engineer assigned daily work, and I reported back after completing it. By the end of three weeks, someone else needed to be able to install, open, and inspect my changes.</p><h3>Environment and Build</h3><p>The first day disappeared into downloading. After three hours against the overseas server, the Qt Online Installer was about 10 percent complete. I assumed large software simply took that long and waited for much of the day. The next morning, the engineer mentioned the Tsinghua mirror; the remaining installation finished in a little over an hour. Reading the <a href=\"https://mirrors.tuna.tsinghua.edu.cn/help/qt/\" target=\"_blank\" rel=\"noopener\">TUNA Qt mirror guide</a> later made that patient first day seem rather funny.</p><p>Installation did not immediately produce a working build. I began with Qt 5.15.2 and made <code>core5compat</code> conditional, which let qmake pass, only for compilation to report more than thirty errors. The branch already used Qt 6 headers and APIs. Extending Qt 5 compatibility would have pulled me away from the assignment, so I installed Qt 6.5.3 MSVC2019 64-bit and Qt 5 Compatibility Module with the v142 compiler. Deleting the old build directory and <code>Seamly2D.pro.user</code>, then configuring the Kit again, finally produced a complete build.</p><p>That process taught me to check the branch, Qt package, compiler, and architecture together. GitHub had previously been somewhere to download code. During the internship I practiced clone, branch switching, commit, push, merge, pull requests, forks, and tags as ways to preserve and exchange actual work. The <a href=\"https://www.66ccff-labs.com/notes/turing-qt-seamly2d-first-run\" target=\"_blank\" rel=\"noopener\">original first-run record</a> retains the environment setup and specific error handling.</p><h3>Accounts and Roles</h3><p>With the application running, I added registration and login windows and organized the entry sequence around <code>main()</code>. <a href=\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">QSettings</a> persisted account information locally. I replaced early plaintext password comparison with hash storage and verification, masked the password input, and added distinct handling for existing users, missing users, and wrong passwords.</p><p>Using the windows exposed smaller problems that still blocked the feature. Enter activated Cancel, username fields offered suggestions, and the password field could crash with a Chinese input method active. I corrected those behaviors one by one. Role management then shifted my attention from the appearance of a window to which user could act on which account. The first account had to be <code>admin</code>; normal users could not access management; administrators could delete or promote only normal users, with confirmation before deletion; and only <code>admin</code> could demote another administrator.</p><p>I implemented the operations by separating the current user, target user, and permitted state change, then demonstrated them individually.</p><h3>Installation and Another Machine</h3><p>Release work in the third week stalled at <code>windeployqt</code> for about three days. The executable existed on disk but the build could not find it. Reinstallation and path checks were frustrating. I finally exposed Qt's <code>bin</code> directory to Qt Creator's Build Environment and let both <code>.pro</code> files locate the deployment tool through <code>QT_INSTALL_BINS</code>, running it only in Release configuration.</p><p>Even with DLLs filling the deployment directory, the application still lacked <code>xerces-c_3_2.dll</code>. I added that XML library before completing Windows self-signing, Inno Setup packaging, installation, and launch. The <a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Qt deployment guide</a> explicitly excludes additional third-party libraries from <code>windeployqt</code>'s automatic work. The <code>.sm2d</code> and <code>.smis</code> samples I had read earlier now connected to a concrete runtime dependency on an XML parser.</p><p>I also kept <a href=\"https://www.66ccff-labs.com/notes/turing-cmake-build-logic\" target=\"_blank\" rel=\"noopener\">CMake and build-logic study material</a> to distinguish generators, compilers, linkers, and runtime dependencies, while the Seamly2D project on my desk continued to use qmake. The <a href=\"https://www.66ccff-labs.com/notes/turing-release-packaging-cross-platform\" target=\"_blank\" rel=\"noopener\">original packaging record</a> and <a href=\"https://www.66ccff-labs.com/notes/turing-sm2d-xml-data-format\" target=\"_blank\" rel=\"noopener\">XML samples</a> contain the detailed procedures and data.</p><p>Formal Windows installation and feature checks took place on the development machine. About two weeks after the internship, I also tested the installer on a newly installed Windows desktop at home with neither Qt nor Visual Studio present. Registration, login, and role operations worked.</p><h3>Mac and Handoff</h3><p>I moved the same source to my Mac, reworked the Qt paths, architecture, and Kit, and brought up both Debug and Release. After collecting dependencies with <code>macdeployqt</code>, the application launched; I also generated and opened an unsigned DMG on that machine, with the supervising engineer watching the demonstration. I then created a self-signed certificate and tried the <code>codesign</code>, <code>spctl</code>, and packaging sequence. Application signing did not finish.</p><p>At the final review, the engineer checked registration, login, roles, Windows installation, and the Mac demonstration, and made a point of praising my progress over the three weeks. The source, weekly logs, environment notes, and scripts went into the company's intern <code>develop</code> branch. I was very excited. For the first time, I had entered an unfamiliar large codebase, completed real changes, and handed them to someone else for inspection.</p>"}, "after": {"zh": "<h2>南京图灵 Seamly2D 开发实习</h2><p class=\"summary\">三周实习里，我从配置 Qt、编译陌生代码库开始，为 Seamly2D 加入本地账户和角色管理，再完成 Windows 安装包与 macOS 无签名包的演示和交接。</p><h3>进入 Seamly2D</h3><p>2025 年 8 月初，我在南京打完全国大学生电子设计竞赛，接着就在南京开始了三周的全职实习，早八点到晚五点坐办公室。我原本以为会去做嵌入式设备上的交互界面，结果要改的是 <a href=\"https://github.com/FashionFreedom/Seamly2D\" target=\"_blank\" rel=\"noopener\">Seamly2D</a>，一个用 C++ 和 Qt 写的大型开源服装纸样软件，能在上面裁剪、设计衣服的版型。那时我的 C++ 停在学校入门课的水平，函数和面向对象学过，继承只稍微了解了一下；写过的程序全在命令行里，敲一行命令，出一行结果。Qt 没碰过，这种体量的开源桌面项目也从来没跑过。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/nanjing-turing/seamly2d-banner.png\" alt=\"Seamly2D 上游项目标识\"><figcaption>Seamly2D 上游项目标识</figcaption></figure></div><p>公司想在 Seamly2D 的基础上做二次开发，先验证能不能在原有程序前面加一层账户入口。带教工程师给我的任务很明确：在主界面之前加上本地注册、登录和角色管理，再把改好的版本构建、打包、交接。他每天跟我讲当天的任务，我做完去找他汇报。三周以后，要让别人能把我的改动装上、打开、检查一遍。</p><h3>环境与构建</h3><p>第一天几乎全耗在下载上。Qt 在线安装器连的是国外的服务器，下了三个小时，进度条才走到 10%。我以为大软件就是这么慢，坑吃坑吃等了大半天。跟带教工程师一提，他告诉我可以换国内的清华源。第二天换到<a href=\"https://mirrors.tuna.tsinghua.edu.cn/help/qt/\" target=\"_blank\" rel=\"noopener\">清华的 Qt 镜像</a>上，剩下的一个多钟头就下完了。前一天守着进度条的我，真跟个小丑一样，不过这种事属于吃一堑长一智，跟后面那种真烦躁不是一回事。</p><p>装好也没法直接用。我先选了 Qt 5.15.2，把 <code>core5compat</code> 改成条件加载，qmake 是过了，完整编译却又报出三十多个错误。当前分支早就用上了 Qt 6 的头文件和 API，再去补 Qt 5 的兼容，只会离这次的任务越来越远。我改装 Qt 6.5.3 MSVC2019 64-bit 和 Qt 5 Compatibility Module，配 v142 编译器，删掉旧的 build 目录和 <code>Seamly2D.pro.user</code>，重新配 Kit，完整构建才终于跑通。版本一对上，那三十多个错误也跟着没了。</p><p>这么一折腾，我养成了把分支、Qt 包、编译器和架构放在一起对的习惯。这也是我第一次系统地碰大型项目。以前 GitHub 对我来说就是个下代码的地方，多人协作开发是怎么回事，脑子里完全没概念。这三周里，clone、查看并切换上游分支、建自己的开发分支、commit、push、merge、pull request、fork、tag，全是现学的，而且实打实用了一遍，我是真觉得 Git 好用。环境怎么配、每个报错怎么处理，记在我当时写的<a href=\"https://www.66ccff-labs.com/notes/turing-qt-seamly2d-first-run\" target=\"_blank\" rel=\"noopener\">首跑原始记录</a>里。</p><h3>账户与角色</h3><p>程序能跑以后，我加了注册和登录窗口，在 <code>main()</code> 附近理顺进入主界面的顺序。账户信息用 <a href=\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">QSettings</a> 存在本机。密码一开始是明文比对，后来改成不可逆的哈希存储和校验，输入框也加了遮挡，再把用户已存在、用户不存在、密码错误分开处理。线上联网和数据库这次没做，一来我不会，二来当时也不急，这一步本来就只是验证 Seamly2D 前面能不能再加一层入口。</p><p>界面真拿来用，小毛病一个都躲不掉。回车默认触发的是取消，用户名框会弹联想，开着中文输入法时密码框还闪退过，我一项项改掉。到了角色管理，心思就从窗口长什么样，转到了谁能对谁做什么。第一个账号必须是 <code>admin</code>；普通用户看不到管理入口；管理员只能删除或升级普通用户，删除前还要二次确认；其他管理员只能由 <code>admin</code> 来降级。我把每项操作按当前用户、目标用户和允许的状态变化拆开实现，再一项项演示。这几条规则后来又拆开细想了一遍，写在<a href=\"https://www.66ccff-labs.com/notes/turing-local-role-permissions\" target=\"_blank\" rel=\"noopener\">本地账户的权限判断</a>里。</p><h3>Windows 打包与换机</h3><p>第三周转去做 Release，<code>windeployqt</code> 卡了我至少三天。工具明明就在硬盘里，构建步骤就是找不到它。重装、查路径，来来回回，那几天是真烦。到底是哪一步起的作用，我自己都记不太清，反正某一刻它突然就找到了。按当时留下的记录，最后的做法是给 Qt Creator 的 Build Environment 补上 Qt 的 <code>bin</code> 目录，再让两个 <code>.pro</code> 文件通过 <code>QT_INSTALL_BINS</code> 去定位部署工具，只在 Release 配置下执行。</p><p>部署目录里的 DLL 已经堆得满满当当，程序一启动还是缺 <code>xerces-c_3_2.dll</code>。补上这个 XML 解析库，才接着做完 Windows 自签名、Inno Setup 打包、安装和启动。按 <a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Qt 的部署文档</a>，额外的第三方库本来就不归 <code>windeployqt</code> 管。前面读过的 <code>.sm2d</code>、<code>.smis</code> 样例，到这里和程序要的 XML 解析依赖对上了。为什么一大堆 DLL 里还能缺一个，在<a href=\"https://www.66ccff-labs.com/notes/turing-windows-runtime-dependencies\" target=\"_blank\" rel=\"noopener\">Qt 程序的 Windows 运行依赖</a>里顺着加载过程拆了一遍。</p><p>同期我还整理过 <a href=\"https://www.66ccff-labs.com/notes/turing-cmake-build-logic\" target=\"_blank\" rel=\"noopener\">CMake 与编译原理的资料</a>，用来分清生成器、编译器、链接器和运行时依赖，手上的 Seamly2D 则一直用的是 qmake。<a href=\"https://www.66ccff-labs.com/notes/turing-release-packaging-cross-platform\" target=\"_blank\" rel=\"noopener\">打包原始记录</a>和 <a href=\"https://www.66ccff-labs.com/notes/turing-sm2d-xml-data-format\" target=\"_blank\" rel=\"noopener\">XML 样例</a>里有具体操作和数据。</p><p>正式验收时，Windows 的安装和功能检查都是在开发机上做的。实习结束大概半个月，我回到家，在一台刚装好系统的 Windows 台式机上又试了一次，那台电脑上没有 Qt，也没有 Visual Studio。直接运行安装程序，装完双击打开，就是我改过的那一版，注册、登录和角色功能都能用。</p><h3>Mac 与交接</h3><p>同一份源码我也搬到了自己的 Mac 上，重新处理 Qt 路径、架构和 Kit，Debug 和 Release 都跑通了。用 <code>macdeployqt</code> 收集完依赖，应用能启动，无签名的 DMG 也生成出来，在这台 Mac 上打开过，带教工程师现场看了演示。之后我建了自签名证书，试着走 <code>codesign</code>、<code>spctl</code> 和打包脚本那一套，应用签名到底没做完，具体卡在哪一步，我到现在也说不太清。工程师自己不用 macOS，知道这条路走得通，也就没再多问。</p><p>最后验收，工程师逐项看了注册登录、角色管理、Windows 安装和 Mac 演示，结结实实把我夸了一顿，说一个三周前连 Qt 是什么都不知道的人，能做到这一步相当厉害。源码、每周日志、环境文档和脚本都提交到了公司专门给实习生开的 <code>develop</code> 分支，后面怎么用、有没有做进产品，我就不清楚了。</p><p>被这么一夸，我是真的兴奋。三周前我还在命令行里打转，三周后，我进了一个陌生的大型代码库，做完一组实打实的修改，又把它交到了别人手里检查。</p>", "en": "<h2>Seamly2D Qt Development Internship</h2><p class=\"summary\">In a three-week internship, I brought an unfamiliar Qt codebase into operation, added local accounts and role management, and prepared a Windows installer and an unsigned macOS package for review and handoff.</p><h3>Joining the Seamly2D Project</h3><p>In early August 2025 I finished the National Undergraduate Electronics Design Contest in Nanjing and went straight into a three-week, full-time internship in the same city, in the office from eight to five every day. I had expected to work on UI for embedded devices. What I actually had to change was <a href=\"https://github.com/FashionFreedom/Seamly2D\" target=\"_blank\" rel=\"noopener\">Seamly2D</a>, a large open-source C++ and Qt application for cutting and designing garment patterns. My C++ stopped at the level of the university's introductory course: functions and object-oriented basics, with inheritance only skimmed. Everything I had written lived in a terminal, one command in and one result out. I had never touched Qt or run an open-source desktop project of this size.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/nanjing-turing/seamly2d-banner.png\" alt=\"Upstream Seamly2D wordmark\"><figcaption>Upstream Seamly2D wordmark</figcaption></figure></div><p>The company wanted to build on Seamly2D and first check whether a layer of account access could sit in front of the existing program. My supervising engineer's brief was clear: add local registration, login and role management before the main interface, then build, package and hand off the modified version. Each day he told me the day's task, and I reported back once it was done. Three weeks later, someone else had to be able to install my changes, open them and check them.</p><h3>Environment and Build</h3><p>The first day went almost entirely on downloading. The Qt Online Installer was pulling from an overseas server, and after three hours the progress bar had reached about 10 percent. Assuming big software was just slow, I plodded along and waited most of the day. When I mentioned it to the engineer, he told me there was a Tsinghua mirror inside China. The next day I switched to the <a href=\"https://mirrors.tuna.tsinghua.edu.cn/help/qt/\" target=\"_blank\" rel=\"noopener\">Tsinghua Qt mirror</a> and the rest finished in a little over an hour. The me who had sat watching that progress bar the day before looked a bit like a clown, though it was the learn-from-it kind of foolishness, nothing like the real frustration still to come.</p><p>Installing Qt did not make it usable. I started with Qt 5.15.2 and made <code>core5compat</code> load conditionally, which got qmake through, only for the full build to report more than thirty errors. The branch had long since moved to Qt 6 headers and APIs, and patching in more Qt 5 compatibility would have taken me further and further from the task. I switched to Qt 6.5.3 MSVC2019 64-bit with the Qt 5 Compatibility Module and the v142 compiler, deleted the old build directory and <code>Seamly2D.pro.user</code>, configured the Kit again, and the full build finally went through. Once the versions matched, those thirty-odd errors went away with them.</p><p>After that episode I got into the habit of checking branch, Qt package, compiler and architecture together. It was also my first real contact with a large project. GitHub had been a place to download code, and I had no picture at all of how several people develop together. Over these three weeks I learned clone, inspecting and switching upstream branches, creating my own development branch, commit, push, merge, pull requests, forks and tags from scratch, and used every one of them for real; Git turned out to be genuinely useful. How the environment was set up and each error handled is in the <a href=\"https://www.66ccff-labs.com/notes/turing-qt-seamly2d-first-run\" target=\"_blank\" rel=\"noopener\">original first-run record</a> I wrote at the time.</p><h3>Accounts and Roles</h3><p>With the application running, I added registration and login windows and sorted out the sequence leading to the main interface around <code>main()</code>. Account information is stored locally with <a href=\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">QSettings</a>. Passwords started out as a plaintext comparison and became one-way hashed storage and verification; the input field got masking, and existing users, missing users and wrong passwords each got their own handling. Online access and a database were not part of this round, partly because I did not know how and partly because there was no hurry. The point was only to check whether Seamly2D could take one more layer of entry in front.</p><p>Actually using the windows, no small problem could be dodged. Enter triggered Cancel by default, the username field popped up suggestions, and the password field once crashed with a Chinese input method active; I fixed them one by one. With role management, my attention moved from how a window looked to who could do what to whom. The first account had to be <code>admin</code>; normal users could not see the management entry; administrators could delete or promote only normal users, with a second confirmation before deletion; and only <code>admin</code> could demote another administrator. I implemented each operation by separating the current user, the target user and the allowed state change, then demonstrated them one at a time. Those rules get a second, closer look in <a href=\"https://www.66ccff-labs.com/notes/turing-local-role-permissions\" target=\"_blank\" rel=\"noopener\">Local Account Permission Rules</a>.</p><h3>Windows Packaging and Another Machine</h3><p>In the third week I moved on to Release, and <code>windeployqt</code> held me up for at least three days. The tool was sitting right there on the disk, and the build step simply could not find it. Reinstalling, checking paths, round and round: those days were genuinely irritating. Which change finally did it I can no longer say for sure; at some point it just worked. According to the notes I kept, the final setup added Qt's <code>bin</code> directory to Qt Creator's Build Environment and had both <code>.pro</code> files locate the deployment tool through <code>QT_INSTALL_BINS</code>, running it only in the Release configuration.</p><p>With the deployment folder already crammed with DLLs, the application still started up missing <code>xerces-c_3_2.dll</code>. Only after adding that XML parsing library could I finish Windows self-signing, the Inno Setup installer, installation and launch. According to <a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Qt's deployment guide</a>, additional third-party libraries were never <code>windeployqt</code>'s job. The <code>.sm2d</code> and <code>.smis</code> samples I had read earlier now matched up with the XML parser the program needed. Why one DLL can still be missing among dozens is traced through the loading process in <a href=\"https://www.66ccff-labs.com/notes/turing-windows-runtime-dependencies\" target=\"_blank\" rel=\"noopener\">Qt Windows Runtime Dependencies</a>.</p><p>Alongside this I put together <a href=\"https://www.66ccff-labs.com/notes/turing-cmake-build-logic\" target=\"_blank\" rel=\"noopener\">CMake and build-logic study material</a> to tell generators, compilers, linkers and runtime dependencies apart, while the Seamly2D project in front of me stayed on qmake. The <a href=\"https://www.66ccff-labs.com/notes/turing-release-packaging-cross-platform\" target=\"_blank\" rel=\"noopener\">original packaging record</a> and the <a href=\"https://www.66ccff-labs.com/notes/turing-sm2d-xml-data-format\" target=\"_blank\" rel=\"noopener\">XML samples</a> hold the step-by-step procedures and data.</p><p>The formal Windows installation and feature checks took place on the development machine. About two weeks after the internship, back home, I tried again on a Windows desktop with a fresh system install and neither Qt nor Visual Studio on it. I ran the installer, double-clicked the result, and up came my modified version, with registration, login and roles all working.</p><h3>Mac and Handoff</h3><p>I moved the same source onto my own Mac, reworked the Qt paths, architecture and Kit, and got both Debug and Release running. After <code>macdeployqt</code> collected the dependencies the application launched, and an unsigned DMG was generated and opened on that Mac while the supervising engineer watched the demonstration. I then created a self-signed certificate and tried the <code>codesign</code>, <code>spctl</code> and packaging-script sequence. Application signing never got finished, and exactly which step it stuck on I still cannot quite say. The engineer did not work on macOS; knowing the route was viable was enough for him, and he did not press further.</p><p>At the final review the engineer went through registration and login, role management, the Windows installation and the Mac demonstration item by item, and then gave me a proper round of praise: for someone who three weeks earlier had not known what Qt was, getting this far was seriously impressive. The source, weekly logs, environment notes and scripts were committed to the <code>develop</code> branch the company had opened for interns. How it was used afterwards, or whether it became part of a product, I do not know.</p><p>That praise genuinely thrilled me. Three weeks earlier I had been going round in circles in a terminal; three weeks later I had walked into an unfamiliar large codebase, made a set of real changes, and handed them to someone else to check.</p>"}, "cb": 1203, "ca": 1747}, {"group": "Nanjing Turing", "kind": "笔记", "label": "Nanjing Turing · 笔记 · 本地账户的权限判断", "route": "https://www.66ccff-labs.com/notes/turing-local-role-permissions", "before": {"zh": "<h2>本地账户的权限判断</h2><p class=\"summary\">从 Seamly2D 的本地角色管理出发，拆开操作者、目标账户与操作，再检查状态变化和保存结果。</p><p>Seamly2D 的本地账户功能做到角色管理时，我需要处理一条很具体的规则：管理员可以把普通用户升级成管理员，但已有管理员的降级只能由 <code>admin</code> 执行。同样一个目标账户，角色一变，原先允许的操作就可能不再允许。只给当前用户贴一个管理员标签，显然解释不完这件事。</p><h3>账户操作权限</h3><p>判断账户操作权限时，先确定操作者，再看目标账户和请求的动作。下表按这个顺序列出规则。<code>admin</code> 在这里指初始的特定账户，普通管理员指后来获得 Admin 角色的其他账户。</p><table><thead><tr><th>操作者</th><th>目标</th><th>操作</th><th>判断</th></tr></thead><tbody><tr><td>普通用户</td><td>其他账户</td><td>管理操作</td><td>拒绝</td></tr><tr><td>普通管理员</td><td>普通用户</td><td>升级为管理员</td><td>允许</td></tr><tr><td>普通管理员</td><td>普通用户</td><td>删除</td><td>确认后允许</td></tr><tr><td>普通管理员</td><td>已有管理员</td><td>删除或降级</td><td>拒绝</td></tr><tr><td><code>admin</code></td><td>其他管理员</td><td>降级</td><td>允许</td></tr></tbody></table><p>这张表让我更容易发现，角色只是判断条件之一。还要知道是不是本人、目标是否存在、操作以后剩下什么状态。<a href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener\">OWASP 的授权说明</a>也把权限判断放在主体、资源与操作的关系中讨论。登录解决身份识别，执行一项具体操作还要再判断权限。</p><h3>用户名规则与账户初始化</h3><p>项目的<a href=\"https://www.66ccff-labs.com/uploads/projects/nanjing-turing/auth-role-snippet.cpp\" target=\"_blank\" rel=\"noopener\">公开角色查询节选</a>里，<code>roleOf()</code> 会先忽略大小写比较用户名是否为 <code>admin</code>，命中便返回 Admin；其他用户则从 QSettings 读取保存的角色。这个函数能回答账户属于哪种角色，却没有表达整张操作表。具有相同 Admin 枚举值的两个账户，仍然可能拥有不同的降级权限。</p><p>角色查询和操作判断可以分开处理。前者负责读取账户属性；后者接收已确认身份的操作者、刚读取的目标账户和动作。名称规范化也要统一，否则创建账户时把 <code>Admin</code> 和 <code>admin</code> 当成两个名字，查询角色时却把它们视为同一个特殊身份，就会出现前后规则不一致。</p><p>这个特殊账户还让我想到初始状态。空账户库中的第一位用户按项目要求应当建立为 <code>admin</code>；账户已经存在以后，注册就应走普通流程。初始化、注册和管理操作需要使用同一套账户识别规则，不能各自解释一次用户名。</p><h3>执行前的权限检查</h3><p>普通用户看不到管理入口，界面会清楚很多。不过真正修改账户时，我仍希望执行函数自己完成权限判断。菜单、快捷键和其他窗口将来都可能成为调用入口，把判断只放在按钮是否可见上，后续维护很容易漏掉新入口。</p><p>删除确认还多了一段时间。弹出对话框前，目标是普通用户；等操作者点下确认，它的角色或者存在状态可能已经变化。一个适合继续练习的实现顺序，是在执行前重新读取账户状态，判断权限，再保存修改。取消、目标消失或权限不满足，都直接结束这次操作，不改变账户数据。</p><p>对于管理员的删除和降级，我还会单独检查操作后的状态。如果产品要求始终保留管理能力，那么删除最后一个可用管理员就应该被拒绝。这个条件关心的是整组账户的结果，仅检查目标的当前角色会漏掉它。以当前特殊 <code>admin</code> 的规则为基础，研究这一点也有助于以后把特殊用户名改成明确的权限属性。</p><h3>QSettings 账户数据保存</h3><p>QSettings 让设置保存起来很方便，但保存动作也有返回结果。<a href=\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">Qt 文档</a>说明，修改可能延迟写入，<code>sync()</code> 用来同步，<code>status()</code> 可检查访问或格式错误。角色已经在界面里改了，重启后却恢复原样，用户感受到的仍然是一次失败的操作。因此，界面提示成功之前，应当把持久化结果也纳入处理。</p><p>这里的账户保存在本机，信任关系也延伸到操作系统账户和存储位置。如果需要约束能够直接修改本地设置文件的人，应用内部的一张角色表就不够了，还要改变数据存储和访问控制的设计。这是继续扩展本地账户功能时需要先定下来的需求。</p><p>我觉得最值得做的一组练习，是把表里的允许和拒绝情况都跑一遍，再加入取消确认、目标消失、修改后重启和保留最后一个管理员这些情况。角色管理真正完整的地方，在于一次操作从谁发起、对谁执行，到最终留下什么状态，都能说得清楚。窗口只是让人使用这套规则的入口。</p>", "en": "<h2>Local Account Permission Rules</h2><p class=\"summary\">Separating actor, target and action in Seamly2D role management, then checking state changes and persistence.</p><p>One Seamly2D account rule made role management more interesting than a login window. An administrator could promote a normal user, but only the specific <code>admin</code> account could demote an existing administrator. Changing the target's role could immediately change which operations were allowed on it. A single administrator label on the current user could not express the whole rule.</p><h3>Account Operation Permissions</h3><p>The table groups permissions by actor, target account and requested action. Here, <code>admin</code> names the initial special account; an ordinary administrator is another account subsequently assigned the Admin role.</p><table><thead><tr><th>Actor</th><th>Target</th><th>Action</th><th>Decision</th></tr></thead><tbody><tr><td>Normal user</td><td>Other accounts</td><td>Management operation</td><td>Reject</td></tr><tr><td>Ordinary administrator</td><td>Normal user</td><td>Promote to administrator</td><td>Allow</td></tr><tr><td>Ordinary administrator</td><td>Normal user</td><td>Delete</td><td>Allow after confirmation</td></tr><tr><td>Ordinary administrator</td><td>Existing administrator</td><td>Delete or demote</td><td>Reject</td></tr><tr><td><code>admin</code></td><td>Another administrator</td><td>Demote</td><td>Allow</td></tr></tbody></table><p>Reading across the table brings out conditions beyond role: whether the actor is targeting themselves, whether the target exists, and what state the operation will leave behind. <a href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener\">OWASP's authorization guidance</a> similarly examines the relationship between subjects, resources and actions. Identifying a user at login still leaves permission for each operation to be decided.</p><h3>Username Rules and Account Initialization</h3><p>In the project's <a href=\"https://www.66ccff-labs.com/uploads/projects/nanjing-turing/auth-role-snippet.cpp\" target=\"_blank\" rel=\"noopener\">public role-query excerpt</a>, <code>roleOf()</code> first compares the username with <code>admin</code>, ignoring case, and returns Admin on a match. For other accounts it reads the stored role from QSettings. That function answers a role query, but the operation table contains additional rules. Two accounts with the same Admin enum value can have different demotion permissions.</p><p>A role query can read account attributes, while a separate operation check receives an authenticated actor, the freshly retrieved target and an action. Username normalization also needs one consistent definition. Treating <code>Admin</code> and <code>admin</code> as separate names during creation, then as the same special identity during role lookup, would make the rules disagree.</p><p>The special account also raises a startup-state question. The project required the first account in an empty store to be <code>admin</code>; subsequent registrations should follow the normal path. Initialization, registration and account management need to agree on how account identities are recognized.</p><h3>Permission Checks Before Execution</h3><p>Hiding management controls from a normal user makes the interface clearer. I would still enforce permissions inside the operation that changes the account. Menus, shortcuts and other windows may become new callers later, and a check attached only to button visibility is easy to miss when adding an entry point.</p><p>A deletion confirmation introduces a time gap as well. The target may be a normal user when the dialog opens, yet have changed role or disappeared by the time confirmation arrives. A useful implementation exercise is to reload account state immediately before execution, check permission, then persist the change. Cancellation, a missing target or a failed permission check should end the operation without changing account data.</p><p>Deletion and demotion also deserve a check on the resulting account set. If the product must always retain management access, it should refuse to remove the last usable administrator. Looking only at the target's present role misses that condition. Studying it alongside the current special-<code>admin</code> rule would also help if the design later replaced a special username with explicit permission attributes.</p><h3>Saving Account Data with QSettings</h3><p>QSettings makes persistence convenient, but the save result still matters. <a href=\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">Qt documents deferred writes, <code>sync()</code> and <code>status()</code></a>, including access and format errors. A role that changes on screen and reverts after restart is a failed operation from the user's perspective. The interface should therefore consider persistence before reporting success.</p><p>These accounts live on the local machine, so the trust model includes the operating-system account and storage location. Restricting someone who can edit the settings directly would require a different storage and access-control design as well as application roles. That requirement needs deciding before extending the local-account feature in that direction.</p><p>The exercise I would most like to complete is to run both the allowed and rejected table entries, then add cancellation, a disappearing target, restart after an edit and preservation of the last administrator. Good role management makes the entire operation understandable: who requests it, which account it affects and what state remains. The window is how a person uses those rules.</p>"}, "after": {"zh": "<h2>本地账户的权限判断</h2><p class=\"summary\">从 Seamly2D 的本地角色管理出发，拆开操作者、目标账户与操作，再检查状态变化和保存结果。</p><p>给 Seamly2D 做本地账户，真正让人动脑子的是角色管理里的一条规则：管理员可以把普通用户升成管理员，可已有的管理员，只有 <code>admin</code> 这个账号能给他降级。同一个目标账户，角色一变，原来允许的操作就可能不再允许。光给当前用户贴一个管理员标签，这件事是说不完的。</p><h3>账户操作权限</h3><p>判断一项账户操作能不能做，先定操作者，再看目标账户和请求的动作，下表就按这个顺序排。<code>admin</code> 指最初那个特定账户，普通管理员指后来拿到 Admin 角色的其他账户。</p><table><thead><tr><th>操作者</th><th>目标</th><th>操作</th><th>判断</th></tr></thead><tbody><tr><td>普通用户</td><td>其他账户</td><td>管理操作</td><td>拒绝</td></tr><tr><td>普通管理员</td><td>普通用户</td><td>升级为管理员</td><td>允许</td></tr><tr><td>普通管理员</td><td>普通用户</td><td>删除</td><td>确认后允许</td></tr><tr><td>普通管理员</td><td>已有管理员</td><td>删除或降级</td><td>拒绝</td></tr><tr><td><code>admin</code></td><td>其他管理员</td><td>降级</td><td>允许</td></tr></tbody></table><p>表一摊开，角色只是条件之一就很明显了。还得知道操作者是不是在动自己、目标还在不在、操作之后剩下什么状态。<a href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener\">OWASP 的授权说明</a>也是把权限放在主体、资源和动作的关系里讨论的。登录只解决了你是谁，每做一项具体操作，还得再问一次能不能做。</p><h3>用户名规则与账户初始化</h3><p>项目的<a href=\"https://www.66ccff-labs.com/uploads/projects/nanjing-turing/auth-role-snippet.cpp\" target=\"_blank\" rel=\"noopener\">公开角色查询节选</a>里，<code>roleOf()</code> 先忽略大小写比较用户名是不是 <code>admin</code>，是就直接返回 Admin；其他用户再从 QSettings 里读保存的角色。这个函数回答得了账户是什么角色，却装不下整张操作表。两个账户的 Admin 枚举值一模一样，降级权限照样可以不同。</p><p>所以角色查询和操作判断最好分开。前者只管读账户属性；后者拿到已确认身份的操作者、刚读出来的目标账户和动作，再下判断。用户名的规范化也得统一口径。创建账户时把 <code>Admin</code> 和 <code>admin</code> 当成两个名字，查角色时又把它们当成同一个特殊身份，规则自己就打架了。</p><p>这个特殊账户还牵出一个初始状态的问题。按项目要求，空账户库里的第一个用户要建成 <code>admin</code>；有了账户以后，注册就走普通流程。初始化、注册和管理操作得用同一套规则认账户，不能各解释各的用户名。</p><h3>执行前的权限检查</h3><p>普通用户看不到管理入口，界面清爽很多。可真正改账户的时候，执行函数最好自己再判断一遍权限。菜单、快捷键、别的窗口，将来都可能变成新的调用入口，判断要是只挂在按钮显不显示上，后面一加入口就容易漏。</p><p>删除确认还夹着一段时间差。对话框弹出来时，目标还是普通用户；等操作者点下确认，它的角色可能变了，账户也可能已经没了。比较稳的顺序是执行前重新读一次账户状态，判断权限，再保存修改。取消、目标消失、权限不够，都直接结束这次操作，账户数据一点不动。</p><p>管理员的删除和降级，还要单独看操作之后的结果。如果产品要求任何时候都得留着管理能力，那删掉最后一个能用的管理员就该被拒绝。这个条件看的是整组账户，只盯着目标当前的角色是看不出来的。以现在特殊 <code>admin</code> 的规则为起点把这一点想清楚，以后要是把特殊用户名换成明确的权限属性，也算打好了底子。</p><h3>QSettings 账户数据保存</h3><p>QSettings 存设置很省事，但保存这个动作本身也有结果。<a href=
