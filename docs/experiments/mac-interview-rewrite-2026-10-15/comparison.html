uino-digital-clock-counter/report-digit-split-code.png\" alt=\"Digit split code from the homework report\"><figcaption>Digit split code from the homework report</figcaption></figure></div><h3>Display Wiring</h3><p>Connecting the common pin to GND as shown in the course slides produced either darkness or scrambled digits. I checked my program and wiring first, and the TA could not explain the behavior either. Only after moving wires and testing individual segments at different levels did I establish that our hardware needed a common-anode connection, with the common pin at VCC. The slides used a common-cathode CD4511 simulation, so their device assumptions did not match the parts on our breadboard.</p><p>After we reported the finding, the professor announced it to the class over the microphone. Other groups had been stuck at the same point. I could not yet explain the decoder output structure fully, but the physical tests were enough to correct the wiring. It was while organizing this portfolio that I revisited <a href=\"https://www.ti.com/lit/ds/symlink/sn74ls47.pdf\" target=\"_blank\" rel=\"noopener\">TI's LS47 documentation</a> and connected its active-low, open-collector outputs with common-anode LEDs.</p><h3>Button Checks</h3><p>The two six-pin latching switches took more work after the displays were running. We had no datasheet, and I did not know how to search for one by part number. Trying different connections produced missed presses, unstable readings, and sometimes two responses to one press. Editing the input conditions left the underlying hardware question open: which contacts actually connected in each switch position?</p><p>I borrowed a multimeter from the instructor, checked continuity between pin pairs, and drew the internal connection map. I then connected pause and reset to D2 and D3, and both worked in the finished build.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/report-switch-logic-code.png\" alt=\"Switch logic code from the homework report\"><figcaption>Switch logic code from the homework report</figcaption></figure></div><h3>Demonstration and Archive</h3><p>Assessment required two separately flashed versions. One returned to <code>00</code> after our group number, <code>17</code>; the other rolled over after <code>99</code>. I changed the threshold, flashed each version, and had the instructor check it. Both digits, pause, and reset worked during the classroom demonstration, and the TA awarded full marks.</p><p>The firmware relied on polling and blocking <code>delay()</code> calls, and it looks distinctly like beginner work today. The debugging habit has lasted better. When a drawing disagrees with the hardware, I identify the actual parts and follow the current path; when a switch behaves strangely, I measure its contacts. Code still needs checking, but I stopped expecting code changes to repair every wiring problem.</p>"}, "after": {"zh": "<h2>Arduino 面包板两位数码管计数器</h2><p class=\"summary\">我承担 MEC104 A17 组两位计数器的大部分搭建、编程与调试。数码管接法和六脚按键先后出问题，我通过逐段试灯、测量开关通断，把显示、暂停和复位调通。</p><h3>两位计数器</h3><p>MEC104 是小组项目，我是被朋友拉进 A17 组的。刚做完 Arduino 小车，这是我第二次碰嵌入式，PCB 还不会画，电子元件的原理也模模糊糊，就是兴趣一直很足。对这个项目，我当时的全部理解就是写一个计数的 Arduino 程序，烧进去，当秒表用。面包板搭建、查引脚、译码器和数码管接线、Arduino 程序、按键调试和最后的联调，基本都是我做的；报告、视频和小组里的其他事情由组员负责。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/breadboard-counter-photo.jpg\" alt=\"面包板上的两位数码管计数器原型\"><figcaption>面包板上的两位数码管计数器原型</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/course-project-requirement.png\" alt=\"课程项目目标页\"><figcaption>课程项目目标页</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/course-basic-requirements.png\" alt=\"两位显示与按键要求\"><figcaption>两位显示与按键要求</figcaption></figure></div><p>实物摆开以后才发现，要做的远不止一个程序。Arduino Nano 旁边是两颗 SN54LS47 译码器、两位数码管和一大片杜邦线。计数值要先拆成十位和个位，各用四位 BCD 送进一颗译码器，再由它点亮对应的数码管。报告里个位的 BCD 接在 D9 到 D12，十位接在 D5 到 D8。BCD 是什么、七段数码管怎么显示，我也是这时候边看学校发的课件、边上网查才弄懂的，Arduino 程序更是边查 CSDN 边写。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/report-two-digit-wiring.png\" alt=\"作业报告里的两位数码管接线图\"><figcaption>作业报告里的两位数码管接线图</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/report-digit-split-code.png\" alt=\"作业报告里的个位和十位拆分代码\"><figcaption>作业报告里的个位和十位拆分代码</figcaption></figure></div><h3>数码管的共阳与共阴接法</h3><p>拆位程序写好了，数码管却不配合。课上 PPT 给的是共阴接法，公共端接 GND。我们照着接，数码管要么一片黑，要么亮出一堆乱码，完全不是正常的样子。这件事卡了我们很久。去问 TA，TA 也说不出个所以然，可能他也不知道 PPT 和发下来的器件根本对不上。</p><p>最后是我在面包板上拿杜邦线瞎插瞎试摸出来的。七段数码管说到底就是几个 LED 摆成固定的形状，哪几段亮，就显示哪个数字。我一段一段换线、试高低电平，慢慢发现手里这套显示要按共阳接，公共端得接 VCC，PPT 那套共阴接法放到我们的器件上就是不灵。摸出这个规律的时候，我自己都觉得挺神奇。</p><p>我们没再回去找 TA，直接找了任课老师。老师拿起麦克风跟全班讲了这件事，好几个组其实也卡在同一个地方。对成熟的硬件工程师来说，共阳共阴大概是一看不对劲就会想到的小事；可对一群刚学会往面包板上插杜邦线的学生来说，这就是天大的问题，网上还搜不到答案，太基础了，没人会专门写。</p><p>当时的我还解释不清译码器的输出结构。现在归档里这份 <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/sn54ls47-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">SN54LS47 数据手册</a>，是我后来才找到的。按 <a href=\"https://www.ti.com/lit/ds/symlink/sn74ls47.pdf\" target=\"_blank\" rel=\"noopener\">TI 的 LS47 资料</a>，它的输出低有效、开集电极，本来就是给共阳数码管用的；课件仿真里的 CD4511 驱动的则是共阴数码管。这背后的电流路径，放在了<a href=\"https://www.66ccff-labs.com/notes/arduino-digital-clock-counter-course-note\" target=\"_blank\" rel=\"noopener\">共阳数码管与 BCD 译码</a>里细讲。</p><h3>六脚自锁按键</h3><p>显示调通了，两个六脚自锁按键又把我折腾了一阵。老师没给数据手册，我们那时也不知道可以拿型号去半导小芯、立创商城这类网站上查，只能硬猜。按下去没反应、读数乱跳、按一次响应两次，这几种情况都碰上过。代码改了一遍又一遍，绕不开的始终是一个硬件问题：按下前后，这六只脚里到底哪几只是通的。</p><p>大家都不知道，我就找老师借了一个万用表，拨到通断档，一对一对地量，把按下前和按下后的内部连接画了出来。照着这张图，我把暂停和复位接到 D2 和 D3，两个按键最后都能正常用。数码管的接法是瞎插碰出来的，这一回是量出来的。触点、上下拉和消抖这些，在<a href=\"https://www.66ccff-labs.com/notes/arduino-counter-latching-switch-control\" target=\"_blank\" rel=\"noopener\">自锁按键与计数控制</a>里有更细的推演。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/report-switch-logic-code.png\" alt=\"作业报告里的开关逻辑代码\"><figcaption>作业报告里的开关逻辑代码</figcaption></figure></div><h3>演示与验收</h3><p>考核要分别演示两个版本，一个计到我们的组号 <code>17</code> 回到 <code>00</code>，另一个计到 <code>99</code> 再回到 <code>00</code>。我改阈值，分别烧录，老师一个一个验。那份代码现在看漏洞百出，裸机轮询，阻塞式的 <code>delay()</code> 用得到处都是，写得挺拉的。不过它确实能跑，课堂上两位显示、暂停和复位都工作正常。</p><p>验收是给 TA 演示的。因为数码管那件事，老师早就认识我们组了，验得很快，最后拿了满分。拿到这个满分，我是真的挺骄傲的。</p>", "en": "<h2>Arduino Breadboard Two-Digit Seven-Segment Counter</h2><p class=\"summary\">For MEC104 Group A17, I handled most of the two-digit counter’s wiring, firmware, and debugging. Testing the display segments and measuring switch contacts resolved faults that code changes had not.</p><h3>Two-Digit Counter</h3><p>MEC104 was a group project, and a friend pulled me into Group A17. I had just finished the Arduino car, so this was my second brush with embedded work. I could not draw a PCB yet and had only a hazy idea of how electronic parts worked, though my interest was strong. My entire understanding of the task was to write an Arduino counting program, flash it, and use the board as a stopwatch. Building the breadboard, looking up pins, wiring the decoders and displays, writing the Arduino program, debugging the buttons and final integration were nearly all mine; the other members handled the report, the video and the group's other business.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/breadboard-counter-photo.jpg\" alt=\"Breadboard digital-clock counter prototype\"><figcaption>Breadboard digital-clock counter prototype</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/course-project-requirement.png\" alt=\"Course project requirement slide\"><figcaption>Course project requirement slide</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/course-basic-requirements.png\" alt=\"Basic two-digit and button requirements\"><figcaption>Basic two-digit and button requirements</figcaption></figure></div><p>Once the parts were laid out, the job clearly went well beyond one program. Beside the Arduino Nano sat two SN54LS47 decoders, two seven-segment displays and a thicket of jumper wires. The count had to be split into tens and units, each sent as four BCD bits to its own decoder, which then lit its display. The report puts the units on D9 to D12 and the tens on D5 to D8. What BCD was and how a seven-segment display worked, I learned right then from the course slides and online material, and I wrote the Arduino program while looking things up on CSDN as I went.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/report-two-digit-wiring.png\" alt=\"Two-digit wiring from the homework report\"><figcaption>Two-digit wiring from the homework report</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/report-digit-split-code.png\" alt=\"Digit split code from the homework report\"><figcaption>Digit split code from the homework report</figcaption></figure></div><h3>Common-Anode and Common-Cathode Wiring</h3><p>With the digit-splitting code written, the displays refused to cooperate. The course slides showed a common-cathode arrangement with the common pin on GND. Wired that way, the displays either stayed completely dark or lit up in gibberish, nothing like normal behaviour. That held us up for a long time. We asked the TA, who could not explain it either and may not have realized that the slides and the parts we had been given did not match.</p><p>In the end I found it by trial and error, poking jumper wires around the breadboard. A seven-segment display is really just a few LEDs arranged in a fixed shape, and whichever segments light make the digit. Moving wires segment by segment and trying high and low levels, I gradually worked out that our displays needed a common-anode connection with the common pin on VCC; the slides' common-cathode wiring simply did not work with our parts. When the pattern finally showed itself, even I thought it was pretty amazing.</p><p>Rather than go back to the TA, we took it straight to the professor, who picked up the microphone and told the whole class; several other groups were stuck at exactly the same point. To an experienced hardware engineer, common anode versus common cathode is probably the first thing to suspect once something looks off. To a room of students who had only just learned to push jumper wires into a breadboard, it was an enormous problem, and searching online turned up nothing, because it is too basic for anyone to bother writing about.</p><p>At the time I still could not explain the decoder's output structure. The <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/sn54ls47-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">SN54LS47 datasheet</a> in this archive is one I found later. According to <a href=\"https://www.ti.com/lit/ds/symlink/sn74ls47.pdf\" target=\"_blank\" rel=\"noopener\">TI's LS47 documentation</a>, its outputs are active-low and open-collector, designed for common-anode displays, while the CD4511 in the course simulation drives common-cathode ones. The current path behind that is worked through in <a href=\"https://www.66ccff-labs.com/notes/arduino-digital-clock-counter-course-note\" target=\"_blank\" rel=\"noopener\">Common-Anode Displays and BCD Decoding</a>.</p><h3>Six-Pin Latching Switches</h3><p>With the displays working, the two six-pin latching switches gave me another round of grief. There was no datasheet, and we did not know then that a part number could be looked up on sites such as Semiee or LCSC, so we guessed. Presses that did nothing, readings that jumped about, one press registering twice: we ran into all of them. However many times the code changed, the same hardware question remained. Which of these six pins actually connect, before and after the button is pressed?</p><p>Nobody knew, so I borrowed a multimeter from the teacher, set it to continuity, measured pin pair after pin pair, and drew out the internal connections before and after pressing. Following that drawing, I wired pause and reset to D2 and D3, and both buttons worked in the end. The display polarity had been stumbled on by poking wires; this time the answer came from measuring. Contacts, pull-ups and debouncing get a closer look in <a href=\"https://www.66ccff-labs.com/notes/arduino-counter-latching-switch-control\" target=\"_blank\" rel=\"noopener\">Latching Switches and Counter Control</a>.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/report-switch-logic-code.png\" alt=\"Switch logic code from the homework report\"><figcaption>Switch logic code from the homework report</figcaption></figure></div><h3>Demonstration and Assessment</h3><p>Assessment required two versions demonstrated separately: one counting to our group number <code>17</code> and going back to <code>00</code>, the other running to <code>99</code> before rolling over to <code>00</code>. I changed the threshold, flashed each version in turn, and the teacher checked them one by one. By today's standards that code is full of holes, bare-metal polling with blocking <code>delay()</code> calls everywhere, frankly pretty rough. It ran, though, and in class both digits, pause and reset all worked.</p><p>We demonstrated to the TA. Because of the display episode, the professor already knew our group, the check went quickly, and we came away with full marks. I am genuinely proud of that one.</p>"}, "cb": 813, "ca": 1195}, {"group": "Digital Clock", "kind": "笔记", "label": "Digital Clock · 笔记 · 共阳数码管与 BCD 译码", "route": "https://www.66ccff-labs.com/notes/arduino-digital-clock-counter-course-note", "before": {"zh": "<h2>共阳数码管与 BCD 译码</h2><p class=\"summary\">沿十进制拆位与 BCD 位序，理解 LS47 低有效输出、共阳 LED 电流路径、逐段限流和显示控制。</p><p>两位数码管显示 <code>17</code> 时，看上去只是把程序里的数搬到了面包板上。我现在再看这份计数器程序，想把中间的过程拆开弄明白。Arduino 保存的是一个数，送到译码器的是两组四位输入，最后亮起来的却是几段 LED。数字、引脚电平和发光的灯段之间，每一步都有各自的对应关系。</p><h3>十进制数与 BCD</h3><p><a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-clock-homework-report.pdf#page=1\" target=\"_blank\" rel=\"noopener\">作业报告</a>里的拆位方法很直接，<code>Num % 10</code> 取个位，<code>(Num / 10) % 10</code> 取十位。把 <code>17</code> 代进去，得到个位 <code>7</code>、十位 <code>1</code>，再分别送给两颗译码器。BCD 用四个二进制位表示一个十进制数字，所以这里是两个独立的数字编码。若把整数 17 直接按二进制展开，得到的是 <code>10001</code>，和两位显示所需的 <code>0001 0111</code> 不是同一种表示。</p><p>我读<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/single-digit-bcd-counter.ino\" target=\"_blank\" rel=\"noopener\">单个位显示示例</a>时，反而在最简单的数字 <code>1</code> 上停了一下。数组把它写成 <code>{1, 0, 0, 0}</code>，而平时写二进制时习惯看到 <code>0001</code>。对照引脚定义就明白了，程序按 A、B、C、D 的顺序存储，权重依次为 1、2、4、8；通常书写的二进制数则把最高位放在左边。数组里的第一个元素先发给 A，顺序完全对得上。</p><pre><code>Decimal digit    D C B A    Array order A, B, C, D\n      1          0 0 0 1          1, 0, 0, 0\n      7          0 1 1 1          1, 1, 1, 0</code></pre><p>这个示例还有十六行编码，但主循环用 <code>% 10</code> 把索引限制在 0 到 9。四根线能表示十六种组合，十进制的一位只需要其中十种。剩下六种也不能随意当成十六进制字母来显示。<a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">TI 的 LS47 说明</a>给它们定义了特定图形，<a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B</a> 则会将大于 9 的输入消隐。以后换译码器时，除了看 0 到 9，我也会看看越界输入会让输出变成什么。</p><h3>低有效输出</h3><p>再往后看，A 到 D 只负责选择数字，译码器的 a 到 g 才对应七段 LED。按常用段位标记，显示 <code>7</code> 要点亮顶部的 a、右上的 b 和右下的 c。对项目里的 SN54LS47 来说，这几个输出变低时，相应的灯段才亮。<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/sn54ls47-datasheet.pdf#page=2\" target=\"_blank\" rel=\"noopener\">LS47 数据手册</a>把它的输出标为低有效、开集电极，驱动共阳数码管。这里的低电平要放到电流路径里理解。</p><p>共阳数码管把各段 LED 的阳极连在一起，公共端接到正电源。选中某一段后，LS47 内部的输出晶体管导通，电流从正电源经过该段 LED 和串联限流电阻，流入译码器，再回到地。输出端电压降低，LED 两端反而得到正向电压，于是发光。沿着这条路径看，输出电平与亮灭的关系就顺了。</p><p>开集电极也值得单独看一下。输出晶体管关闭时，芯片松开了这条下拉路径，输出端呈高阻，节点电压由外部电路决定。它不会像普通推挽输出那样主动把引脚推到电源电压。因而，真值表里的不点亮状态、输出引脚上测到的电压，以及能否向外提供电流，要分别理解。我读到这里才更留意数据手册为什么同时写了译码器和驱动器两个身份。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/bcd-decoder-notes.png\" alt=\"课程中的译码器引脚与逐段限流说明\"><figcaption>课程中的译码器引脚与逐段限流说明</figcaption></figure></div><h3>段电流与限流电阻</h3><p>课件要求每个段输出各串一个限流电阻。我想进一步弄清楚，为什么不在数码管公共端只放一只。假如所有段共用一只电阻，显示 <code>1</code> 时只有两条 LED 支路分电流，显示 <code>8</code> 时变成七条。亮起的段数改变后，每段分到的电流也会改变，亮度就容易随数字变化。电阻分别放在各段支路，才能分别限制各段电流。</p><p>估算某一段时，我会把 LED 的正向压降和驱动器导通后的低电平电压一起扣掉。假设电源为 5 V，某段 LED 在目标电流附近的正向压降为 2.0 V，驱动输出压降按 0.3 V 计算，希望段电流约为 5 mA，那么电阻约为 <code>(5 − 2.0 − 0.3) / 0.005 = 540 Ω</code>。换成常见的 560 Ω，按同样假设算出约 4.8 mA。这组数值是一个选值例子，具体数码管和芯片还要按各自的电气参数计算。</p><p>这样看，课件里的 330 Ω 就有了可以继续追问的地方。电阻值要和供电、电流、LED 压降放在一起看；同样用 330 Ω，换一种 LED 后电流未必相同。显示 <code>8</code> 时七段都亮，还要把七路电流加起来，检查公共端、电源和译码器的负担。选电阻既要让每一段合适，也要看整位显示一起亮时怎样工作。</p><h3>译码器与数码管的匹配</h3><p>再对照课件仿真里的 <a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B</a>，差别就很具体了。它为共阴 LED 提供段驱动电流，选中的段输出高电平，电流从输出端经过 LED 和限流电阻流向公共阴极，再回到地。同样送入一个数字，两种芯片要求的公共端接法和段输出有效电平不同。它们都能把 BCD 变成七段图形，连接 LED 的方式却要随输出结构一起选。</p><p>四位输入确认以后，还要检查测试和消隐脚。<a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">LS47 的控制说明</a>列有灯测试、消隐和零消隐功能，这些控制会参与决定显示状态。如果只查 A 到 D，忽略了这些脚的状态，就可能遇到输入数字正确、显示仍然被关闭的情况。调试单个位时，我会先按真值表设好正常译码条件，再固定送入 <code>1</code>、<code>7</code> 和 <code>8</code>，逐步检查右侧两段、顶部一段和全部七段。</p><p>缺一段和整位显示成另一个数字，可以从不同的地方查起。前者沿对应的 LED 支路检查，后者先核对 BCD 位序和译码器的控制条件。显示错了什么、哪些引脚控制着它、电流应该从哪里流过，这几件事能对上，调试就有了具体的方向。</p>", "en": "<h2>Common-Anode Displays and BCD Decoding</h2><p class=\"summary\">Following decimal digit splitting and BCD bit order into active-low LS47 outputs, common-anode LED current paths, segment resistors, and display controls.</p><p>When the two-digit display reads <code>17</code>, it looks as though the program has simply moved a number onto the breadboard. Reading the counter program again, I want to follow what happens in between. The Arduino holds a number, the decoders receive two groups of four inputs, and a set of LED segments lights up. Numbers, pin levels, and illuminated segments each have a mapping that needs to make sense.</p><h3>Decimal Digits and BCD</h3><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-clock-homework-report.pdf#page=1\" target=\"_blank\" rel=\"noopener\">project report</a> separates the digits with <code>Num % 10</code> for units and <code>(Num / 10) % 10</code> for tens. Applying those expressions to <code>17</code> gives <code>7</code> and <code>1</code>, which go to separate decoders. BCD represents each decimal digit with four binary bits, so there are two independent digit codes here. The binary representation of the integer 17 is <code>10001</code>; the two display digits require the BCD groups <code>0001 0111</code>. Those representations serve different purposes.</p><p>The number <code>1</code> made me pause when I read the <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/single-digit-bcd-counter.ino\" target=\"_blank\" rel=\"noopener\">single-digit example</a>. Its array entry is <code>{1, 0, 0, 0}</code>, while I normally expect to see <code>0001</code> written down. The pin definitions explain the order. The array follows A, B, C, D, with weights of 1, 2, 4, and 8. Written binary usually puts the most significant bit on the left. Here the first array element goes to A, exactly where it belongs.</p><pre><code>Decimal digit    D C B A    Array order A, B, C, D\n      1          0 0 0 1          1, 0, 0, 0\n      7          0 1 1 1          1, 1, 1, 0</code></pre><p>The example contains sixteen array rows, but <code>% 10</code> limits the index to 0 through 9 in the loop. Four wires can represent sixteen combinations; one decimal digit uses ten of them. The other six are not automatically hexadecimal characters. <a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">TI defines particular patterns for the LS47</a>, whereas the <a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B blanks inputs above 9</a>. When comparing decoders, I would now check what happens outside the normal digit range as well.</p><h3>Active-Low Outputs</h3><p>Inputs A through D select the number; outputs a through g correspond to the seven LED segments. With the usual segment labels, <code>7</code> lights the top segment a, upper-right b, and lower-right c. The project's SN54LS47 turns those segments on by taking their outputs low. Its <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/sn54ls47-datasheet.pdf#page=2\" target=\"_blank\" rel=\"noopener\">datasheet</a> identifies active-low, open-collector outputs for common-anode displays. Following current through the circuit makes that low level easier to interpret.</p><p>In a common-anode display, the segment anodes share a connection to the positive supply. Selecting a segment turns on the corresponding output transistor inside the LS47. Current travels from the supply through that LED and its series resistor, into the driver, and back to ground. Lowering the output voltage forward-biases the LED, causing it to emit light. The relationship between a low output and a lit segment becomes straightforward once I follow that path.</p><p>I also want to look more closely at open-collector operation. When the output transistor turns off, the chip releases the path to ground. The output is then high impedance, with its voltage determined by the external circuit. It does not actively drive the pin up to the supply as a push-pull output would. A segment-off entry in the truth table, the voltage measured at the pin, and the ability to supply current are consequently different things to examine. This makes me pay more attention to why the datasheet calls the part both a decoder and a driver.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/bcd-decoder-notes.png\" alt=\"Course diagram of decoder pins and individual segment resistors\"><figcaption>Course diagram of decoder pins and individual segment resistors</figcaption></figure></div><h3>Segment Current and Resistor Selection</h3><p>The course slide calls for one series resistor per segment output. I want to understand why a single resistor at the display's common pin would not do the same job. With a shared resistor, two LED branches divide the current when displaying <code>1</code>, and seven do so when displaying <code>8</code>. Changing the number of lit segments changes the current available to each, making brightness depend on the displayed digit. Individual branch resistors let each segment's current be limited separately.</p><p>For one segment, I would subtract both the LED's forward drop and the driver's on-state low voltage from the supply. Suppose the supply is 5 V, the LED forward drop near the intended current is 2.0 V, and the driver drop is taken as 0.3 V. A target of roughly 5 mA gives <code>(5 − 2.0 − 0.3) / 0.005 = 540 Ω</code>. Using a standard 560 Ω resistor gives about 4.8 mA under the same assumptions. This is an example of choosing a value; the calculation for particular parts needs their electrical parameters.</p><p>That gives me a useful way to examine the slide's 330 Ω value. Supply voltage, current, and LED forward voltage belong in the same calculation. Changing the LED while keeping 330 Ω need not preserve the current. When <code>8</code> lights all seven segments, their currents also add at the common connection and place a combined load on the supply and driver. I need to consider both each segment and the full digit operating together.</p><h3>Decoder and Display Compatibility</h3><p>The <a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B</a> used in the course simulation makes the difference concrete. It supplies segment current for common-cathode LEDs. An active segment output goes high, sending current through the LED and its limiting resistor to the common cathode and ground. The two chips therefore require different common connections and active output levels for the same input digit. Both turn BCD into a seven-segment pattern, but the LED connections have to match the output structure.</p><p>The test and blanking pins need checking alongside the four data inputs. <a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">The LS47 controls</a> include lamp test, blanking, and zero suppression, all of which affect what appears on the display. A correct value on A through D can still be hidden by those controls. For a single-digit check, I would first establish normal decoding conditions from the truth table, then hold the inputs at <code>1</code>, <code>7</code>, and <code>8</code> in turn. That sequence checks the two right-hand segments, adds the top segment, then exercises all seven.</p><p>An incorrect digit calls for checking BCD bit order and the decoder's control inputs; a missing segment can be investigated along its LED branch. Those are different starting points. Once I can connect the visible error to the relevant pins and expected current path, I have a concrete way to investigate it.</p>"}, "after": {"zh": "<h2>共阳数码管与 BCD 译码</h2><p class=\"summary\">沿十进制拆位与 BCD 位序，理解 LS47 低有效输出、共阳 LED 电流路径、逐段限流和显示控制。</p><p>两位数码管亮出 <code>17</code>，看上去就像程序把一个数搬到了面包板上。中间其实隔着好几层，Arduino 手里是一个整数，译码器收到的是两组四位电平，最后亮起来的是几段 LED。当年按课件把公共端接到地，数码管一片黑，能用的接法是靠瞎试找到的，背后的道理一直没补上。</p><h3>十进制数与 BCD</h3><p><a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-clock-homework-report.pdf#page=1\" target=\"_blank\" rel=\"noopener\">作业报告</a>里拆位很直接，<code>Num % 10</code> 取个位，<code>(Num / 10) % 10</code> 取十位。<code>17</code> 代进去，个位 <code>7</code>、十位 <code>1</code>，分别送给两颗译码器。BCD 用四个二进制位表示一个十进制数字，所以这里要的是两组独立的编码，<code>0001</code> 和 <code>0111</code>。整数 17 直接按二进制写是 <code>10001</code>，跟两位显示要的东西压根不是一回事。</p><p>读<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/single-digit-bcd-counter.ino\" target=\"_blank\" rel=\"noopener\">单个位显示示例</a>时，最简单的 <code>1</code> 反倒让我愣了一下。数组里写的是 <code>{1, 0, 0, 0}</code>，平时写二进制，习惯看到的却是 <code>0001</code>。对一下引脚定义就明白了，程序按 A、B、C、D 的顺序存，权重依次是 1、2、4、8；平时书写则把最高位放在左边。数组第一个元素发给 A，顺序完全对得上，只是看着反过来了。</p><pre><code>Decimal digit    D C B A    Array order A, B, C, D\n      1          0 0 0 1          1, 0, 0, 0\n      7          0 1 1 1          1, 1, 1, 0</code></pre><p>示例里一共写了十六行编码，主循环却用 <code>% 10</code> 把索引限制在 0 到 9。四根线能表示十六种组合，十进制的一位只用其中十种，剩下六种也不能想当然地当成十六进制字母。<a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">TI 的 LS47 说明</a>给这六种输入定义了特定图形，<a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B</a> 遇到大于 9 的输入则直接消隐。换一颗译码器，0 到 9 之外的输入会显示成什么，也得一起查。</p><h3>低有效输出</h3><p>A 到 D 只负责选数字，真正对应七段 LED 的是译码器的 a 到 g。按常用的段位标记，显示 <code>7</code> 要点亮顶上的 a、右上的 b 和右下的 c。对 SN54LS47 来说，这几路输出变低，对应的段才亮。<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/sn54ls47-datasheet.pdf#page=2\" target=\"_blank\" rel=\"noopener\">LS47 数据手册</a>把它的输出标成低有效、开集电极，用来驱动共阳数码管。低电平为什么反而点亮，得放进电流路径里看。</p><p>共阳数码管把各段 LED 的阳极连在一起，公共端接正电源。选中某一段时，LS47 里对应的输出晶体管导通，电流从正电源出发，经过这段 LED 和串联的限流电阻，流进译码器，再回到地。输出一拉低，LED 两端就有了正向电压，于是发光。顺着这条路走一遍，低电平点亮这件事就不别扭了。当年把公共端接到 GND，这条路从起点就没了电，数码管黑着也就不奇怪了。</p><p>开集电极也值得单独说两句。输出晶体管关断时，芯片只是松开了这条到地的路径，输出端处于高阻，电压由外部电路决定，不会像推挽输出那样主动把引脚推到电源。所以真值表里写的熄灭、万用表在引脚上量到的电压、这个引脚能不能往外送电流，要分开理解。读到这儿，我才明白数据手册为什么给它同时安了译码器和驱动器两个身份。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/bcd-decoder-notes.png\" alt=\"课程中的译码器引脚与逐段限流说明\"><figcaption>课程中的译码器引脚与逐段限流说明</figcaption></figure></div><h3>段电流与限流电阻</h3><p>课件要求每个段输出各串一只限流电阻。为什么不在公共端放一只就完事？假如七段共用一只电阻，显示 <code>1</code> 时只有两条支路分电流，显示 <code>8</code> 时变成七条。亮的段数一变，每段分到的电流跟着变，数字不同，亮度也不同。电阻放到各段支路上，每段的电流才各管各的。</p><p>估算一段时，要把 LED 的正向压降和驱动器导通后的低电平一起扣掉。假设电源 5 V，LED 在目标电流附近的正向压降 2.0 V，驱动输出压降按 0.3 V 算，想让段电流在 5 mA 左右，电阻约为 <code>(5 − 2.0 − 0.3) / 0.005 = 540 Ω</code>。换成常见的 560 Ω，同样假设下大约 4.8 mA。这组数只是演示怎么选值，具体的数码管和芯片还得按各自的参数算。</p><p>这么一算，课件里的 330 Ω 就有了可以追问的地方。电阻值要和供电、电流、LED 压降放在一起看，同样是 330 Ω，换一种 LED，电流未必一样。显示 <code>8</code> 时七段全亮，七路电流还要在公共端加起来，电源和译码器的负担也得一起检查。</p><h3>译码器与数码管的匹配</h3><p>再拿课件仿真里的 <a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B</a> 对照，差别就落到了实处。它给共阴 LED 提供段电流，选中的段输出高电平，电流从输出端经过 LED 和限流电阻流到公共阴极，再回到地。同一个数字送进去，两颗芯片要求的公共端接法和有效电平正好相反。它们都能把 BCD 变成七段图形，LED 怎么接，却得跟着输出结构走。课件拿 CD4511 的接法去配 LS47 的实物，问题就出在这里。</p><p>四位输入对了还不算完，测试和消隐脚也得看。<a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">LS47 的控制说明</a>里有灯测试、消隐和零消隐，这几个脚同样在决定显示什么。只查 A 到 D、忽略了它们，就可能碰上输入数字没错、整位却被关掉的情况。调单个位时，我会先按真值表把这几个脚设到正常译码的状态，再依次送 <code>1</code>、<code>7</code>、<code>8</code>，先看右边两段，再加上顶上一段，最后七段全亮。</p><p>缺了一段，和整位显示成了另一个数字，排查的起点不一样。前者顺着那一段的 LED 支路去查，后者先核对 BCD 位序和译码器的控制脚。看到的错误、管着它的引脚、电流该走的路，这几样能对上，就不用再靠瞎插杜邦线碰运气了。</p>", "en": "<h2>Common-Anode Displays and BCD Decoding</h2><p class=\"summary\">Following decimal digit splitting and BCD bit order into active-low LS47 outputs, common-anode LED current paths, segment resistors, and display controls.</p><p>When the two digits read <code>17</code>, it looks as if the program simply carried a number onto the breadboard. There are several layers in between: the Arduino holds an integer, the decoders receive two groups of four voltage levels, and what finally lights up is a handful of LED segments. Back when I wired the common pin to ground as the course slides showed, the display stayed dark, and the wiring that worked was found by trial and error. The reasoning behind it was never filled in.</p><h3>Decimal Digits and BCD</h3><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-clock-homework-report.pdf#page=1\" target=\"_blank\" rel=\"noopener\">project report</a> splits the digits plainly, <code>Num % 10</code> for units and <code>(Num / 10) % 10</code> for tens. Feeding in <code>17</code> gives <code>7</code> and <code>1</code>, which go to separate decoders. BCD spends four binary bits on each decimal digit, so the display needs two independent codes, <code>0001</code> and <code>0111</code>. Written straight out in binary, the integer 17 is <code>10001</code>, which is a different thing altogether from what the two digits need.</p><p>In the <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/single-digit-bcd-counter.ino\" target=\"_blank\" rel=\"noopener\">single-digit example</a>, the simplest digit of all is the one that made me stop. The array stores <code>1</code> as <code>{1, 0, 0, 0}</code>, while written binary usually reads <code>0001</code>. The pin definitions settle it. The program stores bits in A, B, C, D order with weights 1, 2, 4 and 8, whereas written binary puts the most significant bit on the left. The first array element goes to A, so the order is exactly right; it just looks reversed.</p><pre><code>Decimal digit    D C B A    Array order A, B, C, D\n      1          0 0 0 1          1, 0, 0, 0\n      7          0 1 1 1          1, 1, 1, 0</code></pre><p>The example has sixteen rows of codes, yet the main loop uses <code>% 10</code> to keep the index between 0 and 9. Four wires can express sixteen combinations and one decimal digit uses ten, and the remaining six cannot be assumed to show hexadecimal letters. <a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">TI's LS47 description</a> assigns those six inputs particular patterns, while the <a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B</a> simply blanks any input above 9. Swapping in another decoder means checking what it shows outside 0 to 9 as well.</p><h3>Active-Low Outputs</h3><p>A through D only choose the digit; the decoder's a through g outputs are what map onto the seven LED segments. With the usual segment labels, <code>7</code> lights the top segment a, upper-right b and lower-right c. On the SN54LS47, those segments light when their outputs go low. The <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/sn54ls47-datasheet.pdf#page=2\" target=\"_blank\" rel=\"noopener\">LS47 datasheet</a> marks its outputs active-low and open-collector, for driving common-anode displays. Why a low level should turn a segment on only makes sense along the current path.</p><p>A common-anode display ties the anodes of all its segments together and connects that common pin to the positive supply. When a segment is selected, the matching output transistor inside the LS47 turns on, and current runs from the supply through that LED and its series resistor, into the decoder and down to ground. Pulling the output low gives the LED its forward voltage, and it lights. Walk that path once and a low level lighting a segment stops feeling backwards. Wiring the common pin to GND, as we first did, cuts the supply off at the very start of the path, so a dark display is no surprise.</p><p>Open-collector operation deserves a word of its own. When the output transistor turns off, the chip merely lets go of that path to ground. The output goes high-impedance and its voltage is set by the external circuit; it does not push the pin up to the supply the way a push-pull output would. The segment-off state in the truth table, the voltage a meter reads at the pin, and whether the pin can source current are therefore three separate questions. Reading this far explained why the datasheet gives the part two identities at once, decoder and driver.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/bcd-decoder-notes.png\" alt=\"Course diagram of decoder pins and individual segment resistors\"><figcaption>Course diagram of decoder pins and individual segment resistors</figcaption></figure></div><h3>Segment Current and Resistor Selection</h3><p>The course slide asks for one series resistor on every segment output. Why not a single resistor at the common pin? If all seven segments shared one, showing <code>1</code> would split the current between two branches and showing <code>8</code> between seven. As the number of lit segments changes, so does the current each one gets, and brightness starts to depend on the digit. With a resistor in each segment branch, every segment's current is limited on its own.</p><p>Estimating one segment means subtracting both the LED's forward drop and the driver's on-state low voltage from the supply. Assume a 5 V supply, an LED forward drop of 2.0 V near the target current, and 0.3 V across the driver output. Aiming for about 5 mA gives <code>(5 − 2.0 − 0.3) / 0.005 = 540 Ω</code>, and the common 560 Ω value gives roughly 4.8 mA under the same assumptions. These numbers only show how a value is chosen; real displays and chips need their own parameters.</p><p>Worked that way, the slide's 330 Ω becomes something to question. A resistor value belongs with the supply, the current and the LED drop; keep 330 Ω and change the LED, and the current need not stay the same. When <code>8</code> lights all seven segments, the seven currents also add up at the common pin, so the load on the supply and the decoder needs checking too.</p><h3>Decoder and Display Compatibility</h3><p>Set the course simulation's <a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B</a> beside it and the difference becomes concrete. That chip supplies segment current for common-cathode LEDs: a selected output goes high, and current flows from the output through the LED and its resistor to the common cathode and ground. Feed the same digit into both chips and they want opposite common connections and opposite active levels. Both turn BCD into a seven-segment pattern, yet the LED wiring has to follow the output structure. Pairing the CD4511's wiring with LS47 hardware is exactly where the course slides went wrong.</p><p>Correct data inputs are not the end of it; the test and blanking pins matter too. <a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">The LS47 controls</a> include lamp test, blanking and ripple blanking, and they also decide what appears. Check only A through D and ignore them, and the input digit can be right while the whole display stays off. To check a single digit I would first set those pins for normal decoding from the truth table, then feed <code>1</code>, <code>7</code> and <code>8</code> in turn: the two right-hand segments, then the top one added, then all seven.</p><p>A missing segment and a whole digit showing the wrong number start from different places. The first is traced along that segment's LED branch; the second begins with the BCD bit order and the decoder's control pins. Once the visible error, the pins that govern it and the path the current should take line up, finding the fault no longer depends on poking jumper wires and hoping.</p>"}, "cb": 1496, "ca": 1464}, {"group": "Digital Clock", "kind": "笔记", "label": "Digital Clock · 笔记 · 自锁按键与计数控制", "route": "https://www.66ccff-labs.com/notes/arduino-counter-latching-switch-control", "before": {"zh": "<h2>自锁按键与计数控制</h2><p class=\"summary\">从自锁触点和输入上下拉，研究消抖、状态变化与计数时序，理清暂停和复位怎样按预期响应。</p><p>暂停和复位都只需要一只开关，接进程序以后，处理方法却很不一样。暂停时，计数器要保持一种状态；复位则可以约定在某次操作发生时把数字清零。我现在回看这套两位计数器，想先弄明白，开关的机械位置、引脚上的电平，以及程序执行的一次动作，究竟怎样对应。</p><h3>开关触点</h3><p>课程使用六脚自锁按键。自锁描述的是机械动作，按下一次后保持在一个位置，再按一次切换回来；六只脚怎样连通，则要看内部触点结构。手指松开按钮，并不等于触点已经回到最初的位置。这个区别放到暂停功能里尤其直观，按钮已经松手，计数器仍然可以保持暂停。</p><p>要读懂触点，我会先让开关与外部电路断开，给六只脚按固定视角编号，再用通断档分别记录两个稳定位置下的导通关系。如果某只脚在一个位置与左侧脚连通，切换后改为与右侧脚连通，就可以按这个测量结果找出一组转换触点；另一组也单独确认。编号和观察方向一起记下来，才能把画出的关系准确接回实物。我更愿意先画清这些线，再决定哪根接输入、哪根接地。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/button-pullup-notes.png\" alt=\"课程中的六脚自锁按键、上下拉电路与输入测试程序\"><figcaption>课程中的六脚自锁按键、上下拉电路与输入测试程序</figcaption></figure></div><h3>默认输入电平</h3><p>开关触点确认以后，接法还要给断开状态安排一个确定的电平。以课件里的上拉电路为例，电阻从输入节点接到 VCC，开关从节点接到地。触点断开时，电阻把输入拉高；闭合时，输入被接地，读成低电平。若选用另一组触点，机械位置与高低电平的对应也可能改变。程序里的 <code>HIGH</code> 或 <code>LOW</code>，需要按实际连线解释。</p><p>这只电阻还有一个容易被略过的作用。闭合时，电源到地之间经过的是电阻和开关，电流受到限制。用 5 V 和 10 kΩ 作例子，电流约为 0.5 mA。若把电阻换成导线，这个连接就会在闭合时直接短接电源。断开时确定电平，闭合时限制电流，两种状态放在一起看，上拉电阻的作用才完整。</p><p><a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-read-key.ino\" target=\"_blank\" rel=\"noopener\">课程测试代码</a>把输入设为 <code>INPUT</code>，然后不断打印读数。<a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Digital%20IO/pinMode.adoc\" target=\"_blank\" rel=\"noopener\">Arduino 的 <code>pinMode()</code> 说明</a>区分了 <code>INPUT</code> 和 <code>INPUT_PULLUP</code>，后者才会启用内部上拉。所以照着这段程序接线时，课件中的外部上拉或下拉也要接上。仅把引脚设为输入，并不会自动替电路补好默认电平。</p><h3>按键消抖与状态变化检测</h3><p>接下来才轮到消抖。机械触点切换时可能短暂反复接触和分离，一次操作会在输入上形成几次跳变。<a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/Debounce/Debounce.ino\" target=\"_blank\" rel=\"noopener\">Arduino 的 Debounce 示例</a>每次发现原始读数改变，就重新记录时间，等它连续稳定一段时间后，才接受为新的按键状态。它给我一个很清楚的区分，原始读数可以先变化，程序认定的稳定状态稍后再变化。</p><p>例如，用 20 ms 作为推演中的稳定时间。读数在 0 ms 时变低，4 ms 时又变高，7 ms 时再变低，此后保持不变。计时应从最后一次变化的 7 ms 开始，到约 27 ms 才接受低电平。这里选 20 ms 是为了看清过程，实际时长要结合开关和响应要求确定。等待稳定会增加响应延迟，设得越长，动作被确认得也越晚。</p><p>消抖之后，循环仍然会一遍遍读到同一个稳定状态。若每次读到低电平就执行一次计数或切换，一只锁住的按键照样能触发很多次。要把一次操作变成一次动作，还需要比较新旧稳定状态，只在选定的变化方向上触发。<a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/StateChangeDetection/StateChangeDetection.ino\" target=\"_blank\" rel=\"noopener\">Arduino 的状态变化示例</a>正是把当前值与上次值比较。到这里，消抖负责确认状态，变化检测负责挑出动作发生的那一刻，两者的作用就分开了。</p><p>对这份计数器，我会先给两个功能写下明确约定。暂停跟随消抖后的开关状态，锁在暂停位置就持续停止加数，切回来再继续。复位则选择一个确定的状态变化，例如进入有效位置时清零一次，保持在这个位置不再反复清零。启动程序时，也要先读取并确认初始状态，避免把开机时已经按下的开关误当成刚发生的一次操作。不同交互要求可以采用不同约定，但代码和实际使用方式要一致。</p><h3>主循环计时与按键响应</h3><p>再看计数程序里的 <code>delay(1000)</code>，前面的问题又多了一层时间关系。程序在主循环里等待一秒时，后面的按键轮询也得等它返回。一次很短的按下和恢复，可能完全落在两次读取之间；自锁开关若保持在新位置，下一次通常还能读到，不过响应会晚。<a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Time/delay.adoc\" target=\"_blank\" rel=\"noopener\">Arduino 的 <code>delay()</code> 说明</a>也区分了暂停主程序与中断等仍可继续工作的机制。这里影响按键的是主循环多久回来读一次。</p><p>一秒可以作为两次加数之间的时间条件，等待期间让主循环继续检查开关。每轮读一次 <code>millis()</code>，处理输入和状态变化，再比较距上次计数是否已满一秒，到时才更新数字。<a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/BlinkWithoutDelay/BlinkWithoutDelay.ino\" target=\"_blank\" rel=\"noopener\">Blink Without Delay 示例</a>用的就是这种经过时间的判断。显示更新和其他处理也要尽量短，循环能及时回来，前面的消抖与变化检测才有足够频繁的输入。</p><p>暂停恢复时还有一个值得提前想清楚的小问题。假设一秒已经走过 700 ms，此时暂停，恢复后是再等 300 ms，还是重新等一秒？这两种行为都能写出来，却对应不同的使用感受。给这个练习重新安排逻辑时，我会约定恢复后重新计满一秒，清零时也重置计时起点；若要保留已走过的 700 ms，就把这部分时间另存下来。这样可以避免恢复后因计时起点太旧而立刻多加一次。</p><p>我还会明确同一轮同时遇到复位和计数到期时的顺序，让复位优先，并跳过这一轮的加数。否则刚写入 <code>0</code>，后面又满足加数条件，显示马上变成 <code>1</code>，从外面看很像复位没生效。这个例子让我更愿意把输入处理、状态更新和计数更新的顺序放在一起推演。遇到异常时，触点抖动和程序执行顺序都值得分别检查。</p><p>暂停时保留原来的数字，复位时清零，拨动开关后及时响应，用这只计数器时期待的其实就是这些。让这些动作按预期发生，得把触点状态、输入判断和主循环顺序一起安排好。开关在手里只需要拨一下，程序却要认真处理这一下带来的变化。</p>", "en": "<h2>Latching Switches and Counter Control</h2><p class=\"summary\">Studying latching contacts, input bias, debouncing, state changes, and elapsed-time counting to define predictable pause and reset behaviour.</p><p>Pause and reset each need only one switch, yet they call for quite different handling in the program. Pausing keeps the counter in a state; resetting can be defined as clearing the number when a particular action occurs. Revisiting this two-digit counter, I want to understand how a switch's mechanical position relates to a pin voltage and, eventually, to a single program action.</p><h3>Switch Contacts</h3><p>The course uses six-pin latching pushbuttons. Latching describes the mechanical action: one push leaves the switch in a position, and another changes it back. The connections among the six pins depend on the contact arrangement inside. Taking a finger off the button does not necessarily return the contacts to their original position. Pause makes this distinction easy to see. The user can let go while the counter stays paused.</p><p>To understand the contacts, I would first disconnect the switch from the surrounding circuit, number its pins from a fixed viewing direction, and record continuity in both stable positions. If one pin connects to a neighbour on one side in the first position and to another on the opposite side after switching, that measurement identifies a changeover contact group. A second group needs its own check. Recording the viewing direction with the numbers lets me translate the drawing back to the physical part. I would rather establish those connections before choosing which wire goes to the input and which goes to ground.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/button-pullup-notes.png\" alt=\"Course slide showing six-pin latching switches, pull-up and pull-down circuits, and an input test sketch\"><figcaption>Course slide showing six-pin latching switches, pull-up and pull-down circuits, and an input test sketch</figcaption></figure></div><h3>The Default Input Level</h3><p>After identifying the contacts, the circuit still needs to give an open contact a definite input level. In the course slide's pull-up example, a resistor connects the input node to VCC, and the switch connects that node to ground. Opening the contact lets the resistor pull the input high; closing it grounds the input, producing a low reading. Choosing a different contact pair can change how mechanical position maps to voltage. I need to interpret <code>HIGH</code> and <code>LOW</code> from the actual wiring.</p><p>The resistor has another role that is easy to miss. With the contact closed, current flows from the supply through the resistor and switch to ground. A 5 V supply and 10 kΩ resistor give about 0.5 mA. Replacing the resistor with a wire would directly short the supply when the switch closes. Looking at both positions explains its job more fully: establishing the level while open and limiting current while closed.</p><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-read-key.ino\" target=\"_blank\" rel=\"noopener\">course test sketch</a> uses <code>INPUT</code> and repeatedly prints the readings. <a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Digital%20IO/pinMode.adoc\" target=\"_blank\" rel=\"noopener\">Arduino's <code>pinMode()</code> reference</a> distinguishes that mode from <code>INPUT_PULLUP</code>, which enables the internal pull-up. Following this sketch therefore also means providing the external pull-up or pull-down shown in the circuit. Configuring an input alone does not supply the missing default level.</p><h3>Switch Debouncing and State-Change Detection</h3><p>Debouncing comes next. Mechanical contacts can briefly make and break several times during a transition, producing multiple changes from one operation. <a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/Debounce/Debounce.ino\" target=\"_blank\" rel=\"noopener\">Arduino's Debounce example</a> restarts a timer whenever the raw reading changes and accepts a new button state only after the reading has remained steady for an interval. That gives me two distinct values to follow. The raw input can change first; the state accepted by the program changes later.</p><p>Consider 20 ms as a stability interval for a worked example. The input goes low at 0 ms, returns high at 4 ms, and goes low again at 7 ms, staying there afterwards. Timing begins again at the final transition, so low is accepted at about 27 ms. The 20 ms value makes the sequence easy to follow; an actual interval needs to suit the switch and response requirements. Waiting for stability adds latency, and a longer interval delays acceptance of the action.</p><p>Even after debouncing, the loop will read the same stable state repeatedly. Incrementing or toggling something every time it reads low can still produce many actions from a switch left latched in position. A single action needs a comparison between the old and new stable states, triggering only on the chosen transition. <a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/StateChangeDetection/StateChangeDetection.ino\" target=\"_blank\" rel=\"noopener\">Arduino's state-change example</a> compares the current value with the previous one. I can now separate the two jobs: debouncing establishes the state, while change detection identifies the moment chosen to trigger an action.</p><p>For this counter, I would define the two controls explicitly. Pause follows the debounced switch state, stopping increments while latched in the pause position and continuing when switched back. Reset uses a selected transition, such as entering the active position, to clear the number once. Staying there does not repeatedly clear it. At startup, the program should also read and establish the initial state, so a switch already pressed is not mistaken for a new operation. Other interactions can use different rules; the code and the way the controls are used need to agree.</p><h3>Loop Timing and Button Response</h3><p>The counter's <code>delay(1000)</code> introduces another timing question. While the main loop waits for a second, the button polling that follows has to wait too. A brief press and return can fit entirely between two reads. A latching switch that remains in its new position will usually still be read on the next pass, although the response comes later. <a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Time/delay.adoc\" target=\"_blank\" rel=\"noopener\">Arduino's <code>delay()</code> documentation</a> also distinguishes suspension of the main program from mechanisms such as interrupts that can continue. What matters for these buttons is how often the loop returns to read them.</p><p>A one-second interval between increments can be checked without stopping the loop from reading the switches. On each pass, read <code>millis()</code>, process the inputs and state changes, and update the count only when a second has elapsed since the last counting reference. <a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/BlinkWithoutDelay/BlinkWithoutDelay.ino\" target=\"_blank\" rel=\"noopener\">Blink Without Delay</a> demonstrates this elapsed-time approach. Display updates and other work also need to stay brief so that debouncing and change detection receive input samples frequently enough.</p><p>Resuming from pause raises a small question worth answering before writing the code. If 700 ms of the second has elapsed when I pause, should resuming leave 300 ms or begin a fresh second? Both behaviours are possible, but they feel different to use. For a new version of this exercise, I would start a full second on resume and reset the timing reference when clearing the count. Preserving the elapsed 700 ms would instead require storing that partial interval. Defining the choice avoids an immediate extra increment caused by an old timing reference after resuming.</p><p>I would also give reset priority when it arrives in the same loop iteration as an increment becoming due, skipping that increment. Otherwise the program can write <code>0</code> and then immediately change it to <code>1</code>, making reset appear ineffective. This example makes me want to reason through input handling, state updates, and count updates together. Contact bounce and the order of program operations each deserve their own check when behaviour looks wrong.</p><p>Pause should hold the displayed number, reset should clear it, and either action should take effect promptly. Getting that behaviour depends on how the contacts are wired, how inputs are interpreted, and when the loop acts on them. A single movement of the switch feels simple in the hand. The program still has to deal carefully with the changes it produces.</p>"}, "after": {"zh": "<h2>自锁按键与计数控制</h2><p class=\"summary\">从自锁触点和输入上下拉，研究消抖、状态变化与计数时序，理清暂停和复位怎样按预期响应。</p><p>暂停和复位各用一只开关，接进程序以后，处理方式却差得挺远。暂停要让计数器一直待在某个状态，复位则可以约定在某个动作发生的那一下把数字清零。当年这两个六脚自锁按键，是拿借来的万用表一对一对量通的。接着往下要弄清楚的是，开关的机械位置、引脚上的电平、程序执行的一次动作，三者到底怎么对应。</p><h3>开关触点</h3><p>课程用的是六脚自锁按键。自锁说的是机械动作，按一下停在一个位置，再按一下切回来；六只脚怎么连通，要看里面的触点结构。手指松开了，触点不一定回到原位。放到暂停功能上就很直观，手已经松了，计数器照样停着。</p><p>要读懂触点，先把开关从电路里拆出来，从固定的方向给六只脚编号，再用通断档分别记下两个稳定位置的导通关系。某只脚在一个位置和左边的脚通，切过去以后改成和右边的通，这就是一组转换触点；另一组也单独确认。编号和观察方向要一起记，画出来的图才能原样接回实物。先把这张图画清楚，再决定哪根接输入、哪根接地，比边接边猜省事得多。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/button-pullup-notes.png\" alt=\"课程中的六脚自锁按键、上下拉电路与输入测试程序\"><figcaption>课程中的六脚自锁按键、上下拉电路与输入测试程序</figcaption></figure></div><h3>默认输入电平</h3><p>触点弄清楚了，还得给断开的状态安排一个确定的电平。小组<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-clock-homework-report.pdf\" target=\"_blank\" rel=\"noopener\">报告</a>里记的是 10 kΩ 电阻从 Arduino 引脚上拉到 VCC，开关另一端接地，按下读低电平，课件里画的也是这种上拉接法。触点断开时，电阻把输入拉高；闭合时输入接地。换一组触点用，机械位置和高低电平的对应关系就可能反过来，程序里的 <code>HIGH</code> 和 <code>LOW</code> 代表什么，要对着实际连线才说得清。</p><p>这只电阻还有一个容易被忽略的活儿。触点闭合时，电源到地之间隔着的就是它，电流被它限住了，按 5 V、10 kΩ 算大约 0.5 mA。要是把电阻换成一根导线，开关一闭合，电源就直接短到地。断开时定电平，闭合时限电流，两种状态放一起看，上拉电阻的作用才算完整。</p><p><a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-read-key.ino\" target=\"_blank\" rel=\"noopener\">课程测试代码</a>把输入设成 <code>INPUT</code>，然后一直打印读数。<a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Digital%20IO/pinMode.adoc\" target=\"_blank\" rel=\"noopener\">Arduino 的 <code>pinMode()</code> 说明</a>把 <code>INPUT</code> 和 <code>INPUT_PULLUP</code> 分得很清楚，后者才会打开内部上拉。照着这段程序接线，课件里画的外部上拉或下拉就得老老实实接上，光把引脚设成输入，默认电平不会凭空出现。当年那阵读数乱跳，悬空的输入就是一种说得通的可能。</p><h3>按键消抖与状态变化检测</h3><p>接下来才轮到消抖。机械触点在切换的一瞬间可能反复碰上、分开好几次，一次操作就在输入上留下好几次跳变，按一次响应两次，正是这种跳变常见的样子。<a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/Debounce/Debounce.ino\" target=\"_blank\" rel=\"noopener\">Arduino 的 Debounce 示例</a>每看到原始读数变一次，就重新记时间，等它连续稳住一段时间，才认定是新的按键状态。原始读数先变，程序认定的状态后变，这两个值得分开跟。</p><p>拿 20 ms 当稳定时间推一遍。读数在 0 ms 变低，4 ms 变高，7 ms 再变低，之后不动了。计时要从最后一次变化的 7 ms 算起，到 27 ms 左右才认低电平。20 ms 只是为了看清过程，实际多长要看开关和响应要求，等得越久，动作被确认得也越晚。</p><p>消完抖，主循环还是会一遍遍读到同一个稳定状态。要是每读到一次低电平就计一次数或切一次状态，一只锁住的按键照样能触发一大串。想让一次操作只对应一次动作，还得比较新旧两个稳定状态，只在选定的变化方向上触发，<a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/StateChangeDetection/StateChangeDetection.ino\" target=\"_blank\" rel=\"noopener\">Arduino 的状态变化示例</a>做的就是这件事。消抖负责确认状态，变化检测负责挑出动作发生的时刻，两件事就这样分开了。</p><p>放到这只计数器上，我会先把两个功能的规矩写清楚。暂停跟着消抖后的开关状态走，锁在暂停位置就一直不加数，切回来接着计。复位挑一个确定的变化，比如进入有效位置的那一下清零一次，停在那个位置不再反复清零。程序启动时也要先读一次初始状态，免得把开机前就按着的开关当成刚按下去的一次操作。别的交互也可以定别的规矩，只要代码和实际用法对得上就行。</p><h3>主循环计时与按键响应</h3><p>课程的单个位示例用 <code>delay(1000)</code> 计时，我当年的程序也是这种阻塞式 <code>delay()</code> 的写法，前面这些问题于是又多了一层时间上的考虑。主循环在那儿干等一秒，后面的按键轮询只能跟着等。一次很短的按下又松开，可能整个落在两次读取之间；自锁开关停在新位置，下一轮通常还能读到，只是慢了半拍。<a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Time/delay.adoc\" target=\"_blank\" rel=\"noopener\">Arduino 的 <code>delay()</code> 说明</a>也区分了主程序被暂停和中断这类还能继续工作的机制。对这两个按键来说，要紧的是主循环多久回来读一次。</p><p>一秒可以当成两次加数之间的时间条件，等的时候让主循环继续看开关。每一轮读一次 <code>millis()</code>，处理输入和状态变化，再看离上次计数满没满一秒，满了才更新数字。<a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/BlinkWithoutDelay/BlinkWithoutDelay.ino\" target=\"_blank\" rel=\"noopener\">Blink Without Delay 示例</a>用的就是这种按经过时间判断的写法。显示更新和其他处理也要尽量短，循环回来得勤，前面的消抖和变化检测才有足够密的输入可用。</p><p>暂停之后恢复，还有个小问题最好在写代码前想好。假设这一秒已经走了 700 ms，这时暂停，恢复以后是再等 300 ms，还是重新等满一秒？两种都写得出来，用起来感觉不一样。重新安排这个练习的话，我会约定恢复后重新计满一秒，清零时也一并重置计时起点；想保留那 700 ms，就得另外把这段时间存下来。这样一来，恢复的那一刻不会因为计时起点太旧而多加一次。</p><p>同一轮里既遇到复位、计数又刚好到期，我会让复位优先，跳过这一轮的加数。不然刚写进 <code>0</code>，后面加数条件一满足，显示立刻变成 <code>1</code>，从外面看就像复位没管用。输入处理、状态更新、计数更新，谁先谁后要放在一起推。显示不对劲的时候，触点抖动和程序执行顺序，都值得分开查一查。</p><p>暂停时停在原来的数，复位时归零，拨一下开关马上有反应，用这只计数器的人要的其实就是这些。要让它们按预期发生，触点状态、输入判断和主循环的先后顺序得一起安排。开关在手里只是拨一下，程序却要把这一下处理得明明白白。</p>", "en": "<h2>Latching Switches and Counter Control</h2><p class=\"summary\">Studying latching contacts, input bias, debouncing, state changes, and elapsed-time counting to define predictable pause and reset behaviour.</p><p>Pause and reset each take one switch, yet once they reach the program they need quite different handling. Pause has to keep the counter sitting in a state; reset can be defined as clearing the number at the moment a particular action happens. Those two six-pin latching switches were mapped back then with a borrowed multimeter, one pin pair at a time. What follows picks up from there: how the switch's mechanical position, the voltage on the pin and a single program action actually correspond.</p><h3>Switch Contacts</h3><p>The course uses six-pin latching pushbuttons. Latching describes the mechanical action: press once and it stays in one position, press again and it switches back. How the six pins connect depends on the contacts inside. Lifting a finger does not necessarily return the contacts to where they started, and pause shows this clearly, because the hand has let go and the counter stays paused.</p><p>Reading the contacts starts with taking the switch out of the circuit, numbering its six pins from a fixed viewing direction, and recording continuity in each of the two stable positions. If one pin connects to its left-hand neighbour in one position and to its right-hand neighbour after switching, that is a changeover contact group; the second group gets its own check. Recording the viewing direction with the numbers is what lets the drawing go back onto the physical part correctly. Drawing those connections first and only then deciding which wire goes to the input and which to ground saves a lot of guessing while wiring.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/button-pullup-notes.png\" alt=\"Course slide showing six-pin latching switches, pull-up and pull-down circuits, and an input test sketch\"><figcaption>Course slide showing six-pin latching switches, pull-up and pull-down circuits, and an input test sketch</figcaption></figure></div><h3>The Default Input Level</h3><p>Once the contacts are known, the open state still needs a definite level. The group's <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-clock-homework-report.pdf\" target=\"_blank\" rel=\"noopener\">report</a> records a 10 kΩ pull-up from the Arduino pin to VCC, with the switch's other side grounded, so a press reads low; the course slide draws the same pull-up arrangement. With the contact open, the resistor pulls the input high, and with it closed the input is grounded. Using a different contact pair can flip how mechanical position maps to voltage, so <code>HIGH</code> and <code>LOW</code> in the program only mean something once read against the actual wiring.</p><p>That resistor has a second job that is easy to overlook. With the contact closed, it is the only thing between supply and ground, and it limits the current; 5 V across 10 kΩ comes to about 0.5 mA. Replace it with a wire and closing the switch would short the supply straight to ground. Setting the level while open and limiting current while closed, seen together, make up the whole job of a pull-up.</p><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-read-key.ino\" target=\"_blank\" rel=\"noopener\">course test sketch</a> sets its inputs to <code>INPUT</code> and keeps printing the readings. <a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Digital%20IO/pinMode.adoc\" target=\"_blank\" rel=\"noopener\">Arduino's <code>pinMode()</code> reference</a> keeps <code>INPUT</code> and <code>INPUT_PULLUP</code> clearly apart; only the latter turns on the internal pull-up. Wiring along with this sketch means actually fitting the external pull-up or pull-down from the slide, because setting a pin as an input does not conjure a default level. A floating input is one plausible explanation for the readings that jumped about back then.</p><h3>Switch Debouncing and State-Change Detection</h3><p>Debouncing comes next. At the moment of switching, mechanical contacts can touch and part several times, so one operation leaves several transitions on the input, and one press registering twice is exactly what that tends to look like. <a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/Debounce/Debounce.ino\" target=\"_blank\" rel=\"noopener\">Arduino's Debounce example</a> restarts its timer every time the raw reading changes and accepts a new button state only once the reading has held steady for an interval. The raw reading changes first and the accepted state changes later, and the two are worth following separately.</p><p>Take 20 ms as the settling time for a worked example. The reading drops low at 0 ms, goes high at 4 ms, drops low again at 7 ms and then stays put. Timing restarts at that last change, so low is accepted at about 27 ms. The 20 ms figure just makes the sequence easy to follow; a real value depends on the switch and the response needed, and the longer the wait, the later the action is confirmed.</p><p>After debouncing, the loop still reads the same stable state over and over. Counting or toggling every time it sees low would let one latched switch fire a whole string of actions. Turning one operation into one action means comparing the old and new stable states and firing only on the chosen transition, which is what <a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/StateChangeDetection/StateChangeDetection.ino\" target=\"_blank\" rel=\"noopener\">Arduino's state-change example</a> does. Debouncing confirms the state and change detection picks out the moment of the action, and that is how the two jobs come apart.</p><p>For this counter, I would write down the rules for both controls first. Pause follows the debounced switch state: latched in the pause position, no counting; switched back, counting resumes. Reset picks one definite transition, such as entering the active position, and clears the number once, without clearing again for as long as it stays there. At startup the program should read the initial state too, so a switch already pressed at power-on is not mistaken for a fresh press. Other interactions can follow other rules, as long as the code and the way the controls are actually used agree.</p><h3>Loop Timing and Button Response</h3><p>The course's single-digit example counts with <code>delay(1000)</code>, and my own code back then leaned on the same kind of blocking delay. That adds a timing layer to everything above. While the main loop sits out its second, the button polling after it has to wait too. A brief press and release can fall entirely between two reads; a latching switch that stays in its new position will usually still be seen on the next pass, just half a beat late. <a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Time/delay.adoc\" target=\"_blank\" rel=\"noopener\">Arduino's <code>delay()</code> reference</a> also separates pausing the main program from mechanisms such as interrupts that keep running. For these buttons, what matters is how often the loop comes back to read them.</p><p>One second can serve as the condition between two increments while the loop keeps watching the switches. Each pass reads <code>millis()</code>, handles inputs and state changes, and updates the number only once a full second has passed since the last count. <a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/BlinkWithoutDelay/BlinkWithoutDelay.ino\" target=\"_blank\" rel=\"noopener\">Blink Without Delay</a> uses exactly this elapsed-time check. Display updates and other work need to stay short as well, so the loop returns often enough to give debouncing and change detection frequent samples.</p><p>Resuming from pause raises a small question best settled before writing code. Suppose 700 ms of the current second has passed when pause is pressed. On resume, should the counter wait the remaining 300 ms or start a fresh second? Both are easy to write and they feel different in use. Laying this exercise out again, I would make resume start a full second and reset the timing reference on clear as well; keeping the 700 ms would mean storing that partial interval separately. Either way, an old timing reference can no longer trigger an extra count the instant the counter resumes.</p><p>If reset arrives in the same pass as an increment falling due, I would let reset win and skip that increment. Otherwise the program writes <code>0</code>, the increment condition is met immediately afterwards, and the display turns to <code>1</code>, which from the outside looks as if reset did nothing. Input handling, state updates and count updates need their order worked out together, and when the display misbehaves, contact bounce and execution order each deserve a separate look.</p><p>Pause holding the number, reset clearing it, and a response the moment the switch moves: that is all anyone using the counter expects. Getting there means arranging contact states, input decisions and the loop's ordering together. In the hand it is a single flick of a switch, and the program has to handle that one flick with real care.</p>"}, "cb": 1874, "ca": 1885}, {"group": "Tianjin STM32", "kind": "主页", "label": "Tianjin STM32 · 主页 · 天津津铁 STM32 嵌入式实习", "route": "https://www.66ccff-labs.com/work/tianjin-metro-stm32-foundation", "before": {"zh": "<h2>天津津铁 STM32 嵌入式实习</h2><p class=\"summary\">在天津津铁一个月的基础实习中，我自行安排 STM32 学习顺序，从外设小实验做起，最后把传感器、显示、编码器、舵机与 LED 控制接进同一套裸机演示。</p><h3>从 Arduino 到 STM32</h3><p>2025 年 2 月，我在天津津铁通信有限公司做了一个月嵌入式实习，日常办公地点在天津轨道交通集团总部。工程师给我一批入门资料，桌上是一块 STM32F103C8T6 Blue Pill、一只 ST-Link 和外接模块，我就从这些基础练起。</p><p>此前我在学校用过 Arduino Nano，对单片机的理解大多停在调用函数、输出高低电平。工程师没有给逐日课表，我就结合资料和网上教程安排自己的顺序，先 GPIO，再 EXTI 与 Timer，接着学 PWM、UART、ADC，最后把它们接成一个综合 demo。我想弄明白，以前函数调用后直接出现的现象，在 STM32 上到底要经过哪些配置。</p><h3>第一次上板</h3><p>Keil 的魔术棒设置页先让我卡了一阵。器件包、编译器、启动文件、库路径、目标地址与下载算法都要配置，我却还不清楚它们分别影响哪一步。后来我把检查分开，电脑先能编译，ST-Link 再能下载，最后看板上有没有明确输出。GPIOC13 每隔 300 ms 翻转，成了第一项贯穿工具链与实物的验证。</p><p><a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/stm32-basic-gpio-oled-loop.c\" target=\"_blank\" rel=\"noopener\">最初的 GPIO 与 OLED 程序</a>还保留着这些配置。先开 GPIOB、GPIOC 时钟，用 PB4、PB5 给 OLED 建立供电电平，再初始化显示并控制 PC13。当时是低功耗面包板练习，用 GPIO 给模块供电也受引脚电流能力约束。我开始主动往 <code>GPIO_SetBits()</code> 下面追，核对时钟、引脚模式和寄存器，而不只记函数名。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/stm32f103c8t6-pinout.png\" alt=\"STM32F103C8T6 引脚定义参考\"><figcaption>STM32F103C8T6 引脚定义参考</figcaption></figure></div><p>OLED 曾经编译、下载都正常却不显示。最后我换了一组普通 GPIO，用软件模拟 I²C，屏幕恢复了。</p><h3>外设组合</h3><p>GPIO、OLED、编码器、舵机、DHT11、光敏传感器、PWM 与 UART，我先在独立工程里逐个跑通，再加入同一套裸机程序，模块靠面包板与杜邦线连接。按键负责切换编码器的控制对象，一种模式调目标光照，另一种调舵机速度；OLED 显示实测光照、目标、LED 输出和温湿度，UART 向电脑发送光照与调试信息，PC13 留作状态灯。</p><p>集成时，EXTI 处理编码器事件，TIM3 提供慢任务的触发节奏，TIM4 负责 PWM。温湿度与光敏读取等 flag 到来再执行，旋钮和目标值则在主循环中更新。我编写了应用流程、编码器映射、模式切换与综合主循环，外设驱动是在 ST 标准库和公开例程基础上理解、修改、接入的。</p><h3>光照标定</h3><p>为了把目标光照数值转换成 LED 输出，我逐点调整 PWM、读取 ADC，在这套面包板上记下 16 组数据，再写了<a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-pwm-lookup-excerpt.c\" target=\"_blank\" rel=\"noopener\">查表插值函数</a>。记录中 PWM 从 0 增到 1000，ADC 从 1600 降到 480；目标位于两个记录点之间，就用线性插值求对应输出。</p><p>这套程序根据目标值查表得到 PWM，实测 ADC 用来显示和打印。我当时也想过再加反馈修正，最后先保留了这套前馈实现。</p><h3>实习结束</h3><p>大约 20 个工作日后，我独立完成了这条学习路线。工程师看了 demo，听我解释外设之间怎样配合，评价我学得比较扎实。同期我还阅读了 PID、ATP、ATO、ATS 的入门资料。</p><p>后来学 FOC 时，我又遇到了 Timer、ADC 和 PWM，只是要求变成了采样与开关时刻的配合，以及一次计算能否及时完成。天津这一个月让我有了继续往下查的起点。遇到一个外设函数，我已经会去找它依赖的时钟、信号和执行顺序。</p>", "en": "<h2>Tianjin Jintie STM32 Internship</h2><p class=\"summary\">During a month of foundational training at Tianjin Jintie, I planned my own STM32 learning sequence and combined external sensors, display, encoder, servo, and LED control in a working bare-metal demo.</p><h3>From Arduino to STM32</h3><p>In February 2025, I spent a month as an embedded intern at Tianjin Jintie Communications, working inside the Tianjin Rail Transit Group headquarters. The supervising engineer supplied introductory material, and my bench held an STM32F103C8T6 Blue Pill, an ST-Link, and external modules. I started with those fundamentals.</p><p>My university Arduino Nano projects had mostly taught me to call functions and set pins high or low. There was no daily syllabus for this placement, so I combined the supplied material with online tutorials and arranged my own route: GPIO, EXTI and timers, then PWM, UART, ADC, and an integrated demo. I wanted to understand the configuration behind effects that Arduino had made available through a function call.</p><h3>First Board Tests</h3><p>Keil's Magic Wand settings occupied me before the peripherals did. Device packs, compiler selection, startup files, library paths, target addresses, and flash algorithms all needed configuration while I was still learning their separate purposes. I eventually split the checks into compilation on the computer, downloading through ST-Link, and an observable effect on the board. Toggling GPIOC13 every 300 ms became the first test across the toolchain and physical hardware.</p><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/stm32-basic-gpio-oled-loop.c\" target=\"_blank\" rel=\"noopener\">initial GPIO and OLED program</a> preserves that setup. It enables GPIOB and GPIOC clocks, establishes OLED power levels through PB4 and PB5, initializes the display, and drives PC13. This was a low-power breadboard exercise; powering a module from GPIO remains constrained by the pin's current capability. I began looking below <code>GPIO_SetBits()</code> at clocks, modes, and registers instead of learning only the function names.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/stm32f103c8t6-pinout.png\" alt=\"STM32F103C8T6 pinout reference\"><figcaption>STM32F103C8T6 pinout reference</figcaption></figure></div><p>At one point the OLED stayed blank even though compilation and download worked. Moving it to another pair of ordinary GPIO pins and using software I²C restored the display.</p><h3>Peripheral Integration</h3><p>I ran GPIO, OLED, encoder, servo, DHT11, light sensing, PWM, and UART in separate projects before joining them into one bare-metal program. The hardware remained a Blue Pill, breadboard, and jumper wires. A button selected what the encoder controlled: target light in one mode and servo speed in the other. The OLED showed measured light, target, LED output, temperature, and humidity; UART sent light readings and debug information to the computer, while PC13 served as a status indicator.</p><p>EXTI handled encoder events, TIM3 paced slower work, and TIM4 generated PWM. Light and temperature/humidity reads waited for a flag; encoder and target updates took place in the main loop. I wrote the application flow, encoder mapping, mode switching, and integrated superloop. The peripheral drivers were material I studied, modified, and connected from ST's Standard Peripheral Library and public examples.</p><h3>Light Calibration</h3><p>To turn a target light value into an LED command, I adjusted PWM point by point and recorded 16 ADC readings on this breadboard, then wrote a <a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-pwm-lookup-excerpt.c\" target=\"_blank\" rel=\"noopener\">lookup and interpolation function</a>. The records span PWM 0 to 1000 and ADC 1600 down to 480. Linear interpolation provides the output for a target between adjacent records.</p><p>The program converts the target through the lookup table into PWM, while measured ADC values are displayed and printed. I considered adding feedback correction, but kept this feedforward implementation for the demo.</p><h3>End of the Placement</h3><p>I completed this learning sequence independently in about 20 working days. The engineer watched the demo, heard my explanation of how the peripherals worked together, and said I had learned the material solidly. Alongside the practical work, I read introductory material on PID, ATP, ATO, and ATS.</p><p>Timer, ADC, and PWM returned when I later studied FOC, this time with questions about aligning sampling with switching and finishing calculations in time. The month in Tianjin gave me a starting point for investigating them. Behind a peripheral function, I had learned to look for the clocks, signals, and execution order it depended on.</p>"}, "after": {"zh": "<h2>天津津铁 STM32 嵌入式实习</h2><p class=\"summary\">在天津津铁一个月的基础实习中，我自行安排 STM32 学习顺序，从外设小实验做起，最后把传感器、显示、编码器、舵机与 LED 控制接进同一套裸机演示。</p><h3>从 Arduino 到 STM32</h3><p>2025 年 2 月，我在网上看到天津津铁通信招嵌入式实习生，投了就去了。津铁通信是天津轨道交通集团旗下的全资子公司，我每天上班进的是轨道交通集团的总部大楼，这段实习说起来还挺神奇。岗位叫嵌入式实习生，实际是一个月的基础培训。工程师甩给我一批入门资料，桌上一块 STM32F103C8T6 Blue Pill、一只 ST-Link，外加一堆外接模块。我一个实习生，也犯不着让他停下手里的活来手把手教，剩下的路得自己摸。</p><p>来之前，我只用过学校发的 Arduino Nano，做过小车和数码管计数器。Keil、ST-Link、标准外设库、中断、定时器、PWM、ADC，一样都不懂，纯小白。在我眼里，单片机就是调一个函数让引脚变高，再调一个函数让它变低。</p><p>没有课表，学习顺序是我自己排的。前面的没弄懂，后面的就看不明白，所以我结合工程师给的资料和网上的教程，定了一条路：先 GPIO，再 EXTI 和定时器，然后 PWM、UART、ADC，最后把它们接成一个综合 demo。我是奔着知其所以然去学的，想弄清楚以前 Arduino 一个函数就出来的效果，换到 STM32 上到底要经过哪些步骤。</p><h3>第一次上板</h3><p>外设还没碰，Keil 的环境先折腾了我好一阵。Keil 是个很老的软件，对小白一点都不友好。要去 ST 官网下器件支持包，再在魔术棒里一项项设置库路径、编译器、ST-Link 能不能识别、程序的起始地址。什么叫起始地址、什么叫 bootloader，我那时完全不知道，只能边查边摸索，最后环境总算配通，ST-Link 也能下载了。</p><p>我把检查拆开来做：电脑上先能编译，ST-Link 再能下载，最后看板子上有没有看得见的动作。PC13 每 300 ms 翻转一次，那盏小灯一闪，工具链和实物算是第一次接上了。</p><p><a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/stm32-basic-gpio-oled-loop.c\" target=\"_blank\" rel=\"noopener\">最初的 GPIO 与 OLED 程序</a>还留着当时的配置：先开 GPIOB、GPIOC 的时钟，用 PB4、PB5 两个引脚给 OLED 供电（小电流的面包板练习才敢这么接），再初始化屏幕、控制 PC13。也是从这里开始，光记住 <code>GPIO_SetBits()</code> 这个函数名已经不够了。我顺着它往下追时钟、引脚模式和寄存器，花了大把时间啃 ST 的手册和论坛帖子。一句置位背后，得先给外设开时钟、配好模式，引脚才会听话。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/stm32f103c8t6-pinout.png\" alt=\"STM32F103C8T6 引脚定义参考\"><figcaption>STM32F103C8T6 引脚定义参考</figcaption></figure></div><p>OLED 也出过一次怪事。代码是对的，编译能过，烧录没问题，接线查了也没错，屏幕就是死活不亮。最后换了一对普通 GPIO，改用软件模拟 I²C，屏幕亮了。那时我连硬件 I²C 和软件 I²C 有什么区别都不知道，只是纳闷它为什么不亮。现在想想，很可能是撞上了 STM32F103 硬件 I²C 卡死的老问题，展开的分析在 <a href=\"https://www.66ccff-labs.com/notes/tianjin-stm32-i2c-oled-debugging\" target=\"_blank\" rel=\"noopener\">I²C 通信与 OLED 调试</a>里。</p><h3>外设组合</h3><p>除了 OLED 这一下，整个过程总体挺顺。大部分是在例程基础上开发，编译错误不多，顶多是逻辑没捋顺，捋清楚改改代码就好了。GPIO、OLED、编码器、舵机、DHT11、光敏传感器、PWM 和 UART，我先在各自的独立工程里跑通，再一个个并进同一套裸机程序。硬件还是那块 Blue Pill，模块全靠面包板和杜邦线连着。</p><p>最后的 demo 里，所有外设同时工作。按键切换编码器的控制对象，一种模式调目标光照，另一种调舵机速度；OLED 显示实测光照、目标值、LED 输出和温湿度；UART 把光照数据和调试信息发到电脑上；PC13 那盏灯留下来当状态灯。EXTI 处理编码器，TIM3 给慢任务打节拍，TIM4 输出 PWM，温湿度和光照的读取等定时器的 flag 到了再做。</p><p>应用流程、编码器映射、模式切换和综合主循环是我写的；OLED、DHT11、编码器和舵机的驱动，是拿网上的标准驱动和 ST 例程魔改来的。那时还不知道 RTOS，全是裸机，中断加定时器轮询，延时一律是阻塞式 <code>delay()</code>，逻辑谈不上漂亮。好在这些任务的频率都很低，跑起来没毛病。</p><h3>光照标定</h3><p>想把目标光照换算成 LED 的输出，我一点一点调 PWM、读 ADC，在这套面包板上记了 16 组数据，再写了<a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/metro-pwm-lookup-excerpt.c\" target=\"_blank\" rel=\"noopener\">查表插值函数</a>。PWM 从 0 加到 1000，ADC 从 1600 降到 480，目标落在两个记录点之间，就用线性插值算输出。程序按目标查表得到 PWM，实测的 ADC 只拿来显示和打印。反馈修正我当时肯定想过，最后没做进去，demo 里留下的是这套前馈。插值怎么算、哪里该补测、加反馈该往哪个方向修，在<a href=\"https://www.66ccff-labs.com/notes/tianjin-stm32-light-calibration-control\" target=\"_blank\" rel=\"noopener\">光照标定与查表控制</a>里推了一遍。</p><h3>实习结束</h3><p>大约 20 个工作日，这条路线我一个人走完了。工程师那边是散养，没要求我做到什么程度。最后我给他演示了 demo，讲了讲我对这些外设怎么配合的理解，还有自己的一些发现，他说我学得挺扎实。</p><p>培训资料里还有 PID 和 ATP、ATO、ATS 这些轨道交通里常用的东西，我读得很仔细，只是 PID 没有真写过，也没调过。第一次读到 PID，我觉得它很神奇，一个公式就能让东西又快又稳地逼近想要的位置。那时我也会把桌上这些小练习往车上想：车厢里的照明和通风扇、进站的信号控制，背后都离不开单片机，只是会换成更稳、更可靠的方案。面包板上的这一套，算是那些系统的一个小缩影。</p><p>后来做 <a href=\"https://www.66ccff-labs.com/work/sensorless-foc-learning-route\" target=\"_blank\" rel=\"noopener\">FOC</a>，Timer、ADC、PWM 和中断我又全碰了一遍。这回采样要和开关时刻严丝合缝地对上，每一次计算都得赶在下一个周期之前算完。天津那一个月里一个个分开学的外设，到了电机控制里被绑到了一起，而且绑得更紧。</p>", "en": "<h2>Tianjin Jintie STM32 Internship</h2><p class=\"summary\">During a month of foundational training at Tianjin Jintie, I planned my own STM32 learning sequence and combined external sensors, display, encoder, servo, and LED control in a working bare-metal demo.</p><h3>From Arduino to STM32</h3><p>In February 2025 I saw an embedded-intern opening at Tianjin Jintie Communications online, applied, and went. Jintie is a wholly owned subsidiary of Tianjin Rail Transit Group, so every morning I walked into the Group's headquarters building, which still strikes me as a slightly surreal way to spend an internship. The title was embedded intern; in practice it was a month of foundational training. The engineer tossed me a batch of introductory material, and on my desk sat an STM32F103C8T6 Blue Pill, an ST-Link and a pile of external modules. An intern was hardly worth him stopping his own work to teach step by step, so the rest of the route was mine to find.</p><p>Before this, the only microcontroller I had used was the Arduino Nano the university handed out, for the car and the seven-segment counter. Keil, ST-Link, the Standard Peripheral Library, interrupts, timers, PWM, ADC: I knew none of them, a complete beginner. To me a microcontroller meant calling one function to set a pin high and another to set it low.</p><p>There was no syllabus, so I set the order myself. Later topics make no sense until the earlier ones do, so I combined the engineer's material with online tutorials and laid out a route: GPIO first, then EXTI and timers, then PWM, UART and ADC, and finally one integrated demo. I wanted to know why things worked, and in particular what an effect Arduino produced with a single function call actually took on an STM32.</p><h3>First Board Tests</h3><p>Before I touched a single peripheral, the Keil environment held me up for quite a while. Keil is an old piece of software and anything but beginner-friendly. I had to download the device pack from ST's website, then work through the Magic Wand settings one by one: library paths, compiler, whether the ST-Link was detected, the program's start address. I had no idea what a start address or a bootloader was, so I searched and fumbled my way through until the environment built and the ST-Link could download.</p><p>I split the checks apart: first the computer had to compile, then the ST-Link had to download, and finally the board had to do something visible. PC13 toggling every 300 ms was that first visible thing, and the moment the little LED blinked, the toolchain and the hardware had finally met.</p><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/stm32-basic-gpio-oled-loop.c\" target=\"_blank\" rel=\"noopener\">initial GPIO and OLED program</a> still holds that setup. It enables the GPIOB and GPIOC clocks, uses PB4 and PB5 to supply the OLED (only acceptable for a low-current breadboard exercise), initializes the display and drives PC13. This was also where remembering the name <code>GPIO_SetBits()</code> stopped being enough. I started following it down into clocks, pin modes and registers, and spent a lot of time chewing through ST's manuals and forum threads. Behind a single set-bit call, the peripheral clock has to be on and the mode configured before the pin will do as it is told.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/tianjin-metro/stm32f103c8t6-pinout.png\" alt=\"STM32F103C8T6 pinout reference\"><figcaption>STM32F103C8T6 pinout reference</figcaption></figure></div><p>The OLED had one strange episode. The code was right, it compiled, it flashed, the wiring checked out, and the screen would not light no matter what. In the end I moved to another pair of ordinary GPIO pins with software-emulated I²C, and the screen came on. At the time I did not even know what separated hardware I²C from software I²C; I was just baffled that it stayed dark. Thinking about it now, I most likely ran into the STM32F103's well-known hardware I²C lockup; the analysis is in <a href=\"https://www.66ccff-labs.com/notes/tianjin-stm32-i2c-oled-debugging\" target=\"_blank\" rel=\"noopener\">I²C Communication and OLED Debugging</a>.</p><h3>Peripheral Integration</h3><p>Apart from that, things went fairly smoothly. Most of the work built on example projects, so compile errors were rare, and the bugs were mostly logic that came straight once I traced it through. GPIO, OLED, encoder, servo, DHT11, light sensor, PWM and UART each ran first in a project of its own, and then I merged them one at a time into a single bare-metal program. The hardware stayed a Blue Pill with every module on breadboard and jumper wires.</p><p>In the final demo every peripheral worked at once. A button switched what the encoder controlled, target light in one mode and servo speed in the other. The OLED showed measured light, the target, LED output, temperature and humidity; UART sent light readings and debug output to the computer; PC13 stayed on as a status light. EXTI handled t
