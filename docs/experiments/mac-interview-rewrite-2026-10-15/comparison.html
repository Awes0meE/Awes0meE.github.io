\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">Qt 文档</a>里写了，修改可能延迟写入，<code>sync()</code> 负责同步，<code>status()</code> 可以查访问或格式错误。界面上角色已经改了，一重启又变回去，对用户来说这就是一次失败的操作。所以提示成功之前，得先把持久化有没有成功也算进去。</p><p>这些账户存在本机，信任关系也就一路延伸到操作系统账户和存储位置。要是还想管住那些能直接改本地设置文件的人，应用里的一张角色表就不够用了，数据存储和访问控制都得换一种设计。往这个方向扩展本地账户之前，这个需求得先定下来。</p><p>最想补的一组练习，是把表里允许和拒绝的情况全跑一遍，再加上取消确认、目标消失、改完重启、保住最后一个管理员这几种情况。角色管理做完整了，一次操作是谁发起的、对谁做的、最后留下什么状态，都能说得清清楚楚。窗口只是让人用上这套规则的那扇门。</p>", "en": "<h2>Local Account Permission Rules</h2><p class=\"summary\">Separating actor, target and action in Seamly2D role management, then checking state changes and persistence.</p><p>Building local accounts for Seamly2D, the part that actually made me think was one rule in role management. An administrator can promote a normal user to administrator, but an existing administrator can be demoted only by the <code>admin</code> account. For the very same target account, a change of role can turn an allowed operation into a forbidden one. A single administrator label on the current user cannot express all of that.</p><h3>Account Operation Permissions</h3><p>Deciding whether an account operation may proceed starts with the actor, then looks at the target account and the requested action, and the table follows that order. Here <code>admin</code> means the original special account, and an ordinary administrator is any other account later given the Admin role.</p><table><thead><tr><th>Actor</th><th>Target</th><th>Action</th><th>Decision</th></tr></thead><tbody><tr><td>Normal user</td><td>Other accounts</td><td>Management operation</td><td>Reject</td></tr><tr><td>Ordinary administrator</td><td>Normal user</td><td>Promote to administrator</td><td>Allow</td></tr><tr><td>Ordinary administrator</td><td>Normal user</td><td>Delete</td><td>Allow after confirmation</td></tr><tr><td>Ordinary administrator</td><td>Existing administrator</td><td>Delete or demote</td><td>Reject</td></tr><tr><td><code>admin</code></td><td>Another administrator</td><td>Demote</td><td>Allow</td></tr></tbody></table><p>Laid out like this, the table makes plain that role is just one condition among several. It also matters whether the actor is acting on themselves, whether the target still exists, and what state the operation leaves behind. <a href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener\">OWASP's authorization guidance</a> likewise frames permission as a relationship between subject, resource and action. Login settles who you are; every concrete operation still has to ask whether you may.</p><h3>Username Rules and Account Initialization</h3><p>In the project's <a href=\"https://www.66ccff-labs.com/uploads/projects/nanjing-turing/auth-role-snippet.cpp\" target=\"_blank\" rel=\"noopener\">public role-query excerpt</a>, <code>roleOf()</code> first compares the username with <code>admin</code>, ignoring case, and returns Admin on a match; for everyone else it reads the stored role from QSettings. That function can say what role an account has, but it cannot hold the whole operation table. Two accounts with exactly the same Admin enum value can still have different demotion rights.</p><p>Role queries and operation checks are therefore best kept apart. The first only reads account attributes; the second takes an authenticated actor, a freshly read target account and an action, and then decides. Username normalization needs one consistent definition as well. Treat <code>Admin</code> and <code>admin</code> as two names when creating accounts and as the same special identity when looking up roles, and the rules end up contradicting each other.</p><p>The special account also raises a question about the starting state. The project required the first user in an empty account store to be created as <code>admin</code>; once accounts exist, registration follows the normal path. Initialization, registration and management all need to recognize accounts by the same rules instead of each interpreting usernames its own way.</p><h3>Permission Checks Before Execution</h3><p>Hiding the management entry from normal users makes the interface much cleaner. When an account is actually changed, though, the executing function should still check permission itself. Menus, shortcuts and other windows may all become new callers later, and a check that lives only in whether a button is visible is easy to miss when another entry point is added.</p><p>A deletion confirmation also hides a gap in time. When the dialog opens, the target is a normal user; by the time the actor clicks confirm, its role may have changed or the account may already be gone. A safer order is to reload the account state immediately before execution, check permission, and then save the change. Cancellation, a vanished target or insufficient permission should all end the operation with account data untouched.</p><p>Deleting or demoting an administrator also needs a look at the result. If the product must always keep some management capability, removing the last usable administrator should be refused. That condition concerns the whole set of accounts, and watching only the target's current role will never catch it. Working this out from the present special-<code>admin</code> rule also lays groundwork for replacing the special username with explicit permission attributes later.</p><h3>Saving Account Data with QSettings</h3><p>QSettings makes saving settings easy, but the save itself has an outcome. <a href=\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">Qt's documentation</a> notes that changes may be written later, that <code>sync()</code> synchronizes them, and that <code>status()</code> reports access or format errors. If a role changes on screen and reverts after a restart, the user has experienced a failed operation. Before announcing success, the interface should take the persistence result into account.</p><p>These accounts live on the local machine, so the trust model reaches all the way to the operating-system account and the storage location. Restraining someone who can edit the local settings file directly would take more than an in-app role table; the data storage and access control would need a different design. That requirement has to be decided before extending local accounts in that direction.</p><p>The set of exercises I most want to finish is running every allowed and rejected row of the table, then adding cancelled confirmations, vanished targets, restarts after an edit and keeping the last administrator. When role management is complete, any operation can be explained in full: who started it, whom it acted on, and what state it left. The window is just the door through which people use those rules.</p>"}, "cb": 1304, "ca": 1288}, {"group": "Nanjing Turing", "kind": "笔记", "label": "Nanjing Turing · 笔记 · Qt 程序的 Windows 运行依赖", "route": "https://www.66ccff-labs.com/notes/turing-windows-runtime-dependencies", "before": {"zh": "<h2>Qt 程序的 Windows 运行依赖</h2><p class=\"summary\">从缺少 DLL 的报错出发，研究 Qt 程序的动态依赖、平台插件与换机验证。</p><p>在南京图灵做 Seamly2D 时，我用 <code>windeployqt</code> 收集过依赖，程序仍然提示缺少 <code>xerces-c_3_2.dll</code>。目录里已经有一大堆 DLL，再冒出来一个缺失文件，很容易让人怀疑刚才的打包是不是白做了。把程序从启动到打开纸样的过程拆开，才能理解这两件事为什么会同时发生。</p><h3>动态链接与运行依赖</h3><p>编译时，头文件告诉编译器有哪些类型和函数；链接时，导入库帮助链接器处理外部符号。采用动态链接以后，相应实现仍要在运行时从 DLL 加载。开发电脑已经装好 Qt、编译器和各种库，程序可能恰好能从这些环境里找到依赖。换到另一台电脑，之前由环境补上的部分才会暴露出来。</p><p>沿着可执行文件往下查，就能逐步找到它的运行依赖。它直接依赖一个库，这个库又可能依赖其他库；有些组件则要等到运行中的某个功能被调用才加载。只看文件夹里有没有同名 DLL 还不够，需要继续检查架构、版本以及它实际从哪里被加载。</p><p>以这次使用的 MSVC x64 构建为例，x86 DLL 不能直接装进 x64 进程。至于 MSVC 的版本，情况比目录名复杂。<a href=\"https://learn.microsoft.com/en-us/cpp/porting/binary-compat-2015-2017?view=msvc-170\" target=\"_blank\" rel=\"noopener\">微软的二进制兼容说明</a>允许特定版本之间兼容，同时约束链接工具、运行库版本及部分编译选项。因此，遇到两个工具集名称不同，我会先核对具体组合，不再直接判定它们无法配合。</p><h3>Qt 插件</h3><p>Qt 的平台插件负责与窗口系统交互。在 Windows 上，部署目录通常需要 <code>platforms/qwindows.dll</code>。它是 DLL，却有自己的发现和加载过程，随手把它扔到可执行文件旁边，未必放对了位置。<a href=\"https://doc.qt.io/qt-6.5/deployment-plugins.html\" target=\"_blank\" rel=\"noopener\">Qt 插件部署说明</a>还列出了插件和 Qt 库之间的版本、构建模式要求，并提供 <code>QT_DEBUG_PLUGINS</code> 诊断开关。</p><p>因此，看到平台插件报错，我会先区分插件没有被找到，还是已经找到但加载失败。后一种情况可能是插件依赖的另一个库缺失，也可能是版本或构建模式不合适。两种问题的报错都可能提到同一个插件名称，修法却不一样。调试输出中的搜索路径和加载失败原因，比继续往目录里堆 DLL 更有用。</p><p>这个排查和嵌入式里读接口状态有点像。找到连接器，只回答了连接器在哪里；通信是否真的建立，还要继续沿链路检查。这里要追的是文件加载关系。</p><h3>第三方依赖</h3><p><code>xerces-c_3_2.dll</code> 属于 XML 解析库。<a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Qt 的 Windows 部署文档</a>明确说明，<code>windeployqt</code> 负责收集 Qt 相关依赖，额外的第三方库仍需另外处理。我的部署目录里有 Qt 库，同时还缺 Xerces，这两种状态完全可以共存。</p><p>排查时，可以先用微软的 <a href=\"https://learn.microsoft.com/en-us/cpp/build/reference/dumpbin-reference?view=msvc-170\" target=\"_blank\" rel=\"noopener\">DUMPBIN</a> 检查二进制文件。<code>/DEPENDENTS</code> 查看导入依赖，<code>/HEADERS</code> 查看架构信息。它们适合顺着静态导入关系往下找；运行中通过插件或显式加载函数引入的文件，还需要结合实际启动和功能操作来查。</p><p>重新整理部署包时，可以把修复后的程序放进一个新目录，再从这次构建对应的 Qt 安装和已知来源补齐依赖。随后在没有 Qt 和 Visual Studio 的环境里测试，避免开发工具的搜索路径继续掩盖问题。具体构建与安装步骤仍放在<a href=\"https://www.66ccff-labs.com/notes/turing-release-packaging-cross-platform\" target=\"_blank\" rel=\"noopener\">原始打包记录</a>，这一步更关心程序究竟借用了哪些外部文件。</p><h3>换机部署测试</h3><p>实习结束后，我在家里新装的 Windows 台式机上运行过安装包，注册、登录和角色操作都能使用。沿着依赖问题继续设计检查，我还会加入打开 <code>.sm2d</code> 纸样及关联 <code>.smis</code> 量体文件、保存后重新打开等动作。窗口能出现以后，XML 解析与文件访问才真正有机会被用到。</p><table><thead><tr><th>操作</th><th>重点观察</th></tr></thead><tbody><tr><td>从安装目录启动</td><td>Qt 库、平台插件与运行库是否能被加载</td></tr><tr><td>注册后退出，再重新登录</td><td>账户状态能否在新的进程中恢复</td></tr><tr><td>打开纸样和量体文件</td><td>XML 解析、关联文件路径是否正常</td></tr><tr><td>保存并重新打开</td><td>写入路径和数据读取能否衔接</td></tr><tr><td>用同一安装包换机</td><td>结果是否依赖开发电脑上的环境</td></tr></tbody></table><p>这样检查下来，打包的完成标准也更具体了。交给别人的是一套能够独立找到依赖、打开实际文件并保存结果的程序。每多验证一个真实使用动作，就少留一个等用户碰到才发现的缺口。</p>", "en": "<h2>Qt Windows Runtime Dependencies</h2><p class=\"summary\">Tracing a packaged Qt application through DLL loading, platform plugins and a clean-machine check.</p><p>During the Seamly2D internship in Nanjing, I collected dependencies with <code>windeployqt</code> and still got an error about <code>xerces-c_3_2.dll</code>. With a directory already full of DLLs, another missing file made the deployment step feel rather pointless. Following the application from startup to opening a pattern helps explain how a successful deployment-tool run and a missing dependency can coexist.</p><h3>Dynamic Linking and Runtime Dependencies</h3><p>Headers describe types and functions to the compiler. Import libraries then help the linker resolve external symbols. With dynamic linking, the implementations still have to be loaded from DLLs at runtime. A development PC already has Qt, a compiler and assorted libraries installed, so its environment may supply files that the application package lacks. Moving the program elsewhere exposes that hidden assistance.</p><p>The executable provides a starting point for tracing runtime dependencies. A library it imports may need further libraries, while other components are loaded only when a particular feature runs. A matching filename in the folder is therefore just the beginning. Architecture, version and the actual load location also matter.</p><p>The internship build used MSVC x64, which cannot load an x86 DLL directly into its process. MSVC version compatibility takes a closer reading. <a href=\"https://learn.microsoft.com/en-us/cpp/porting/binary-compat-2015-2017?view=msvc-170\" target=\"_blank\" rel=\"noopener\">Microsoft documents compatibility across certain toolset versions</a>, with conditions on the linker, runtime version and some compilation options. Different toolset names prompt me to check the combination, rather than immediately reject it.</p><h3>Qt Plugins</h3><p>On Windows, Qt normally needs <code>platforms/qwindows.dll</code> to interact with the window system. Although it is a DLL, the platform plugin has its own discovery and loading process; dropping it beside the executable may put it in the wrong place. <a href=\"https://doc.qt.io/qt-6.5/deployment-plugins.html\" target=\"_blank\" rel=\"noopener\">Qt's plugin deployment guide</a> also explains version and build-mode compatibility, and provides the <code>QT_DEBUG_PLUGINS</code> diagnostic switch.</p><p>A platform-plugin error can describe two different stages of failure: discovery never found the file, or loading failed after finding it. The latter may involve another missing library required by the plugin, or an incompatible version or build mode. Both errors can name the same plugin. The search paths and failure reason in the diagnostic output are more useful than adding yet more DLLs to the folder.</p><p>There is a familiar hardware habit here. Finding the connector tells me where it is; establishing communication requires following the rest of the interface. For deployment, the connections I am tracing are between loaded files.</p><h3>Third-Party Libraries</h3><p>Xerces supplies XML parsing through <code>xerces-c_3_2.dll</code>. The <a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Qt Windows deployment guide</a> explicitly leaves additional third-party libraries outside <code>windeployqt</code>'s collection of Qt dependencies. My folder could contain the required Qt libraries and still be missing Xerces.</p><p><a href=\"https://learn.microsoft.com/en-us/cpp/build/reference/dumpbin-reference?view=msvc-170\" target=\"_blank\" rel=\"noopener\">Microsoft's DUMPBIN</a> provides a starting point for inspecting the binaries. <code>/DEPENDENTS</code> lists imports, and <code>/HEADERS</code> exposes architecture information. These help follow static import relationships. Files introduced through plugins or explicit runtime loading still need investigation while the application starts and its features run.</p><p>A corrected package can be assembled in a fresh deployment directory, with dependencies drawn from the Qt installation used for that build and other known sources. Testing without Qt or Visual Studio then removes the development tools' search paths from the equation. The <a href=\"https://www.66ccff-labs.com/notes/turing-release-packaging-cross-platform\" target=\"_blank\" rel=\"noopener\">original packaging record</a> retains the build and installation procedure; the question here is which external files the application actually uses.</p><h3>Deployment Testing on Another Computer</h3><p>After the internship, I ran the installer on a newly installed Windows desktop at home and used registration, login and role management successfully. To extend that check around dependencies, I would add opening an <code>.sm2d</code> pattern with its associated <code>.smis</code> measurements, saving it and reopening it. Those actions exercise XML parsing and file access after the initial window has appeared.</p><table><thead><tr><th>Action</th><th>What to observe</th></tr></thead><tbody><tr><td>Launch from the installation directory</td><td>Loading of Qt libraries, the platform plugin and runtime</td></tr><tr><td>Register, exit and log in again</td><td>Account-state recovery in a new process</td></tr><tr><td>Open a pattern and measurement file</td><td>XML parsing and associated file paths</td></tr><tr><td>Save and reopen</td><td>The connection between writing and reading data</td></tr><tr><td>Use the same installer on another machine</td><td>Dependence on the development environment</td></tr></tbody></table><p>That gives me a concrete completion criterion for packaging: someone else can run a program that finds its own dependencies, opens real files and saves the result. Each actual use case checked before handoff removes one more gap that a user would otherwise discover for me.</p>"}, "after": {"zh": "<h2>Qt 程序的 Windows 运行依赖</h2><p class=\"summary\">从缺少 DLL 的报错出发，研究 Qt 程序的动态依赖、平台插件与换机验证。</p><p>在南京图灵做 Seamly2D 时，<code>windeployqt</code> 收集完依赖，程序一启动还是报缺 <code>xerces-c_3_2.dll</code>。目录里已经铺了一大片 DLL，又冒出来一个缺的，难免让人怀疑刚才那一通打包是不是白干了。把程序从启动到打开纸样的过程拆开看，就能明白这两件事为什么能同时发生。</p><h3>动态链接与运行依赖</h3><p>编译时，头文件告诉编译器有哪些类型和函数；链接时，导入库帮链接器处理外部符号。用了动态链接，这些实现到运行时还得从 DLL 里加载。开发电脑上 Qt、编译器、各种库都装好了，程序很可能顺手就从这些环境里找到了依赖。一换电脑，之前被环境悄悄补上的那部分才露出来。</p><p>顺着可执行文件往下查，运行依赖能一层层找出来。它直接依赖一个库，那个库又可能依赖别的库；还有些组件要等某个功能真被调用了才加载。所以光看文件夹里有没有同名 DLL 不够，还得查架构、版本，以及它实际是从哪儿被加载的。</p><p>拿这次的 MSVC x64 构建来说，x86 的 DLL 是装不进 x64 进程的。MSVC 的版本就比目录名复杂了。<a href=\"https://learn.microsoft.com/en-us/cpp/porting/binary-compat-2015-2017?view=msvc-170\" target=\"_blank\" rel=\"noopener\">微软的二进制兼容说明</a>允许特定版本之间兼容，同时对链接工具、运行库版本和部分编译选项有约束。所以看到两个工具集名字不一样，先核对具体组合，别急着判死刑。</p><h3>Qt 插件</h3><p>Qt 靠平台插件和窗口系统打交道，在 Windows 上，部署目录里通常要有 <code>platforms/qwindows.dll</code>。它虽然也是 DLL，却有自己的一套发现和加载流程，随手扔到可执行文件旁边，未必放对了地方。<a href=\"https://doc.qt.io/qt-6.5/deployment-plugins.html\" target=\"_blank\" rel=\"noopener\">Qt 插件部署说明</a>还列了插件和 Qt 库之间的版本、构建模式要求，并给了 <code>QT_DEBUG_PLUGINS</code> 这个诊断开关。</p><p>所以碰到平台插件报错，先分清是插件压根没找到，还是找到了却加载失败。后一种可能是插件自己依赖的另一个库缺了，也可能是版本或构建模式对不上。两种情况的报错都可能提到同一个插件名，修法却完全不同。调试输出里的搜索路径和失败原因，比往目录里接着堆 DLL 有用得多。</p><p>这跟嵌入式里查接口有点像。找到连接器，只知道连接器在哪儿；通信到底通没通，还得顺着链路往下查。只不过这里要追的，是文件之间谁加载谁。</p><h3>第三方依赖</h3><p><code>xerces-c_3_2.dll</code> 是 XML 解析库。<a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Qt 的 Windows 部署文档</a>写得很明白，<code>windeployqt</code> 只负责收集 Qt 相关的依赖，额外的第三方库得自己处理。所以部署目录里 Qt 的库一个不少、Xerces 却缺着，这两件事完全可以同时成立。</p><p>排查时可以先拿微软的 <a href=\"https://learn.microsoft.com/en-us/cpp/build/reference/dumpbin-reference?view=msvc-170\" target=\"_blank\" rel=\"noopener\">DUMPBIN</a> 看二进制文件，<code>/DEPENDENTS</code> 查导入依赖，<code>/HEADERS</code> 查架构信息。它适合顺着静态导入关系往下找；运行中通过插件或显式加载才引入的文件，还得结合实际启动和功能操作来查。</p><p>重新整理部署包时，可以把修好的程序放进一个全新的目录，再从这次构建对应的 Qt 安装和已知来源把依赖补齐，然后拿到没有 Qt 和 Visual Studio 的环境里测，免得开发工具的搜索路径继续替它打掩护。具体的构建和安装步骤在<a href=\"https://www.66ccff-labs.com/notes/turing-release-packaging-cross-platform\" target=\"_blank\" rel=\"noopener\">原始打包记录</a>里，这里更关心的是程序到底借用了哪些外部文件。</p><h3>换机部署测试</h3><p>实习结束后，我在家里新装的 Windows 台式机上跑过安装包，注册、登录和角色操作都能用。顺着依赖这条线，检查还能再往前推一步：打开 <code>.sm2d</code> 纸样和它关联的 <code>.smis</code> 量体文件，保存，再重新打开。窗口出来以后，XML 解析和文件读写才真正派上用场。</p><table><thead><tr><th>操作</th><th>重点观察</th></tr></thead><tbody><tr><td>从安装目录启动</td><td>Qt 库、平台插件与运行库是否能被加载</td></tr><tr><td>注册后退出，再重新登录</td><td>账户状态能否在新的进程中恢复</td></tr><tr><td>打开纸样和量体文件</td><td>XML 解析、关联文件路径是否正常</td></tr><tr><td>保存并重新打开</td><td>写入路径和数据读取能否衔接</td></tr><tr><td>用同一安装包换机</td><td>结果是否依赖开发电脑上的环境</td></tr></tbody></table><p>这么一套查下来，打包的完成标准也具体了。交到别人手里的，得是一套自己能找到依赖、能打开真实文件、能把结果存下来的程序。交接前多验一个真实的使用动作，就少留一个要等用户撞上才发现的坑。</p>", "en": "<h2>Qt Windows Runtime Dependencies</h2><p class=\"summary\">Tracing a packaged Qt application through DLL loading, platform plugins and a clean-machine check.</p><p>Working on Seamly2D at Nanjing Turing, I ran <code>windeployqt</code> to collect the dependencies, and the program still started up complaining about a missing <code>xerces-c_3_2.dll</code>. With a folder already carpeted in DLLs, one more missing file made me wonder whether all that packaging had been for nothing. Taking the program apart from startup to opening a pattern explains how both can be true at once.</p><h3>Dynamic Linking and Runtime Dependencies</h3><p>At compile time, headers tell the compiler which types and functions exist; at link time, import libraries help the linker resolve external symbols. With dynamic linking, the implementations still have to be loaded from DLLs at runtime. A development PC already has Qt, a compiler and all sorts of libraries installed, so the program may quietly find its dependencies in that environment. Only on another computer does the part the environment had been silently supplying come to light.</p><p>Tracing down from the executable uncovers the runtime dependencies layer by layer. It depends directly on one library, which may in turn depend on others, and some components load only once a particular feature is actually called. A same-named DLL in the folder is therefore not enough; architecture, version and where it is really loaded from all need checking.</p><p>Take this MSVC x64 build: an x86 DLL simply cannot be loaded into an x64 process. MSVC versions are more involved than their folder names suggest. <a href=\"https://learn.microsoft.com/en-us/cpp/porting/binary-compat-2015-2017?view=msvc-170\" target=\"_blank\" rel=\"noopener\">Microsoft's binary compatibility notes</a> allow compatibility between certain versions, with constraints on the linker, runtime version and some compiler options. Two different toolset names call for checking the exact combination before writing it off.</p><h3>Qt Plugins</h3><p>Qt talks to the window system through a platform plugin, and on Windows the deployment folder usually needs <code>platforms/qwindows.dll</code>. It is a DLL, yet it has its own discovery and loading process, and dropping it next to the executable may not put it in the right place. <a href=\"https://doc.qt.io/qt-6.5/deployment-plugins.html\" target=\"_blank\" rel=\"noopener\">Qt's plugin deployment guide</a> also lists the version and build-mode requirements between plugins and Qt libraries, and provides the <code>QT_DEBUG_PLUGINS</code> diagnostic switch.</p><p>So a platform-plugin error first needs sorting into one of two cases: the plugin was never found, or it was found and failed to load. The second may come from another library the plugin itself needs, or from a mismatched version or build mode. Both can produce errors naming the same plugin, and they are fixed in completely different ways. The search paths and failure reasons in the diagnostic output help far more than piling still more DLLs into the folder.</p><p>It resembles checking an interface in embedded work. Finding the connector only tells you where the connector is; whether communication actually works means following the link further. Here, what has to be followed is which file loads which.</p><h3>Third-Party Libraries</h3><p><code>xerces-c_3_2.dll</code> is an XML parsing library. <a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Qt's Windows deployment guide</a> is explicit that <code>windeployqt</code> gathers Qt's own dependencies and leaves additional third-party libraries to the developer. A deployment folder with every Qt library present and Xerces missing is therefore entirely possible.</p><p>Microsoft's <a href=\"https://learn.microsoft.com/en-us/cpp/build/reference/dumpbin-reference?view=msvc-170\" target=\"_blank\" rel=\"noopener\">DUMPBIN</a> is a good first tool for inspecting the binaries: <code>/DEPENDENTS</code> lists imports and <code>/HEADERS</code> shows architecture. It suits following static import relationships downward; files brought in at runtime through plugins or explicit loading still have to be found by actually starting the program and using its features.</p><p>A corrected package can be assembled in a brand-new folder, with dependencies filled in from the Qt installation matching this build and other known sources, then tested in an environment without Qt or Visual Studio so the development tools' search paths stop covering for it. The step-by-step build and installation live in the <a href=\"https://www.66ccff-labs.com/notes/turing-release-packaging-cross-platform\" target=\"_blank\" rel=\"noopener\">original packaging record</a>; the concern here is which outside files the program really borrows.</p><h3>Deployment Testing on Another Computer</h3><p>After the internship I ran the installer on a freshly installed Windows desktop at home, and registration, login and role operations all worked. Following the dependency thread, the check can go one step further: open an <code>.sm2d</code> pattern with its associated <code>.smis</code> measurements, save it and open it again. Only once the window is up do XML parsing and file access actually get exercised.</p><table><thead><tr><th>Action</th><th>What to observe</th></tr></thead><tbody><tr><td>Launch from the installation directory</td><td>Loading of Qt libraries, the platform plugin and runtime</td></tr><tr><td>Register, exit and log in again</td><td>Account-state recovery in a new process</td></tr><tr><td>Open a pattern and measurement file</td><td>XML parsing and associated file paths</td></tr><tr><td>Save and reopen</td><td>The connection between writing and reading data</td></tr><tr><td>Use the same installer on another machine</td><td>Dependence on the development environment</td></tr></tbody></table><p>Checked this way, the finish line for packaging becomes concrete. What goes to someone else has to be a program that finds its own dependencies, opens real files and saves its results. Every real use case verified before handoff is one less hole left for a user to fall into.</p>"}, "cb": 1233, "ca": 1221}, {"group": "Claude Chime", "kind": "笔记", "label": "Claude Chime · 笔记 · 电池采样开关与 ADC 建立时间", "route": "https://www.66ccff-labs.com/notes/claude-chime-switched-adc-divider", "before": {"zh": "<h2>电池采样开关与 ADC 建立时间</h2><p class=\"summary\">从 Claude Chime 的受控分压电路出发，计算建立时间、采样耗电与电压换算误差。</p><p>我给 Claude Chime 写的<a href=\"https://www.66ccff-labs.com/uploads/projects/claude-chime-hardware/software-handoff.md\" target=\"_blank\" rel=\"noopener\">软件交接文档</a>里，电池采样顺序是拉高 <code>ADC_ENABLE</code>，等待 5 到 10 ms，多次读取，再关闭采样支路。分压公式只有一个系数，为什么还要等？答案要从 ADC 引脚旁边那颗电容说起。</p><h3>分压与开关</h3><p>在<a href=\"https://www.66ccff-labs.com/uploads/projects/claude-chime-hardware/power-board-schematic.png\" target=\"_blank\" rel=\"noopener\">原理图</a>中，电池通过 AO3401 高侧开关给分压支路供电，15 kΩ 与 22 kΩ 电阻负责分压。<code>ADC_ENABLE</code> 拉高以后，2N7002 导通，把 AO3401 的栅极拉低，分压支路才接通。分压节点经过 1 kΩ 电阻接到 <code>ADC_BAT</code>，ADC 侧还有一颗 100 nF 对地电容。</p><p>在稳定状态下，先忽略开关导通电阻和 ADC 输入电流，分压输出为 <code>VADC = VBAT × 22 / 37</code>，反算系数为 <code>37 / 22 ≈ 1.682</code>。电池电压取 4.2 V 时，ADC 节点的目标电压约为 2.497 V。但刚接通的瞬间，100 nF 电容需要充电，电压要经过一段时间才接近这个目标。</p><h3>RC 电路的建立时间</h3><p>计算前级电路的戴维南电阻时，先在电路模型中把理想电压源置零。15 kΩ 与 22 kΩ 因而并联，再与 1 kΩ 串联，得到约 9.919 kΩ 的等效电阻。配上 100 nF，时间常数约为 0.992 ms。假设电容从 0 V 开始充电，一阶模型中的剩余误差比例为 <code>exp(-t/τ)</code>。</p><table><thead><tr><th>等待时间</th><th>剩余误差比例</th><th>换算到 4.2 V 电池端的误差幅值</th></tr></thead><tbody><tr><td>1 ms</td><td>约 36.5%</td><td>约 1.53 V</td></tr><tr><td>5 ms</td><td>约 0.647%</td><td>约 27.2 mV</td></tr><tr><td>10 ms</td><td>约 0.00419%</td><td>约 0.176 mV</td></tr></tbody></table><p>这张表是理想 RC 计算，只讨论从零建立时的误差。它说明 5 ms 和 10 ms 虽然只差几毫秒，建立程度已经差了很多。接通以后立刻连续读 32 次，再把它们平均，也可能只是在平均一段仍然上升的电压。</p><p>如果单独把 RC 建立误差目标设为 0.1%，则需要约 <code>6.91τ</code>，也就是 6.85 ms。实际等待还要考虑电阻电容容差、MOS 开通过程、ADC 采样负载和测量要求。交接时给出的 5 到 10 ms 因而可以继续用示波器与实际 ADC 读数核对，再选择合适的时长。</p><h3>采样电路的电流消耗</h3><p>4.2 V 下，37 kΩ 分压支路的静态电流约为 113.5 μA，持续接通一天约消耗 2.72 mAh。开关让它只在测量窗口内工作，例如每秒接通 10 ms，单算分压电阻的平均电流就约为 1.14 μA。</p><p>不过，这还没算完整。AO3401 的栅极通过 10 kΩ 上拉，2N7002 导通时，这条上拉与串联 1 kΩ 也形成电流路径。在理想导通近似下，4.2 V 对应约 382 μA，比分压支路本身还大。电容每次充电、GPIO 驱动及关断漏电也各有消耗。评估整套采样电路时，要把这些支路一起算，不能只用分压电阻的电流宣称总功耗。</p><p>连续采样的耗时同样属于接通窗口。如果等待 10 ms 后又花时间完成多次转换，实际占空比就高于 1%。这样算完，我更容易决定采样频率该多高，以及为了多读几次付出了多少电量。</p><h3>ADC 换算</h3><p>ESP32-S3 的 ADC 还涉及衰减设置和校准。<a href=\"https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-reference/peripherals/adc/adc_calibration.html\" target=\"_blank\" rel=\"noopener\">Espressif 的校准文档</a>提供原始码到电压的校准接口，也讨论了输入电容和多次采样对噪声的改善。软件应先得到符合当前 ADC 配置的输入电压，再乘分压系数，不能把所有配置都套进一个固定满量程公式。</p><p>误差也要分开处理。平均可以降低部分随机噪声，持续偏低的 RC 建立误差却不会自动消失；分压比偏差与 ADC 换算偏差也可能叠加。用几个稳定电压点对照万用表，分别检查低端、中间与接近满电的位置，会比只校准一个点更容易发现差异。</p><p>这块板在我的桌上做过手动使能后的模拟电压检查，ESP32 的实际读取由客户固件负责。沿电路继续计算以后，我更清楚交接时为什么要同时写出控制顺序与换算关系。一次电池读数要经历开关接通、电压建立、ADC 采样和校准换算，等这些动作配合好了，屏幕上的电压才值得用来判断下一步操作。</p>", "en": "<h2>A Switched Battery Divider and ADC Settling</h2><p class=\"summary\">Calculating the settling, current consumption and error sources of the Claude Chime battery-voltage divider.</p><p>My Claude Chime <a href=\"https://www.66ccff-labs.com/uploads/projects/claude-chime-hardware/software-handoff.md\" target=\"_blank\" rel=\"noopener\">software handoff</a> recommends enabling <code>ADC_ENABLE</code>, waiting 5 to 10 ms, taking several readings and then disabling the divider. The voltage conversion uses just one ratio, so why the wait? The capacitor next to the ADC input supplies the explanation.</p><h3>Divider and Switch</h3><p>In the <a href=\"https://www.66ccff-labs.com/uploads/projects/claude-chime-hardware/power-board-schematic.png\" target=\"_blank\" rel=\"noopener\">schematic</a>, an AO3401 high-side switch connects the battery to a divider formed by 15 kΩ and 22 kΩ resistors. Driving <code>ADC_ENABLE</code> high turns on a 2N7002, which pulls the AO3401 gate low and enables the branch. A further 1 kΩ resistor connects the divider midpoint to <code>ADC_BAT</code>, where a 100 nF capacitor goes to ground.</p><p>Ignoring switch resistance and ADC input current, the settled output is <code>VADC = VBAT × 22 / 37</code>, giving the inverse ratio <code>37 / 22 ≈ 1.682</code>. A 4.2 V battery therefore produces a target of about 2.497 V at the ADC node. At enable time, however, the 100 nF capacitor has to charge before that voltage is reached.</p><h3>RC Settling Time</h3><p>To calculate the resistance seen by the capacitor, I set the ideal voltage source to zero in the circuit model. The 15 kΩ and 22 kΩ resistors are then in parallel, followed by 1 kΩ in series. The resulting Thevenin resistance is about 9.919 kΩ. With 100 nF, the time constant is approximately 0.992 ms. For a capacitor starting at 0 V, the first-order remaining-error fraction is <code>exp(-t/τ)</code>.</p><table><thead><tr><th>Wait</th><th>Remaining error</th><th>Equivalent error magnitude at a 4.2 V battery</th></tr></thead><tbody><tr><td>1 ms</td><td>About 36.5%</td><td>About 1.53 V</td></tr><tr><td>5 ms</td><td>About 0.647%</td><td>About 27.2 mV</td></tr><tr><td>10 ms</td><td>About 0.00419%</td><td>About 0.176 mV</td></tr></tbody></table><p>These are ideal RC calculations for settling from zero. A few milliseconds between 5 and 10 ms make a considerable difference. Immediately taking 32 samples and averaging them could simply average a voltage that is still rising.</p><p>Setting an isolated RC settling target of 0.1% requires approximately <code>6.91τ</code>, or 6.85 ms. Component tolerances, MOS turn-on, ADC sampling load and the required measurement accuracy also affect the chosen wait. The handoff's 5 to 10 ms recommendation can therefore be checked against the node waveform and actual ADC readings before selecting a duration.</p><h3>Sampling-Circuit Current Consumption</h3><p>At 4.2 V, the 37 kΩ divider draws about 113.5 μA, or 2.72 mAh over a full day if continuously connected. Switching it on for an illustrative 10 ms each second reduces the average current in the divider resistors alone to about 1.14 μA.</p><p>There are other paths to count. The AO3401 gate has a 10 kΩ pull-up. When the 2N7002 conducts, that pull-up and the series 1 kΩ form another path drawing approximately 382 μA at 4.2 V under an ideal on-state approximation. That exceeds the divider current itself. Capacitor recharging, GPIO drive and off-state leakage add further consumption. The divider-resistor calculation is therefore only part of the complete sensing circuit's power budget.</p><p>Conversion time also extends the enabled window. Waiting 10 ms and then spending additional time taking samples produces a duty above 1% when repeated every second. Including that time makes it easier to choose a sampling rate and judge the energy cost of additional readings.</p><h3>ADC Conversion</h3><p>ESP32-S3 conversion also involves attenuation and calibration. <a href=\"https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-reference/peripherals/adc/adc_calibration.html\" target=\"_blank\" rel=\"noopener\">Espressif's calibration documentation</a> provides raw-code-to-voltage conversion and discusses input capacitance and multisampling for noise reduction. Software should first obtain an input voltage appropriate to the ADC configuration, then apply the divider ratio. A single fixed full-scale formula does not fit every configuration.</p><p>The error sources need separate treatment. Averaging can reduce some random noise, but cannot automatically remove the consistently low reading caused by incomplete settling. Divider-ratio and ADC-conversion errors can combine as well. Comparing several stable voltages against a meter at low, intermediate and near-full-battery levels reveals more than correcting one point alone.</p><p>I checked the analog voltage on my bench after manually enabling this circuit; the client's firmware handled the ESP32 readings. Working through the circuit explains why the handoff needed both a control sequence and a conversion ratio. Enabling the switch, allowing settling, acquiring samples and calibrating them all contribute to a battery reading that can usefully guide the next operation.</p>"}, "after": {"zh": "<h2>电池采样开关与 ADC 建立时间</h2><p class=\"summary\">从 Claude Chime 的受控分压电路出发，计算建立时间、采样耗电与电压换算误差。</p><p>给 Claude Chime 写<a href=\"https://www.66ccff-labs.com/uploads/projects/claude-chime-hardware/software-handoff.md\" target=\"_blank\" rel=\"noopener\">软件交接文档</a>时，电池采样那段我写的顺序是：拉高 <code>ADC_ENABLE</code>，等 5 到 10 ms，多读几次，再把采样支路关掉。分压公式就一个系数，为什么还非得等？答案在 ADC 引脚旁边那颗电容身上。</p><h3>分压与开关</h3><p><a href=\"https://www.66ccff-labs.com/uploads/projects/claude-chime-hardware/power-board-schematic.png\" target=\"_blank\" rel=\"noopener\">原理图</a>里，电池经过 AO3401 高侧开关给分压支路供电，15 kΩ 和 22 kΩ 负责分压。<code>ADC_ENABLE</code> 一拉高，2N7002 导通，把 AO3401 的栅极拉低，这条支路才接上。分压节点再经过一颗 1 kΩ 电阻接到 <code>ADC_BAT</code>，ADC 这一侧还挂着一颗 100 nF 的对地电容。</p><p>先不管开关的导通电阻和 ADC 的输入电流，稳定以后分压输出是 <code>VADC = VBAT × 22 / 37</code>，反算时乘上 <code>37 / 22 ≈ 1.682</code>。电池 4.2 V 时，ADC 节点的目标电压约 2.497 V。可支路刚接通那一下，100 nF 电容得先充电，电压要过一阵才能爬到这个目标。</p><h3>RC 电路的建立时间</h3><p>算电容看到的等效电阻，先在电路模型里把理想电压源置零。15 kΩ 和 22 kΩ 于是并联，再串上 1 kΩ，戴维南等效电阻约 9.919 kΩ。配上 100 nF，时间常数约 0.992 ms。电容从 0 V 开始充，一阶模型里剩下的误差比例就是 <code>exp(-t/τ)</code>。</p><table><thead><tr><th>等待时间</th><th>剩余误差比例</th><th>换算到 4.2 V 电池端的误差幅值</th></tr></thead><tbody><tr><td>1 ms</td><td>约 36.5%</td><td>约 1.53 V</td></tr><tr><td>5 ms</td><td>约 0.647%</td><td>约 27.2 mV</td></tr><tr><td>10 ms</td><td>约 0.00419%</td><td>约 0.176 mV</td></tr></tbody></table><p>这是理想 RC 计算，只算从零开始建立的误差。5 ms 和 10 ms 只差几毫秒，建立程度却差得很远。接通以后马上连读 32 次再取平均，平均的很可能是一段还在往上爬的电压。</p><p>单独把 RC 建立误差定在 0.1%，大约要 <code>6.91τ</code>，也就是 6.85 ms。实际等多久，还得算上阻容容差、MOS 的开通过程、ADC 采样带来的负载和测量精度要求。交接里写的 5 到 10 ms，可以再拿示波器看节点波形、对着实际的 ADC 读数核一核，再定下具体时长。</p><h3>采样电路的电流消耗</h3><p>4.2 V 下，37 kΩ 的分压支路要是一直接着，电流约 113.5 μA，一天下来约 2.72 mAh。加了开关以后，它只在测量窗口里工作，比如每秒接通 10 ms，光算分压电阻，平均电流就降到约 1.14 μA。</p><p>不过账还没算完。AO3401 的栅极挂着 10 kΩ 上拉，2N7002 一导通，这颗上拉加上串联的 1 kΩ 又是一条电流路径。按理想导通近似，4.2 V 下约 382 μA，比分压支路本身还大。电容每次充电、GPIO 驱动、关断时的漏电也各有一份。整套采样电路的功耗，得把这些支路一起算进去，光拿分压电阻的电流说事是不够的。</p><p>多次转换花的时间也算在接通窗口里。等 10 ms 以后再花时间做好几次转换，实际占空比就不止 1%。这样算清楚，采样频率定多高、为了多读几次付出多少电量，心里就有数了。</p><h3>ADC 换算</h3><p>ESP32-S3 的 ADC 还牵涉衰减设置和校准。<a href=\"https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-reference/peripherals/adc/adc_calibration.html\" target=\"_blank\" rel=\"noopener\">Espressif 的校准文档</a>提供了原始码到电压的校准接口，也讲了输入电容和多次采样对降噪的作用。软件应该先按当前 ADC 配置拿到输入电压，再乘分压系数，不能拿一个固定的满量程公式套所有配置。</p><p>误差也得分开看。平均能压掉一部分随机噪声，RC 没建立完带来的持续偏低却不会自己消失；分压比的偏差和 ADC 换算的偏差还可能叠在一起。拿几个稳定的电压点对着万用表，低端、中间、接近满电各查一处，比只校一个点更容易看出问题。</p><p>测这块板时，我手边没有 ESP32 核心板，能做的就是手动拉高 <code>ADC_ENABLE</code>，量分压节点，到这一步电压和计算是对得上的；后面的数字读数交给客户固件，电量读取正常也是对方反馈回来的。把这条支路从头到尾算一遍，交接时为什么要把控制顺序和换算关系一起写下来，就很清楚了。开关接通、电压建立、ADC 采样、校准换算，几步配合好，读出来的电量才值得拿来决定螃蟹下一下还跳不跳。</p>", "en": "<h2>A Switched Battery Divider and ADC Settling</h2><p class=\"summary\">Calculating the settling, current consumption and error sources of the Claude Chime battery-voltage divider.</p><p>In the <a href=\"https://www.66ccff-labs.com/uploads/projects/claude-chime-hardware/software-handoff.md\" target=\"_blank\" rel=\"noopener\">software handoff</a> I wrote for Claude Chime, the battery-sampling sequence is to drive <code>ADC_ENABLE</code> high, wait 5 to 10 ms, take several readings and then switch the divider off. The conversion uses a single ratio, so why insist on waiting? The answer sits with the capacitor beside the ADC pin.</p><h3>Divider and Switch</h3><p>In the <a href=\"https://www.66ccff-labs.com/uploads/projects/claude-chime-hardware/power-board-schematic.png\" target=\"_blank\" rel=\"noopener\">schematic</a>, the battery feeds the divider through an AO3401 high-side switch, with 15 kΩ and 22 kΩ doing the dividing. Once <code>ADC_ENABLE</code> goes high, a 2N7002 turns on and pulls the AO3401 gate low, and only then is the branch connected. The divider midpoint reaches <code>ADC_BAT</code> through a further 1 kΩ resistor, and a 100 nF capacitor hangs from the ADC side to ground.</p><p>Setting aside the switch's on-resistance and the ADC input current, the settled output is <code>VADC = VBAT × 22 / 37</code>, so the reading is scaled back up by <code>37 / 22 ≈ 1.682</code>. A 4.2 V battery puts the ADC node's target at about 2.497 V. At the instant the branch connects, though, the 100 nF capacitor has to charge first, and the voltage takes a while to climb to that target.</p><h3>RC Settling Time</h3><p>To find the resistance the capacitor sees, set the ideal voltage source to zero in the circuit model. The 15 kΩ and 22 kΩ resistors then sit in parallel, in series with the 1 kΩ, for a Thevenin resistance of about 9.919 kΩ. With 100 nF, the time constant is about 0.992 ms. Starting from 0 V, the first-order fraction of error remaining is <code>exp(-t/τ)</code>.</p><table><thead><tr><th>Wait</th><th>Remaining error</th><th>Equivalent error magnitude at a 4.2 V battery</th></tr></thead><tbody><tr><td>1 ms</td><td>About 36.5%</td><td>About 1.53 V</td></tr><tr><td>5 ms</td><td>About 0.647%</td><td>About 27.2 mV</td></tr><tr><td>10 ms</td><td>About 0.00419%</td><td>About 0.176 mV</td></tr></tbody></table><p>These are ideal RC figures for settling from zero. Five and ten milliseconds are only a few milliseconds apart, yet they leave very different amounts of error. Taking 32 readings straight after switching on and averaging them may simply average a voltage that is still on its way up.</p><p>Setting the RC settling error alone at 0.1% takes about <code>6.91τ</code>, or 6.85 ms. The real wait also has to account for component tolerances, the MOSFET turning on, the load from ADC sampling and the accuracy actually needed. The 5 to 10 ms in the handoff can be checked against the node waveform on an oscilloscope and real ADC readings before a final duration is chosen.</p><h3>Sampling-Circuit Current Consumption</h3><p>At 4.2 V, the 37 kΩ divider left permanently connected draws about 113.5 μA, roughly 2.72 mAh a day. With the switch, it works only inside the measurement window; switched on for 10 ms each second, for example, the divider resistors alone average about 1.14 μA.</p><p>That is not the whole bill, though. The AO3401 gate has a 10 kΩ pull-up, and when the 2N7002 conducts, that pull-up plus the series 1 kΩ forms another current path. Under an ideal on-state approximation it draws about 382 μA at 4.2 V, more than the divider itself. Each recharge of the capacitor, GPIO drive and off-state leakage add their share too. The power of the whole sensing circuit has to count all of these branches together; the divider current alone tells only part of it.</p><p>The time spent on repeated conversions belongs inside the enabled window as well. Wait 10 ms and then spend more time on several conversions, and the real duty is above 1%. With that worked out, choosing the sampling rate and knowing how much charge each extra reading costs becomes straightforward.</p><h3>ADC Conversion</h3><p>The ESP32-S3's ADC also involves attenuation settings and calibration. <a href=\"https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-reference/peripherals/adc/adc_calibration.html\" target=\"_blank\" rel=\"noopener\">Espressif's calibration documentation</a> provides raw-code-to-voltage calibration and discusses input capacitance and multisampling for noise reduction. Software should first get an input voltage that matches the current ADC configuration and only then apply the divider ratio, instead of forcing every configuration through one fixed full-scale formula.</p><p>Errors need separating too. Averaging can knock down some random noise, but the steady low bias from incomplete RC settling does not go away on its own, and divider-ratio and ADC-conversion errors can stack on top of each other. Comparing a few stable voltages against a multimeter, one each near the low end, the middle and full charge, shows discrepancies far more readily than calibrating at a single point.</p><p>When I tested this board, I had no ESP32 core board at hand. What I could do was drive <code>ADC_ENABLE</code> high by hand and measure the divider node, and at that stage the voltage matched the calculation; the digital reading was left to the client's firmware, and it was their side that reported the battery reading worked. Working the branch through from start to finish makes it clear why the handoff had to carry both a control sequence and a conversion ratio. Switching on, settling, sampling and calibrated conversion all have to cooperate before the battery reading is fit to decide whether the crab gets to jump again.</p>"}, "cb": 1011, "ca": 1027}, {"group": "Claude Chime", "kind": "笔记", "label": "Claude Chime · 笔记 · 带保护电池的启动测量", "route": "https://www.66ccff-labs.com/notes/claude-chime-startup-current", "before": {"zh": "<h2>带保护电池的启动测量</h2><p class=\"summary\">从一次冷启动掉压出发，研究电芯与电池包输出的区别、电容充电，以及保护判断所需的测量。</p><p>Claude Chime 电源板接入带保护电池时，我在电池包输出端量到的电压从 4.03 V 降到了 1.49 至 1.57 V。同一块板却能用 3.8 V、限流 50 mA 的台式电源启动两路空载升压。这两个结果放在一起，最值得继续研究的是电源怎样进入工作状态，以及仪器量到的究竟是哪一段电路。</p><h3>电芯与电池包输出电压测量</h3><p>带保护的电池包包含电芯、保护芯片和串联开关路径。万用表接在包的输出正负端，读到的是负载能够使用的端电压。保护开关断开时，即使电芯仍有电，输出端也可能因负载、漏电及内部路径呈现很低的读数。看到 1.5 V 左右，必须先确认测量节点，再讨论电芯状态。</p><p>这组现象让我怀疑电池包上的 DW01A 与 8205A 保护路径在启动时发生了动作。<a href=\"https://www.ic-fortune.com/upload/Download/DW01A-DS-12_EN.pdf\" target=\"_blank\" rel=\"noopener\">DW01A 原厂资料</a>说明，电流检测使用 CS 引脚的电压，并结合相应延时判断过流。门限是检测电压，换算为电流还要知道受监测路径的阻抗。不能把一个电压门限直接当成所有保护板通用的电流额定值。</p><p>要区分电芯自身下跌与保护路径断开，理想记录应当同时包含电芯端电压、包输出电压和接入电流。测电池不同参考点时，要使用合适的差分测量方式，避免示波器共地探头把保护路径意外短接。测量连接本身会改变电路，这一点在低侧保护结构里尤其需要留心。</p><h3>电容充电与启动电流</h3><p>电源刚接入时，电容需要获得电荷。<a href=\"https://www.ti.com/lit/an/slva670a/slva670a.pdf\" target=\"_blank\" rel=\"noopener\">TI 的浪涌电流说明</a>用 <code>I = C × dV/dt</code> 描述这部分电流。相同电容量，电压建立得越快，所需电流就越大。为了帮助运行中的负载瞬态而增加电容，也会增加接电时需要补充的电荷。</p><p>原理图里直接接在 <code>BAT+</code> 上的电容，包括两路升压输入的 22 μF、22 μF、22 μF，充电芯片电池端的 4.7 μF，以及两颗 100 nF。只按标称值相加，已经约有 70.9 μF。取 4 V 电压变化、100 μs 线性上升作示例，仅这部分电容就对应约 2.84 A 的充电电流；把上升时间延长到 1 ms，则约为 0.284 A。这是理想估算，实际电容量、连线阻抗和电源响应都会改变波形。</p><p>输出电容还要沿各自路径继续计算。<a href=\"https://www.ti.com/lit/ds/symlink/tlv61048.pdf\" target=\"_blank\" rel=\"noopener\">TLV61048 手册</a>描述了内部软启动，但这颗芯片使用外部电感和整流二极管，接电时可以先沿电感与二极管向输出充电。芯片开始调节内部参考之前，已经可能有电流流过。因此，检查启动电流时，需要把直接输入充电、输出预充及进入升压调节后的过程分开。</p><h3>电源限流与电池保护</h3><p>50 mA 限流启动成功很有价值，但它对应的是另一种电源响应。台式电源进入限流时，输出电压可能上升得更慢；输出电容、控制响应和连接方式也会影响最初那一小段电流。带保护电池则可能在检测条件满足后切断放电路径。两者面对同一块板，可以走出不同的启动过程。</p><p>万用表电阻挡适合先查持续低阻，却无法重放上电时的充电过程。它的测试电压和电流与真正接入电池不同，半导体的状态也可能不同。我会把电阻检查用于缩小持续短路的可能范围，再用电压、电流波形研究接入瞬间，各种测量回答各自的问题。</p><p>当时断开主板后，包输出电压会恢复；给包输出端接过外部电源后，下一次启动也成功过。这让我更关心每次试验开始前的状态。电容有没有放完电、保护是否已经恢复、主板有没有持续连接，都会影响可重复性。继续试验时，应先固定这些条件，再比较结果。</p><h3>启动波形测量</h3><p>以电池接入事件触发示波器，可以同时记录电池包的输出电压和电流。电流测量优先考虑电流探头；若使用分流电阻，则需计算它额外引入的压降，并用差分方式读取。只量到一个尖峰还不够，还要看它持续多久、输出何时开始下降，以及下降之后电流是否被切断。</p><p>如果电流先增大，随后包输出突然降低，而电芯端仍保持较高电压，保护路径就值得优先检查。如果电芯端也明显下跌，则要继续查电芯内阻和连接压降。根据波形，再选择预充、受控上升斜率或调整启动安排，改动会更有针对性。两颗 Boost 共用同一次接电事件，合计电流也应在共同输入端观察。</p><p>启动掉压的后续排查，可以从这组同步测量继续。电流先增大还是电压先下降、哪两个节点开始分离，这些细节能够逐渐缩小原因范围。把启动过程测清楚以后，电路该改哪里，也就有了具体依据。</p>", "en": "<h2>Protected Battery Startup Measurements</h2><p class=\"summary\">Separating cell and pack voltage, capacitor charging and protection timing when investigating a failed cold start.</p><p>Connecting the Claude Chime power board to its protected battery pack dropped the measured pack output from 4.03 V to 1.49 through 1.57 V. Yet a 3.8 V bench supply with a 50 mA limit could start both unloaded boost rails on the same board. Together, those observations raise questions about how each source enters operation and which part of the circuit an instrument is measuring.</p><h3>Cell and Pack-Output Voltage Measurements</h3><p>A protected pack contains a cell, protection circuitry and a series switching path. A meter across its output terminals measures the voltage available to the load. If the protection switch opens, the load, leakage and internal paths can leave a low output reading while the cell still holds charge. Before interpreting a reading near 1.5 V as a cell condition, I need to identify the measurement nodes.</p><p>The behavior made me suspect startup activity in the pack's DW01A and 8205A protection path. <a href=\"https://www.ic-fortune.com/upload/Download/DW01A-DS-12_EN.pdf\" target=\"_blank\" rel=\"noopener\">Fortune's DW01A documentation</a> describes overcurrent detection using the CS-pin voltage and a corresponding delay. Converting that voltage threshold into a current requires the impedance of the monitored path. The threshold alone is no universal current rating for every protection board.</p><p>An ideal capture for separating cell droop from an opened protection path would include cell voltage, pack output and connection current together. Measurements across different battery references require an appropriate differential arrangement, so common-ground oscilloscope probes do not accidentally bypass the protection path. The measuring connection itself can change the circuit, especially with low-side protection.</p><h3>Capacitor Charging and Startup Current</h3><p>At connection, capacitors need charge. <a href=\"https://www.ti.com/lit/an/slva670a/slva670a.pdf\" target=\"_blank\" rel=\"noopener\">TI's inrush-current application note</a> expresses that current as <code>I = C × dV/dt</code>: for the same capacitance, a faster voltage rise demands more current. Added capacitance that helps with operating load transients also increases the charge needed at startup.</p><p>The schematic shows three 22 μF capacitors across the boost inputs, 4.7 μF at the charger's battery terminal and two 100 nF capacitors, all directly connected to <code>BAT+</code>. Their nominal sum is about 70.9 μF. For an illustrative linear 4 V rise in 100 μs, those capacitors alone require about 2.84 A; extending the rise to 1 ms reduces that to about 0.284 A. This is an ideal estimate. Effective capacitance, wiring impedance and source response alter the actual waveform.</p><p>Output capacitors need examination along their own paths. The <a href=\"https://www.ti.com/lit/ds/symlink/tlv61048.pdf\" target=\"_blank\" rel=\"noopener\">TLV61048 datasheet</a> describes internal soft start, but the external inductor and rectifier also provide a path that can charge the output when power is first connected. Current can flow before the internal reference begins its controlled ramp. Direct input charging, output precharge and regulated boost startup should therefore be distinguished when examining the input current.</p><h3>Supply Current Limiting and Battery Protection</h3><p>Successful startup at a 50 mA limit is useful, but the bench supply has a different response from the protected pack. In current limit, its voltage may rise more slowly. Output capacitance, control response and connection details also affect the initial current. A protected battery may instead interrupt discharge once its detection conditions are met. The same board can consequently follow different startup trajectories with the two sources.</p><p>Resistance mode helps look for a persistent low-resistance path, but does not reproduce power-on charging. Its test current and voltage differ from the battery connection, potentially putting semiconductor devices in different states. I would use resistance checks to narrow the persistent-short possibility, then voltage and current captures to investigate connection behavior. Each measurement has a different job.</p><p>At the time, disconnecting the board restored pack output; applying an external supply at the pack output was also followed by a successful battery start. That makes the initial state of each trial worth controlling. Residual capacitor charge, protection recovery and whether the board remained connected can all affect repeatability. I would fix those conditions before comparing further trials.</p><h3>Startup Waveform Measurements</h3><p>Triggering on battery connection would capture pack-output voltage and current together. A current probe is preferable; a shunt requires accounting for its additional voltage drop and reading it differentially. A peak alone is insufficient. Its duration, the beginning of output collapse and whether current is then interrupted belong in the same capture.</p><p>If current rises first, pack output suddenly falls and cell voltage remains relatively high, the protection path deserves priority. If the cell voltage also falls substantially, cell resistance and connection drops need investigation. The waveform can then guide a choice of precharge, controlled rise time or a revised startup sequence. Both converters share the connection event, so their combined demand needs observing at the common input.</p><p>Those synchronized measurements provide a concrete continuation for the fault investigation. Whether current rises before voltage falls, and which nodes begin to separate, can progressively narrow the cause. Once startup is visible at that level, circuit changes have a much clearer basis.</p>"}, "after": {"zh": "<h2>带保护电池的启动测量</h2><p class=\"summary\">从一次冷启动掉压出发，研究电芯与电池包输出的区别、电容充电，以及保护判断所需的测量。</p><p>Claude Chime 电源板第一次接上带保护的电池，板子没起来。接入前我在电池包输出端量到 4.03 V，一接上就掉到 1.49 至 1.57 V。可同一块板，用 3.8 V、限流 50 mA 的台式电源，两路升压都能空载启动。同一块板，换个电源就是两种结局。值得接着追的是，电源到底怎样把板子带进工作状态，仪表量到的又究竟是哪一段电路。</p><p>当时我先怀疑 PCB，拿万用表把各个点位的电压和芯片的配置引脚挨个量了一遍，都在正常的工作状态。接着用示波器去抓电池焊上那一瞬间电池端的电压，看到它一下子掉下去，中间还有个小凹槽，像是想往回升，最后还是被压在了低位。顺着电池往下查，这是一块淘宝买来的带保护板的锂电池，一块细长的小保护板直接点焊在电芯的两片极耳上。</p><h3>电芯与电池包输出电压测量</h3><p>带保护的电池包里有电芯、保护芯片和一段串联的开关路径。万用表接在包的输出正负端，读到的是负载实际能用的端电压。保护开关一断，就算电芯里还有电，输出端也可能因为负载、漏电和内部路径读出一个很低的数。所以看到 1.5 V 上下，先得弄清量的是哪两个点，再谈电芯怎么样。</p><p>这组现象让我怀疑，接电那一下，电池包里 DW01A 和 8205A 组成的保护路径动作了。<a href=\"https://www.ic-fortune.com/upload/Download/DW01A-DS-12_EN.pdf\" target=\"_blank\" rel=\"noopener\">DW01A 的原厂资料</a>说明，它靠 CS 引脚上的电压，再加一段延时来判断过流。门限是一个检测电压，要换成电流，还得知道被监测那段路径的阻抗，所以没法拿一个电压门限，当成所有保护板通用的电流额定值。</p><p>要分清是电芯自己掉下去，还是保护路径断开了，最理想的是同时记下电芯端电压、包输出电压和接入电流。测电池里不同的参考点，得用合适的差分方式，免得示波器共地的探头一夹，反倒把保护路径给短接了。测量的接法本身就会改变电路，低侧保护的结构里尤其要当心。</p><h3>电容充电与启动电流</h3><p>板上放了不少大容量的 MLCC，本意是电磁铁起跳那一下，能从这些电容里拿到足够的电流。可电源刚接入时，这些电容自己也得先充上电。<a href=\"https://www.ti.com/lit/an/slva670a/slva670a.pdf\" target=\"_blank\" rel=\"noopener\">TI 的浪涌电流说明</a>用 <code>I = C × dV/dt</code> 描述这部分电流：同样的电容量，电压建立得越快，要的电流越大。为运行中的负载瞬态加的电容越多，接电那一刻要先补上的电荷也越多。</p><p>原理图上直接挂在 <code>BAT+</code> 上的电容，有两路升压输入端的三颗 22 μF、充电芯片电池端的 4.7 μF，还有两颗 100 nF，光按标称值加起来就约 70.9 μF。拿 4 V 的电压变化、100 μs 线性上升来举例，光这些电容就要约 2.84 A 的充电电流；上升时间拉长到 1 ms，就降到约 0.284 A。这是理想估算，实际的有效电容、连线阻抗和电源响应都会改变波形。</p><p>输出电容也得顺着各自的路径算。<a href=\"https://www.ti.com/lit/ds/symlink/tlv61048.pdf\" target=\"_blank\" rel=\"noopener\">TLV61048 手册</a>写了内部软启动，可这颗芯片用的是外部电感和整流二极管，一接电，电流就能先顺着电感和二极管往输出电容里充。芯片还没开始调节内部参考，电流可能已经流过去了。所以看启动电流时，要把输入端直接充电、输出预充和进入升压调节以后的过程分开看。</p><h3>电源限流与电池保护</h3><p>限流 50 mA 能启动，这个结果很有用，但它对应的是另一种电源响应。台式电源进了限流，输出电压可能升得更慢；输出电容、控制响应和接法也会影响最开始那一小段电流。带保护的电池则可能在检测条件满足以后，直接把放电路径切断。同一块板，碰上这两种电源，可以走出完全不同的启动过程。</p><p>万用表电阻挡适合先查有没有持续的低阻，却重放不了上电时的充电过程。它的测试电压和电流跟真接电池不一样，半导体的状态也可能不一样。电阻挡用来缩小持续短路的可能，接入瞬间的事交给电压、电流波形，每种测量各管各的问题。</p><p>当时断开板子，电池包的输出电压就会恢复。电池焊在板子上以后，用台式电源在电池包两端打一下 3.7 V，输出就恢复正常了，像是把保护板的锁定解开了，只要不再拆下来就一直没事；可每重新接一次，就会再掉一次压。这也说明每次试验开始前的状态值得控制：电容放没放完电、保护有没有恢复、板子是不是一直接着，都会影响能不能复现。接着试的话，先把这些条件固定住，再比结果。</p><h3>启动波形测量</h3><p>以电池接入为触发，可以同时记下电池包的输出电压和电流。电流优先用电流探头；用分流电阻的话，得把它多出来的压降算进去，并用差分方式读。只抓到一个尖峰不够，还要看它持续多久、输出从什么时候开始往下掉、掉下去以后电流是不是被切断了。</p><p>如果是电流先冲上去，包输出随后突然掉下，电芯端却还保持在较高电压，保护路径就该优先查。如果电芯端也明显跌了，那就得接着查电芯内阻和连接压降。看清波形以后再决定是加预充、控制上升斜率，还是调整启动顺序，改起来才有的放矢。两颗 Boost 共用同一次接电，合计电流要在共同的输入端看。</p><p>示波器上那个小凹槽，要是旁边再配一条电流波形，就能看出往回升的那一下是谁在撑，又是谁把它按了下去。电流先涨还是电压先掉、哪两个节点先分开，这些细节能把原因一点点收窄。启动过程测清楚了，电路该改哪儿，也就有了实实在在的依据。</p>", "en": "<h2>Protected Battery Startup Measurements</h2><p class=\"summary\">Separating cell and pack voltage, capacitor charging and protection timing when investigating a failed cold start.</p><p>The first time the Claude Chime power board met its protected battery pack, it would not start. Before connection I measured 4.03 V at the pack output; once connected it fell to between 1.49 and 1.57 V. Yet the very same board started both unloaded boost rails from a 3.8 V bench supply limited to 50 mA. Same board, different source, opposite outcomes. What deserves following up is how each source actually brings the board into operation, and which part of the circuit an instrument is really measuring.</p><p>At the time my first suspect was the PCB. I went over the voltages at each test point and the chip configuration pins with a multimeter, and everything sat in its normal operating state. Then I used the oscilloscope to catch the battery-terminal voltage at the moment the cell was soldered on. It dropped sharply, with a small notch in the middle where it looked as if it were trying to climb back, before being held down low. Following the battery further, it turned out to be a Taobao lithium cell with a protection board: a narrow little strip spot-welded straight onto the cell's two tabs.</p><h3>Cell and Pack-Output Voltage Measurements</h3><p>A protected pack contains a cell, protection circuitry and a series switching path. A meter across its output terminals reads the terminal voltage the load can actually use. Once the protection switch opens, the output can read very low through load, leakage and internal paths even while the cell still holds charge. Seeing something around 1.5 V, the first job is to pin down which two points were measured, and only then talk about the state of the cell.</p><p>That combination of symptoms made me suspect that the pack's DW01A and 8205A protection path acted at the moment of connection. <a href=\"https://www.ic-fortune.com/upload/Download/DW01A-DS-12_EN.pdf\" target=\"_blank\" rel=\"noopener\">Fortune's DW01A documentation</a> describes overcurrent detection from the CS-pin voltage combined with a delay. The threshold is a detection voltage; turning it into a current requires the impedance of the monitored path, so no single voltage threshold can stand in for a current rating shared by every protection board.</p><p>Telling a sagging cell apart from an opened protection path ideally means recording cell voltage, pack output voltage and connection current together. Measuring between different reference points inside a battery needs a suitable differential setup, so that a common-ground oscilloscope probe does not end up shorting the protection path. The measurement connection itself changes the circuit, and with low-side protection that deserves particular care.</p><h3>Capacitor Charging and Startup Current</h3><p>The board carries a fair amount of high-value MLCC capacitance, put there so that the solenoid's kick could draw plenty of current from the capacitors. At the moment power arrives, though, those capacitors need charge of their own. <a href=\"https://www.ti.com/lit/an/slva670a/slva670a.pdf\" target=\"_blank\" rel=\"noopener\">TI's inrush-current application note</a> describes that current as <code>I = C × dV/dt</code>: for the same capacitance, the faster the voltage rises, the more current it takes. The more capacitance added for load transients during operation, the more charge has to be supplied first at connection.</p><p>On the schematic, the capacitors tied directly to <code>BAT+</code> include three 22 μF parts at the two boost inputs, 4.7 μF at the charger's battery pin and two 100 nF parts, about 70.9 μF by nominal value alone. Taking a 4 V change with a linear 100 μs rise as an example, those capacitors by themselves need roughly 2.84 A of charging current; stretching the rise to 1 ms brings it down to about 0.284 A. This is an idealized estimate, and effective capacitance, wiring impedance and source response all reshape the real waveform.</p><p>Output capacitors need following along their own paths too. The <a href=\"https://www.ti.com/lit/ds/symlink/tlv61048.pdf\" target=\"_blank\" rel=\"noopener\">TLV61048 datasheet</a> describes internal soft start, but this part uses an external inductor and rectifier diode, so as soon as power arrives, current can flow through the inductor and diode into the output capacitors. Current may already be flowing before the chip begins regulating its internal reference. Examining startup current therefore means separating direct input charging, output precharge and the period after boost regulation takes over.</p><h3>Supply Current Limiting and Battery Protection</h3><p>Starting successfully at a 50 mA limit is a useful result, but it reflects a different kind of source response. A bench supply in current limit may let its output rise more slowly, and output capacitance, control response and wiring also shape that first sliver of current. A protected battery may instead cut its discharge path outright once its detection conditions are met. Faced with these two sources, the same board can follow completely different startup paths.</p><p>A multimeter's resistance range is good for a first look at persistent low resistance, but it cannot replay the charging that happens at power-on. Its test voltage and current differ from a real battery connection, and semiconductors may sit in different states. Resistance checks narrow down the possibility of a persistent short; the moment of connection is a job for voltage and current waveforms. Each measurement answers its own question.</p><p>At the time, disconnecting the board brought the pack output back. With the battery soldered to the board, briefly applying 3.7 V from the bench supply across the pack terminals made the output normal again, as if the protection board's lockout had been released, and it stayed fine as long as the battery was not removed. Every fresh connection brought the voltage drop back once more. That makes the starting state of each trial worth controlling: whether the capacitors have fully discharged, whether the protection has recovered, and whether the board stayed connected all affect repeatability. Further trials should fix those conditions before comparing results.</p><h3>Startup Waveform Measurements</h3><p>Triggering on the battery connection, pack output voltage and current can be recorded together. A current probe is the first choice; with a shunt resistor, its extra voltage drop has to be accounted for and it has to be read differentially. Catching a single spike is not enough. How long it lasts, when the output starts to fall, and whether current is cut off after the fall all belong in the same capture.</p><p>If current surges first, pack output then drops abruptly and the cell stays relatively high, the protection path should be checked first. If the cell also falls noticeably, cell resistance and connection drops need investigating. Deciding between precharge, a controlled rise rate or a revised startup sequence after seeing the waveform makes the change well aimed. Both boost converters share the same connection event, so their combined current should be watched at the common input.</p><p>Put a current trace beside that small notch on the oscilloscope, and it would show what was holding the voltage up as it tried to recover, and what pressed it back down. Whether current rises before voltage falls, and which two nodes separate first, are the details that narrow the cause step by step. Once startup is measured that clearly, where to change the circuit has a solid basis.</p>"}, "cb": 1367, "ca": 1670}];
