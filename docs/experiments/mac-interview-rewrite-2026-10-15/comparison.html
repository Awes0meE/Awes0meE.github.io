<header><div class="eyebrow">PORTFOLIO / EDITORIAL REVIEW · 2026.10.15</div><h1>五个项目，原稿与重写稿对照</h1>

<script>
const data=[{"group": "DIY Cooling", "kind": "主页", "label": "DIY Cooling · 主页 · DIY 压风式笔记本散热器", "route": "https://www.66ccff-labs.com/work/juanyun-diy-cooling-prototype", "before": {"zh": "<h2>DIY 压风式笔记本散热器</h2><p class=\"summary\">我做了一台亚克力与泡棉散热器，用 Windows 程序读取温度，经蓝牙控制 ESP32 和风扇。后来重画的 STM32 板完成了串口控制，尚未重新接成完整的温控整机。</p><h3>风道与温度</h3><p>做这个散热器的起因很直接，玩 CSGO 时，笔记本高温掉帧。我已经调过机器、清过灰，再看普通散热底座，总觉得风扇吹得很热闹，进到笔记本底部风口的气流却未必有多少。我想试着把四周封起来，让风少绕一些路，同时让风扇跟着电脑温度调整。</p><p>结构上，我做了亚克力底座，用泡棉贴合笔记本底部，减少气流从四周逃走。温度则直接从电脑内部读取，不再加外置探头。外壳附近的温度与 CPU、GPU 的状态隔着一段距离，还要增加器件成本；既然电脑已经能提供内部读数，我就想把它接到自己的控制板上。</p><h3>第一套上位机</h3><p>此前我没学过 WinForms，也没有写上位机的经验。我边查 CSDN 边借助 AI，做出一个面向 .NET Framework 4.7.2 的 C# 程序。<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">上位机源码</a>调用 <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor\" target=\"_blank\" rel=\"noopener\">LibreHardwareMonitor</a> 读取温度，提供 COM 口扫描、连接、显示和自动发送，再把 <code>CPU62.7</code>、<code>GPU71.3</code> 这样的报文经 115200 波特率的虚拟串口送出去。接收端是使用 <code>BluetoothSerial</code> 的 ESP32。</p><p>我不想让一个散热底座的使用过程变成打开 VS Code、接 USB-UART、手敲命令。散热器还附送一份操作作业，实在没必要。原本我想把所有操作都放进 GUI，最后只完成了连接与温度发送，模式、PWM 频率和手动占空比交给五个实体按键。这个没做完整的界面方案倒也有实用之处，通电以后，伸手就能调风扇。</p><p>第一次在 Windows 点下 Connect，找到 <code>ESP32_Bluetooth</code>，看着温度出现在窗口里，随后桌上的风扇真的变速了，我很兴奋。写在电脑里的程序终于控制到了自己焊的板子。<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-desktop-demo.mp4\" target=\"_blank\" rel=\"noopener\">3 分 57 秒的演示</a>保留了 Windows、蓝牙、OLED、按键和风扇之间的完整操作。</p><h3>温度与风扇控制</h3><p><a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 固件</a>用 GPIO 5 输出 PWM，初始频率是 15 kHz，分辨率为 8 位。自动模式采用温度的简单比例映射，另有手动占空比设置。我也花过大约半周尝试 PID，最终没有实现。那时连目标温度、传感器选择和热响应记录都没定义清楚，现在回看，急着调 PID 确实太早。</p><p>OLED 上的 <code>Fan Speed</code> 也是我后来才意识到的问题，显示变量实际是占空比，程序没有测 RPM。<a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">风扇厂商的 PWM 与转速监测说明</a>把控制输入与 tach 反馈明确分开。</p><p>上位机每五秒尝试发送一条，CPU、GPU 交替，固件再用 30 秒窗口中的较高峰值更新输出。</p><h3>两版硬件</h3><p>我为 ESP32 版完成了<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">原理图</a>、<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/easyeda-2024-project.epro\" target=\"_blank\" rel=\"noopener\">EasyEDA 工程</a>与 <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-gerber.zip\" target=\"_blank\" rel=\"noopener\">Gerber</a>，随后制造、焊接、上电并装入亚克力底座。板上有两路风扇接口、电源变换、OLED 和五个按键，没有另加风扇驱动芯片，PWM 接到风扇自身的控制接口。这一版完成了从电脑温度到实体风扇的整机联调，我实际用了大约两三天。</p><p>后来我用 STM32F103C8T6 <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/easyeda-2026-project.epro2\" target=\"_blank\" rel=\"noopener\">重画控制板</a>，重新整理并加宽部分走线，调整元件布局、缩小板子，再加入 CH340N USB-UART。我也把这块板焊好、上电，并写了固件。从 VS Code 经串口发命令，它能够回复命令，让风扇变速。这一版做到串口控制就停了，外接蓝牙还没连回 Windows 温度程序。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-pcb-3d.png\" alt=\"后续 STM32 控制板渲染\"><figcaption>后续 STM32 控制板渲染</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-schematic.png\" alt=\"后续 STM32 控制板原理图\"><figcaption>后续 STM32 控制板原理图</figcaption></figure></div><p>外壳也试过另一条路线。我为 Bambu Lab A1 mini 建模、拆件，在 <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/bambu-a1-mini-auto-slice.3mf\" target=\"_blank\" rel=\"noopener\">3MF</a> 中排成九块切片板，比较过自动与手动树状支撑、零件朝向、Brim 和 Skirt。做到切片预览就停了。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-1.jpg\" alt=\"同一组零件的树状自动支撑视图\"><figcaption>同一组零件的树状自动支撑视图</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-2.jpg\" alt=\"同一组零件的 Brim 与 Skirt 设置\"><figcaption>同一组零件的 Brim 与 Skirt 设置</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling-3d-print-preview-3.jpg\" alt=\"树状手动支撑与零件摆放视图\"><figcaption>树状手动支撑与零件摆放视图</figcaption></figure></div><h3>实际使用</h3><p>使用那两三天，我觉得散热有改善。按现在记得的量级，CSGO 大约增加了 20 到 30 FPS，最高温度从约 92 到 93°C 降到约 84°C。</p><p>我把最初那个让风扇跟着电脑温度调整的想法，做成了能放到自己电脑下面使用的散热器。第一次点下 Connect，看着桌上的风扇跟着电脑里的温度读数变速，我特别兴奋。</p>", "en": "<h2>DIY Laptop Cooler</h2><p class=\"summary\">I built an acrylic-and-foam laptop cooler, with a Windows application sending temperatures over Bluetooth to an ESP32 fan controller. A later STM32 board reached serial control but never rejoined the complete system.</p><h3>Airflow and Temperature</h3><p>This cooler began with my laptop overheating and dropping frames in CSGO. I had already adjusted the machine and cleaned its cooling system. Looking at an ordinary cooling pad, I could see plenty of air moving without knowing how much entered the laptop's bottom intake. I wanted to seal the surrounding gaps and make the fan respond to the computer's temperature.</p><p>I built an acrylic base with foam against the laptop underside to reduce air escaping around it. For temperature, I chose the readings already available inside the computer. An external probe would add cost and measure farther from the CPU and GPU. Using the internal readings meant finding a way to bring them onto my own controller board.</p><h3>My First Desktop Controller</h3><p>I had no WinForms or desktop-control experience. With CSDN material and AI assistance, I assembled a C# application targeting .NET Framework 4.7.2. The <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">application source</a> uses <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor\" target=\"_blank\" rel=\"noopener\">LibreHardwareMonitor</a> for temperature monitoring, then provides COM-port scanning, connection, display, and automatic transmission. Lines such as <code>CPU62.7</code> and <code>GPU71.3</code> leave through a 115200-baud virtual serial port and reach an ESP32 using <code>BluetoothSerial</code>.</p><p>I did not want using a cooling stand to involve opening VS Code, attaching a USB-UART adapter, and typing commands. A cooler should not come with that much homework. My original plan put every control in the GUI, but I finished only connection and temperature transmission there. Five physical buttons handled mode, PWM frequency, and manual duty. The incomplete GUI plan had one useful consequence: the fan could be adjusted directly after power-on.</p><p>The first successful Connect click was exciting. Windows found <code>ESP32_Bluetooth</code>, temperatures appeared in the window, and the fan on the desk changed speed. A program on my computer was controlling a board I had soldered. The <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-desktop-demo.mp4\" target=\"_blank\" rel=\"noopener\">3 min 57 s demonstration</a> preserves the operation across Windows, Bluetooth, OLED, buttons, and the physical fan.</p><h3>Temperature and Fan Control</h3><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 firmware</a> generates PWM on GPIO 5, initially at 15 kHz with 8-bit resolution. Automatic modes use simple proportional temperature mapping, alongside manual duty control. I spent roughly half a week trying PID, without completing an implementation. In retrospect, I had reached for tuning before defining a target temperature, selecting the exact sensor, or recording the thermal response.</p><p>I also reconsidered the OLED label <code>Fan Speed</code>. Its variable was duty cycle; the program never measured RPM. A <a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">fan manufacturer's PWM and speed-monitoring guide</a> makes the distinction between the command input and tach feedback explicit.</p><p>The application attempts one temperature transmission every five seconds, alternating CPU and GPU; the firmware updates its output from the higher peak in a 30-second window.</p><h3>Two Hardware Versions</h3><p>For the ESP32 version, I completed the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">schematic</a>, <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/easyeda-2024-project.epro\" target=\"_blank\" rel=\"noopener\">EasyEDA project</a>, and <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-gerber.zip\" target=\"_blank\" rel=\"noopener\">Gerber files</a>, then had the board fabricated, soldered it, powered it, and installed it in the acrylic base. It carried two fan interfaces, power conversion, an OLED, and five buttons. There was no separate fan-driver IC; PWM went to the fan's own control interface. This version completed the computer-temperature-to-fan integration, and I used it for about two or three days.</p><p>I later <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/easyeda-2026-project.epro2\" target=\"_blank\" rel=\"noopener\">redrew the controller</a> around an STM32F103C8T6, reorganizing and widening some traces, changing placement, reducing board size, and adding a CH340N USB-UART interface. I soldered and powered this board too, and wrote its firmware. Serial commands from VS Code produced replies and changed the fan speed. I stopped this version at serial control, with the external Bluetooth link still awaiting reconnection to the Windows temperature application.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-pcb-3d.png\" alt=\"Later STM32 control-board render\"><figcaption>Later STM32 control-board render</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-schematic.png\" alt=\"Later STM32 control-board schematic\"><figcaption>Later STM32 control-board schematic</figcaption></figure></div><p>I explored another enclosure for the Bambu Lab A1 mini, modeling and splitting the body across nine build plates in the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/bambu-a1-mini-auto-slice.3mf\" target=\"_blank\" rel=\"noopener\">3MF project</a>. I compared automatic and manual tree supports, orientation, brim, and skirt settings. That route stopped at slicing previews.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-1.jpg\" alt=\"Automatic tree-support view for the same part set\"><figcaption>Automatic tree-support view for the same part set</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-2.jpg\" alt=\"Brim and skirt settings for the same part set\"><figcaption>Brim and skirt settings for the same part set</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling-3d-print-preview-3.jpg\" alt=\"Manual tree-support view and part orientations\"><figcaption>Manual tree-support view and part orientations</figcaption></figure></div><h3>Using the Prototype</h3><p>During those two or three days, I felt that cooling improved. I remember roughly 20 to 30 additional FPS in CSGO and a maximum temperature falling from about 92 to 93°C to around 84°C.</p><p>The cooler I built could go under my own laptop and adjust its fan to the computer's temperature, just as I had first wanted. I was thrilled the first time I clicked Connect and watched the fan on my desk change speed with those readings.</p>"}, "after": {"zh": "<h2>DIY 压风式笔记本散热器</h2><p class=\"summary\">我做了一台亚克力与泡棉散热器，用 Windows 程序读取温度，经蓝牙控制 ESP32 和风扇。后来重画的 STM32 板完成了串口控制，尚未重新接成完整的温控整机。</p><h3>风道与温度来源</h3><p>玩 CSGO 的时候，我的笔记本温度高得厉害，帧数也跟着往下掉。调机器、清灰尘，能想到的办法试了一圈，都不太管用。再看手边的普通散热底座，它只是对着笔记本底部吹，风扇转得挺卖力，大量的风却从四周溜走了。我想做一个尽量密封的底座，把风集中往笔记本的进风口里送，送进去的风要量大管饱。</p><p>底座用亚克力板搭起来，泡棉贴着笔记本底部，在散热器和电脑之间围出一块相对封闭的送风空间。四周少漏一点，风就多从进风口走一点，当时追求的也就是少漏风、对准进风口。</p><p>风扇该转多快，要看电脑有多热。温度从哪儿来，我是按成本和需求掂量过的。电脑里本来就有好多温度传感器，有的直接做在 CPU 封装里，集成度高得很。我再花一笔钱在散热器上装个外置探头，测到的多半是外壳或者风道的温度，准不准还难说。所以温度直接读电脑自己的。麻烦在于这些读数都在 Windows 里，得想办法送到我自己的控制板上。</p><h3>Windows 上位机</h3><p>这个项目真正的重心就在这条链路上。Windows 读出温度，经蓝牙发给 ESP32，ESP32 算出占空比，从引脚发出对应的 PWM 波，去控制风扇转速。ESP32 用 <code>BluetoothSerial</code> 开了一个经典蓝牙串口，电脑配对以后会多出一个虚拟 COM 口，里面跑的是没经过任何处理的原始串口数据。</p><p>数据通了，还得有人会用。我不想让用这台散热器的人打开 VS Code，拿 USB 转 TTL 线插到板子上，再手敲调速命令，这也太折腾了。它又不走 USB 协议，插上电脑也不会自己跑起来。我设想的是像打开一个游戏那样，点开就是一个界面，点连接、调一调、开自动，几下就能用上。问题是我从没写过 Windows 上位机，图形界面也一点没碰过。</p><p>最后做出来的是一个 C# WinForms 程序，目标框架是 .NET Framework 4.7.2。我在 CSDN 上一点点补基础，AI 也帮了我很大的忙，前前后后费了好一番功夫。<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">上位机源码</a>用 <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor\" target=\"_blank\" rel=\"noopener\">LibreHardwareMonitor</a> 读取 CPU 和 GPU 温度，能扫描 COM 口、连接、显示读数，再把 <code>CPU62.7</code>、<code>GPU71.3</code> 这样的短报文以 115200 波特率自动发出去。</p><p>第一次在窗口里点下 Connect，连上 <code>ESP32_Bluetooth</code>，温度数字出现在窗口里，桌上的风扇跟着变了速。我当时是真的兴奋。这是我第一次用自己写的上位机，让物理世界里的电路板跟着 Windows 里的鼠标做出了反应。<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-desktop-demo.mp4\" target=\"_blank\" rel=\"noopener\">3 分 57 秒的演示</a>录下了 Windows、蓝牙、OLED、按键和风扇一起工作的全过程。</p><p>界面这边，我原本想把所有操作都放进去，最后只做到连接、读温度和自动发送，切换模式、调 PWM 频率和手动占空比交给了板子上的五个实体按键。这样分工其实也挺好。软件得先找到、下载、装上，按键插上电就能按，一个加一个减，风扇就跟着变快变慢。</p><h3>温控规则</h3><p>温度怎么换算成风扇转速，我一开始想上 PID，在这上面纠结了差不多半周，算法实在写不明白，最后还是放弃了。真正跑在板子上的规则简单得多。ESP32 取最近 30 秒里 CPU 和 GPU 的最高温度，按模式乘一个系数：静音模式乘 0.5，普通模式乘 0.7，高速模式干脆拿温度当占空比，84°C 就给 84%。手动模式不看温度，只认按键调出来的占空比。时间隔得太久，我自己都记成了查表，对照<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">固件</a>才确认是这套比例映射。</p><p>上位机每 5 秒发一条温度，CPU 和 GPU 轮流，每种大约 10 秒更新一次。5 秒是为了数据别太旧；30 秒的峰值窗口能让游戏里短时间的高温不被后面的低读数马上盖掉，风扇也不会一会儿快一会儿慢。我当时还觉得蓝牙串口直连没有想象中那么高效，发得慢一点比较稳妥。一条温度读数从读出来到真正改变风扇输出，中间隔着好几段等待，按键还会把攒下的峰值清掉，这些细节放在了<a href=\"https://www.66ccff-labs.com/notes/juanyun-diy-cooling\" target=\"_blank\" rel=\"noopener\">温度采样与风扇响应</a>里。</p><h3>ESP32 控制板</h3><p>ESP32 这块板是我随手画的。<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">原理图</a>、<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/easyeda-2024-project.epro\" target=\"_blank\" rel=\"noopener\">EasyEDA 工程</a>和 <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-gerber.zip\" target=\"_blank\" rel=\"noopener\">Gerber</a> 画完以后，打板、焊接、上电，再装进亚克力底座。板上有两路风扇接口、电源变换、OLED 和五个按键。板上没给风扇单独配驱动芯片，接的是 PWM 风扇，ESP32 的 PWM 直接送到风扇自带的控制线上。OLED 上那行 <code>Fan Speed</code> 显示的其实是占空比，程序从来没测过转速。风扇怎么接、占空比和实际转速怎么区分，写在<a href=\"https://www.66ccff-labs.com/notes/juanyun-diy-cooling-pwm-fan-control\" target=\"_blank\" rel=\"noopener\">PWM 风扇控制与转速反馈</a>里。</p><p>这一版我真垫在电脑底下用了两三天，确实感觉散热好了不少。按我记得的量级，CSGO 大概多了 20 到 30 帧，最高温度从九十二三度降到 84 度左右。</p><h3>STM32 改版与 3D 打印外壳</h3><p>后来我用 STM32F103C8T6 把控制板<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/easyeda-2026-project.epro2\" target=\"_blank\" rel=\"noopener\">重画了一版</a>，算是对 ESP32 版的整体优化。走线拉宽、理顺，元件重新布局，板子也缩小了，另外加了一颗 CH340N 做 USB 转串口。这块板同样焊好、上电，固件也写完了。在 VS Code 里通过串口给它发调速命令，它会回复，风扇也跟着变速。STM32F103 本身不带无线功能，蓝牙得靠外接模块，这条链路一直没接回 Windows 上位机，这块板也没装进亚克力底座。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-pcb-3d.png\" alt=\"STM32 控制板渲染\"><figcaption>STM32 控制板渲染</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-schematic.png\" alt=\"STM32 控制板原理图\"><figcaption>STM32 控制板原理图</figcaption></figure></div><p>外壳我也试过 3D 打印。给 Bambu Lab A1 mini 建模、拆件，在 <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/bambu-a1-mini-auto-slice.3mf\" target=\"_blank\" rel=\"noopener\">3MF</a> 里排成九块打印板，自动和手动树状支撑、零件朝向、Brim 和 Skirt 都比较过，最后停在切片预览，一件也没打出来。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-1.jpg\" alt=\"同一组零件的树状自动支撑视图\"><figcaption>同一组零件的树状自动支撑视图</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-2.jpg\" alt=\"同一组零件的 Brim 与 Skirt 设置\"><figcaption>同一组零件的 Brim 与 Skirt 设置</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling-3d-print-preview-3.jpg\" alt=\"树状手动支撑与零件摆放视图\"><figcaption>树状手动支撑与零件摆放视图</figcaption></figure></div><p>所以真正在我电脑底下垫过、跟着游戏温度调过风扇的，是亚克力、泡棉和 ESP32 板拼起来的那一台。STM32 那块板一直停在串口这一步，命令发过去照样回复，风扇照样转，就差一个蓝牙模块把它接回上位机。</p>", "en": "<h2>DIY Laptop Cooler</h2><p class=\"summary\">I built an acrylic-and-foam laptop cooler, with a Windows application sending temperatures over Bluetooth to an ESP32 fan controller. A later STM32 board reached serial control but never rejoined the complete system.</p><h3>Airflow and Temperature Source</h3><p>My laptop ran very hot in CSGO, and the frame rate sank with it. I had tuned the system and cleaned out the dust, and nothing helped much. The ordinary cooling pad beside it simply blew at the underside; its fans worked hard while much of the air escaped around the edges. I wanted a base sealed as tightly as I could manage, pushing air into the laptop's intake in generous volume.</p><p>I built it from acrylic sheet, with foam pressed against the laptop's underside to enclose a space between cooler and computer. Less leakage around the edges meant more air through the intake, and reducing leakage while aiming at the intake was all I was after.</p><p>How fast the fan should spin depends on how hot the computer is, and where that temperature came from was a cost-versus-need decision. A computer already carries plenty of temperature sensors, some built right into the CPU package. Paying extra for an external probe on the cooler would most likely measure the case or the airflow, with no guarantee of accuracy. So I read the computer's own temperatures. The catch was that those readings live inside Windows, and I needed a way to get them onto my own controller board.</p><h3>Windows Desktop Controller</h3><p>That chain was the heart of the project. Windows reads the temperature and sends it over Bluetooth to an ESP32, which works out a duty cycle and outputs the matching PWM wave to set the fan speed. The ESP32 runs a Classic Bluetooth serial port through <code>BluetoothSerial</code>; once paired, a virtual COM port appears in Windows, carrying raw, unprocessed serial data.</p><p>A working link still had to be usable. I did not want anyone using this cooler to open VS Code, plug a USB-to-TTL cable into the board and type speed commands by hand, which is far too much fuss. The board does not speak USB either, so plugging it in would not make anything run on its own. What I pictured was something like launching a game: open it, see a window, click Connect, adjust, switch on automatic, done. The problem was that I had never written a Windows desktop application or touched a graphical interface.</p><p>The result is a C# WinForms application targeting .NET Framework 4.7.2. I picked up the basics bit by bit from CSDN, AI helped me a great deal, and the whole thing took considerable effort. The <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">application source</a> uses <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor\" target=\"_blank\" rel=\"noopener\">LibreHardwareMonitor</a> to read CPU and GPU temperatures, scans and connects to COM ports, shows the readings, and automatically sends short messages such as <code>CPU62.7</code> and <code>GPU71.3</code> at 115200 baud.</p><p>The first time I clicked Connect, the window found <code>ESP32_Bluetooth</code>, temperatures appeared, and the fan on my desk changed speed. I was genuinely thrilled. For the first time, a desktop program I had written made a circuit board in the physical world respond to my mouse in Windows. The <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-desktop-demo.mp4\" target=\"_blank\" rel=\"noopener\">3 min 57 s demonstration</a> records Windows, Bluetooth, the OLED, the buttons and the fan all working together.</p><p>I had meant to put every control in the interface, but it ended up handling only connection, temperature reading and automatic sending. Mode, PWM frequency and manual duty went to five physical buttons on the board. That split turned out fine. Software has to be found, downloaded and installed; buttons work as soon as the power is on, one up and one down, and the fan speeds up or slows down.</p><h3>Temperature Control Rules</h3><p>For turning temperature into fan speed, I first wanted PID. I wrestled with it for about half a week, could not get the algorithm written, and gave up. The rule that actually runs on the board is much simpler. The ESP32 takes the highest CPU or GPU temperature from the last 30 seconds and multiplies it by a mode factor: 0.5 in Quiet, 0.7 in Normal, and in High Speed the temperature simply becomes the duty, so 84°C gives 84%. Manual mode ignores temperature and holds whatever duty the buttons set. So much time had passed that I remembered it as a lookup table, until a check against the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">firmware</a> confirmed this proportional mapping.</p><p>The desktop program sends one temperature every five seconds, alternating CPU and GPU, so each updates roughly every ten seconds. Five seconds keeps the data from going stale. The 30-second peak window stops a short in-game spike from being instantly overwritten by lower readings and keeps the fan from hunting up and down. I also felt at the time that a direct Bluetooth serial link was less efficient than it sounds, so a slower pace seemed safer. Between a temperature being read and the fan output actually changing there are several separate waits, and a button press can wipe the accumulated peaks; those details are in <a href=\"https://www.66ccff-labs.com/notes/juanyun-diy-cooling\" target=\"_blank\" rel=\"noopener\">Temperature Sampling and Fan Response</a>.</p><h3>ESP32 Controller Board</h3><p>I drew the ESP32 board quickly, without much ceremony. After the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">schematic</a>, <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/easyeda-2024-project.epro\" target=\"_blank\" rel=\"noopener\">EasyEDA project</a> and <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-gerber.zip\" target=\"_blank\" rel=\"noopener\">Gerber files</a>, I had it fabricated, soldered it, powered it up and installed it in the acrylic base. It carries two fan connectors, power conversion, an OLED and five buttons. There is no separate fan-driver IC: these are PWM fans, and the ESP32's PWM goes straight to the fan's own control wire. The OLED line labelled <code>Fan Speed</code> actually shows duty cycle; the program never measured speed. How the fan is wired, and how duty differs from real RPM, are covered in <a href=\"https://www.66ccff-labs.com/notes/juanyun-diy-cooling-pwm-fan-control\" target=\"_blank\" rel=\"noopener\">PWM Fan Control and Speed Feedback</a>.</p><p>I really did use this version under my laptop for two or three days, and cooling felt noticeably better. As I remember it, CSGO gained roughly 20 to 30 FPS and the peak temperature fell from about 92 or 93°C to around 84°C.</p><h3>STM32 Revision and 3D-Printed Enclosure</h3><p>Later I <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/easyeda-2026-project.epro2\" target=\"_blank\" rel=\"noopener\">redrew the controller</a> around an STM32F103C8T6 as an across-the-board refinement of the ESP32 version: wider, tidier traces, a new placement, a smaller board, and a CH340N for USB-to-serial. I soldered and powered this board as well and finished its firmware. Speed commands sent over serial from VS Code got replies, and the fan changed speed. The STM32F103 has no wireless of its own, so Bluetooth depends on an external module; that link never made it back to the Windows application, and the board never went into the acrylic base.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-pcb-3d.png\" alt=\"STM32 control-board render\"><figcaption>STM32 control-board render</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-schematic.png\" alt=\"STM32 control-board schematic\"><figcaption>STM32 control-board schematic</figcaption></figure></div><p>I also tried a 3D-printed enclosure. I modelled and split it for a Bambu Lab A1 mini, arranged the parts across nine build plates in the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/bambu-a1-mini-auto-slice.3mf\" target=\"_blank\" rel=\"noopener\">3MF project</a>, and compared automatic and manual tree supports, part orientation, brim and skirt. It stopped at the slicing preview, and not a single part was printed.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-1.jpg\" alt=\"Automatic tree-support view for the same part set\"><figcaption>Automatic tree-support view for the same part set</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-2.jpg\" alt=\"Brim and skirt settings for the same part set\"><figcaption>Brim and skirt settings for the same part set</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling-3d-print-preview-3.jpg\" alt=\"Manual tree-support view and part orientations\"><figcaption>Manual tree-support view and part orientations</figcaption></figure></div><p>So the one that actually sat under my laptop and adjusted its fan to game temperatures was the acrylic, foam and ESP32 build. The STM32 board stayed at the serial stage, still answering commands and still spinning the fan, one Bluetooth module short of rejoining the desktop program.</p>"}, "cb": 1065, "ca": 1649}, {"group": "DIY Cooling", "kind": "笔记", "label": "DIY Cooling · 笔记 · 温度采样与风扇响应", "route": "https://www.66ccff-labs.com/notes/juanyun-diy-cooling", "before": {"zh": "<h2>温度采样与风扇响应</h2><p class=\"summary\">沿传感器选择、异步读取与发送、温度峰值清空，研究一条温度样本何时影响风扇输出。</p><p>我给这台散热器写的程序，会把电脑里的温度拼成 <code>CPU62.7</code> 这样的消息发给 ESP32。短短一行就能把数值送过去，但要解释风扇为什么在某个时刻改变输出，还得知道这个数从哪里来、什么时候读到，又经过了怎样的处理。我想顺着一条温度消息，把这几件事弄清楚。</p><h3>传感器的选择</h3><p><a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">上位机代码</a>用 LibreHardwareMonitor 遍历硬件和传感器。每找到一个 CPU 温度项，就把它的值写进 <code>cpuTemperature</code>；GPU 也做同样的处理。如果一轮遍历遇到多个符合条件的温度项，后面的赋值就会覆盖前面的。变量名虽然叫 CPU 温度，具体留下哪一项，却取决于遍历时最后遇到了谁。</p><p>这个细节会影响我怎样理解温度变化。假如想跟踪 <code>CPU Package</code>，就应该明确选中这一项，持续观察同一个对象。<a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/blob/master/LibreHardwareMonitorLib/Hardware/ISensor.cs\" target=\"_blank\" rel=\"noopener\">LibreHardwareMonitor 的 <code>ISensor</code> 接口</a>提供了 <code>Name</code> 和 <code>Identifier</code>，可以用来辨认传感器，再建立固定的选择规则。保留一位小数方便显示，选定读数的来源才方便比较。</p><h3>读取和发送的顺序</h3><p>来源确定以后，还要看新值能不能赶上这一次发送。上位机的定时器设为 5 秒，但它在一次回调中分别用两个 <code>Task.Run</code> 启动测温和发送。代码里先写测温任务，后写发送任务，两项任务之间却没有等待关系。<a href=\"https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/task-based-asynchronous-programming\" target=\"_blank\" rel=\"noopener\">Microsoft 的任务编程说明</a>介绍了任务的调度，以及用等待或延续建立执行依赖的方法。按这段程序的写法，发送时完全可能读到上一轮留在字段里的温度。</p><p>用一组假设的时刻就能看清这个过程。字段里原来是 60°C；5.000 秒时，程序提交两个任务；发送任务在 5.002 秒取走 60°C；测温任务到 5.080 秒才写入新的 72°C。这次发出去的仍是 60°C。这里相差的几十毫秒只是推演用的数值，关键在于发送没有等本轮读取完成。把定时器改得更快，也不会自动补上这层依赖。</p><p>CPU 和 GPU 还轮流占用发送机会。按程序预定的节奏，每 5 秒发其中一种，每种温度大约 10 秒才轮到一次。因此，定时器触发、某个传感器读完，以及它的数值发出，本来就是三个不同的时刻。我会让一次读取返回一个确定的样本，再把这个样本交给发送任务，避免发送时重新去取一个随时可能被别的任务改写的共享字段。</p><h3>温度峰值的统计窗口</h3><p>到了 <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 程序</a>，同一条消息又会进入两组变量。<code>cpuValue</code> 和 <code>gpuValue</code> 保存最近收到的值，供 OLED 显示；<code>maxCpuValue</code> 和 <code>maxGpuValue</code> 只在收到更高的温度时更新。定时控制部分每隔约 30 秒取两项峰值中较大的一项，存入 <code>maxValue</code>，再按当前模式计算占空比。较低的新读数可以马上出现在屏幕上，前面那个高读数却仍然可能参与下一次输出计算。</p><p>先假设处于自动调速模式，只有定时更新，中途没有按键操作。一个窗口从 0 秒开始，CPU 温度在第 5 秒到达 80°C，第 15 秒和第 25 秒都到达 60°C，GPU 始终低于这次 CPU 峰值。第 30 秒计算输出时，采用的仍是 80°C；随后峰值变量被清零，输出设置则保留到下一次更新。这样，15 秒时屏幕就可能显示 60°C，30 秒时程序却刚开始采用之前的 80°C。读数变低和输出变低，中间隔着一段程序安排的等待。</p><p><code>updatePWM()</code> 在计算输出之外，还会清空峰值。下面摘出函数中计算输出和清空峰值的部分。</p><pre><code>dutyCycle =processBluetoothValue(maxValue);\nledcWrite(ledChannel, map(dutyCycle, 0, 100, 0, 255));\nmaxCpuValue = 0.0;\nmaxGpuValue = 0.0;</code></pre><p>这几行把设置 PWM 和清空温度峰值放在了同一个函数里。继续找调用位置，除了 30 秒定时更新，按键处理函数也会调用它。切换模式或调整频率时，累计的峰值因此也会被清掉。按键这条路径仍然使用此前保存的 <code>maxValue</code>，没有先取出正在累计的新峰值；它也没有重设 <code>lastUpdateTime</code>。</p><p>于是，上面的时间线还可以再推一步。假设第 25 秒处理了一次调频按键，刚才保留的 80°C 会被清除，而第 30 秒的定时更新仍照常到来。到时参与计算的，就是按键清空之后收到的那一小段数据。这让我更在意函数之间的关系了。单看 <code>30000</code>，很容易把它理解成固定的 30 秒统计窗口；把所有清空位置找出来，才能解释一次操作怎样改变了窗口里的内容。</p><h3>样本时间记录与控制时序</h3><p>要继续整理这段程序，我会把写入 PWM 和结算温度窗口分成两个操作。按键可以修改输出设置，温度统计是否重新开始，则由明确的规则决定。比如选择固定周期，就让按键保留正在累计的峰值；如果希望切换模式时重新统计，就同时清空峰值并重设计时起点。两种安排都能说清，混在一个函数里时反而容易忽略。</p><p>上位机的样本也可以多带一点信息。我想保留传感器标识、读数、读取完成时间和消息序号，再在 ESP32 一侧记录收到消息和采用样本的时刻。读取完成时间描述的是程序取到值的时刻，传感器自身可能还有更新周期；电脑时间和 ESP32 的 <code>millis()</code> 也不能直接相减。先用序号对上同一条消息，再分别检查两端各自的等待时间，会比直接减两个不同来源的时间戳清楚。</p><p>这样整理以后，温度降下来了、风扇输出却还没降，就有了可以逐段追查的过程。我能先确认读到了哪一项温度，再看这条消息何时发出、何时收到，以及哪个峰值被用于计算。几秒钟的等待究竟发生在任务之间、发送轮次里，还是峰值保留期间，应该能在记录里找到。把这段时间弄明白，再决定该加快哪一步，调整起来才有依据。</p>", "en": "<h2>Temperature Sampling and Fan Response</h2><p class=\"summary\">Following sensor selection, asynchronous reading and sending, and peak resets to understand when a temperature sample changes fan output.</p><p>To understand a change in this cooler's output, I want to follow the temperature reading that led to it. My desktop program sends the ESP32 short messages such as <code>CPU62.7</code>. The number travels easily enough, but explaining the response calls for more detail: where the reading came from, when it was obtained, and what happened to it along the way.</p><h3>Sensor Selection</h3><p>In the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">desktop source</a>, LibreHardwareMonitor is used to walk through the hardware and its sensors. Each matching CPU temperature overwrites <code>cpuTemperature</code>, with the same approach used for GPU readings. When several temperature entries match during a pass, later assignments replace earlier ones. The name CPU temperature sounds specific, yet the value left in that field depends on which matching entry the traversal reaches last.</p><p>That affects how I interpret a temperature change. To follow <code>CPU Package</code>, for example, I would select that entry explicitly and keep observing it. LibreHardwareMonitor exposes <code>Name</code> and <code>Identifier</code> through its <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/blob/master/LibreHardwareMonitorLib/Hardware/ISensor.cs\" target=\"_blank\" rel=\"noopener\"><code>ISensor</code> interface</a>, giving me a way to identify sensors and define a consistent selection rule. One decimal place makes the number convenient to display. A consistent source makes successive readings useful to compare.</p><h3>Reading and Sending</h3><p>Even with a sensor selected, a new reading still has to be ready for transmission. The desktop timer is set to five seconds. Within one callback, however, it starts monitoring and sending through separate <code>Task.Run</code> calls. Monitoring appears first in the source, but there is no dependency making transmission wait for it to finish. <a href=\"https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/task-based-asynchronous-programming\" target=\"_blank\" rel=\"noopener\">Microsoft's task programming guide</a> covers scheduling and the use of waits or continuations to establish dependencies. As written, the sender can pick up a temperature left in the field by a previous pass.</p><p>A hypothetical sequence makes the ordering easier to follow. Start with 60°C in the field. At 5.000 seconds, the program submits both tasks; at 5.002, the sender takes 60°C; only at 5.080 does monitoring write a new value of 72°C. The transmitted value is still 60°C. Those millisecond offsets are chosen for the example. What matters is the missing wait for the current read to complete. Shortening the timer interval would leave that dependency unresolved.</p><p>CPU and GPU also take turns using the sending opportunity. At the intended cadence, one type is sent every five seconds, so each type gets a turn roughly every ten seconds. A timer tick, completion of a sensor read, and transmission of its value are therefore separate events. I would have a read return a definite sample and pass that sample to the sender. That avoids looking up a shared field again at send time while another task may be changing it.</p><h3>Peak-Temperature Window</h3><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 program</a> handles an arriving message in two ways. It stores the most recently received readings in <code>cpuValue</code> and <code>gpuValue</code> for the OLED. It updates <code>maxCpuValue</code> and <code>maxGpuValue</code> only when a higher reading arrives. About every 30 seconds, the periodic control path saves the larger of those peaks in <code>maxValue</code> and calculates duty according to the current mode. A lower new reading can reach the screen immediately while an earlier high reading remains available for the next output calculation.</p><p>Consider an automatic mode with periodic updates only and no button activity. A window begins at zero seconds. A CPU reading of 80°C arrives at five seconds, followed by 60°C at both 15 and 25 seconds, while the GPU stays below that CPU peak. At 30 seconds, the output calculation still uses 80°C. The retained peaks are then cleared, and the output setting stays in place until the next update. The screen could thus show 60°C from 15 seconds onwards, even as the program starts applying the earlier 80°C at 30 seconds. The software has arranged a wait between a falling reading and a falling output.</p><p>Alongside the output calculation, <code>updatePWM()</code> contains two assignments that clear the peaks. The excerpt below includes both operations.</p><pre><code>dutyCycle =processBluetoothValue(maxValue);\nledcWrite(ledChannel, map(dutyCycle, 0, 100, 0, 255));\nmaxCpuValue = 0.0;\nmaxGpuValue = 0.0;</code></pre><p>Setting PWM and clearing the temperature peaks happen inside the same function. Following its callers, I found that the button handler calls it as well as the 30-second update path. Changing mode or adjusting frequency therefore clears the accumulated peaks too. The button path still uses the previously saved <code>maxValue</code>, without first selecting the new peaks being accumulated, and it leaves <code>lastUpdateTime</code> unchanged.</p><p>That allows another variation on the timeline. Suppose a frequency-button event is handled at 25 seconds. The retained 80°C is cleared, but the periodic update still arrives at 30 seconds. Its calculation now draws on the short stretch of data received after the button reset. This makes the relationship between functions much more interesting to me. Reading <code>30000</code> alone suggests a fixed 30-second collection window. Following every reset explains how an operation can change what remains inside it.</p><h3>Sample Timestamps and Control Timing</h3><p>To reorganize this code, I would separate writing PWM from closing out a temperature window. A button could change the output setting, with an explicit rule deciding whether temperature collection starts again. A fixed-period policy could retain the accumulated peaks through a button event. A policy that restarts collection on a mode change could clear the peaks and reset the timing origin together. Either is straightforward to describe; combining the operations in one function makes the choice easier to overlook.</p><p>I would also keep a little more information with each desktop sample: its sensor identifier, value, read-completion time, and message sequence number. On the ESP32, I could record when the message arrived and when its sample was used. Read completion describes when the program obtained the value; the sensor may have an update cycle of its own. A computer timestamp and ESP32 <code>millis()</code> also cannot be subtracted directly. Matching a message by sequence number and examining the waits on each device separately would give me a clearer account than subtracting timestamps from different clocks.</p><p>A lower temperature with an unchanged fan output would then be something I could trace through the program. I could identify the sensor first, follow the message's departure and arrival, and check which peak entered the calculation. The records should locate those seconds of waiting between tasks, between sending turns, or within peak retention. Once I understand where that time is spent, I have a reason for choosing which part to speed up.</p>"}, "after": {"zh": "<h2>温度采样与风扇响应</h2><p class=\"summary\">沿传感器选择、异步读取与发送、温度峰值清空，研究一条温度样本何时影响风扇输出。</p><p>散热器的上位机每隔几秒就往蓝牙里塞一行 <code>CPU62.7</code>，ESP32 收到以后决定风扇怎么转。一行字送过去很容易，可要解释风扇为什么偏偏在某个时刻变速，就得追问这个数到底是哪个传感器的、什么时候读到的、路上又被怎么处理过。顺着这一行消息往回翻代码，坑比我想的多。</p><h3>传感器的选择</h3><p><a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">上位机代码</a>用 LibreHardwareMonitor 遍历 CPU 和 GPU 底下的所有传感器，只要类型是温度，就把读数写进 <code>cpuTemperature</code> 或 <code>gpuTemperature</code>。一颗 CPU 往往挂着好几个温度项，通常每个核心一个，再加一个封装温度，这段循环挨个写过去，后一个盖掉前一个。变量叫 CPU 温度，最后留下的是哪一项，全看遍历时谁排在最后。窗口里那行 <code>CPU Temp</code> 标签在同一轮里也被刷了好几遍，人眼只看得到最后一下。</p><p>变量名里的 CPU 温度因此说不清指的是哪一项。想跟踪 <code>CPU Package</code>，就该指名道姓地把它挑出来，以后一直盯着同一项。LibreHardwareMonitor 的 <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/blob/master/LibreHardwareMonitorLib/Hardware/ISensor.cs\" target=\"_blank\" rel=\"noopener\"><code>ISensor</code> 接口</a>提供了 <code>Name</code> 和 <code>Identifier</code>，拿它们写一条固定的选择规则就够了。保留一位小数是为了显示，来源固定下来，前后两次读数才有得比。</p><h3>读取和发送的先后</h3><p>传感器选定了，还得看新读数赶不赶得上这一次发送。上位机的定时器 5 秒触发一次，回调里用两个 <code>Task.Run</code> 分别启动测温和发送。代码里测温写在前面，两个任务之间却没有任何等待。<a href=\"https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/task-based-asynchronous-programming\" target=\"_blank\" rel=\"noopener\">Microsoft 的任务编程说明</a>讲得很清楚，一个任务要等另一个，得靠等待或延续明确建立依赖。这段程序两样都没有，发送任务完全可能抢先一步，把上一轮留在字段里的温度发出去。</p><p>测温这边还让这场赛跑更加一边倒。它每一轮都新建一个 <code>Computer</code>，<code>Open()</code> 一遍再从头遍历，初始化硬件监控本身就要花时间；发送那边只是读个字段、往串口写一行。谁先跑完，大概不用猜。</p><p>拿一组假设的时刻推一遍。字段里原本是 60°C；5.000 秒，两个任务一起提交；5.002 秒，发送任务取走 60°C；5.080 秒，测温任务才写进新的 72°C。这一轮发出去的还是 60°C。几十毫秒的差距是推演用的数，关键在于发送从来不等本轮读取完成，定时器调得再快，这层依赖也不会自己冒出来。</p><p>CPU 和 GPU 还要轮流用发送机会，每 5 秒发其中一种，每种大约 10 秒才轮到一次。定时器触发、传感器读完、数值发出，其实是三个不同的时刻。要改这一段，我会让每次读取返回一个确定的样本，再把这个样本直接交给发送，省得发送时回头去翻一个随时可能被别的任务改写的共享字段。</p><h3>30 秒峰值窗口</h3><p>消息到了 <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 程序</a>这边，同一个数会分进两组变量。<code>cpuValue</code> 和 <code>gpuValue</code> 存最近收到的值，给 OLED 显示；<code>maxCpuValue</code> 和 <code>maxGpuValue</code> 只有来了更高的温度才更新。主循环每隔约 30 秒把两个峰值里较大的那个存进 <code>maxValue</code>，再按当前模式算占空比。屏幕上可以马上出现一个更低的新读数，之前那个高温却照样参与下一次输出计算。</p><p>假设处在自动模式，中途没人碰按键。窗口从 0 秒开始，第 5 秒 CPU 来了 80°C，第 15 秒和第 25 秒都是 60°C，GPU 一直低于这次 CPU 峰值。到第 30 秒算输出，用的还是 80°C；算完峰值清零，输出一直保持到下一次更新。于是屏幕从第 15 秒起就显示 60°C，程序却到第 30 秒才开始按 80°C 设置风扇。温度已经降了，风扇还在使劲，中间这段等待是程序自己安排的。</p><h3>按键与峰值清空</h3><p><code>updatePWM()</code> 除了算输出，还顺手把峰值清了。</p><pre><code>dutyCycle =processBluetoothValue(maxValue);\nledcWrite(ledChannel, map(dutyCycle, 0, 100, 0, 255));\nmaxCpuValue = 0.0;\nmaxGpuValue = 0.0;</code></pre><p>写 PWM 和清温度峰值，被放进了同一个函数。再查谁在调用它，除了 30 秒的定时更新，按键处理函数在每次短按的末尾也会调一次。切模式、调频率，都会顺带把攒着的峰值清掉。按键这条路径用的还是上一次存下的 <code>maxValue</code>，没先把正在累计的新峰值取出来，也没重设 <code>lastUpdateTime</code>。</p><p>前面的时间线还能再推一步。假设第 25 秒按了一下调频键，刚才保留的 80°C 被清掉，第 30 秒的定时更新照常到来，这时参与计算的，只剩按键之后那几秒收到的数据。单看 <code>30000</code> 这个常数，很容易把它当成固定的 30 秒统计窗口；把所有清零的地方都找出来，才看清一次按键就能改写窗口里装的东西。函数之间的这层牵连，比常数本身有意思多了。</p><h3>样本记录与控制时序</h3><p>要整理这段程序，我会把写 PWM 和结算温度窗口拆成两个操作。按键只管改输出设置，温度统计要不要重新开始，交给一条明确的规则。选固定周期，就让按键保留正在累计的峰值；想在切模式时重新统计，就把峰值和计时起点一起重置。两种安排都说得清，混在一个函数里，该选哪种反而容易被忽略。</p><p>上位机的样本也可以多带点信息：传感器标识、读数、读取完成的时间和消息序号；ESP32 这边再记下收到消息和采用样本的时刻。读取完成时间只说明程序什么时候拿到这个值，传感器自己可能还有更新周期；电脑的时间和 ESP32 的 <code>millis()</code> 也不能直接相减。先靠序号对上同一条消息，再分别看两端各自等了多久，比硬减两个不同时钟的时间戳靠谱。</p><p>这样一来，温度降了而风扇没降，就成了一个能一段一段查下去的问题。先确认读的是哪一项温度，再看这条消息什么时候发出、什么时候收到，最后看哪个峰值进了计算。那几秒钟到底耗在任务之间、发送轮次里还是峰值窗口里，记录里都找得到，到那时再决定先加快哪一步。</p>", "en": "<h2>Temperature Sampling and Fan Response</h2><p class=\"summary\">Following sensor selection, asynchronous reading and sending, and peak resets to understand when a temperature sample changes fan output.</p><p>Every few seconds the cooler's desktop program pushes a line like <code>CPU62.7</code> into the Bluetooth link, and the ESP32 decides what the fan should do with it. Getting one line across is easy. Explaining why the fan changed at one particular moment means asking which sensor the number came from, when it was read, and what happened to it on the way. Tracing that single message back through the code turned up more traps than I expected.</p><h3>Sensor Selection</h3><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">desktop source</a> uses LibreHardwareMonitor to walk every sensor under the CPU and GPU, and whenever the type is temperature it writes the reading into <code>cpuTemperature</code> or <code>gpuTemperature</code>. A CPU usually exposes several temperature entries, typically one per core plus a package reading, and the loop writes each in turn, every one overwriting the last. The variable is called CPU temperature, yet which entry survives depends on whatever the traversal reaches last. The <code>CPU Temp</code> label in the window is rewritten several times within the same pass, and the eye only catches the final value.</p><p>The name, then, no longer says which temperature it holds. To follow <code>CPU Package</code>, the code should pick that entry by name and keep watching the same one. LibreHardwareMonitor's <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/blob/master/LibreHardwareMonitorLib/Hardware/ISensor.cs\" target=\"_blank\" rel=\"noopener\"><code>ISensor</code> interface</a> exposes <code>Name</code> and <code>Identifier</code>, which are enough for a fixed selection rule. One decimal place is there for display; a fixed source is what makes two successive readings comparable.</p><h3>Read and Send Order</h3><p>With the sensor settled, the next question is whether a fresh reading makes it into this round's message. The desktop timer fires every five seconds, and the callback starts monitoring and sending as two separate <code>Task.Run</code> calls. Monitoring comes first in the source, but nothing makes the sender wait for it. <a href=\"https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/task-based-asynchronous-programming\" target=\"_blank\" rel=\"noopener\">Microsoft's task programming guide</a> is explicit that one task waits for another only through a wait or a continuation. This code sets up neither, so the sender can easily run first and transmit whatever the previous round left in the field.</p><p>The monitoring side also makes the race lopsided. Every round it creates a new <code>Computer</code>, calls <code>Open()</code> and walks the hardware again, and initializing hardware monitoring takes real time, while the sender only reads a field and writes one serial line. It is not hard to guess which task usually finishes first.</p><p>A set of hypothetical times shows the effect. The field holds 60°C. At 5.000 s both tasks are submitted; at 5.002 s the sender takes 60°C; only at 5.080 s does monitoring write a new 72°C. This round still transmits 60°C. The millisecond gaps are illustration values. What matters is that sending never waits for the current read, and a faster timer would not create that dependency by itself.</p><p>CPU and GPU also share the sending turns, one type every five seconds, so each comes round about every ten seconds. The timer tick, the completed read and the transmission are three separate moments. To fix it I would have each read return a definite sample and hand that sample straight to the sender, instead of letting the sender look up a shared field that another task may be rewriting.</p><h3>30-Second Peak Window</h3><p>At the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 program</a>, the same number goes into two sets of variables. <code>cpuValue</code> and <code>gpuValue</code> hold the latest reading for the OLED, while <code>maxCpuValue</code> and <code>maxGpuValue</code> change only when a higher temperature arrives. About every 30 seconds the main loop puts the larger peak into <code>maxValue</code> and calculates duty for the current mode. A lower new reading can appear on screen immediately while the earlier high one still feeds the next output calculation.</p><p>Take an automatic mode with no one touching the buttons. A window opens at 0 s. The CPU reports 80°C at 5 s and 60°C at both 15 and 25 s, and the GPU stays below that CPU peak. At 30 s the output is calculated from 80°C; the peaks are then cleared and the output holds until the next update. From 15 s onward the screen shows 60°C, yet only at 30 s does the program start setting the fan from 80°C. The temperature has already dropped while the fan keeps pushing, and the program itself arranged that wait.</p><h3>Buttons and Peak Resets</h3><p>Besides calculating the output, <code>updatePWM()</code> also clears the peaks along the way.</p><pre><code>dutyCycle =processBluetoothValue(maxValue);\nledcWrite(ledChannel, map(dutyCycle, 0, 100, 0, 255));\nmaxCpuValue = 0.0;\nmaxGpuValue = 0.0;</code></pre><p>Writing PWM and clearing the temperature peaks live in one function. Searching for its callers turned up the button handler as well as the 30-second update, because every short press ends with a call to it. Changing mode or adjusting frequency therefore wipes the accumulated peaks too. The button path also uses the previously saved <code>maxValue</code> without first collecting the new peaks, and it leaves <code>lastUpdateTime</code> untouched.</p><p>That stretches the timeline one step further. Suppose a frequency button is pressed at 25 s. The retained 80°C disappears, the periodic update still arrives at 30 s, and the calculation now draws on only the few seconds of data received after the press. Reading the constant <code>30000</code> on its own suggests a fixed 30-second window. Finding every place that clears it shows how one button press can rewrite what the window contains, and that coupling between functions turned out more interesting to me than the constant itself.</p><h3>Sample Records and Control Timing</h3><p>To reorganize this code, I would split writing PWM from closing out a temperature window. Buttons would change the output setting, and an explicit rule would decide whether collection restarts. With a fixed period, a button press keeps the accumulating peaks; if a mode change should start a fresh count, the peaks and the timing origin reset together. Either choice is easy to state, and combining both operations in one function is what makes the choice easy to miss.</p><p>Each desktop sample could also carry a little more: sensor identifier, value, read-completion time and a message sequence number, with the ESP32 noting when the message arrived and when its sample was used. Read completion only says when the program got the value, and the sensor may have its own update cycle. A PC timestamp and the ESP32's <code>millis()</code> cannot simply be subtracted either. Matching messages by sequence number and then looking at the waits on each side separately is more reliable than subtracting timestamps from two different clocks.</p><p>With that in place, a temperature that falls while the fan stays high becomes something to trace step by step: which reading was taken, when the message left and arrived, and which peak entered the calculation. The records would show whether those seconds went into task scheduling, sending turns or the peak window, and that is when I would decide which step to speed up first.</p>"}, "cb": 1610, "ca": 1627}, {"group": "DIY Cooling", "kind": "笔记", "label": "DIY Cooling · 笔记 · PWM 风扇控制与转速反馈", "route": "https://www.66ccff-labs.com/notes/juanyun-diy-cooling-pwm-fan-control", "before": {"zh": "<h2>PWM 风扇控制与转速反馈</h2><p class=\"summary\">从风扇供电与 PWM 接线，研究频率、占空比和独立测速反馈，理解怎样观察每只风扇的实际响应。</p><p>这台散热器的 OLED 上有一项 <code>Fan Speed</code>，后面显示百分数。我顺着<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">程序里的显示函数</a>往下找，它取的是 <code>dutyCycle</code>，也就是发给风扇的 PWM 占空比。这个名字把我想研究的问题引了出来：一个占空比设置怎样作用于风扇，又要从哪里得到风扇实际转了多快的消息？</p><h3>风扇接口的连线</h3><p>在这版 <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">ESP32 控制板原理图</a>上，D5 接到 <code>PWM</code> 网络，风扇输出接口使用 <code>12V+</code>、<code>12V−</code> 和 <code>PWM</code> 三种信号。两个四针接口也只接了这三种信号，各留一针未连接。顺着连线看，比数接口有几只脚更直接，电源与控制各自走哪根线，一眼就能对上。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-schematic.png\" alt=\"ESP32 控制板原理图中的风扇电源与 PWM 接口\"><figcaption>ESP32 控制板原理图中的风扇电源与 PWM 接口</figcaption></figure></div><p>查四线 PWM 风扇的原理时，我才把风扇内部的驱动电路也放进考虑。它有供电、地、PWM 输入和测速输出这四条连接。电机所需的能量由电源线提供，控制器从 PWM 输入给出指令，风扇内部电路负责驱动电机。<a href=\"https://www.analog.com/en/resources/analog-dialogue/articles/how-to-control-fan-speed.html\" target=\"_blank\" rel=\"noopener\">Analog Devices 的风扇控制说明</a>还讲到，把 PWM 放在专用控制线上，可以让风扇电子电路持续供电；若用开关反复切断整只风扇的电源，测速输出也可能随供电中断。</p><p>这也解释了我在接线时应该分别考虑的两件事。12 V 供电负责提供电机运行所需的能量，GPIO 提供的是逻辑信号。控制信号的电平和参考地要与风扇接口相容，不能按电机的供电电压去理解 PWM 引脚。具体接插件的脚序仍要按图纸和风扇定义逐根对应，四针的外形本身并没有把这些关系说明白。</p><h3>频率、占空比和转速</h3><p>程序最初把 PWM 设为 15 kHz，使用 8 位分辨率。按这个频率计算，一个周期约为 66.7 μs；理想的 50% 占空比，就是每个周期约有 33.3 μs 为高电平。代码把百分数映射到 0 至 255，50 会得到整数 127，对应接近一半的输出比例。这里算的都是引脚上的波形，还没有涉及叶片每分钟转多少圈。</p><p>15 kHz 的脉冲也不需要主循环逐个翻转引脚。<a href=\"https://docs.espressif.com/projects/esp-idf/en/v4.4.8/esp32/api-reference/peripherals/ledc.html\" target=\"_blank\" rel=\"noopener\">ESP32 的 LEDC 文档</a>说明，通道配置好以后，就按设定的频率和占空比产生 PWM。程序可以隔一段时间才写入新的占空比，期间外设继续输出原来的波形。温度处理多久改变一次设置，与 PWM 一个周期有多长，分属两种时间尺度。</p><p>频率该选多少，我会先查具体风扇的接口要求。以 <a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">Noctua 的微控制器接线说明</a>为例，它给出的目标值是 25 kHz，接受范围为 21 至 28 kHz。这是厂商对其风扇的要求，可以拿来学习怎样核对接口。原程序里按键每次把频率加减 200 Hz，只是在改变波形的重复频率；把频率数值调高，并不等于给风扇增加了同样比例的转速。</p><h3>测速接口与转速换算</h3><p>实际转速需要从另一个方向传回来。<a href=\"https://cdn.noctua.at/media/Noctua_PWM_specifications_white_paper.pdf\" target=\"_blank\" rel=\"noopener\">Noctua 的 PWM 技术白皮书</a>说明，其风扇使用开集电极测速输出，每转一圈产生两个脉冲。风扇内部的输出晶体管导通时，把信号线拉低；关断时，信号线靠外部上拉电阻回到高电平。控制器接在这个节点上，就能数到随转动产生的脉冲。</p><p>我会按主控的逻辑电压选择上拉电源，并让测速输出与主控共用参考地。假设上拉到 3.3 V，电阻取 10 kΩ，输出拉低时的电流约为 0.33 mA。这个计算方便检查电流大小，实际选值还要兼顾输出允许的灌电流和信号上升速度。电阻太大，信号线上的电容充电会更慢；到主控引脚处观察高低电平和边沿，才能知道它能否被可靠识别。</p><p>每圈脉冲数确定以后，计算就很短。按两脉冲一圈举例，100 Hz 的测速信号对应每秒 50 圈，也就是 3000 rpm。我之前在<a href=\"https://www.66ccff-labs.com/notes/arduino-smart-car-line-tracking-learning-note\" target=\"_blank\" rel=\"noopener\">小车电源与速度反馈笔记</a>里研究过脉冲计时，这里沿用同一个计数思路。要换成风扇自己的每圈脉冲数，并把测速频率与前面控制端的 15 kHz 分开。</p><p>两个风扇还会多出一个接线问题。原理图上的两路风扇输出共用 <code>PWM</code>，所以会收到同一个控制波形。若希望知道两只风扇各自的转速，就需要分别接收测速信号。按开集电极的工作方式推下去，把两个测速输出并在一起，任意一边拉低都会让公共节点变低，重叠的脉冲便无法分清来自哪一只。共享控制指令很方便，分别观察每只风扇还需要各自的反馈。</p><h3>占空比与风扇转速</h3><p>有了测速读数，占空比与转速的关系才方便放到一起比较。我想固定供电电压和 PWM 频率，逐档改变占空比，等转速稳定后记录下来，画出这只风扇的响应曲线。低占空比处尤其值得单独试，从静止开始能否启动，以及已经转起来后能否继续降低占空比，可以分别记录。这样得到的曲线，也就包含了实际使用时关心的启动和低速运行情况。</p><p>这版程序目前把占空比显示在 <code>Fan Speed</code> 后面，没有读取测速输入。我更愿意让界面直接显示 <code>PWM</code> 百分数，接入测速后再单独显示 <code>RPM</code>。一项告诉我发出了什么设置，一项告诉我风扇怎样响应。调节时就能同时看到设置和响应，也能单独检查两只风扇的运行情况。</p>", "en": "<h2>PWM Fan Control and Speed Feedback</h2><p class=\"summary\">Studying fan power and PWM connections, waveform frequency and duty, and separate tachometer feedback for measuring each fan’s response.</p><p>The cooler's OLED labels a percentage as <code>Fan Speed</code>. Following the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">display function</a>, I find that it reads <code>dutyCycle</code>, the PWM duty sent to the fan. That label gives me a useful question to pursue. How does a duty setting act on a fan, and where would I get a reading of how fast the fan actually turns?</p><h3>Fan Interface Wiring</h3><p>On this version of the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">ESP32 controller schematic</a>, D5 connects to the <code>PWM</code> net. The fan outputs use three signals, <code>12V+</code>, <code>12V−</code>, and <code>PWM</code>. The two four-pin connectors also carry only those three signals, leaving one pin unconnected on each. Following the nets tells me more directly where power and control go than counting the connector pins does.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-schematic.png\" alt=\"Fan power and PWM connections on the ESP32 controller schematic\"><figcaption>Fan power and PWM connections on the ESP32 controller schematic</figcaption></figure></div><p>Studying four-wire PWM fans brought their internal drive electronics into the picture for me. The four connections provide power, ground, a PWM input, and a tachometer output. The supply wires deliver the motor's energy, the controller sends a command through the PWM input, and circuitry inside the fan drives the motor. <a href=\"https://www.analog.com/en/resources/analog-dialogue/articles/how-to-control-fan-speed.html\" target=\"_blank\" rel=\"noopener\">Analog Devices' explanation of fan control</a> also describes why a dedicated PWM input matters. It lets the fan electronics remain powered; repeatedly switching the entire fan supply can interrupt the tachometer output along with it.</p><p>I can now consider the two wiring jobs separately. The 12 V supply provides energy for the motor, while the GPIO provides a logic signal. That signal needs a compatible voltage level and ground reference at the fan interface. The motor supply voltage does not define the PWM pin's logic level. I would map each connector pin against the schematic and the fan's pin definitions; a four-pin housing alone leaves those connections unspecified.</p><h3>Frequency, Duty, and Speed</h3><p>The program initially configures PWM at 15 kHz with 8-bit resolution. A cycle at that frequency lasts about 66.7 μs. An ideal 50% duty keeps the signal high for about 33.3 μs of each cycle. The code maps percentages to integers from 0 to 255, so 50 becomes 127, producing approximately half duty. All of these quantities describe the pin waveform. None yet tells me how many revolutions the blades make per minute.</p><p>The main loop also does not have to toggle the pin for every 15 kHz pulse. As the <a href=\"https://docs.espressif.com/projects/esp-idf/en/v4.4.8/esp32/api-reference/peripherals/ledc.html\" target=\"_blank\" rel=\"noopener\">ESP32 LEDC documentation</a> explains, a configured channel generates PWM at the selected frequency and duty. The program can wait before writing a new duty while the peripheral continues producing the previous waveform. How often temperature processing changes a setting and how long one PWM cycle lasts are two different time scales.</p><p>For the frequency itself, I would start with the particular fan's interface requirements. <a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">Noctua's microcontroller guide</a>, for example, specifies a 25 kHz target and an accepted range of 21 to 28 kHz for its fans. It is a useful manufacturer example of what to check. The original program lets buttons change frequency in 200 Hz steps. Those steps change how often the waveform repeats; a proportional increase in fan speed does not follow from increasing that number.</p><h3>Tachometer Interface and RPM Calculation</h3><p>An actual speed reading has to travel back from the fan. <a href=\"https://cdn.noctua.at/media/Noctua_PWM_specifications_white_paper.pdf\" target=\"_blank\" rel=\"noopener\">Noctua's PWM white paper</a> describes an open-collector tachometer output producing two pulses per revolution on its fans. The internal output transistor pulls the signal low when it conducts. When it switches off, an external pull-up resistor brings the line high. A controller connected to that node can count the pulses produced as the fan rotates.</p><p>I would choose the pull-up supply for the controller's logic voltage and give the tachometer output and controller a common ground reference. For a worked example, a 10 kΩ resistor to 3.3 V gives approximately 0.33 mA while the output is low. That calculation helps check the current, but resistor selection also depends on the allowed sink current and the signal's rise time. A larger resistance charges the line capacitance more slowly. Inspecting the levels and edges at the controller input would establish whether the signal can be read reliably.</p><p>Once the pulse count per revolution is known, the conversion is short. At two pulses per revolution, a 100 Hz tachometer signal represents 50 revolutions per second, or 3000 rpm. I explored pulse timing in the <a href=\"https://www.66ccff-labs.com/notes/arduino-smart-car-line-tracking-learning-note\" target=\"_blank\" rel=\"noopener\">car power and speed-feedback note</a>; the same counting idea applies here. I need the fan's own pulses-per-revolution value and must keep the tachometer frequency separate from the 15 kHz control waveform.</p><p>Two fans introduce another wiring question. Both fan outputs in the schematic share <code>PWM</code>, so they receive the same control waveform. Reading each fan's speed would require separate tachometer inputs. Reasoning from the open-collector circuit, joining both outputs would let either one pull the shared node low. Overlapping pulses would no longer identify which fan produced them. Sharing a command is convenient, while observing each fan individually requires its own feedback.</p><h3>Duty Cycle and Fan Speed</h3><p>With a speed reading available, I could compare duty and rotation directly. I would hold supply voltage and PWM frequency constant, step through duty settings, and record speed after it settles to build a response curve for that fan. Low duty deserves a closer check. Starting from rest and reducing duty on a fan that is already turning can be recorded separately, so the curve also captures the starting and low-speed behaviour that matter in use.</p><p>The current program displays duty after <code>Fan Speed</code> and does not read a tachometer input. I would label that percentage <code>PWM</code> and add a separate <code>RPM</code> reading when speed sensing is connected. One shows the setting I sent; the other shows the fan's response. Both would be visible while adjusting the cooler, with each fan's operation available to check individually.</p>"}, "after": {"zh": "<h2>PWM 风扇控制与转速反馈</h2><p class=\"summary\">从风扇供电与 PWM 接线，研究频率、占空比和独立测速反馈，理解怎样观察每只风扇的实际响应。</p><p>散热器的 OLED 上有一行 <code>Fan Speed</code>，后面跟着一个百分数，看着挺像转速。顺着<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">显示函数</a>往下找，它印出来的是 <code>dutyCycle</code>，也就是发给风扇的 PWM 占空比。名字和内容对不上，正好引出一个值得弄清楚的问题：占空比设置到底怎样作用到风扇上，风扇实际转多快，又该从哪里读回来。</p><h3>风扇接口的连线</h3><p><a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">ESP32 控制板原理图</a>上，D5 接到 <code>PWM</code> 网络，风扇输出用到 <code>12V+</code>、<code>12V−</code> 和 <code>PWM</code> 三种信号。两个四针接口也只接了这三种，各空着一针。顺着网络看，比数接口有几只脚直观，电源和控制各走哪根线，一下就能对上。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-schematic.png\" alt=\"ESP32 控制板原理图中的风扇电源与 PWM 接口\"><figcaption>ESP32 控制板原理图中的风扇电源与 PWM 接口</figcaption></figure></div><p>查四线 PWM 风扇的工作方式，我才把风扇肚子里的驱动电路也算进来。四根线分别是供电、地、PWM 输入和测速输出。电机要的能量从电源线来，控制器从 PWM 线下指令，真正驱动电机的是风扇内部的电路。<a href=\"https://www.analog.com/en/resources/analog-dialogue/articles/how-to-control-fan-speed.html\" target=\"_blank\" rel=\"noopener\">Analog Devices 的风扇控制说明</a>还提到，PWM 单独走一根控制线，风扇里的电子电路就能一直有电；要是拿开关反复切整只风扇的供电，测速输出也可能跟着断掉。</p><p>这样一来，供电和控制在接线时就得分开想。12 V 送的是电机运转的能量，GPIO 给的是逻辑信号，控制信号的电平和参考地要跟风扇接口对得上，不能拿电机的供电电压去理解 PWM 引脚。具体的脚序还得按图纸和风扇定义一根根对，光看四针的外形，什么也定不下来。</p><h3>频率、占空比和转速</h3><p>程序一开始把 PWM 设在 15 kHz、8 位分辨率。一个周期约 66.7 μs，理想的 50% 占空比，就是每个周期里大约 33.3 μs 是高电平。代码把 0 到 100 的百分数映射到 0 到 255，50 得到 127，略低于一半。这些数说的都是引脚上的波形，跟叶片一分钟转几圈还没扯上关系。</p><p>15 kHz 的脉冲也用不着主循环一个个去翻。<a href=\"https://docs.espressif.com/projects/esp-idf/en/v4.4.8/esp32/api-reference/peripherals/ledc.html\" target=\"_blank\" rel=\"noopener\">ESP32 的 LEDC 文档</a>说明，通道配好以后，外设会按设定的频率和占空比自己产生 PWM。程序隔一阵才写一次新的占空比，中间外设照旧输出原来的波形。温度处理多久改一次设置，和 PWM 一个周期多长，完全是两个时间尺度上的事。</p><p>频率选多少，先得查具体风扇的接口要求。以 <a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">Noctua 的微控制器接线说明</a>为例，他们家风扇的目标值是 25 kHz，可接受范围 21 到 28 kHz。这是厂商对自家风扇的要求，正好拿来练习怎么核对接口。原程序里按一次键，频率加减 200 Hz，改的只是波形重复得多快；频率数字调高了，风扇并不会按同样的比例转得更快。</p><h3>测速接口与转速换算</h3><p>真正的转速得从风扇那头传回来。<a href=\"https://cdn.noctua.at/media/Noctua_PWM_specifications_white_paper.pdf\" target=\"_blank\" rel=\"noopener\">Noctua 的 PWM 技术白皮书</a>说明，他们的风扇用开集电极测速输出，每转一圈出两个脉冲。风扇里的输出晶体管导通时把信号线拉低，关断时靠外部上拉电阻把线拉回高电平。控制器接在这个节点上，就能数到随转动产生的脉冲。</p><p>上拉电源要按主控的逻辑电压来选，测速输出和主控还得共地。假设上拉到 3.3 V、电阻取 10 kΩ，输出拉低时电流约 0.33 mA。这个算式能核对电流大小，实际取值还要顾及输出允许的灌电流和信号上升速度，电阻越大，线上的电容充得越慢。主控引脚上的高低电平和边沿能不能被可靠识别，得拿示波器看过才算数。</p><p>每圈脉冲数确定以后，换算就很短了。按两脉冲一圈算，100 Hz 的测速信号对应每秒 50 圈，也就是 3000 rpm。小车那篇<a href=\"https://www.66ccff-labs.com/notes/arduino-smart-car-line-tracking-learning-note\" target=\"_blank\" rel=\"noopener\">供电与轮速测量</a>研究过脉冲计时，这里沿用同一个计数思路，只是要换成风扇自己的每圈脉冲数，也别把测速频率和控制端的 15 kHz 搅在一起。</p><p>两只风扇又带出一个接线问题。原理图上两路风扇输出共用 <code>PWM</code>，收到的是同一个控制波形。想分别知道两只风扇的转速，测速信号就得分开接。按开集电极的工作方式推下去，两个测速输出要是并在一起，任何一边拉低都会把公共节点拉低，脉冲叠在一起，就分不清是哪一只的了。控制指令共用很省事，想单独看清每只风扇，还得各给一路反馈。</p><h3>占空比与转速的对应关系</h3><p>有了测速读数，占空比和转速才能放在一起比。我想固定供电电压和 PWM 频率，一档一档改占空比，等转速稳定后记下来，画出这只风扇的响应曲线。低占空比那一段尤其值得单独试，从静止能不能起转，已经转起来以后能降到多低还不停，分开记。这样画出来的曲线，才包含实际使用时最在意的启动和低速表现。</p><p>这版程序把占空比挂在 <code>Fan Speed</code> 后面，又没读测速输入。要改的话，屏幕上那行干脆写成 <code>PWM</code>，接上测速以后再单独加一行 <code>RPM</code>。一行是我发出去的设置，一行是风扇给出的回应，两行并排摆着，调风扇的时候哪只在偷懒，一眼就看得出来。</p>", "en": "<h2>PWM Fan Control and Speed Feedback</h2><p class=\"summary\">Studying fan power and PWM connections, waveform frequency and duty, and separate tachometer feedback for measuring each fan’s response.</p><p>The cooler's OLED has a line reading <code>Fan Speed</code> followed by a percentage, which looks a lot like a speed. Following the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">display function</a> down, what it prints is <code>dutyCycle</code>, the PWM duty sent to the fan. The mismatch between label and content leads straight to a question worth settling: how a duty setting actually acts on a fan, and where a reading of how fast the fan really turns would have to come from.</p><h3>Fan Interface Wiring</h3><p>On the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">ESP32 controller schematic</a>, D5 connects to the <code>PWM</code> net, and the fan outputs use three signals, <code>12V+</code>, <code>12V−</code> and <code>PWM</code>. The two four-pin connectors carry only those three as well, each leaving one pin unconnected. Following the nets makes it clearer than counting pins which wire carries power and which carries control.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-schematic.png\" alt=\"Fan power and PWM connections on the ESP32 controller schematic\"><figcaption>Fan power and PWM connections on the ESP32 controller schematic</figcaption></figure></div><p>Looking into how four-wire PWM fans work made me count the drive circuit inside the fan as part of the system. The four connections are power, ground, PWM input and tachometer output. The motor's energy comes through the supply wires, the controller gives its command on the PWM line, and the fan's own electronics drive the motor. <a href=\"https://www.analog.com/en/resources/analog-dialogue/articles/how-to-control-fan-speed.html\" target=\"_blank\" rel=\"noopener\">Analog Devices' explanation of fan control</a> adds that a dedicated PWM line lets those electronics stay powered, whereas repeatedly switching the whole fan supply can cut the tachometer output along with it.</p><p>Power and control therefore need separate thought when wiring. The 12 V supply delivers the motor's running energy, while the GPIO provides a logic signal whose level and ground reference have to suit the fan interface; the motor's supply voltage says nothing about the PWM pin's logic level. The actual pin order still has to be matched wire by wire against the schematic and the fan's definition, because a four-pin housing on its own settles none of it.</p><h3>Frequency, Duty and Speed</h3><p>The program starts PWM at 15 kHz with 8-bit resolution. One cycle lasts about 66.7 μs, so an ideal 50% duty keeps the signal high for roughly 33.3 μs each cycle. The code maps percentages from 0 to 100 onto 0 to 255, and 50 becomes 127, just under half. All of these numbers describe the waveform on the pin; none of them yet says how many times the blades turn in a minute.</p><p>The main loop does not have to toggle the pin for every 15 kHz pulse either. According to the <a href=\"https://docs.espressif.com/projects/esp-idf/en/v4.4.8/esp32/api-reference/peripherals/ledc.html\" target=\"_blank\" rel=\"noopener\">ESP32 LEDC documentation</a>, once a channel is configured the peripheral generates PWM at the set frequency and duty by itself. The program writes a new duty only now and then, and between writes the peripheral keeps producing the old waveform. How often temperature processing changes the setting and how long one PWM cycle lasts sit on entirely different time scales.</p><p>Choosing the frequency starts with the particular fan's interface requirements. <a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">Noctua's microcontroller guide</a>, for example, targets 25 kHz for its fans and accepts 21 to 28 kHz. That is one manufacturer's requirement for its own fans, and a handy example of what to check. In the original program each button press moves the frequency up or down by 200 Hz, which only changes how fast the waveform repeats; raising that number does not make the fan spin proportionally faster.</p><h3>Tachometer Interface and RPM Calculation</h3><p>A real speed reading has to travel back from the fan. <a href=\"https://cdn.noctua.at/media/Noctua_PWM_specifications_white_paper.pdf\" target=\"_blank\" rel=\"noopener\">Noctua's PWM white paper</a> describes an open-collector tachometer output on its fans that produces two pulses per revolution. When the fan's internal output transistor conducts it pulls the line low; when it switches off, an external pull-up resistor brings the line back high. A controller attached to that node can count the pulses as the fan turns.</p><p>The pull-up should go to the controller's logic voltage, and the tachometer output and controller need a common ground. With a 10 kΩ pull-up to 3.3 V, about 0.33 mA flows while the output is low. That figure checks the current, but the actual value also has to respect the output's allowed sink current and the signal's rise time, since a larger resistor charges the line capacitance more slowly. Whether the controller pin sees clean enough levels and edges to count reliably is something to confirm on an oscilloscope.</p><p>Once pulses per revolution are known, the conversion is short. At two pulses per revolution, a 100 Hz tachometer signal means 50 revolutions per second, or 3000 rpm. The car's <a href=\"https://www.66ccff-labs.com/notes/arduino-smart-car-line-tracking-learning-note\" target=\"_blank\" rel=\"noopener\">power and wheel-speed note</a> worked through pulse timing, and the same counting idea carries over here, as long as the fan's own pulses-per-revolution value is used and the tachometer frequency is kept apart from the 15 kHz control waveform.</p><p>Two fans bring one more wiring question. Both fan outputs on the schematic share <code>PWM</code>, so they receive the same control waveform. Knowing each fan's speed separately would need separate tachometer inputs. Following the open-collector behaviour through, tying both outputs together would let either fan pull the shared node low, and with the pulses overlapping there would be no telling which fan produced them. A shared command is convenient; watching each fan on its own needs a feedback line for each.</p><h3>Duty Cycle and Fan Speed</h3><p>With a speed reading available, duty and rotation can finally be compared side by side. I would hold the supply voltage and PWM frequency fixed, step the duty one notch at a time, record the speed once it settles, and plot this fan's response curve. The low-duty end deserves its own test: whether the fan can start from rest, and how low the duty can go once it is already spinning before it stops, recorded separately. A curve built that way includes the starting and low-speed behaviour that matters most in actual use.</p><p>This version of the program hangs duty cycle after <code>Fan Speed</code> and never reads a tachometer input. To change that, the screen line would simply say <code>PWM</code>, with a separate <code>RPM</code> line added once speed sensing is wired in. One line shows the setting I sent, the other shows how the fan answered, and with the two side by side it would be obvious at a glance which fan was slacking off.</p>"}, "cb": 1495, "ca": 1426}, {"group": "Digital Clock", "kind": "主页", "label": "Digital Clock · 主页 · Arduino 面包板两位数码管计数器", "route": "https://www.66ccff-labs.com/work/arduino-digital-clock-counter", "before": {"zh": "<h2>Arduino 面包板两位数码管计数器</h2><p class=\"summary\">我承担 MEC104 A17 组两位计数器的大部分搭建、编程与调试。数码管接法和六脚按键先后出问题，我通过逐段试灯、测量开关通断，把显示、暂停和复位调通。</p><h3>两位计数器</h3><p>加入 MEC104 A17 组时，我刚做过 Arduino 小车，这是第二次接触嵌入式。我以为计数器会轻松一些，写个程序，每隔一段时间加一，再给它接上暂停和复位就行。组内的面包板搭建、引脚查找、译码接线、Arduino 程序、按键调试和最终联调主要由我完成，其他组员负责报告、视频与小组事务。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/breadboard-counter-photo.jpg\" alt=\"面包板上的两位数码管计数器原型\"><figcaption>面包板上的两位数码管计数器原型</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/course-project-requirement.png\" alt=\"课程项目目标页\"><figcaption>课程项目目标页</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/course-basic-requirements.png\" alt=\"两位显示与按键要求\"><figcaption>两位显示与按键要求</figcaption></figure></div><p>实物摆开以后，Arduino Nano 旁边是两颗译码器、两位数码管和一大片杜邦线。一个计数值要拆成十位与个位，各自通过四位 BCD 控制一颗 SN54LS47，再由它驱动对应数码管。报告把两组 BCD 输出分别画在 D9 到 D12、D5 到 D8。我写了拆位与输出程序，却很快发现，数字在程序里变化，显示未必会跟着正常变化。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/report-two-digit-wiring.png\" alt=\"作业报告里的两位数码管接线图\"><figcaption>作业报告里的两位数码管接线图</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/report-digit-split-code.png\" alt=\"作业报告里的个位和十位拆分代码\"><figcaption>作业报告里的个位和十位拆分代码</figcaption></figure></div><h3>数码管接线</h3><p>按课程 PPT 把公共端接到 GND，数码管有时全黑，有时乱码。我先查自己的程序和接线，TA 也没能解释清楚。后来在面包板上逐段换线、试高低电平，才发现手里的显示链路需要按共阳方式连接，公共端应接 VCC。PPT 用的是 CD4511 驱动共阴显示的仿真，实物器件的前提与它对不上。</p><p>我们把发现告诉教授后，他用麦克风向全班说明了这件事，其他组也正卡在这里。那时我的知识还不足以完整解释译码器的输出结构，但实物测试已经足以让我修正接法。整理作品集时再查 <a href=\"https://www.ti.com/lit/ds/symlink/sn74ls47.pdf\" target=\"_blank\" rel=\"noopener\">TI 的 LS47 资料</a>，才把低有效、开集电极输出与共阳 LED 的关系补齐。</p><h3>按键排查</h3><p>显示调通后，两个六脚自锁按键又让我折腾了一阵。没有数据手册，也不知道怎样按型号找资料，我先靠换线试，遇到过按下没反应、读数乱跳，以及按一次触发两次。继续改按键判断，仍然绕不开一个硬件问题，按下前后究竟哪几只脚导通。</p><p>我向老师借了万用表，用通断档逐对测引脚，把开关的内部连接关系画出来，再把暂停与复位接到 D2、D3。最终两个功能都能正常使用。</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/report-switch-logic-code.png\" alt=\"作业报告里的开关逻辑代码\"><figcaption>作业报告里的开关逻辑代码</figcaption></figure></div><h3>演示与归档</h3><p>考核要分别演示两个版本，一个计到组号 <code>17</code> 后回到 <code>00</code>，另一个计到 <code>99</code> 后回到 <code>00</code>。我修改阈值，分别烧录，再让老师逐项检查。课堂上，两位显示、暂停和复位都工作正常，TA 给了满分。</p><p>当年的代码依赖轮询和阻塞式 <code>delay()</code>，今天看确实稚嫩。但这次实践留下的习惯很具体，图纸与实物不一致时，我会先确认器件和电流路径；按键状态不对，就先量导通关系。程序当然要检查，只是从那以后，我不再指望改代码能修好所有接线问题。</p>", "en": "<h2>Arduino Breadboard Two-Digit Seven-Segment Counter</h2><p class=\"summary\">For MEC104 Group A17, I handled most of the two-digit counter’s wiring, firmware, and debugging. Testing the display segments and measuring switch contacts resolved faults that code changes had not.</p><h3>Two-Digit Counter</h3><p>Joining MEC104 Group A17 came just after my Arduino car project, making this my second encounter with embedded development. A counter sounded easier: increment a value at regular intervals and add pause and reset. I handled most of the technical implementation, including the breadboard, pin research, decoder wiring, Arduino program, button debugging, and integration. Other members took care of the report, video, and group administration.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/breadboard-counter-photo.jpg\" alt=\"Breadboard digital-clock counter prototype\"><figcaption>Breadboard digital-clock counter prototype</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/course-project-requirement.png\" alt=\"Course project requirement slide\"><figcaption>Course project requirement slide</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/course-basic-requirements.png\" alt=\"Basic two-digit and button requirements\"><figcaption>Basic two-digit and button requirements</figcaption></figure></div><p>On the bench, an Arduino Nano sat beside two decoders, two displays, and a generous spread of jumper wires. The count had to be separated into tens and units, with each four-bit BCD value sent to an SN54LS47 driving its own digit. The report assigns the two BCD groups to D9 through D12 and D5 through D8. I wrote the digit-splitting and output code, then discovered how little a changing variable guaranteed about the physical display.</p><div class=\"images\"><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/report-two-digit-wiring.png\" alt=\"Two-digit wiring from the homework report\"><figcaption>Two-digit wiring from the homework report</figcaption></figure><figure><img loading=\"lazy\" src=\"https://www.66ccff-labs.com/uploads/projects/ard
