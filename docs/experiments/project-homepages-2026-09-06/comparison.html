<a href=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/metro-pwm-lookup-excerpt.c\" target=\"_blank\" rel=\"noopener\">查表插值函数<\/a>。记录中 PWM 从 0 增到 1000，ADC 从 1600 降到 480；目标位于两个记录点之间，就用线性插值求对应输出。<\/p><p>这套程序根据目标值查表得到 PWM，实测 ADC 用来显示和打印。我当时也想过再加反馈修正，最后先保留了这套前馈实现。<\/p><h3>实习结束<\/h3><p>大约 20 个工作日后，我独立完成了这条学习路线。工程师看了 demo，听我解释外设之间怎样配合，评价我学得比较扎实。同期我还阅读了 PID、ATP、ATO、ATS 的入门资料。<\/p><p>后来学 FOC 时，我又遇到了 Timer、ADC 和 PWM，只是要求变成了采样与开关时刻的配合，以及一次计算能否及时完成。天津这一个月让我有了继续往下查的起点。遇到一个外设函数，我已经会去找它依赖的时钟、信号和执行顺序。<\/p>"}, "en": {"before": "<h2>From Arduino High/Low Calls to STM32 Peripherals: A Tianjin Jintie Communications Internship<\/h2><p class=\"summary\">During a one-month embedded internship at Tianjin Jintie Communications, I went from Arduino-style high/low calls to a self-directed STM32 path through GPIO, EXTI, timers, PWM, UART, and ADC, then joined the external sensors, display, servo, and LED in one bare-metal demo.<\/p><h3>The Magic Wand Had to Work Before GPIOC13 Could Blink<\/h3><p>In February 2025, I joined Tianjin Jintie Communications Co., Ltd. for a one-month placement under the formal title of Embedded Systems Intern. My internship certificate came from Jintie Communications, while my desk was inside the Tianjin Rail Transit Group headquarters. <a href=\"https://static.cninfo.com.cn/finalpage/2024-04-30/1219962825.pdf\" target=\"_blank\" rel=\"noopener\">The Group&#x27;s public disclosure<\/a> identifies it as fully owned within the Group structure. The setting sounded close to railway engineering, but the first objects on my desk were much smaller. They were an STM32F103C8T6 Blue Pill, an ST-Link, and a collection of introductory material from the supervising engineer. This was a training exercise, not work on a production rail system.<\/p><p>The material did not arrive with a daily syllabus, which was fair for a one-month intern. I combined it with online tutorials and arranged my own sequence. GPIO led to EXTI, then Timer, PWM / UART / ADC, and finally an integrated demo. Before this, I had only used an Arduino Nano in university projects. My entire mental model of a microcontroller was little more than calling one function for high and another for low.<\/p><p>The first real obstacle was not C code but Keil&#x27;s Magic Wand settings. Device support packs, compiler selection, library paths, target addresses, and ST-Link download options appeared together before I understood what a startup address or flash algorithm was responsible for. Build Succeeded only meant that the computer had produced a program; it did not mean the program had reached the board. A 300 ms blink on GPIOC13 became my first end-to-end test, crossing the project, compiler, programmer, MCU, and physical pin.<\/p><p>The smallest code excerpt enables the GPIOB and GPIOC clocks, establishes the OLED module&#x27;s power levels on PB4 and PB5, and then alternates PC13. It was the first time I noticed how much an Arduino API had kept out of sight. A peripheral clock must exist before the port can work, and the pin&#x27;s mode, speed, and initial level still have to be chosen. ST&#x27;s <a href=\"https://www.st.com/resource/en/application_note/an3268-stm32vldiscovery-firmware-package-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">Standard Peripheral Library<\/a> shortened the register syntax; it did not make those hardware decisions for me.<\/p><p><a href=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/stm32-basic-gpio-oled-loop.c\" target=\"_blank\" rel=\"noopener\">Basic GPIO and OLED loop<\/a> preserves that first chain beside the pin reference.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/stm32f103c8t6-pinout.png\" alt=\"STM32F103C8T6 pinout reference\"><figcaption>STM32F103C8T6 pinout reference<\/figcaption><\/figure><\/div><h3>Below SetBits Were Clocks, Modes, and Registers<\/h3><p>While learning GPIO, I deliberately followed the library calls downward. On the F103, GPIO, AFIO, ADC, and some USART clocks are enabled on APB2, while TIM2–4, I²C, and other USART peripherals sit on APB1. A pin must then be configured as an input, push-pull output, open-drain output, or alternate function. The <a href=\"https://www.st.com/resource/en/reference_manual/rm0008-stm32f101xx-stm32f102xx-stm32f103xx-stm32f105xx-and-stm32f107xx-advanced-arm-based-32-bit-mcus-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">RM0008 reference manual<\/a> let me connect the library routines to the RCC and GPIO configuration registers. <code>SetBits<\/code> stopped looking like an incantation; it was simply the last visible action in a longer hardware path.<\/p><p>EXTI and timers split the next question in two. Which edge just occurred, and when should this happen again? The encoder turned pin transitions into events. Timers derived update rhythms from their clocks, prescalers, and counter periods. In the integrated project, <code>Encoder_EXTI_Config()<\/code>, <code>TIM3_Config()<\/code>, and <code>TIM4_PWM_Config()<\/code> appeared together, but they dealt with edge capture, task pacing, and a PWM time base, not three differently named delays.<\/p><p>The OLED gave me a more concrete lesson. The code compiled and flashed, the wiring looked correct, yet the display stayed blank. Moving the bus to another pair of ordinary GPIO pins and bit-banging I²C brought it back. During the internship, all I knew was that changing pins worked. In hindsight, ST&#x27;s <a href=\"https://www.st.com/resource/en/errata_sheet/es096-stm32f101x8b-stm32f102x8b-and-stm32f103x8b-mediumdensity-device-limitations-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">F103x8/xB errata<\/a> documents a hardware-I²C condition that can leave the BUSY flag locked, so the explanation is technically plausible. I did not retain the BUSY register state, waveforms, or exact pins, however, so it remains a present-day hypothesis rather than a proven root cause. The observed failure, the switch to software I²C, and the recovered display are the parts I can state with confidence.<\/p><h3>Sixteen Points Carried an ADC Target into TIM4<\/h3><p>PWM, UART, and ADC taught me to separate data by purpose. ADC turned the light sensor&#x27;s analogue voltage into a sample. PWM used a timer period and compare value to shape the pulses seen by an LED or servo. UART carried light readings and debug text to a computer. All three moved numbers, but they served measurement, actuation, and observability rather than forming one interchangeable kind of interface.<\/p><p>To map a target light reading to an LED output, I changed the PWM setting point by point and recorded the resulting ADC values. The 16 measured pairs run from PWM 0 / ADC 1600 to PWM 1000 / ADC 480. <code>Lookup_PWM_For_Target()<\/code> locates the two points surrounding a target, linearly interpolates between them, and writes the result to TIM4 channel 1. The divider orientation made the ADC value fall as the PWM value rose. I did not convert the readings to lux or characterize fitting error; the calibration answered which compare value worked for this breadboard setup, not its photometric accuracy.<\/p><p>This path is easy to mislabel as closed loop, but the code is more precise. The target is mapped directly to PWM, while measured light is read, displayed, and printed over UART. There is no target-minus-measurement error and no correction based on that error. It is a feedforward calibration with visible measurement. I remember considering feedback at the time; it did not make it into the final code.<\/p><p><a href=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/metro-pwm-lookup-excerpt.c\" target=\"_blank\" rel=\"noopener\">PWM lookup excerpt<\/a><\/p><h3>Every Peripheral Finally Had to Share One main()<\/h3><p>GPIO, OLED, encoder, servo, DHT11, light sensing, PWM, and UART first ran as separate exercises. I then joined them in one bare-metal program around the same Blue Pill, breadboard, and Dupont wires. There was no custom carrier board. A button switched what the encoder controlled. One mode changed target light, while the other changed servo speed. GPIOC13 acted as a status indicator. The OLED showed measured light, target, LED output, temperature, and humidity, while UART sent light data and debug messages to the computer. All of these functions ran together in the final bench demo.<\/p><p>The condensed main-loop excerpt preserves the light-control path. <code>Get_Encoder_Value()<\/code> changes the target; a flag gates light-sensor and DHT11 reads; the OLED exposes the values; and the lookup result drives the LED PWM. The complete internship project also contained the button-mode, servo, and UART branches, which this shorter file does not reproduce. I wrote the application flow, encoder mappings, calibration interpolation, mode switching, and integrated superloop. I adapted the OLED, DHT11, encoder, and other drivers from ST library material and public examples rather than inventing those drivers from a blank file.<\/p><p>There was no RTOS. Interrupts and timer flags handled some events and polling rhythms; the superloop carried the remaining work; several delays were still blocking. That was usable for a low-frequency demo built around temperature, humidity, a rotary input, and lighting. With tighter real-time work, the blocking delays, shared state, and execution time of each branch would all need to be redesigned.<\/p><p><a href=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/metro-environment-main-excerpt.c\" target=\"_blank\" rel=\"noopener\">Environment-monitoring main-loop excerpt<\/a><\/p><p>I completed this sequence independently in roughly 20 working days. At the end, the supervising engineer watched the demo and listened to my explanation of the peripherals, then said I had learned the material solidly. It was an informal review, not a formal acceptance. The engineer&#x27;s training material also introduced PID, ATP, ATO, and ATS. I studied the concepts, but I did not implement or tune PID and never worked on a real train-control system. China&#x27;s <a href=\"https://xxgk.mot.gov.cn/jigou/ysfws/202201/P020220121613617393399.pdf\" target=\"_blank\" rel=\"noopener\">operational technical specification for urban rail signal systems<\/a> places ATP protection, ATO train operation, and ATS supervision within reliability, redundancy, and verification requirements far beyond this Blue Pill demo. The useful resemblance was smaller. Inputs, state, timing, communication, and outputs met inside a controller.<\/p><p>The part that carried furthest into my later work was the path to field-oriented motor control. In FOC, a timer is no longer just a periodic trigger, ADC is no longer just a light-sensor read, and PWM is no longer just a way to dim an LED. Sampling must be aligned with PWM, and the control calculation must finish before the next update. ST&#x27;s <a href=\"https://www.st.com/resource/en/user_manual/um1052-stm32f-pmsm-singledual-foc-sdk-v43-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">motor-control documentation<\/a> puts those resources on one synchronized chain. The Tianjin internship did not turn me into a motor-control engineer, but when I later encountered that chain, I did not have to begin again with the question of why a microcontroller was more than a collection of convenient functions.<\/p>", "after": "<h2>Tianjin Jintie STM32 Internship<\/h2><p class=\"summary\">During a month of foundational training at Tianjin Jintie, I planned my own STM32 learning sequence and combined external sensors, display, encoder, servo, and LED control in a working bare-metal demo.<\/p><h3>From Arduino to STM32<\/h3><p>In February 2025, I spent a month as an embedded intern at Tianjin Jintie Communications, working inside the Tianjin Rail Transit Group headquarters. The supervising engineer supplied introductory material, and my bench held an STM32F103C8T6 Blue Pill, an ST-Link, and external modules. I started with those fundamentals.<\/p><p>My university Arduino Nano projects had mostly taught me to call functions and set pins high or low. There was no daily syllabus for this placement, so I combined the supplied material with online tutorials and arranged my own route: GPIO, EXTI and timers, then PWM, UART, ADC, and an integrated demo. I wanted to understand the configuration behind effects that Arduino had made available through a function call.<\/p><h3>First Board Tests<\/h3><p>Keil&#x27;s Magic Wand settings occupied me before the peripherals did. Device packs, compiler selection, startup files, library paths, target addresses, and flash algorithms all needed configuration while I was still learning their separate purposes. I eventually split the checks into compilation on the computer, downloading through ST-Link, and an observable effect on the board. Toggling GPIOC13 every 300 ms became the first test across the toolchain and physical hardware.<\/p><p>The <a href=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/stm32-basic-gpio-oled-loop.c\" target=\"_blank\" rel=\"noopener\">initial GPIO and OLED program<\/a> preserves that setup. It enables GPIOB and GPIOC clocks, establishes OLED power levels through PB4 and PB5, initializes the display, and drives PC13. This was a low-power breadboard exercise; powering a module from GPIO remains constrained by the pin&#x27;s current capability. I began looking below <code>GPIO_SetBits()<\/code> at clocks, modes, and registers instead of learning only the function names.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/stm32f103c8t6-pinout.png\" alt=\"STM32F103C8T6 pinout reference\"><figcaption>STM32F103C8T6 pinout reference<\/figcaption><\/figure><\/div><p>At one point the OLED stayed blank even though compilation and download worked. Moving it to another pair of ordinary GPIO pins and using software I²C restored the display.<\/p><h3>Peripheral Integration<\/h3><p>I ran GPIO, OLED, encoder, servo, DHT11, light sensing, PWM, and UART in separate projects before joining them into one bare-metal program. The hardware remained a Blue Pill, breadboard, and jumper wires. A button selected what the encoder controlled: target light in one mode and servo speed in the other. The OLED showed measured light, target, LED output, temperature, and humidity; UART sent light readings and debug information to the computer, while PC13 served as a status indicator.<\/p><p>EXTI handled encoder events, TIM3 paced slower work, and TIM4 generated PWM. Light and temperature/humidity reads waited for a flag; encoder and target updates took place in the main loop. I wrote the application flow, encoder mapping, mode switching, and integrated superloop. The peripheral drivers were material I studied, modified, and connected from ST&#x27;s Standard Peripheral Library and public examples.<\/p><h3>Light Calibration<\/h3><p>To turn a target light value into an LED command, I adjusted PWM point by point and recorded 16 ADC readings on this breadboard, then wrote a <a href=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/metro-pwm-lookup-excerpt.c\" target=\"_blank\" rel=\"noopener\">lookup and interpolation function<\/a>. The records span PWM 0 to 1000 and ADC 1600 down to 480. Linear interpolation provides the output for a target between adjacent records.<\/p><p>The program converts the target through the lookup table into PWM, while measured ADC values are displayed and printed. I considered adding feedback correction, but kept this feedforward implementation for the demo.<\/p><h3>End of the Placement<\/h3><p>I completed this learning sequence independently in about 20 working days. The engineer watched the demo, heard my explanation of how the peripherals worked together, and said I had learned the material solidly. Alongside the practical work, I read introductory material on PID, ATP, ATO, and ATS.<\/p><p>Timer, ADC, and PWM returned when I later studied FOC, this time with questions about aligning sampling with switching and finishing calculations in time. The month in Tianjin gave me a starting point for investigating them. Behind a peripheral function, I had learned to look for the clocks, signals, and execution order it depended on.<\/p>"}}, {"slug": "nanjing-turing-qt-embedded-learning", "label": "南京图灵 Seamly2D 开发实习", "zh": {"before": "<h2>南京图灵 Qt、编译与打包学习记录<\/h2><p class=\"summary\">全国大学生电子设计竞赛结束后，我带着学校入门课水平的 C++ 进入三周全职 Qt 实习：从零拉起 Seamly2D，加入本地账户与角色层，再把 Windows 安装包和 macOS 无签名 DMG 推到各自的验证边界。<\/p><h3>电赛刚收尾，Qt 先让我下了一天<\/h3><p>2025 年全国大学生电子设计竞赛结束后，我直接留在南京开始了这段三周全职实习。报到前，我以为自己会学一点偏嵌入式设备的 UI，画几个页面，接一些按钮，让屏幕能和硬件互动。真正落到桌上的却是 <a href=\"https://github.com/FashionFreedom/Seamly2D\" target=\"_blank\" rel=\"noopener\">Seamly2D<\/a>，一个用 C++ 和 Qt 维护的大型开源服装纸样软件。此前我只上过学校的 C++ 入门课，写过函数和基础类，程序的活动范围基本没离开过命令行；Qt 是什么、一个多人维护的仓库怎样工作，我都要从第一天现学。<\/p><p>第一课甚至还没轮到代码。Qt 在线安装器连着海外服务器，三个小时过去，进度条大约走了 10%。我很认真地陪它耗了一天，第二天才从带教工程师那里知道还有清华镜像。换源以后，一个多小时就下完了。现在看，清华 TUNA 的 <a href=\"https://mirrors.tuna.tsinghua.edu.cn/help/qt/\" target=\"_blank\" rel=\"noopener\">Qt 镜像帮助<\/a>已经把 <code>--mirror<\/code> 参数写得很清楚；但对当时的我来说，这个知识来得稍晚了一天，足够让下载 Qt 也成了这段实习的一部分。<\/p><p>公司当时希望验证在 Seamly2D 上继续二次开发的可行性。我的任务更靠前，也更具体，需要先看能否在这个桌面程序前加一层本地注册、登录和角色入口，再把修改后的版本构建、打包并交接。它是本地功能原型，没有数据库，也没有线上鉴权。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/nanjing-turing/seamly2d-banner.png\" alt=\"Seamly2D 上游项目标识\"><figcaption>Seamly2D 上游项目标识<\/figcaption><\/figure><\/div><h3><code>qmake_all finished successfully<\/code> 以后，三十多个错误才刚到<\/h3><p>我第一次把仓库 clone 到本地，跟着分支、Kit 和 <code>.pro<\/code> 文件往前走。最初装的是 Qt 5.15.2；把 <code>core5compat<\/code> 改成条件加载以后，qmake 终于显示成功。那一刻很容易以为环境已经通了。紧接着的完整构建却扔出三十多个错误。当前分支已经在使用 Qt 6 侧的 API 与头文件，工程文件能生成，不代表这套源码真的能被 Qt 5 编译。<\/p><p>检出的这套源码需要 Qt 6，继续逐条做 Qt 5 兼容的代价太高。我安装了 Qt 6.5.3 MSVC2019 64-bit，匹配 v142 工具链，删掉旧 build 目录和 <code>.pro.user<\/code>，再重新配置 Kit。如今再看 Qt 6.5 的<a href=\"https://doc.qt.io/qt-6.5/windows.html\" target=\"_blank\" rel=\"noopener\">官方 Windows 支持表<\/a>，我会先核对操作系统、架构、编译器和 Qt 包是否属于同一个兼容组合，再解释 Qt Creator 里的具体报错。<\/p><p>这也是我第一次真正使用 Git 协作。clone、查看和切换上游分支、创建开发分支、commit、push、merge、pull request、fork 和 tag，都在这三周里实际走过一遍。过去我把 GitHub 理解成下载代码的网站；进入一个持续演进的大型仓库以后，分支开始告诉我，我正基于哪段历史工作。<\/p><h3>一个登录框，最后长成了角色状态机<\/h3><p>把程序跑起来以后，本地账户入口看上去终于接近我原先想象的 UI 工作。我加入注册和登录窗口，用 <code>QSettings<\/code> 保存本地账户数据，把密码从明文比较改成哈希值存储与校验，再补上密码遮蔽、用户已存在、用户不存在和密码错误等状态提示。Qt 对 <a href=\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">`QSettings`<\/a>的定义本来就是跨平台持久化应用设置，这很适合为本地桌面原型保存账户数据。项目没有数据库，也没有线上鉴权。<\/p><p>回车键最初连到了取消，用户名输入要关掉联想，密码框遇到中文输入法还会闪退。第二周再加入普通用户与管理员后，每个按钮后面都跟着条件。首次账号必须是 <code>admin<\/code>，普通用户看不到用户管理，管理员只能删除或升级普通用户，只有 <code>admin<\/code> 能把其他管理员降级。写到后面，我开始把每个动作拆成当前用户、目标用户和允许的状态转换。<\/p><p><a href=\"http://127.0.0.1:3000/uploads/projects/nanjing-turing/auth-role-snippet.cpp\" target=\"_blank\" rel=\"noopener\">公开角色摘录<\/a>保留了 <code>Role::User<\/code>、<code>Role::Admin<\/code>、<code>admin<\/code> 特判与 <code>QSettings<\/code> 查询。三周日志记录了这些功能由我实现并在验收时演示。完整新增源码仍未公开。<\/p><h3><code>windeployqt<\/code> 找了三天，绿色运行按钮开始失去权威<\/h3><p>Qt Creator 里的修改版本已经能启动，Release 阶段却在 <code>windeployqt<\/code> 停了三天。工具明明装在电脑里，Release 构建却看不见它，这件事确实很烦人。现存首跑文档保留了最后可复查的解决路径。在 Build Environment 中补齐 Qt <code>bin<\/code>，再修改 qmake 部署规则，让它通过 <code>QT_INSTALL_BINS<\/code> 找到 <code>windeployqt<\/code>，并且只在 Release 构建里执行。<\/p><p>Qt 6.5 的 <a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Windows 部署文档<\/a>说明，<code>windeployqt<\/code> 会扫描可执行文件并收集 Qt 库、插件、翻译和相应运行时，但不会替应用认领所有第三方依赖。这正好解释了下一幕。部署目录里已经铺开一大片 DLL，<code>seamly2d.exe<\/code> 仍然缺少 <code>xerces-c_3_2.dll<\/code>。手动补上这个 XML 库以后，我才继续完成自签名、Inno Setup 安装程序、安装与启动。<\/p><p>实习末的正式验收在开发机上进行。带教工程师逐项看了注册、登录、角色管理、Windows 安装流程，以及我在自己 Mac 上做的迁移演示；源码、周日志、环境文档和打包脚本随后提交到公司为实习生设置的 <code>develop<\/code> 分支。公司后来是否继续合并或产品化这份代码，我没有再参与，也不清楚。<\/p><h3>DMG 已经生成，macOS 还没有同意分发<\/h3><p>Windows 路线跑通以后，我把代码移到自己的 Mac。Homebrew Qt 与官方安装版本的路径、架构并不会自动对齐，只能重新处理 Debug、Release 和依赖。最终，<code>macdeployqt<\/code> 收集依赖后的应用能够启动，无签名 DMG 也实际生成并在这台 Mac 上验证过。Qt 的 <a href=\"https://doc.qt.io/qt-6.5/macos-deployment.html\" target=\"_blank\" rel=\"noopener\">macOS 部署文档<\/a>说明，<code>macdeployqt<\/code> 会把 Qt framework 和插件放进可部署的应用包。平台信任仍取决于签名与公证。<\/p><p>我创建了自签名证书，也写了包含 <code>codesign<\/code>、<code>spctl<\/code> 和 DMG 步骤的第二版脚本，应用签名却没有真正完成。现在再看 Apple 的说明，面向用户直接分发的软件需要有效的 <a href=\"https://developer.apple.com/support/developer-id/\" target=\"_blank\" rel=\"noopener\">Developer ID 与 notarization<\/a>；自签名证书可以帮助我理解流程，却不能替代 Apple 的信任链。于是 macOS 留下了一个很准确的边界。Debug、Release、依赖收集、应用启动和无签名 DMG 都跑过，正式签名、公证与第二台干净 Mac 验证都没有完成。<\/p><p>两份脚本保留了<a href=\"http://127.0.0.1:3000/uploads/projects/nanjing-turing/macos-build-package.sh\" target=\"_blank\" rel=\"noopener\">已运行的无签名 DMG 路线<\/a>和<a href=\"http://127.0.0.1:3000/uploads/projects/nanjing-turing/macos-build-package-sign.sh\" target=\"_blank\" rel=\"noopener\">没有完成的签名尝试<\/a>。它们只差几段命令，平台身份却划出了真正的分发边界。<\/p><h3><code>develop<\/code> 分支装下了三周，但没有替我回答后续<\/h3><p>最后验收时，带教工程师特意提到，从三周前连 Qt 是什么都不知道，到能够在 Seamly2D 里加功能、处理构建、做出 Windows 安装程序并迁到 macOS，这个推进幅度让他很意外。他确实认真夸了我一顿，我当时也确实非常兴奋。更重要的是，这是我第一次确认自己能够进入一个陌生的大型代码库，找到工作起点并完成自己的改动。<\/p><p>实习结束约半个月后，我又在家里一台新装的 Windows 台式机上补了一次测试。那台机器没有 Qt，也没有 Visual Studio；运行 Inno Setup 安装程序后，带注册、登录和权限功能的修改版本能够直接打开。这次个人测试完成了当时缺少的换机验证。它发生在流程文档写完以后，也没有再拿回公司复验，因此不属于正式验收。<\/p><p>三周结束时，我判断一个结果是否真的可用，会同时看分支、Qt Kit、角色、启动目录、换机运行和平台信任。下一次再看到 Qt Creator 里的绿色三角，我大概还会问它在哪里运行、以什么身份运行，以及已经验证到哪一步。<\/p>", "after": "<h2>南京图灵 Seamly2D 开发实习<\/h2><p class=\"summary\">三周实习里，我从配置 Qt、编译陌生代码库开始，为 Seamly2D 加入本地账户和角色管理，再完成 Windows 安装包与 macOS 无签名包的演示和交接。<\/p><h3>进入 Seamly2D<\/h3><p>2025 年全国大学生电子设计竞赛结束后，我留在南京，开始了三周全职实习。我原先以为会接触嵌入式设备的 UI，真正要改的却是 <a href=\"https://github.com/FashionFreedom/Seamly2D\" target=\"_blank\" rel=\"noopener\">Seamly2D<\/a>，一个 C++ 与 Qt 编写的大型服装纸样软件。此前我只上过学校的 C++ 入门课，程序基本还停在命令行，Qt 和多人协作仓库都要现学。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/nanjing-turing/seamly2d-banner.png\" alt=\"Seamly2D 上游项目标识\"><figcaption>Seamly2D 上游项目标识<\/figcaption><\/figure><\/div><p>公司想验证继续二次开发的可行性。我接到的任务是在主界面前加入本地注册、登录和角色管理，再把修改版构建、打包并交接。带教工程师每天给任务，我完成后汇报。三周的终点很具体，要让别人能够安装、打开并检查我的改动。<\/p><h3>环境与构建<\/h3><p>第一天先耗在下载上。Qt 在线安装器连海外服务器，三个小时大约下了 10%，我还以为大软件本来就这么慢，老老实实等了大半天。第二天工程师告诉我可以换清华镜像，剩余安装一个多小时就结束了。后来看到 <a href=\"https://mirrors.tuna.tsinghua.edu.cn/help/qt/\" target=\"_blank\" rel=\"noopener\">TUNA 的 Qt 镜像说明<\/a>，再想起那一天，多少有点好笑。<\/p><p>装好也没马上能用。最初我选 Qt 5.15.2，把 <code>core5compat<\/code> 改为条件加载后，qmake 通过，完整编译却继续报三十多个错误。当前分支已经用了 Qt 6 的头文件和 API，继续补 Qt 5 兼容会偏离这次任务。我改用 Qt 6.5.3 MSVC2019 64-bit、Qt 5 Compatibility Module 与 v142 编译器，删除旧 build 目录和 <code>Seamly2D.pro.user<\/code>，重新配置 Kit，才把完整构建跑通。<\/p><p>这段排查让我开始把分支、Qt 包、编译器和架构放在一起核对。此前我把 GitHub 当成下载代码的地方，这次才实际练习 clone、切分支、commit、push、merge、pull request、fork 与 tag，用 Git 保存和交接自己的改动。<a href=\"http://127.0.0.1:3000/notes/turing-qt-seamly2d-first-run\" target=\"_blank\" rel=\"noopener\">首跑原始记录<\/a>保留了环境配置与具体报错处理。<\/p><h3>账户与角色<\/h3><p>程序启动后，我加入注册、登录窗口，并在 <code>main()<\/code> 附近整理进入主界面的顺序。账户信息由 <a href=\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">QSettings<\/a> 在本机保存，密码从早期明文比较改成哈希存储与校验，输入框增加遮蔽，再分别处理用户已存在、用户不存在和密码错误。<\/p><p>真正使用界面时，小问题一个也绕不开。回车默认触发取消，用户名框弹联想，密码框在中文输入法状态下发生过闪退，我逐项修正这些行为。到了角色管理，重点又从窗口长什么样，变成谁可以对谁执行什么操作。第一个账号必须是 <code>admin<\/code>；普通用户看不到管理入口；管理员只能删除或升级普通用户，删除还要二次确认；其他管理员的降级只能由 <code>admin<\/code> 执行。<\/p><p>我把每项操作按当前用户、目标用户和允许的状态变化拆开实现，再逐项演示。<\/p><h3>安装与换机<\/h3><p>第三周转做 Release，我在 <code>windeployqt<\/code> 上卡了约三天。工具明明在硬盘里，构建步骤却找不到，重装和查路径的过程确实很烦。最后，我给 Qt Creator 的 Build Environment 补上 Qt <code>bin<\/code>，并让两个 <code>.pro<\/code> 文件通过 <code>QT_INSTALL_BINS<\/code> 定位部署工具，只在 Release 配置执行。<\/p><p>部署目录里已经堆满 DLL，程序还缺 <code>xerces-c_3_2.dll<\/code>。我补上这个 XML 库，才继续完成 Windows 自签名、Inno Setup 打包、安装与启动。<a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Qt 部署文档<\/a>也明确提醒，额外第三方库不在 <code>windeployqt<\/code> 的自动处理范围内。前面读过的 <code>.sm2d<\/code>、<code>.smis<\/code> 样例，这时与程序需要的 XML 解析依赖对上了。<\/p><p>我同期整理过 <a href=\"http://127.0.0.1:3000/notes/turing-cmake-build-logic\" target=\"_blank\" rel=\"noopener\">CMake 与编译原理资料<\/a>，用来分清生成器、编译器、链接器和运行时依赖，手上的 Seamly2D 则一直使用 qmake。<a href=\"http://127.0.0.1:3000/notes/turing-release-packaging-cross-platform\" target=\"_blank\" rel=\"noopener\">打包原始记录<\/a>与 <a href=\"http://127.0.0.1:3000/notes/turing-sm2d-xml-data-format\" target=\"_blank\" rel=\"noopener\">XML 样例<\/a>里有操作和数据细节。<\/p><p>实习正式验收时，Windows 安装与功能检查都在开发机上进行。结束约半个月后，我又在家中一台新装的 Windows 台式机上补测，那台电脑没有 Qt 和 Visual Studio。运行安装程序后，注册、登录和角色功能都能实际操作。<\/p><h3>Mac 与交接<\/h3><p>我也把同一份源码迁到自己的 Mac，重新处理 Qt 路径、架构与 Kit，跑通 Debug 和 Release，再用 <code>macdeployqt<\/code> 收集依赖。应用能够启动，无签名 DMG 也生成并在这台 Mac 上打开过，带教工程师现场看了演示。随后我创建自签名证书，尝试 <code>codesign<\/code>、<code>spctl<\/code> 与打包脚本，应用签名没有做完。<\/p><p>最后，工程师检查了注册登录、角色管理、Windows 安装和 Mac 演示，还认真肯定了我三周里的进步。源码、周日志、环境文档和脚本提交到了公司的实习生 <code>develop<\/code> 分支。我当时非常兴奋，第一次确认自己能进入陌生的大型代码库，完成一组实际修改，再交给别人检查。<\/p>"}, "en": {"before": "<h2>Nanjing Turing Qt, Build, and Packaging Learning Log<\/h2><p class=\"summary\">After the 2025 National Undergraduate Electronics Design Contest, I entered a three-week full-time Qt internship with classroom-level C++: bringing Seamly2D up from scratch, adding a local account and role layer, then carrying a Windows installer and an unsigned macOS DMG to their respective verification boundaries.<\/p><h3>Qt Took a Day to Download Before I Wrote a Line<\/h3><p>I went straight from the 2025 National Undergraduate Electronics Design Contest into this three-week, full-time internship in Nanjing. Before arriving, I expected to learn something closer to embedded-device UI. I imagined drawing a few pages, connecting a few buttons, and letting a screen interact with hardware. What landed on my desk was <a href=\"https://github.com/FashionFreedom/Seamly2D\" target=\"_blank\" rel=\"noopener\">Seamly2D<\/a>, a large open-source patternmaking application maintained in C++ and Qt. My experience stopped at an introductory university C++ course and command-line programs. Qt, GUI development, and the working habits of a multi-contributor repository all began on day one.<\/p><p>The first lesson arrived before the code. After three hours against the overseas Qt server, the Online Installer had moved by roughly ten percent. I patiently spent most of a day treating this as the natural size of a serious development tool. The supervising engineer told me about the Tsinghua mirror the next morning; after switching, the installation finished in a little over an hour. The current <a href=\"https://mirrors.tuna.tsinghua.edu.cn/help/qt/\" target=\"_blank\" rel=\"noopener\">TUNA Qt mirror guide<\/a> spells out the <code>--mirror<\/code> argument clearly. For me, that knowledge arrived one day late, which was enough to make downloading the software part of the internship.<\/p><p>The company was testing whether Seamly2D could support further secondary development. My assignment was deliberately earlier and narrower. I had to place a local registration, login, and role layer in front of the desktop application, then build, package, and hand off the modified version. It was a local functional prototype, with no database or online authentication.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/nanjing-turing/seamly2d-banner.png\" alt=\"Upstream Seamly2D wordmark\"><figcaption>Upstream Seamly2D wordmark<\/figcaption><\/figure><\/div><h3><code>qmake_all finished successfully<\/code> Came Before Thirty More Errors<\/h3><p>I cloned the repository for the first time and began working through branches, Kits, and <code>.pro<\/code> files. The initial environment used Qt 5.15.2. After making <code>core5compat<\/code> conditional, qmake finally completed, which looked very much like a working setup. The full build immediately produced more than thirty errors instead. The checked-out branch already used Qt 6 APIs and headers. Generating the build files did not mean that Qt 5 could compile the source behind them.<\/p><p>The checked-out source required Qt 6, and extending Qt 5 compatibility across a large set of files would have cost too much. I installed Qt 6.5.3 MSVC2019 64-bit, matched it to the v142 toolchain, deleted the stale build directory and <code>.pro.user<\/code>, and configured the Kit again. The official Qt 6.5 <a href=\"https://doc.qt.io/qt-6.5/windows.html\" target=\"_blank\" rel=\"noopener\">Windows configuration table<\/a> now helps me check whether the operating system, architecture, compiler, and Qt package belong to the same compatible combination before interpreting a specific Qt Creator error.<\/p><p>This was also my first real use of Git as a collaboration system. I practiced cloning, inspecting and switching upstream branches, creating a development branch, committing, pushing, merging, opening a pull request, forking, and tagging during the internship. Until then, GitHub was mostly a place where code could be downloaded. Inside a changing codebase, a branch began to tell me which history I was building on.<\/p><h3>A Login Window Grew into a Role State Machine<\/h3><p>Once the application ran, the local account entrance finally resembled the UI work I had expected. I added registration and login windows, stored local account data through <code>QSettings<\/code>, replaced plaintext password comparison with hash storage and verification, and added masked input plus prompts for existing users, missing users, and incorrect passwords. Qt defines <a href=\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">`QSettings`<\/a> as persistent, platform-independent application settings. That made it suitable for storing account data in this local desktop prototype. The project had no database or online authentication.<\/p><p>Enter initially activated Cancel, username fields needed their suggestions disabled, and the password field could crash under a Chinese input method. Adding normal and administrator roles in the second week put a condition behind every action. The first account had to be <code>admin<\/code>; normal users could not see user management; administrators could delete or promote only normal users; and only <code>admin<\/code> could demote another administrator. As the feature grew, I began breaking each action down into the current user, the target user, and the allowed state transition.<\/p><p>The <a href=\"http://127.0.0.1:3000/uploads/projects/nanjing-turing/auth-role-snippet.cpp\" target=\"_blank\" rel=\"noopener\">public role excerpt<\/a> retains <code>Role::User<\/code>, <code>Role::Admin<\/code>, the <code>admin<\/code> special case, and the <code>QSettings<\/code> lookup. The three-week logs record that I implemented and demonstrated these functions during acceptance. The full added source remains unpublished.<\/p><h3><code>windeployqt<\/code> Took Three Days and Demoted the Green Run Button<\/h3><p>The modified application already launched inside Qt Creator, yet the Release build stopped at <code>windeployqt<\/code> for three days. The tool was installed on the machine but remained invisible to the Release build, which was especially frustrating. The surviving first-run document preserves the final reproducible path. Add Qt&#x27;s <code>bin<\/code> directory to the Build Environment, then change the qmake deployment rule to resolve <code>windeployqt<\/code> through <code>QT_INSTALL_BINS<\/code> and run only for Release builds.<\/p><p>Qt&#x27;s <a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Windows deployment documentation<\/a> explains that <code>windeployqt<\/code> scans an executable and collects Qt libraries, plugins, translations, and related runtime files, but does not account for every third-party dependency. That clarified the next scene. The deployment directory was already covered in DLLs, and <code>seamly2d.exe<\/code> still required <code>xerces-c_3_2.dll<\/code>. After copying that XML library manually, I could continue through self-signing, an Inno Setup installer, installation, and launch.<\/p><p>The formal internship acceptance took place on the development machine. The supervising engineer checked registration, login, role management, the Windows installation flow, and the migration demonstration on my Mac. I then committed the source changes, weekly logs, environment notes, and packaging scripts to the company&#x27;s intern <code>develop<\/code> branch. I did not remain involved afterward, so I do not know whether the code was later merged or productized.<\/p><h3>The DMG Existed; macOS Still Had Not Approved Distribution<\/h3><p>After the Windows path worked, I moved the code to my own Mac. Homebrew Qt and the official Qt installation did not share paths or architecture assumptions, so Debug, Release, and deployment had to be handled again. The application launched after <code>macdeployqt<\/code> collected its dependencies, and I generated and tested an unsigned DMG on that Mac. Qt&#x27;s <a href=\"https://doc.qt.io/qt-6.5/macos-deployment.html\" target=\"_blank\" rel=\"noopener\">macOS deployment documentation<\/a> describes <code>macdeployqt<\/code> as placing Qt frameworks and plugins inside a deployable application bundle. Platform trust still depended on signing and notarization.<\/p><p>I created a self-signed certificate and wrote a second script containing <code>codesign<\/code>, <code>spctl<\/code>, and DMG steps, but application signing never completed. Apple&#x27;s current guidance requires a valid <a href=\"https://developer.apple.com/support/developer-id/\" target=\"_blank\" rel=\"noopener\">Developer ID and notarization<\/a> for direct distribution to users. A self-signed certificate helped me examine the sequence; it could not stand in for Apple&#x27;s trust chain. The macOS boundary therefore remains exact. Debug, Release, dependency collection, application launch, and an unsigned DMG were exercised, while distribution signing, notarization, and a second clean-Mac test were not.<\/p><p>The two scripts retain the <a href=\"http://127.0.0.1:3000/uploads/projects/nanjing-turing/macos-build-package.sh\" target=\"_blank\" rel=\"noopener\">working unsigned-DMG path<\/a> and the <a href=\"http://127.0.0.1:3000/uploads/projects/nanjing-turing/macos-build-package-sign.sh\" target=\"_blank\" rel=\"noopener\">unfinished signing attempt<\/a>. Only a few commands separate them, while platform identity sets the real distribution boundary.<\/p><h3>Three Weeks Fit into <code>develop<\/code>, but What Happened Next Did Not<\/h3><p>During the final acceptance, the supervising engineer pointed out how far the work had moved in three weeks. I had gone from not knowing what Qt was to adding features inside Seamly2D, handling its build, producing a Windows installer, and carrying it onto macOS. He praised the progress at some length, and I was genuinely excited. More importantly, this was the first time I confirmed that I could enter an unfamiliar large codebase, find where to begin, and complete my own changes.<\/p><p>About two weeks after the internship, I ran one more test on a newly installed Windows desktop at home. It had neither Qt nor Visual Studio. The Inno Setup installer completed, and the modified application opened with its registration, login, and role functions. This personal test completed the missing cross-machine verification. It took place after the packaging guide was written and was not brought back to the company for re-acceptance, so it remained outside formal internship acceptance.<\/p><p>By the end of those three weeks, I judged a working result through its branch, Qt Kit, role, launch directory, behaviour on another machine, and platform trust. The next time I see Qt Creator&#x27;s green triangle, I will probably ask where it runs, under which identity, and how far it has been verified.<\/p>", "after": "<h2>Seamly2D Qt Development Internship<\/h2><p class=\"summary\">In a three-week internship, I brought an unfamiliar Qt codebase into operation, added local accounts and role management, and prepared a Windows installer and an unsigned macOS package for review and handoff.<\/p><h3>Joining the Seamly2D Project<\/h3><p>After the 2025 National Undergraduate Electronics Design Contest, I stayed in Nanjing for a three-week full-time internship. I had expected to encounter UI work for embedded devices. The actual assignment involved <a href=\"https://github.com/FashionFreedom/Seamly2D\" target=\"_blank\" rel=\"noopener\">Seamly2D<\/a>, a large C++ and Qt patternmaking application. My prior experience was an introductory university C++ course, mostly in the terminal; both Qt and a collaborative codebase were new territory.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/nanjing-turing/seamly2d-banner.png\" alt=\"Upstream Seamly2D wordmark\"><figcaption>Upstream Seamly2D wordmark<\/figcaption><\/figure><\/div><p>The company wanted to assess further development on the application. My task was to add local registration, login, and role management before the main interface, then build, package, and hand off the modified version. The supervising engineer assigned daily work, and I reported back after completing it. By the end of three weeks, someone else needed to be able to install, open, and inspect my changes.<\/p><h3>Environment and Build<\/h3><p>The first day disappeared into downloading. After three hours against the overseas server, the Qt Online Installer was about 10 percent complete. I assumed large software simply took that long and waited for much of the day. The next morning, the engineer mentioned the Tsinghua mirror; the remaining installation finished in a little over an hour. Reading the <a href=\"https://mirrors.tuna.tsinghua.edu.cn/help/qt/\" target=\"_blank\" rel=\"noopener\">TUNA Qt mirror guide<\/a> later made that patient first day seem rather funny.<\/p><p>Installation did not immediately produce a working build. I began with Qt 5.15.2 and made <code>core5compat<\/code> conditional, which let qmake pass, only for compilation to report more than thirty errors. The branch already used Qt 6 headers and APIs. Extending Qt 5 compatibility would have pulled me away from the assignment, so I installed Qt 6.5.3 MSVC2019 64-bit and Qt 5 Compatibility Module with the v142 compiler. Deleting the old build directory and <code>Seamly2D.pro.user<\/code>, then configuring the Kit again, finally produced a complete build.<\/p><p>That process taught me to check the branch, Qt package, compiler, and architecture together. GitHub had previously been somewhere to download code. During the internship I practiced clone, branch switching, commit, push, merge, pull requests, forks, and tags as ways to preserve and exchange actual work. The <a href=\"http://127.0.0.1:3000/notes/turing-qt-seamly2d-first-run\" target=\"_blank\" rel=\"noopener\">original first-run record<\/a> retains the environment setup and specific error handling.<\/p><h3>Accounts and Roles<\/h3><p>With the application running, I added registration and login windows and organized the entry sequence around <code>main()<\/code>. <a href=\"https://doc.qt.io/qt-6.5/qsettings.html\" target=\"_blank\" rel=\"noopener\">QSettings<\/a> persisted account information locally. I replaced early plaintext password comparison with hash storage and verification, masked the password input, and added distinct handling for existing users, missing users, and wrong passwords.<\/p><p>Using the windows exposed smaller problems that still blocked the feature. Enter activated Cancel, username fields offered suggestions, and the password field could crash with a Chinese input method active. I corrected those behaviors one by one. Role management then shifted my attention from the appearance of a window to which user could act on which account. The first account had to be <code>admin<\/code>; normal users could not access management; administrators could delete or promote only normal users, with confirmation before deletion; and only <code>admin<\/code> could demote another administrator.<\/p><p>I implemented the operations by separating the current user, target user, and permitted state change, then demonstrated them individually.<\/p><h3>Installation and Another Machine<\/h3><p>Release work in the third week stalled at <code>windeployqt<\/code> for about three days. The executable existed on disk but the build could not find it. Reinstallation and path checks were frustrating. I finally exposed Qt&#x27;s <code>bin<\/code> directory to Qt Creator&#x27;s Build Environment and let both <code>.pro<\/code> files locate the deployment tool through <code>QT_INSTALL_BINS<\/code>, running it only in Release configuration.<\/p><p>Even with DLLs filling the deployment directory, the application still lacked <code>xerces-c_3_2.dll<\/code>. I added that XML library before completing Windows self-signing, Inno Setup packaging, installation, and launch. The <a href=\"https://doc.qt.io/qt-6.5/windows-deployment.html\" target=\"_blank\" rel=\"noopener\">Qt deployment guide<\/a> explicitly excludes additional third-party libraries from <code>windeployqt<\/code>&#x27;s automatic work. The <code>.sm2d<\/code> and <code>.smis<\/code> samples I had read earlier now connected to a concrete runtime dependency on an XML parser.<\/p><p>I also kept <a href=\"http://127.0.0.1:3000/notes/turing-cmake-build-logic\" target=\"_blank\" rel=\"noopener\">CMake and build-logic study material<\/a> to distinguish generators, compilers, linkers, and runtime dependencies, while the Seamly2D project on my desk continued to use qmake. The <a href=\"http://127.0.0.1:3000/notes/turing-release-packaging-cross-platform\" target=\"_blank\" rel=\"noopener\">original packaging record<\/a> and <a href=\"http://127.0.0.1:3000/notes/turing-sm2d-xml-data-format\" target=\"_blank\" rel=\"noopener\">XML samples<\/a> contain the detailed procedures and data.<\/p><p>Formal Windows installation and feature checks took place on the development machine. About two weeks after the internship, I also tested the installer on a newly installed Windows desktop at home with neither Qt nor Visual Studio present. Registration, login, and role operations worked.<\/p><h3>Mac and Handoff<\/h3><p>I moved the same source to my Mac, reworked the Qt paths, architecture, and Kit, and brought up both Debug and Release. After collecting dependencies with <code>macdeployqt<\/code>, the application launched; I also generated and opened an unsigned DMG on that machine, with the supervising engineer watching the demonstration. I then created a self-signed certificate and tried the <code>codesign<\/code>, <code>spctl<\/code>, and packaging sequence. Application signing did not finish.<\/p><p>At the final review, the engineer checked registration, login, roles, Windows installation, and the Mac demonstration, and made a point of praising my progress over the three weeks. The source, weekly logs, environment notes, and scripts went into the company&#x27;s intern <code>develop<\/code> branch. I was very excited. For the first time, I had entered an unfamiliar large codebase, completed real changes, and handed them to someone else for inspection.<\/p>"}}, {"slug": "juanyun-thermal-hardware", "label": "卷云相变散热器控制系统", "zh": {"before": "<h2>卷云相变散热器系统：两套控制器与一条完整制冷链<\/h2><p class=\"summary\">在卷云实习期间，我独立完成了相变制冷笔记本散热器的 BaseUnit 与三板 ACUnit 硬件、固件、bring-up 和整机联调，并继续参与同一项目的自动控制与交付维护阶段。<\/p><h3>两套控制器最后要接成一台机器<\/h3><p>这套产品最容易理解的说法，是放在笔记本下面的一台小空调。压缩机和制冷回路持续制造冷风，底座再把冷风送进笔记本风道，让它带走内部鳍片上的热量。占地太大后来成了产品最明显的缺点之一，但它面对的工程问题并不小。制冷系统、送风结构、两套嵌入式控制器和电脑端工具，必须对同一台机器的状态达成一致。<\/p><p>BaseUnit 放在笔记本下面，负责送风、屏幕与按键交互、本地传感、风扇控制、蓝牙上报和设定保存。ACUnit 则是外机制冷控制器，分电板、主控板和交互板把压缩机驱动板、电子膨胀阀、风扇、压力与温度传感、OLED、本地交互和网络接口接到一起。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/acunit-v21-system-block.png\" alt=\"ACUnit V2.1 系统图\"><figcaption>ACUnit V2.1 系统图<\/figcaption><\/figure><\/div><p>BaseUnit 的硬件、固件和实机联调由我独立完成。随后三块 ACUnit PCB 的设计、装配与焊接、固件、分阶段 bring-up、整机联调和 V2.1 开发 SOP 也都由我独立完成。现在回头看，这个范围有时更像初创团队里硬件负责人要接住的事情，而不只是一个边界很窄的嵌入式实习任务。这是我对责任范围的回看，不是给自己补一个并不存在的职位。<\/p><h3>BaseUnit 先让我相信更大的控制器能跑起来<\/h3><p>我先做了相对简单的 BaseUnit。它虽然职责少一些，却已经是一套完整控制器。两路温湿度、在位检测、风扇、OLED、按键、蓝牙和 Flash 参数保存要在同一个状态机里配合。等这套系统真的在硬件上跑起来，ACUnit 就不再像一次跨度过大的冒险，而是下一个更复杂的控制问题。<\/p><p><span title=\"该旧笔记已暂挂\" class=\"paused\">BaseUnit 固件笔记<\/span>沿着第一套状态与数据循环展开。这次成功也决定了项目顺序。我没有先冲进压缩机算法，再期待用户交互那一半以后自己跟上来，而是先让一套完整控制系统稳定协作，再把这份把握带到外机。<\/p><h3>三块板把固件规划真正压到了实处<\/h3><p>ACUnit 的接口一下多了很多，但我不想让固件变成一条按外设加入顺序不断续写的长循环。写代码之前，我已经规划好 App、Service、BSP 的边界，也预估了 1、10、100、500、2000 ms 各档任务该承担什么。功能往下拆时，细节当然还在继续完善，但调度思路和分层职责不是写乱以后才补的。<\/p><p>这个选择一半来自项目约束，一半来自我自己的目的。STM32F103 性能有限，我理解 RTOS 的一些概念和原理，却没有真正用过，也谈不上熟练。外设很多，但并发复杂度仍能用协作式调度和明确状态机控制。我也想拿这个项目检验自己的裸机基本功到底扎不扎实。时序、deadline 和非阻塞推进不是项目旁边的杂活，它们就是这场考试。<\/p><p><span title=\"该旧笔记已暂挂\" class=\"paused\">三板 bring-up 笔记<\/span>保留实体控制器和电源实测，<span title=\"该旧笔记已暂挂\" class=\"paused\">裸机固件笔记<\/span>解释多速率循环怎样避免慢传感与通信拖住 EEV 快任务，后续的<a href=\"http://127.0.0.1:3000/notes/juanyun-acunit-automatic-control\" target=\"_blank\" rel=\"noopener\">自动控制笔记<\/a>再沿着手动执行走到板端 EEV 与压缩机控制。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-main-board-assembled.jpg\" alt=\"完成装配的 V2.1 主控板\"><figcaption>完成装配的 V2.1 主控板<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-power-board-assembled.jpg\" alt=\"完成装配的 V2.1 分电板\"><figcaption>完成装配的 V2.1 分电板<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-interaction-board-assembled.jpg\" alt=\"完成装配的 V2.1 交互板\"><figcaption>完成装配的 V2.1 交互板<\/figcaption><\/figure><\/div><h3>公司测试走得比我的工作台更远<\/h3><p>我亲自验证的范围包括三块板的电气行为、每一路外设的独立测试，以及三块板、压缩机驱动板、压缩机、电源与电脑全部连接后的完整链路。更后面的自动模式和保护测试由公司完成，不是我亲手跑的。<\/p><p>按照老板和测试团队转述的结果，ControlPanel 收到过真实温度、压力、转速和电流遥测。他们反馈在制冷系统上手动控制过风扇、EEV 与压缩机，也运行过 QUIET、PERF、ZERO，观察到 EEV 过热度控制与压缩机连续调速产生变化，并触发过低过热度、负过热度和高冷凝压力保护。<\/p><p>公司还提到一轮十余人的小规模外部试用，参与者主要是校园里会跑大型渲染、3A 游戏等持续重负载的师生。转述给我的说法是，部分负载下性能提升约为 25–40%，另有单台设备连续运行超过 150 小时。我没有亲眼看过完整测试，也没有拿到原始日志、统一 benchmark 记录和完整运行历史，因此无法独立验证这些数字。它们是公司反馈的试用结果，不是我的实测。<\/p><p>制冷效果得到的反馈很好，但占地和便携性不足也一直是很现实的问题。产品没有量产，后期固件同样明确保留了长期标定尚未完成的边界。<span title=\"该旧笔记已暂挂\" class=\"paused\">ControlPanel 与维护阶段笔记<\/span>只复盘后期工程变化，不把现有记录推不到的结论硬写上去。<\/p><h3>电脑上出现数据时，板子活了<\/h3><p>真正把这个项目钉住的瞬间，反而不是某个性能数字。三块 ACUnit 板、压缩机驱动板、压缩机、电源和电脑全部接到一起，ControlPanel 上开始出现 Modbus 传来的压缩机状态与数据，旁边还有 ADC 采回来的温度。此前一块块板、一条条接口单独验证的东西，终于同时属于一台看得见的机器。<\/p><p>这种感觉太爽了。板子活了。<\/p><p>老板后来开玩笑说，我来之前他们想打开 EEV，还要拿着磁铁围着阀一点点吸着转；我交付这套系统以后，团队像是从手动阶段直接跨进了电气控制。这个玩笑当然很照顾我，但我也明白大家为什么会觉得开心。初创公司的条件未必最舒服，却能把很密集的成长压进一段不算长的时间。我很感谢他们愿意把一套真实的从零到一嵌入式产品交给一个本科生，也很感谢硬件、固件和团队最后在同一条链上碰到了一起。<\/p>", "after": "<h2>卷云相变散热器控制系统<\/h2><p class=\"summary\">在卷云实习期间，我独立完成 BaseUnit 与三板 ACUnit 的硬件、固件和整机联调，随后继续参与自动控制与维护。后期完整制冷测试由公司团队执行。<\/p><h3>两套控制器<\/h3><p>在卷云实习时，我做的这套相变散热器，可以理解为给笔记本送冷风的小空调。外机用压缩机和制冷回路产生冷风，底座把风送入笔记本进风口。我的工作是让底座与外机的硬件、固件和电脑端工具一起运行，最后交给团队继续测试。<\/p><p>我先独立完成了 BaseUnit 的硬件、固件和实机联调。它放在笔记本下面，要处理两路温湿度、在位检测、风扇、OLED、按键、蓝牙和参数保存。器件看起来都熟悉，但放到同一台设备里，关机时风扇该不该转、按键按住会不会重复触发、重启后恢复哪个设定，都得一起考虑。先做通这套较小的控制器，我才有把握继续处理 ACUnit。<\/p><p>外机 ACUnit 分为分电板、主控板和交互板，要接压缩机驱动板、EEV 电子膨胀阀、风扇、压力与温度传感、OLED、本地输入及无线接口。三块 PCB 的原理图、布局、制造准备、装配焊接、固件、分阶段上电与整机联调，以及 V2.1 开发 SOP，都由我独立完成。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/acunit-v21-system-block.png\" alt=\"ACUnit V2.1 系统图\"><figcaption>ACUnit V2.1 系统图<\/figcaption><\/figure><\/div><h3>固件规划<\/h3><p>接口多起来后，我先规划 App、Service 与 BSP 的职责，再写具体功能。调度也提前按 1、10、100、500、2000 ms 分档估算，让 EEV 步进、输入反馈、通信传感、显示和慢速环境读取各有安排。实现时继续拆分和调整职责，基本结构在动笔写固件前就已经确定。<\/p><p>我知道 RTOS 的概念，却没有实际项目经验，也想借这次工作检验自己的裸机基础。STM32F103 资源有限，这套并发仍能用协作式调度与状态机组织。我把 EEV 回零、通信等待与重试等过程拆成可以逐次推进的状态，在两次动作之间把 CPU 还给主循环；慢速 DHT 读取则避开 EEV 忙碌的时候。对我来说，能否处理好这些等待，正好是这次练习的重点。<\/p><h3>上电与联调<\/h3><p>我先查分电板，再接主控与交互，把电源和外设分开验证。24 V 输入与总线测得 24.07 V，变换输出 12.03 V，分电板空载电流约 18 mA；主控的三条电源轨分别为 12.03 V、4.99 V、3.32 V。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-main-board-assembled.jpg\" alt=\"完成装配的 V2.1 主控板\"><figcaption>完成装配的 V2.1 主控板<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-power-board-assembled.jpg\" alt=\"完成装配的 V2.1 分电板\"><figcaption>完成装配的 V2.1 分电板<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-interaction-board-assembled.jpg\" alt=\"完成装配的 V2.1 交互板\"><figcaption>完成装配的 V2.1 交互板<\/figcaption><\/figure><\/div><p>之后再逐项测试温度、风扇 PWM 与 TACH、EEV、ESP、OLED、交互输入和基础压缩机通信。NTC 当时约为 24.7°C，附近参考约为 24.8 到 24.9°C。交互板还遇到一次排线顺序不匹配，调整线序后恢复正常，不需要重新投板。这次异常也提醒我，板间连接需要单独核对。<\/p><p>随后，我把三块 ACUnit 板、压缩机驱动板、压缩机、电源和电脑全部接起来。ControlPanel 开始显示 Modbus 返回的压缩机状态与数据，旁边还有由 ADC 读数换算出的温度。此前单独检查过的接口，终于在同一次运行里配合起来。<\/p><p>这种感觉太爽了。自己设计、焊接和编程的板子，真的在控制一台机器。<\/p><h3>自动控制与维护<\/h3><p>后续我继续参与同一项目的 <code>production-line<\/code> 开发。手动调阀、调风扇和发送压缩机指令保留为测试入口，EEV 与压缩机的自动决策则逐步进入板端核心。系统加入 <code>STOP<\/code>、<code>QUIET<\/code>、<code>PERF<\/code>、<code>ZERO<\/code> 模式，也把传感有效性、过热度、压力和启动约束放到普通温度目标之前。<a href=\"http://127.0.0.1:3000/notes/juanyun-acunit-automatic-control\" target=\"_blank\" rel=\"noopener\">自动制冷控制笔记<\/a>具体解释了这些判断怎样影响阀和压缩机。<\/p><p>在后续维护中，ControlPanel 逐渐增加了趋势图、CSV 导出、Monitor 与 Debug 日志，以及监测和直接控制的区分。固件也补充了安全启动、数据有效性检查和 HSE 初始化失败后的时钟回退。<\/p><p>后来的实机制冷测试由公司团队完成。老板与测试人员反馈，遥测、手动控制、<code>QUIET<\/code>、<code>PERF<\/code>、<code>ZERO<\/code> 模式能够运行，观察到了 EEV 过热度控制与压缩机连续调速的变化，也触发过低过热度、负过热度和高冷凝压力保护。<\/p><h3>交付后的状态<\/h3><p>公司还转述过十余名校园师生参与的小规模试用，在大型渲染、3A 游戏等持续负载中，部分场景性能提高约 25% 到 40%；另有单台设备连续运行超过 150 小时。团队反馈制冷效果不错，占地大、便携性不足也始终是实际问题，产品最终没有量产。<\/p><p>老板后来开玩笑说，我来之前，他们开 EEV 还得拿磁铁绕着阀一点点吸着转。现在测试人员终于可以从界面发出指令、读到状态，继续推进自己的工作。我很感谢团队把这么完整的一套硬件与固件任务交给当时还在读本科的我。最后能把它接起来交出去，是这段实习里最让我满足的事。<\/p>"}, "en": {"before": "<h2>Cirro Phase-Change Cooling System: Two Controllers and One Complete Refrigeration Chain<\/h2><p class=\"summary\">During my internship at Juanyun, I independently completed the BaseUnit and the three-board ACUnit hardware, firmware, bring-up, and integration for a phase-change laptop cooler, then continued the same project through its automatic-control and maintenance phase.<\/p><h3>Two Controllers Had to Become One Machine<\/h3><p>The product is easiest to picture as a small air conditioner placed beneath a laptop. A compressor and refrigeration loop produce cold air, then a base pushes that air toward the laptop intake so it can carry heat away from the internal fins. The footprint eventually became one of the product&#x27;s clearest weaknesses, but the engineering question was real. Cooling performance depended on a refrigeration system, an airflow path, two embedded controllers, and a PC tool agreeing on what the machine was doing.<\/p><p>The BaseUnit sits under the laptop. It handles airflow delivery, screen and button interaction, local sensing, fan control, Bluetooth telemetry, and saved settings. The ACUnit is the external refrigeration controller. Its power, main-control, and interaction boards connect the compressor driver, electronic expansion valve, fans, pressure and temperature sensing, OLED, local controls, and network interface.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/acunit-v21-system-block.png\" alt=\"ACUnit V2.1 system map\"><figcaption>ACUnit V2.1 system map<\/figcaption><\/figure><\/div><p>I independently completed the BaseUnit hardware, firmware, and real-machine bring-up. I then independently completed the three ACUnit PCBs, assembly and soldering, firmware, staged bring-up, full-chain integration, and the V2.1 development SOP. Looking back, the scope sometimes felt closer to the hardware-lead work of a small startup than to a narrowly bounded embedded internship. That is a comparison of responsibility, not a job title I held.<\/p><h3>BaseUnit Made the Larger Controller Feel Possible<\/h3><p>I built the simpler BaseUnit first. It still had enough moving parts to be a complete controller. Two temperature and humidity sensors, presence detection, a fan, an OLED, buttons, Bluetooth, and Flash persistence all had to share one state machine. When that system worked on hardware, the ACUnit stopped looking like one enormous leap and became the next, more complicated control problem.<\/p><p>The <span title=\"该旧笔记已暂挂\" class=\"paused\">BaseUnit note<\/span> follows that first state and data loop. Its success also shaped the order of the project. I did not begin with the compressor algorithm and hope the user-facing half would catch up later. I first made one complete control system behave coherently, then carried that confidence into the external unit.<\/p><h3>Three Boards Put the Firmware Plan Under Pressure<\/h3><p>The ACUnit had many more interfaces, but I did not want the firmware to become a long loop of whichever peripheral happened to be added next. Before coding, I planned the App, Service, and BSP boundaries and estimated the work that belonged at 1, 10, 100, 500, and 2000 ms. The details matured while functions were decomposed. The scheduling idea and layer responsibilities were there first.<\/p><p>That choice was partly practical and partly personal. The STM32F103 had limited resources. I understood RTOS concepts but had never used one and was not yet comfortable with it. The peripheral count was high, while the concurrency could still be expressed through a cooperative schedule and explicit state machines. I also wanted this project to test whether my bare-metal fundamentals were real. Timing, deadlines, and nonblocking progress were not chores around the project. They were the exam.<\/p><p>The <span title=\"该旧笔记已暂挂\" class=\"paused\">three-board bring-up note<\/span> stays with the physical controller and measured rails. The <span title=\"该旧笔记已暂挂\" class=\"paused\">bare-metal firmware note<\/span> explains how the multi-rate loop protected fast EEV work from slower sensing and communication. The later <a href=\"http://127.0.0.1:3000/notes/juanyun-acunit-automatic-control\" target=\"_blank\" rel=\"noopener\">automatic-control note<\/a> follows the move from manual actuation to board-side EEV and compressor control.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-main-board-assembled.jpg\" alt=\"Populated V2.1 main board\"><figcaption>Populated V2.1 main board<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-power-board-assembled.jpg\" alt=\"Populated V2.1 power board\"><figcaption>Populated V2.1 power board<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-interaction-board-assembled.jpg\" alt=\"Populated V2.1 interaction board\"><figcaption>Populated V2.1 interaction board<\/figcaption><\/figure><\/div><h3>The Company Test Team Went Beyond My Bench<\/h3><p>My direct validation covered the three boards&#x27; electrical behavior, each peripheral in isolation, and the complete connection among the boards, compressor driver, compressor, power supply, and PC. The later automatic modes and protection tests were performed by the company rather than by me.<\/p><p>According to results relayed by the boss and test team, the ControlPanel received real temperature, pressure, speed, and current telemetry. They reported operating the fans, EEV, and compressor manually, running QUIET, PERF, and ZERO on the refrigeration system, observing EEV superheat control and continuous compressor-speed changes, and triggering low or negative superheat and high condensing-pressure protection paths.<\/p><p>The company also described a small external trial involving more than ten campus students and faculty who used sustained workloads such as large renders and AAA games. The relayed estimate was roughly 25–40% more performance in some of those workloads, and the company reported one unit running continuously for more than 150 hours. I did not witness the full tests or receive the raw logs, unified benchmark records, or complete operating history, so I cannot independently verify those figures. They are company-reported trial results, not measurements I made.<\/p><p>The cooling effect was reported as strong, while the footprint and poor portability kept coming back as practical objections. The system did not reach mass production, and the later firmware still marked final long-term calibration as unfinished. The <span title=\"该旧笔记已暂挂\" class=\"paused\">ControlPanel and maintenance note<\/span> keeps those later engineering changes separate from the stronger claims that the available records cannot support.<\/p><h3>The Board Came Alive on the PC<\/h3><p>The moment that settled the project for me was smaller than a performance figure. All three ACUnit boards, the compressor driver, compressor, power supply, and PC were connected. The ControlPanel began showing Modbus compressor state and data together with ADC temperatures. Every board and interface that had previously been checked alone was now part of one visible machine.<\/p><p>That felt extremely good. The board was alive.<\/p><p>My boss later joked that before I joined, opening an EEV could involve moving a magnet around it by hand, while the system I delivered moved the team from that manual stage into electrical control. The joke was generous, but I understood why the team enjoyed it. A startup may not offer the most comfortable conditions, yet it can compress an unusual amount of growth into a short time. I am grateful that they trusted an undergraduate with a real zero-to-one embedded product, and grateful that the hardware, firmware, and people all met at the end of the same chain.<\/p>", "after": "<h2>Cirro Phase-Change Cooling Controllers<\/h2><p class=\"summary\">At Juanyun, I independently completed BaseUnit and three-board ACUnit hardware, firmware, and integration, then continued into automatic control and maintenance. The company team performed the later refrigeration tests.<\/p><h3>Two Controllers<\/h3><p>The phase-change cooler I worked on during my Juanyun internship is a small air-conditioning system feeding a laptop. An external compressor and refrigeration loop produce cold air, and a base directs it into the laptop intake. My responsibility was to make the base and external-unit hardware, firmware, and PC tool work together, then hand the system over for continued testing.<\/p><p>I first completed the BaseUnit hardware, firmware, and real-machine bring-up independently. Sitting under the laptop, it coordinated two temperature/humidity channels, presence detection, a fan, OLED, buttons, Bluetooth, and saved settings. Familiar components became a combined set of questions: whether the fan should run while off, whether a held button should trigger again, and which setting should survive a restart. Getting this smaller controller working gave me the confidence to take on the ACUnit.<\/p><p>The external ACUnit uses power, main-control, and interaction boards to connect the compressor driver, electronic expansion valve (EEV), fans, pressure and temperature sensing, OLED, local inputs, and wireless interfaces. I independently handled all three schematics and PCBs, manufacturing preparation, assembly and soldering, firmware, staged power-up, integration, and the V2.1 development SOP.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/acunit-v21-system-block.png\" alt=\"ACUnit V2.1 system map\"><figcaption>ACUnit V2.1 system map<\/figcaption><\/figure><\/div><h3>Firmware Planning<\/h3><p>I planned the App, Service, and BSP responsibilities before implementing the growing set of interfaces. I also estimated a schedule at 1, 10, 100, 500, and 2000 ms for EEV stepping, input feedback, communications and sensing, display updates, and slower environmental reads. Responsibilities continued to evolve as I decomposed the functions, but the basic structure preceded the firmware implementation.<\/p><p>I knew RTOS concepts without having used one on a real project, and wanted this work to test my bare-metal fundamentals. The STM32F103 had limited resources, and explicit cooperative scheduling and state machines could still organize this workload. I split EEV homing, communication waits, and retries into incremental states, returning the CPU to the main loop between actions. Slow DHT reads waited while the EEV was busy. Handling these waits was an important part of the exercise for me.<\/p><h3>Power-Up and Integration<\/h3><p>I checked the power board first, then connected the main and interaction boards, separating rail checks from peripheral tests. I measured 24.07 V at the 24 V input and bus, 12.03 V at the converted output, and about 18 mA of power-board no-load current. Main-board rails measured 12.03 V, 4.99 V, and 3.32 V.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-main-board-assembled.jpg\" alt=\"Populated V2.1 main board\"><figcaption>Populated V2.1 main board<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-power-board-assembled.jpg\" alt=\"Populated V2.1 power board\"><figcaption>Populated V2.1 power board<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/acunit-v21-bringup/acunit-v21-interaction-board-assembled.jpg\" alt=\"Populated V2.1 interaction board\"><figcaption>Populated V2.1 interaction board<\/figcaption><\/figure><\/div><p>I then tested temperature sensing, fan PWM and TACH, EEV, ESP, OLED, interaction inputs, and basic compressor communication individually. The NTC read about 24.7°C against nearby references of roughly 24.8 to 24.9°C. The interaction board also had a cable-order mismatch, corrected by changing the wire order without another PCB spin. It also reminded me to check the connections between boards separately.<\/p><p>Next I connected all three ACUnit boards, the compressor driver, compressor, supply, and PC. The ControlPanel began showing compressor state and data returned over Modbus alongside temperatures calculated from ADC readings. Interfaces I had checked separately were finally cooperating in one running system.<\/p><p>That felt extremely good. The boards I had designed, soldered, and programmed were controlling a real machine.<\/p><h3>Automatic Control and Maintenance<\/h3><p>I continued working on the same project&#x27;s <code>production-line<\/code> development. Manual valve, fan, and compressor commands remained available for testing, while automatic EEV and compressor decisions moved into a board-side core. The system gained <code>STOP<\/code>, <code>QUIET<\/code>, <code>PERF<\/code>, and <code>ZERO<\/code> modes, with sensor validity, superheat, pressure, and startup constraints taking precedence over ordinary temperature targets. The <a href=\"http://127.0.0.1:3000/notes/juanyun-acunit-automatic-control\" target=\"_blank\" rel=\"noopener\">automatic-control note<\/a> explains how those decisions affect the valve and compressor.<\/p><p>During later maintenance, the ControlPanel gained trend plots, CSV export, Monitor and Debug logs, and separation between monitoring and direct control. Firmware added safer startup, data-validity checks, and clock fallback after HSE initialization failure.<\/p><p>The company team performed the later refrigeration tests. The boss and testers reported working telemetry, manual controls, <code>QUIET<\/code>, <code>PERF<\/code>, and <code>ZERO<\/code> modes, observable EEV superheat regulation and continuous compressor-speed changes, and triggers of low-superheat, negative-superheat, and high-condensing-pressure protection.<\/p><h3>After Handoff<\/h3><p>The company also described a small trial involving more than ten campus students and faculty. It reported roughly 25 to 40 percent better performance in some sustained workloads, including large renders and AAA games, and one unit running continuously for over 150 hours. Cooling feedback was positive, but the size and poor portability remained practical drawbacks. The product did not reach mass production.<\/p><p>My boss later joked that before I joined, opening the EEV involved moving a magnet around the valve by hand. Now testers could issue commands, read status, and continue their own work. I am grateful the team trusted an undergraduate with such a complete hardware and firmware assignment. Connecting it into a working system and handing it over was the most satisfying part of the placement.<\/p>"}}, {"slug": "sensorless-foc-learning-route", "label": "自制驱动板与无感 FOC 实践", "zh": {"before": "<h2>从自制驱动板到压缩机运行：我的无感 FOC 学习路线<\/h2><p class=\"summary\">我独立完成 STM32F446/DRV8301 驱动板的设计与制造，并在 12 V 下把真实压缩机推进到 30-80 Hz 开环阶段；无感闭环接管仍未完成。<\/p><h3>缺一台电机，最后先做了一块板<\/h3><p>我从无感 FOC 原理进入这条路线。学完一套 PMSM-FOC 课程后，我很想让公式真正带动一台电机，可手边散落的都是有刷电机，并没有合适的三相无刷电机。配套教学板要 888 元，这个价格足以让我把硬件本身也变成学习问题。<\/p><p>于是我决定把缺的那块板自己画出来。PCB 丝印保留了 2025 年 11 月 25 日，也就是我动笔的那天。我以芯片参考设计和课程中建立的电路理解为基础，独立完成原理图、器件选型、PCB Layout 与制造文件。到 2026 年 1 月，设计完成并进入打板。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/board-render-front.png\" alt=\"自制 FOC 板正面渲染\"><figcaption>自制 FOC 板正面渲染<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/board-render-back.png\" alt=\"自制 FOC 板背面渲染\"><figcaption>自制 FOC 板背面渲染<\/figcaption><\/figure><\/div><h3>压缩机把原理图变成了真实负载<\/h3><p>我在做另一个项目时，工作室里恰好放进来一台小型压缩机。最初我想找的是普通无刷电机，后来顺着手册和三相接线继续了解，才意识到压缩机内部的永磁电机正好可以填上这个空位。这次偶然相遇改变了练习的尺度。真实压缩机会逼着我把 FOC 从原理、硬件一路推到起转与持续运行。<\/p><p>板上以 STM32F446RET6、DRV8301DCAR 与六颗 HY3010D MOSFET 为核心。五张原理图分页分别承接控制与时序、连接器、模拟采样、三相功率级和栅极驱动。我可以沿着它们检查从 <code>Ia<\/code>、<code>Ib<\/code> 采样到六路互补 PWM，再到 U/V/W 端子的完整路径。Hall 与编码器接口也被保留下来，方便以后继续研究，但这一阶段的目标没有因此改变。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-mcu.png\" alt=\"STM32F446 控制分页\"><figcaption>STM32F446 控制分页<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-adc.png\" alt=\"电流与电压采样分页\"><figcaption>电流与电压采样分页<\/figcaption><\/figure><\/div><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-mos.png\" alt=\"HY3010D 三相功率级\"><figcaption>HY3010D 三相功率级<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-driver.png\" alt=\"DRV8301 栅极驱动分页\"><figcaption>DRV8301 栅极驱动分页<\/figcaption><\/figure><\/div><p>公开设计证据包括 <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/bom.xlsx\" target=\"_blank\" rel=\"noopener\">BOM<\/a>、<a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/gerber.zip\" target=\"_blank\" rel=\"noopener\">Gerber 制造包<\/a>、<a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/pcb-fabrication-drawing.pdf\" target=\"_blank\" rel=\"noopener\">PCB 制造图<\/a>、<a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/compressor-6md030z-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">压缩机手册<\/a>，以及 <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/drv8301-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">DRV8301<\/a>、<a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/hy3010d-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">HY3010D<\/a>、<a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/stm32f446re-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">STM32F446<\/a> 和 <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/lm358a-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">LM358A<\/a> 数据手册。<\/p><h3>制造也是学习的一部分<\/h3><p>我没有把文件交出去以后只等一块焊好的成品回来。Gerber 与 BOM 导出、下单、SMT 上料、贴片坐标设置、设备操作、补焊、手工焊接、装配和上电检查都由我独立完成。<a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-smt-pick-and-place.mp4\" target=\"_blank\" rel=\"noopener\">现场 SMT 录像<\/a>记录的就是这块板的生产过程，并非通用工厂素材。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-smt-pick-and-place-poster.jpg\" alt=\"现场 SMT 上料与贴片设置\"><figcaption>现场 SMT 上料与贴片设置<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-test.jpg\" alt=\"装配板与压缩机台架\"><figcaption>装配板与压缩机台架<\/figcaption><\/figure><\/div><p>设计在 2 月寒假暂停，3 月开学后又搁置了一段时间。4 月和 5 月重新拿起它时，问题已经换了性质。引脚映射、模拟量换算、启动电流、驱动故障都要在实物上成立，压缩机也不可能像一个没有摩擦和负载的理想电机模型那样配合我。<\/p><h3>开源代码只是起点<\/h3><p>固件起点是一套开源 FOC 示例代码。最初的 Clarke、Park、电流 PI、反 Park、SVPWM 与 EKF 基线并非由我编写。原始对象是普通三线无刷电机，而我的板卡与压缩机带来了不同的引脚、模拟前端、交互方式、启动负载和故障行为。<\/p><p>硬件适配与实物验证由我主导，其中包括板级引脚与外设映射、电流电压换算、OLED、按键、EC11 控制、压缩机启动行为，以及覆盖电压、电流、驱动故障和重启的保护状态机。自制硬件最终能够承接示例代码的控制链，但压缩机适配远比接口能对上更难。<\/p><p>后续研究观测器时，我与 Codex 一起阅读代码，并由它协助实现 RAM trace、修正 EKF 参数、定位 Kalman 增益被覆盖的问题。实验条件、硬件操作、压缩机状态判断和阶段结果取舍仍由我负责。<a href=\"https://github.com/Awes0meE/STM32_Sensorless_FOC\" target=\"_blank\" rel=\"noopener\">公开固件仓库<\/a>保持原样，作为外部代码证据。<\/p><h3>12 V 与敞开的压缩机<\/h3><p>第一个真正有用的锚点，是 45 Hz 开环稳定运行。随后我保留了 30、45、60 Hz 三个测试点，因为它们的机械响应和电气趋势足够可重复，可以拿来对照调试。最终低速 EC11 版本在 12 V 母线下开放 30-80 Hz 指令范围。这里说的是电频率指令，并非直接测得的机械转速。<\/p><p><a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/runtime-open-loop.mp4\" target=\"_blank\" rel=\"noopener\">运行录像<\/a>拍摄于这个最终版本。我印象中当时可能接近 80 Hz，但现有证据不足以给视频写死准确设定值。测试时吸排气口都处于开放状态，后段我用手人工限制吸气口，观察驱动能否继续承受扰动。明显的吸力、较低的听感噪声和扰动下持续运行，让我能够确认这一阶段的开环 FOC 链路确实在连续做功。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/runtime-open-loop-poster.jpg\" alt=\"最终低速 EC11 开环演示\"><figcaption>最终低速 EC11 开环演示<\/figcaption><\/figure><\/div><p>此前我还把同一台压缩机接到一块面向小风扇电机的低价无感驱动板上。那块板带旋钮调速，我用示波器确认过它采用普通六步换相方波。在相近台架条件下，我记得它的声音更大、压缩机更热、吸力也更弱。这个反差在现场很明显，但我没有受控的压力、流量、声学、温升或效率数据，因此这里只保留个人观察，不把它包装成数值对比，更不会把它扩成对六步控制的普遍结论。<\/p><p>吸排气口从未接入完整制冷回路，人工限制吸气口也只是扰动观察，不能代替制冷剂负载下的压差测试。这一阶段证明了装配实物能够运行，也固定了一段有边界的开环范围；它没有证明制冷性能，更没有证明无感闭环已经完成。<\/p><h3>这一步的边界仍在接管<\/h3><p>开环运行说明功率级、采样链、电流环、SVPWM 更新与压缩机能够一起工作。修正符号、电机参数和代码问题后，EKF 速度估计也逐渐接近外加频率，可闭环接管依旧失败。<\/p><p>这次失败改变了我追问的重点。速度估计看起来合理，说明观测器已经看见运动；它仍不能证明瞬时转子角足够准确，也不能证明内部状态已经收敛，更不能保证控制从外加角切到估计角时没有相位跳变。学习笔记<span title=\"该旧笔记已暂挂\" class=\"paused\">速度估计对了，闭环为什么还是接不住？<\/span>会沿着真实代码与 trace 继续拆开这层差别。<\/p><h3>学习路线还会走出这台压缩机<\/h3><p>我在 2026 年 5 月封存 30-80 Hz 低速演示，因为它是那一轮工作里可重复、也相对安全的阶段终点。项目本身仍在继续。更长的目标是走向普适无刷与伺服电机的无感闭环，再继续面对机器人关节电机、力反馈、低速启动与高频注入等问题。<\/p><p>这些未来方向目前都还没有在本项目中实现。压缩机的开环运行是这条长路线里第一个完整落到实物上的检查点。真实负载把每一处薄弱环节都逼到眼前，也让我下一步要做的事比让电机转起来更具体。<\/p>", "after": "<h2>自制驱动板与无感 FOC 实践<\/h2><p class=\"summary\">我独立设计、装配 STM32F446/DRV8301 驱动板，适配开源固件，在 12 V 母线下用 30 到 80 Hz 开环指令带动压缩机；无感接管仍未完成。<\/p><h3>自制驱动板<\/h3><p>学完一套 PMSM-FOC 课程后，我很想让那些公式真正带动电机。手边却只有有刷电机，没有合适的三相无刷负载，配套教学板又要 888 元。我决定先把驱动板自己做出来，一边补上实验条件，一边把课程里的电路重新弄明白。<\/p><p>PCB 丝印上的 2025 年 11 月 25 日，就是我开始画板的日期。我参考芯片推荐电路，独立完成原理图、器件选型、PCB 布局与制造文件，到 2026 年 1 月完成设计并送去打板。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/board-render-front.png\" alt=\"自制 FOC 板正面渲染\"><figcaption>自制 FOC 板正面渲染<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/board-render-back.png\" alt=\"自制 FOC 板背面渲染\"><figcaption>自制 FOC 板背面渲染<\/figcaption><\/figure><\/div><p>刚好在做另一个项目时，工作室里出现了一台小型压缩机。我查手册、沿三相接线继续了解，才知道内部的永磁电机可以作为实验负载。原先只是想找一台无刷电机，后来要面对的变成了压缩机起转、持续运行与扰动，比课程里的理想模型具体得多。<\/p><h3>从原理图到实物<\/h3><p>我选了 STM32F446RET6、DRV8301DCAR 和六颗 HY3010D MOSFET，构成主控、栅极驱动与三相功率级。五张原理图分别整理控制时序、连接器、模拟采样、功率级与驱动接口，能顺着 <code>Ia<\/code>、<code>Ib<\/code> 采样一路检查到六路互补 PWM 和 U/V/W 输出。Hall 与编码器接口也预留了下来，方便后续实验。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-mcu.png\" alt=\"STM32F446 控制分页\"><figcaption>STM32F446 控制分页<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-adc.png\" alt=\"电流与电压采样分页\"><figcaption>电流与电压采样分页<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-mos.png\" alt=\"HY3010D 三相功率级\"><figcaption>HY3010D 三相功率级<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-driver.png\" alt=\"DRV8301 栅极驱动分页\"><figcaption>DRV8301 栅极驱动分页<\/figcaption><\/figure><\/div><p>设计完成后，我继续做 Gerber、BOM 导出和下单，并亲自操作 SMT 设备，包括上料、设置贴片坐标、运行机器，再补焊、手焊、装配和上电。<a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-smt-pick-and-place.mp4\" target=\"_blank\" rel=\"noopener\">现场 SMT 录像<\/a>拍的就是这块板。以前在图纸上处理的是器件位置和连线，现在每一个决定都要经过装配和上电检查。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-smt-pick-and-place-poster.jpg\" alt=\"现场 SMT 上料与贴片设置\"><figcaption>现场 SMT 上料与贴片设置<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-test.jpg\" alt=\"装配板与压缩机台架\"><figcaption>装配板与压缩机台架<\/figcaption><\/figure><\/div><h3>板级适配<\/h3><p>项目在 2 月寒假和 3 月开学后暂停过，4 月、5 月才重新集中做实物调试。我从开源 FOC 示例的 Clarke、Park、电流 PI、反 Park、SVPWM 和 EKF 算法开始，把面向普通三线无刷电机的示例适配到自己这块板和这台压缩机。<\/p><p>我主导板级引脚、外设与采样换算的适配，接入 OLED、按键和 EC11，再处理压缩机启动与保护状态机。电压、电流、驱动器故障和重启条件都需要在实物上检查。引脚能对应上，离压缩机可靠运行还差不少工作，启动负载和故障反应不能只靠示例代码里的默认值解释。<\/p><p>后续排查观测器时，我与 Codex 一起读代码，由它协助实现 RAM trace、修正 EKF 参数，并定位 Kalman 增益被覆盖的问题。我负责选择实验条件、操作硬件、判断声音与振动、检查启动状态，再决定保留哪些修改，逐步更新到<a href=\"https://github.com/Awes0meE/STM32_Sensorless_FOC\" target=\"_blank\" rel=\"noopener\">固件仓库<\/a>。<\/p><h3>压缩机运行<\/h3><p>45 Hz 稳定开环运行，是第一个能反复用来检查修改的状态。我随后保留了 30、45、60 Hz 三个测试点，对照机械响应和电气趋势。最终低速 EC11 版本在 12 V 母线下开放了 30 到 80 Hz 的电频率指令范围。<\/p><p><a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/runtime-open-loop.mp4\" target=\"_blank\" rel=\"noopener\">运行视频<\/a>拍的是这个最终版本。当时吸气口、排气口都敞开，后段我用手限制吸气口，驱动仍继续运行。在工作台上，能感觉到明显的吸力，听起来噪声也较低。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/runtime-open-loop-poster.jpg\" alt=\"最终低速 EC11 开环演示\"><figcaption>最终低速 EC11 开环演示<\/figcaption><\/figure><\/div><p>此前我还用同一台压缩机试过一块带调速旋钮的低价无感驱动板，它原本面向小风扇电机，我用示波器确认过普通六步换相波形。在相近台架条件下，我记得它声音更大、发热更多、吸力更弱。<\/p><h3>无感接管<\/h3><p>开环阶段能够持续运行后，我继续修正 EKF 的符号、电机参数与代码问题，估计速度逐渐接近外加频率。但一切换到无感接管，运行仍会失败。这让我重新检查自己的判断，把注意力从估计速度转向观测器输出的瞬时角度。<\/p><p>现在看 <a href=\"https://www.st.com/en/applications/industrial-motor-control/3-phase-field-oriented-control-foc.html\" target=\"_blank\" rel=\"noopener\">ST 对 FOC 的说明<\/a>，转子角度本来就是控制所需的信息。接下来，我想分别检查角度偏差、状态收敛，以及切换瞬间的参考是否连续，找出接管失败的原因。<\/p><p>我在 2026 年 5 月保留了能重复运行的 30 到 80 Hz 低速演示版本。后面仍想继续做通无刷与伺服电机的无感闭环，再研究机器人关节、力反馈、低速启动和高频注入。眼前最明确的问题，仍是怎样让观测器从提供一个看似合理的读数，走到真正可以用于控制。<\/p>"}, "en": {"before": "<h2>From a Custom Driver Board to a Running Compressor: My Sensorless FOC Learning Route<\/h2><p class=\"summary\">I designed, assembled, and adapted a custom STM32F446/DRV8301 driver to run a real compressor at 12 V across a 30-80 Hz open-loop stage; sensorless takeover remains unfinished.<\/p><h3>A Missing Motor Turned Into a Board<\/h3><p>I entered this route through sensorless FOC theory. After finishing a PMSM-FOC course, I wanted to make the equations move a real motor. The awkward part was physical. The loose motors around me were brushed motors, and I did not own a suitable three-phase brushless motor. The matching teaching board cost RMB 888, which was high enough to make the hardware itself part of the question.<\/p><p>I decided to draw the board I was missing. The silkscreen preserves 25 November 2025, the day I began. I worked from chip reference designs and the circuit understanding I had built during the course, then independently completed the schematic, component selection, PCB layout, and manufacturing exports. By January 2026 the design was finished and sent out for fabrication.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/board-render-front.png\" alt=\"Front render of the custom FOC board\"><figcaption>Front render of the custom FOC board<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/board-render-back.png\" alt=\"Back render of the custom FOC board\"><figcaption>Back render of the custom FOC board<\/figcaption><\/figure><\/div><h3>The Compressor Made the Schematic Real<\/h3><p>While I was working on another project, a small compressor happened to be placed in my workshop. I had started with an ordinary brushless motor in mind. After reading its manual and tracing its three-phase connection, I realised that the permanent-magnet motor inside the compressor could become the real load I had been missing. That chance encounter changed the scale of the exercise. A compressor would force me to carry FOC from principle and hardware all the way to startup and sustained operation.<\/p><p>The board centres on an STM32F446RET6, a DRV8301DCAR gate driver, and six HY3010D MOSFETs. Five schematic sheets separate control and timing, connectors, analogue sampling, the three-phase power stage, and gate drive. That separation helped me inspect the complete route from <code>Ia<\/code> and <code>Ib<\/code> sensing through six complementary PWM signals to the U/V/W terminal. It also left Hall and encoder interfaces available for later study without changing the goal of this stage.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-mcu.png\" alt=\"STM32F446 control sheet\"><figcaption>STM32F446 control sheet<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-adc.png\" alt=\"Current and voltage sampling sheet\"><figcaption>Current and voltage sampling sheet<\/figcaption><\/figure><\/div><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-mos.png\" alt=\"HY3010D power stage\"><figcaption>HY3010D power stage<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-driver.png\" alt=\"DRV8301 gate-driver sheet\"><figcaption>DRV8301 gate-driver sheet<\/figcaption><\/figure><\/div><p>The public design evidence includes the <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/bom.xlsx\" target=\"_blank\" rel=\"noopener\">BOM<\/a>, <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/gerber.zip\" target=\"_blank\" rel=\"noopener\">Gerber package<\/a>, <a href=\"http://127.0.0.1:300
