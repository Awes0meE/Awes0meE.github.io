</style><header><div class="eyebrow">PORTFOLIO / EDITORIAL REVIEW · 2026.09.06</div><h1>七个项目，中英重构对照</h1><p class="intro">主页讲自己做过的事，学习笔记留给具体问题的深入研究。此处展示本地候选稿与修改前全文。15 篇重复笔记已暂挂，9 篇继续显示，全部原稿保留。Claude Chime 主页不参与重构。</p><div class="toolbar"><label for="project">项目</label><select id="project" aria-label="选择对照项目"></select><div class="language"><button id="zh" aria-pressed="true">中文</button><button id="en" aria-pressed="false">English</button></div><a class="site-link" id="site" target="_blank" rel="noopener">打开实际主页 ↗</a><span class="status">用户已确认 · 审阅存档</span></div></header><main class="columns"><section class="column"><div class="bar"><span>BEFORE / 修改前</span><span>保留原始版本</span></div><article class="reader" id="before"></article></section><section class="column after"><div class="bar"><span>AFTER / 获批文案</span><span id="position"></span></div><article class="reader" id="after"></article></section></main><footer>两栏可分别滚动。图片与附件引用原项目资料；旧稿中的暂挂笔记链接显示为灰色点线。项目图片由本地网站 3000 端口提供。选题与恢复说明保存在同一审阅资料目录。</footer><script>
const data=[{"slug": "arduino-smart-car-line-tracker", "label": "Arduino 循迹小车焊接与控制实训", "zh": {"before": "<h2>Arduino 循迹小车焊接与控制实训<\/h2><p class=\"summary\">第一次接触嵌入式，就从一块裸 PCB 开始：焊接整车、读懂 LM7805/74HC165/L293 电路、分模块测试 Arduino，再把循迹 PWM 一路调到校内圈速赛前 5%。<\/p><h3>小车到手时还只是一块裸 PCB<\/h3><p>这套东西刚拿到手时，桌上摊着一块紫色裸 PCB、几袋插件元件、少量贴片器件、一份电路 manual，再加若干 Arduino 测试程序。电阻、IC 座、开关、传感器和电机接口得先一个个落到正确的位置，小车才具备循迹的条件。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/soldering-bench.jpg\" alt=\"焊接和装配现场\"><figcaption>焊接和装配现场<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/cover-front.jpg\" alt=\"焊接完成后的小车正面\"><figcaption>焊接完成后的小车正面<\/figcaption><\/figure><\/div><p>这是我第一次接触嵌入式。那时连 PCB 到底是什么、电源芯片为什么存在、旁边那几颗电阻电容各自管什么，我都还在现学。脑子里的入门规则倒是很简单。只要把所有元件正确焊上去，功能自然就会出现。PCB 所要求的正确焊接，比我当时理解的细得多。极性、方向、焊点质量和 IC 座的位置决定了元件有没有装对。电源检查和分模块测试接着验证装好的板子。也正是这点让我越做越有兴趣。<\/p><h3>把紫色 PCB 读成一条信号链<\/h3><p>元件焊满以后，我靠 <a href=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/smart-car-manual-teas1-en.pdf\" target=\"_blank\" rel=\"noopener\">Smart Car Manual<\/a> 才读懂这块板子。中间是 Arduino Nano 兼容主控区，旁边依次接着电源、L293 电机驱动、双电机和测速、WS2812 灯、移位寄存器、红外传感器、碰撞开关与两个按键。按功能给模块命名以后，这块密密麻麻的紫色 PCB 就呈现为一条能顺着读下去的信号链。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/manual-system-diagram.png\" alt=\"小车系统框图\"><figcaption>小车系统框图<\/figcaption><\/figure><\/div><p>电源部分最先让我意识到，元件焊上去只是开始，供电状态还会影响后面所有模块。LM7805 把输入稳到 5 V，周围的电容在扰动到达逻辑和传感器前先把它滤掉。项目报告还很直接地提醒，CP1、CM3、CM4 在测试中比较容易损坏。这条电源路径会直接影响后面所有模块的工作状态。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-power-supply.png\" alt=\"去掉校徽后的电源课件页\"><figcaption>去掉校徽后的电源课件页<\/figcaption><\/figure><\/div><h3>十四路输入得先排个队<\/h3><p>manual 把 6 个碰撞开关、6 路红外循迹输入和 2 个按键合成了 14 路数字信号。Arduino Nano 总共只有 13 个数字 I/O，车上其他功能还要继续用引脚，于是两颗 74HC165 先把这些并行状态收进来，再串行送回主控。到了上传的代码里，<code>reload_shift_reg()<\/code> 就是电路和软件真正接上的那一下。它先刷新每个开关与传感器字段，程序才知道小车刚刚读到了什么。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-sensors-switches.png\" alt=\"传感器和开关课件页\"><figcaption>传感器和开关课件页<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-shift-register.png\" alt=\"移位寄存器课件页\"><figcaption>移位寄存器课件页<\/figcaption><\/figure><\/div><p>这些输入对应的是两种完全不同的现实接触。朝下的红外传感器靠反射区分黑线与周围地面，车身四周的长臂开关则要真的碰到障碍物才动作。它们进程序以后都是 bit，但一个起点是反射光，另一个起点是拨杆碰到了东西。看到它们最后走进同一条读取路径，数字信号这四个字也就没那么悬空了。<\/p><h3>L293 把 PWM 变成轮速<\/h3><p>输出侧的问题正好反过来。Arduino 引脚不能直接给电机供电。L293 夹在逻辑和两只直流电机之间，用 H 桥组合切换方向，再用 PWM 决定每只轮子拿到多大的驱动。上传代码里的 <code>motor_set_PWM(left, right)<\/code> 把这层关系写得很直白。正负号管方向，绝对值最大到 255，变成实际的 PWM 命令。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/manual-h-bridge-motor-control.png\" alt=\"H 桥电机控制原理\"><figcaption>H 桥电机控制原理<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-pwm-control.png\" alt=\"PWM 调速课件页\"><figcaption>PWM 调速课件页<\/figcaption><\/figure><\/div><p>这个接口也把转弯变成了可以调的东西。左右轮给相同指令，小车直走；一侧降速，路径开始弯；两侧反向，则会得到更强的原地修正。哪一路红外传感器检测到黑线，决定修正等级和转向策略。程序再把这次修正转换成两只电机各自的驱动指令。<\/p><h3>跑圈之前，先过六个小测试<\/h3><p>Testing code 文件夹 比一份收拾得很漂亮的最终赛道程序更能说明 bring-up 过程。里面把 LED、按键、碰撞开关、红外循迹传感器、电机和测速传感器拆成了六组测试，还各自保留 <code>with-led<\/code> 与 <code>without-led<\/code> 版本。这个目录有一点入门项目特有的朴素凌乱，但思路很清楚。先证明一个模块能工作，再要求整台车一起配合。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-basic-function-tests.png\" alt=\"基础功能测试课件页\"><figcaption>基础功能测试课件页<\/figcaption><\/figure><\/div><p>这个顺序对焊接套件尤其重要。如果红外测试连黑线和桌面都分不出来，或者电机测试没有带动预期的轮子，直接跑完整循迹程序，只会让硬件和代码轮流看起来很可疑。六个小测试先把问题范围缩小，之后才检查小车能跑多快。<\/p><h3>三档转向和一块更轻的电池<\/h3><p><a href=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/smart-car-report.pdf\" target=\"_blank\" rel=\"noopener\">两页 Smart Car 报告<\/a> 把比赛逻辑写成了三档转向。外侧红外传感器检测到黑线，说明偏得更远，需要包括左右轮反向在内的强修正；内侧传感器触发，只用较小轮速差；中间再补一档过渡。报告还记录了把原来的 4 节干电池换成更轻的 12 V 锂电方案，再反复调整轮速差和转速。目标很具体，直道尽量全速，进弯又不能冲出去。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-racing-challenge.png\" alt=\"圈速挑战课件页\"><figcaption>圈速挑战课件页<\/figcaption><\/figure><\/div><p>我们的小车最后跑进了校内圈速挑战前 5%。这个名次当然很开心，但更有意思的结果其实在冲线前就已经看得见。那块最初和一堆散件一起到手的 PCB，已经能把反射光变成 bit，把 bit 变成两路 PWM，再让两只轮子把跑偏的小车拉回黑线。<\/p>", "after": "<h2>Arduino 循迹小车焊接与控制实训<\/h2><p class=\"summary\">我从裸 PCB 开始装配 Arduino 小车，逐项检查电源、传感和电机功能，再参与赛道调试；小组最终进入校内圈速挑战前 5%。<\/p><h3>装板<\/h3><p>第一次做嵌入式项目，我拿到的是一块紫色裸 PCB 和几袋元件。那时还没弄明白稳压器和电容各管什么，就已经要把电阻、IC 座、传感器、开关和电机接口焊上去了。我对任务的理解也很直接，把元件装对，小车应该就能跑。真正动手后，才发现这个“装对”包含极性、朝向、焊点和安装顺序，远比把引脚塞进孔里复杂。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/soldering-bench.jpg\" alt=\"焊接和装配现场\"><figcaption>焊接和装配现场<\/figcaption><\/figure><\/div><p>这辆车是 MEC104 的 Arduino 循迹套件。我从装配、读电路和基础测试开始，参与把它调到能沿黑线跑完整圈的状态。套件已经给出了 PCB、manual 和测试程序，我要做的是理解这些设计，并让自己焊出来的实物按预期工作。也正是在这个过程中，我开始对板上那些原先只认识外形的器件产生兴趣。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/cover-front.jpg\" alt=\"焊接完成后的小车正面\"><figcaption>焊接完成后的小车正面<\/figcaption><\/figure><\/div><h3>电路与测试<\/h3><p>焊接完成后，我拿着 <a href=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/smart-car-manual-teas1-en.pdf\" target=\"_blank\" rel=\"noopener\">套件 manual<\/a> 顺着信号读板子。LM7805 所在的电源部分建立 5 V 供电，周围电容配合滤波；6 个碰撞开关、6 路红外循迹输入和 2 个按键，经两颗 74HC165 送回 Nano 兼容主控。程序先用 <code>reload_shift_reg()<\/code> 刷新状态，再决定下一步动作。红外传感器读的是地面反射差异，碰撞开关读的是真实接触，到了程序里才都变成数字状态。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/manual-system-diagram.png\" alt=\"小车系统框图\"><figcaption>小车系统框图<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-power-supply.png\" alt=\"去掉校徽后的电源课件页\"><figcaption>去掉校徽后的电源课件页<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-sensors-switches.png\" alt=\"传感器和开关课件页\"><figcaption>传感器和开关课件页<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-shift-register.png\" alt=\"移位寄存器课件页\"><figcaption>移位寄存器课件页<\/figcaption><\/figure><\/div><p>输出侧由 L293 驱动两只直流电机。<code>motor_set_PWM(left, right)<\/code> 的正负号选择方向，绝对值给出最大到 255 的 PWM 指令。我开始能把函数和车轮对应起来，左右相同是直行，一侧减小指令会转弯，两侧反向则能作更强的修正。现在对照 <a href=\"https://www.ti.com/lit/ds/symlink/l293.pdf\" target=\"_blank\" rel=\"noopener\">L293 手册<\/a>，更能看清主控负责逻辑、电机电流由驱动级承担的分工；当时我是看着车轮动作，才逐渐理解这层关系的。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/manual-h-bridge-motor-control.png\" alt=\"H 桥电机控制原理\"><figcaption>H 桥电机控制原理<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-pwm-control.png\" alt=\"PWM 调速课件页\"><figcaption>PWM 调速课件页<\/figcaption><\/figure><\/div><p>不过，能解释电路还不够，板子得逐项测。课程把 LED、按键、碰撞开关、红外循迹、电机和测速分成六组测试，测试代码里还留着 <code>with-led<\/code> 与 <code>without-led<\/code> 两套版本。我沿着这些小程序检查功能，先确认输入会变、预期的轮子会动，再加载完整循迹逻辑。这样一来，跑偏时至少不用同时怀疑所有焊点和整份程序。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-basic-function-tests.png\" alt=\"基础功能测试课件页\"><figcaption>基础功能测试课件页<\/figcaption><\/figure><\/div><h3>赛道调试<\/h3><p>真正上赛道后，要同时顾及直道速度和入弯修正。<a href=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/smart-car-report.pdf\" target=\"_blank\" rel=\"noopener\">项目报告<\/a>记录了大、中、小三档转向。外侧红外通道触发时，偏离已经较大，需要更强的动作，必要时让左右轮反向；内侧通道触发时，只给较小的轮速差，中间再加一档过渡。我参与反复调整速度与左右轮指令，目标就是直道尽量快，到了弯道又能把车收回来。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-racing-challenge.png\" alt=\"圈速挑战课件页\"><figcaption>圈速挑战课件页<\/figcaption><\/figure><\/div><p>报告也记录了将原来的 4 节干电池换成更轻的 12 V 锂电方案。<\/p><p>最后，我们的小车跑进了校内圈速挑战前 5%。这个名次当然让人开心。我更清楚地记住了从散件到整车的过程，原来让小车沿黑线跑，需要我把焊接、电源、传感器读取和两轮动作逐个弄明白，再把它们放到一起调。那是我第一次觉得，自己愿意继续往嵌入式这个方向钻下去。<\/p>"}, "en": {"before": "<h2>Arduino Smart Car Line-Tracking Kit<\/h2><p class=\"summary\">A first embedded-systems build that began as a bare PCB and ended in a top-5-percent campus lap: soldering the kit, reading the LM7805/74HC165/L293 circuit blocks, staging Arduino tests, and tuning line-tracking PWM.<\/p><h3>The Car Arrived As A Bare PCB<\/h3><p>The kit arrived as one bare purple PCB, bags of through-hole parts, a few surface-mount devices, a circuit manual, and some Arduino test programs spread across the bench. Every resistor, socket, switch, sensor, and motor connector first had to land in the right place before the car could follow a black line.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/soldering-bench.jpg\" alt=\"Soldering bench during assembly\"><figcaption>Soldering bench during assembly<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/cover-front.jpg\" alt=\"Assembled smart car front side\"><figcaption>Assembled smart car front side<\/figcaption><\/figure><\/div><p>This was my first embedded-systems project. At the time, even the ideas behind a PCB, a regulator, or the capacitors around it were new to me. My beginner rule was reassuringly simple. Solder every component correctly and the functions should appear. The PCB demanded much more care than I understood at the time. Polarity, orientation, joint quality, and socket placement determined whether a part was installed correctly. Power checks and staged testing then verified the assembled board. That gap was what made me want to keep digging.<\/p><h3>Reading the Purple PCB as a Signal Chain<\/h3><p>The <a href=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/smart-car-manual-teas1-en.pdf\" target=\"_blank\" rel=\"noopener\">Smart Car manual<\/a> gave me the map I needed to read the finished board. It names an Arduino Nano-compatible controller area in the middle, a power path, an L293 motor driver, two motors and their speed sensing, WS2812 LEDs, a shift-register path, IR sensors, collision switches, and two keys. Once I could name those modules by function, the crowded purple PCB read as a signal chain.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/manual-system-diagram.png\" alt=\"Teas smart-car system diagram\"><figcaption>Teas smart-car system diagram<\/figcaption><\/figure><\/div><p>The power block first made me realise that soldered components still depend on the condition of their supply. The LM7805 path regulates the input to a 5 V rail, and the surrounding capacitors filter disturbances before they reach the logic and sensors. The project report even leaves a blunt warning that CP1, CM3, and CM4 were easy to damage during testing. That supply path directly affects the behaviour of every downstream module.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-power-supply.png\" alt=\"Power-supply slide with the school logo removed\"><figcaption>Power-supply slide with the school logo removed<\/figcaption><\/figure><\/div><h3>Fourteen Inputs Had To Queue Up<\/h3><p>The manual groups six collision switches, six IR tracking inputs, and two keys into fourteen digital signals. An Arduino Nano has only thirteen digital I/O pins, and the rest of the car still needs pins of its own. Two 74HC165 devices therefore collect those parallel states and shift them back to the controller serially. In the uploaded code, <code>reload_shift_reg()<\/code> is the moment that circuit becomes software. It refreshes the named switch and sensor fields before the program decides what the car has seen.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-sensors-switches.png\" alt=\"Sensors and switches slide\"><figcaption>Sensors and switches slide<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-shift-register.png\" alt=\"Shift-register slide\"><figcaption>Shift-register slide<\/figcaption><\/figure><\/div><p>The inputs serve two different kinds of contact with the outside world. The downward-facing IR sensors distinguish the dark line from the surrounding surface by reflection; the long-arm switches around the body register a physical collision. Both eventually arrive as bits, but one begins with reflected light and the other with a lever touching an obstacle. Seeing them share the same input path made the phrase digital signal feel much less detached from the physical car.<\/p><h3>L293 Turned PWM Into Wheel Speed<\/h3><p>On the output side, the Arduino cannot supply motor current directly. The L293 sits between logic and the two DC motors, using an H-bridge arrangement to select direction while PWM controls how much drive each wheel receives. The uploaded <code>motor_set_PWM(left, right)<\/code> implementation makes that relationship unusually visible. The sign selects direction and the magnitude, up to 255, becomes the PWM command.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/manual-h-bridge-motor-control.png\" alt=\"H-bridge motor-control principle\"><figcaption>H-bridge motor-control principle<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-pwm-control.png\" alt=\"PWM control slide\"><figcaption>PWM control slide<\/figcaption><\/figure><\/div><p>That interface also turned steering into something I could tune. Equal wheel commands drive the car forward; a smaller command on one side bends the path; opposite directions produce a much stronger correction. Which IR sensor detects the black line determines the correction grade and steering strategy. The program turns that correction into separate drive commands for the two motors.<\/p><h3>Six Small Tests Before One Fast Lap<\/h3><p>The testing-code folder is more revealing than a single polished racing sketch. It keeps separate programs for the LEDs, keys, collision switches, IR tracking sensors, motors, and speed sensors, with both <code>with-led<\/code> and <code>without-led<\/code> variants. The folder is a little untidy in the honest way beginner project folders often are, but its logic is sound. Prove one block at a time before asking the entire car to work at once.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-basic-function-tests.png\" alt=\"Basic function tests slide\"><figcaption>Basic function tests slide<\/figcaption><\/figure><\/div><p>That order matters on a soldered kit. If the IR test cannot distinguish black from the desk, or the motor test does not drive the expected wheel, a full line-tracking loop only gives hardware and code more opportunities to take turns looking guilty. The small tests narrowed the question before speed entered the picture.<\/p><h3>Three Steering Grades And A Lighter Battery<\/h3><p>The <a href=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/smart-car-report.pdf\" target=\"_blank\" rel=\"noopener\">two-page Smart Car report<\/a> records the racing logic as three steering grades. An outer IR sensor means the car has drifted farther and needs a strong correction, including opposite wheel directions; an inner sensor calls for a smaller wheel-speed difference; a medium grade fills the gap. The report also records replacing the original four dry cells with a lighter 12 V lithium-battery setup, then repeatedly tuning speed differences and RPM to keep full speed on the straights without missing the corners.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-racing-challenge.png\" alt=\"Racing challenge slide\"><figcaption>Racing challenge slide<\/figcaption><\/figure><\/div><p>Our car eventually finished in the top 5 percent of the campus lap-speed challenge. The ranking was gratifying, but the more useful result was visible before the finish line. A board that had arrived as loose parts could now turn reflected light into bits, bits into two PWM commands, and those commands into a car recovering toward the black line.<\/p>", "after": "<h2>Arduino Smart Car Line-Tracking Kit<\/h2><p class=\"summary\">I assembled and tested an Arduino car kit, learned to trace its power, sensing, and motor circuits, and helped tune the team’s car to a top-5-percent finish in the campus lap-speed challenge.<\/p><h3>Assembly<\/h3><p>My first embedded project arrived as a bare purple PCB and several bags of components. I was still learning what regulators and capacitors did when it was already time to solder resistors, IC sockets, sensors, switches, and motor connectors. My expectation was simple: install everything correctly and the car should work. Assembly made me unpack that word. Polarity, orientation, joint quality, and the order of installation all mattered beyond getting the leads into the holes.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/soldering-bench.jpg\" alt=\"Soldering bench during assembly\"><figcaption>Soldering bench during assembly<\/figcaption><\/figure><\/div><p>The car was an Arduino line-tracking kit for MEC104. I began with assembly, circuit reading, and basic tests, then helped tune it to complete a lap along a black line. The PCB, manual, and test programs came with the kit; my task was to understand their design and make the hardware I had soldered behave accordingly. Working through that gap was what drew me toward the components I had initially known only by appearance.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/cover-front.jpg\" alt=\"Assembled smart car front side\"><figcaption>Assembled smart car front side<\/figcaption><\/figure><\/div><h3>Circuit Checks<\/h3><p>With the board assembled, I used the <a href=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/smart-car-manual-teas1-en.pdf\" target=\"_blank\" rel=\"noopener\">kit manual<\/a> to follow its signals. The LM7805 supply section provides the 5 V rail, with capacitors supporting filtering. Two 74HC165 devices bring six collision switches, six IR tracking inputs, and two keys back to the Nano-compatible controller. Calling <code>reload_shift_reg()<\/code> refreshes those states before the program chooses an action. Reflected light and physical contact begin as very different interactions; the software receives both as digital states.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/manual-system-diagram.png\" alt=\"Teas smart-car system diagram\"><figcaption>Teas smart-car system diagram<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-power-supply.png\" alt=\"Power-supply slide with the school logo removed\"><figcaption>Power-supply slide with the school logo removed<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-sensors-switches.png\" alt=\"Sensors and switches slide\"><figcaption>Sensors and switches slide<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-shift-register.png\" alt=\"Shift-register slide\"><figcaption>Shift-register slide<\/figcaption><\/figure><\/div><p>The L293 drives the two DC motors. In <code>motor_set_PWM(left, right)<\/code>, the sign selects direction and the magnitude gives a PWM command up to 255. Watching the wheels made the interface concrete for me: matching commands for forward travel, a smaller command on one side for a turn, and opposing directions for a stronger correction. Reading the <a href=\"https://www.ti.com/lit/ds/symlink/l293.pdf\" target=\"_blank\" rel=\"noopener\">L293 datasheet<\/a> now clarifies the separation between controller logic and the stage supplying motor current. During the project, I built that understanding by observing the car.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/manual-h-bridge-motor-control.png\" alt=\"H-bridge motor-control principle\"><figcaption>H-bridge motor-control principle<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-pwm-control.png\" alt=\"PWM control slide\"><figcaption>PWM control slide<\/figcaption><\/figure><\/div><p>An explanation of the circuit still needed testing. The course split checks into LEDs, keys, collision switches, IR tracking, motors, and speed sensing; the test-code archive retains both <code>with-led<\/code> and <code>without-led<\/code> versions. I worked through those small programs before loading the full tracking logic, checking that inputs changed and the expected wheel moved. Once the car was on the track, a steering problem no longer required suspecting every solder joint and the entire program at once.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-basic-function-tests.png\" alt=\"Basic function tests slide\"><figcaption>Basic function tests slide<\/figcaption><\/figure><\/div><h3>Track Tuning<\/h3><p>Track work brought straight-line speed and cornering response into the same decision. The <a href=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/smart-car-report.pdf\" target=\"_blank\" rel=\"noopener\">project report<\/a> describes large, medium, and small steering corrections. An outer IR channel calls for a strong response, including opposing wheel directions when needed; an inner channel calls for a smaller speed difference, with a middle grade between them. I helped adjust speed and wheel commands repeatedly so the car could run quickly on straights and recover in corners.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-smart-car-line-tracker/course-racing-challenge.png\" alt=\"Racing challenge slide\"><figcaption>Racing challenge slide<\/figcaption><\/figure><\/div><p>The report records replacing four dry cells with a lighter 12 V lithium-battery setup.<\/p><p>Our car eventually placed in the top 5 percent of the campus lap-speed challenge, which was a satisfying result. What stayed with me was the route from loose parts to a working car. I had to understand assembly, power, sensor reads, and wheel motion individually, then tune them together. It was the first project that made me want to keep going in embedded engineering.<\/p>"}}, {"slug": "arduino-digital-clock-counter", "label": "Arduino 面包板两位数码管计数器", "zh": {"before": "<h2>Arduino 面包板两位数码管计数器<\/h2><p class=\"summary\">我在第二次嵌入式实践里承担 A17 组的面包板、译码接线、Arduino 程序与联调；数码管极性错配和六脚按键故障，逼着我第一次先测实物，再相信图纸。<\/p><h3>公共端接地以后，数码管开始乱码<\/h3><p>朋友邀请我加入 MEC104 A17 组时，这是我第二次接触嵌入式。当时我把任务想得很简单，给 Arduino 写好计数程序、烧进去，它就该像秒表一样走起来。组内的面包板搭建、引脚查找、译码器与数码管接线、Arduino 程序、按键调试和最终联调主要由我完成；报告和视频由其他组员负责。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/breadboard-counter-photo.jpg\" alt=\"面包板上的两位数码管计数器原型\"><figcaption>面包板上的两位数码管计数器原型<\/figcaption><\/figure><\/div><p>数码管的表现逼着我去查硬件链路。课程 PPT 给的是 CD4511 驱动共阴数码管的仿真接法，我们手里的显示链路却要按共阳方式工作，公共端最终接到 VCC。照着 PPT 把公共端接地时，数码管会全黑或显示乱码，TA 也解释不了。最后是我在面包板上逐段换线、试高低电平，才摸出正确方向。我们把这个现象告诉教授后，他用麦克风把问题告诉了全班。其他组当时也卡在这里。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/course-project-requirement.png\" alt=\"课程项目目标页\"><figcaption>课程项目目标页<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/course-basic-requirements.png\" alt=\"两位显示与按键要求\"><figcaption>两位显示与按键要求<\/figcaption><\/figure><\/div><h3>一个计数值，实际上要穿过两条显示链<\/h3><p>数码管肯亮以后，计数程序后面的链路才露出来。一个 <code>Num<\/code> 先用 <code>Num % 10<\/code> 取个位，再用 <code>(Num / 10) % 10<\/code> 取十位；每个数字各自查一行四位 BCD，经一颗 SN54LS47 变成七路段信号。报告把两组 BCD 输出分别画在 D9-D12 和 D5-D8，现场实物则是在 Arduino Nano 旁边铺开两颗译码器、两位数码管和一大片杜邦线。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-two-digit-wiring.png\" alt=\"作业报告里的两位数码管接线图\"><figcaption>作业报告里的两位数码管接线图<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-digit-split-code.png\" alt=\"作业报告里的个位和十位拆分代码\"><figcaption>作业报告里的个位和十位拆分代码<\/figcaption><\/figure><\/div><h3>六脚按键不肯把内部连线写在脸上<\/h3><p>两个六脚自锁按键是另一种折磨。没有数据手册，也不知道去哪里按型号找资料，六只脚只能靠猜。结果有时按下没反应，有时读数乱跳，还有过按一次却触发两次。继续换代码并不能回答最基本的问题。开关按下前后，究竟是哪几只脚导通？<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-switch-logic-code.png\" alt=\"作业报告里的开关逻辑代码\"><figcaption>作业报告里的开关逻辑代码<\/figcaption><\/figure><\/div><p>后来我向老师借来万用表，用通断档挨个测量六只脚，才把按下前后的内部连接关系画出来，再把暂停和复位接回 D2、D3。最终两个按键都能正常工作。不过，现存报告对 <code>HIGH<\/code>、<code>LOW<\/code> 和上拉接法的描述彼此冲突，最终源码也没有留下；所以我可以确认功能结果，却不能把今天看来更整齐的按键极性或消抖方案倒写回去。<\/p><h3>满分与不完整的源码归档<\/h3><p>考核包含两个分别烧录的版本。一个按 A17 组号在 <code>17<\/code> 后归零，另一个一直计数到 <code>99<\/code> 再归零。改动阈值后，我把两个独立版本分别烧录并让老师验证，它们不属于运行时切换的模式。最终课堂演示时，两位显示、暂停和复位都正常工作，TA 给了满分。<\/p><p>如今留下的 <a href=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/demo.mp4\" target=\"_blank\" rel=\"noopener\">17 秒现场视频<\/a> 只拍到两位数字变化，没有拍下按键操作；<a href=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/digital-clock-homework-report.pdf\" target=\"_blank\" rel=\"noopener\">A17 报告<\/a> 也不是我写的。Mac 上那份 <code>main.c<\/code> 是我写并烧录运行过的早期草稿，它保留了 <code>15 -&gt; 16 -&gt; 17 -&gt; 00<\/code> 的开发痕迹，但第二个按键尚未完成，注释和语法也有问题，不能冒充最终版本。Xcode 出现在归档里，只是因为 macOS 当时默认用它打开 <code>.c<\/code> 文件，并不代表它是项目的嵌入式工具链。<\/p><p>现在回看，我会把这个系统理解成 Arduino 状态、两组 BCD 输入、译码器低有效输出和 LED 电流路径的连续链条；当时的我还在课件、CSDN 和面包板测试之间拼这张地图。代码采用轮询和阻塞式 <code>delay()<\/code>，从今天的标准看很稚嫩。程序烧进板子只是任务中的一步，文档和实物还得对得上。它们打架时，先看电流怎么走，再决定该改哪一行代码。<\/p>", "after": "<h2>Arduino 面包板两位数码管计数器<\/h2><p class=\"summary\">我承担 MEC104 A17 组两位计数器的大部分搭建、编程与调试。数码管接法和六脚按键先后出问题，我通过逐段试灯、测量开关通断，把显示、暂停和复位调通。<\/p><h3>两位计数器<\/h3><p>加入 MEC104 A17 组时，我刚做过 Arduino 小车，这是第二次接触嵌入式。我以为计数器会轻松一些，写个程序，每隔一段时间加一，再给它接上暂停和复位就行。组内的面包板搭建、引脚查找、译码接线、Arduino 程序、按键调试和最终联调主要由我完成，其他组员负责报告、视频与小组事务。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/breadboard-counter-photo.jpg\" alt=\"面包板上的两位数码管计数器原型\"><figcaption>面包板上的两位数码管计数器原型<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/course-project-requirement.png\" alt=\"课程项目目标页\"><figcaption>课程项目目标页<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/course-basic-requirements.png\" alt=\"两位显示与按键要求\"><figcaption>两位显示与按键要求<\/figcaption><\/figure><\/div><p>实物摆开以后，Arduino Nano 旁边是两颗译码器、两位数码管和一大片杜邦线。一个计数值要拆成十位与个位，各自通过四位 BCD 控制一颗 SN54LS47，再由它驱动对应数码管。报告把两组 BCD 输出分别画在 D9 到 D12、D5 到 D8。我写了拆位与输出程序，却很快发现，数字在程序里变化，显示未必会跟着正常变化。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-two-digit-wiring.png\" alt=\"作业报告里的两位数码管接线图\"><figcaption>作业报告里的两位数码管接线图<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-digit-split-code.png\" alt=\"作业报告里的个位和十位拆分代码\"><figcaption>作业报告里的个位和十位拆分代码<\/figcaption><\/figure><\/div><h3>数码管接线<\/h3><p>按课程 PPT 把公共端接到 GND，数码管有时全黑，有时乱码。我先查自己的程序和接线，TA 也没能解释清楚。后来在面包板上逐段换线、试高低电平，才发现手里的显示链路需要按共阳方式连接，公共端应接 VCC。PPT 用的是 CD4511 驱动共阴显示的仿真，实物器件的前提与它对不上。<\/p><p>我们把发现告诉教授后，他用麦克风向全班说明了这件事，其他组也正卡在这里。那时我的知识还不足以完整解释译码器的输出结构，但实物测试已经足以让我修正接法。整理作品集时再查 <a href=\"https://www.ti.com/lit/ds/symlink/sn74ls47.pdf\" target=\"_blank\" rel=\"noopener\">TI 的 LS47 资料<\/a>，才把低有效、开集电极输出与共阳 LED 的关系补齐。<\/p><h3>按键排查<\/h3><p>显示调通后，两个六脚自锁按键又让我折腾了一阵。没有数据手册，也不知道怎样按型号找资料，我先靠换线试，遇到过按下没反应、读数乱跳，以及按一次触发两次。继续改按键判断，仍然绕不开一个硬件问题，按下前后究竟哪几只脚导通。<\/p><p>我向老师借了万用表，用通断档逐对测引脚，把开关的内部连接关系画出来，再把暂停与复位接到 D2、D3。最终两个功能都能正常使用。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-switch-logic-code.png\" alt=\"作业报告里的开关逻辑代码\"><figcaption>作业报告里的开关逻辑代码<\/figcaption><\/figure><\/div><h3>演示与归档<\/h3><p>考核要分别演示两个版本，一个计到组号 <code>17<\/code> 后回到 <code>00<\/code>，另一个计到 <code>99<\/code> 后回到 <code>00<\/code>。我修改阈值，分别烧录，再让老师逐项检查。课堂上，两位显示、暂停和复位都工作正常，TA 给了满分。<\/p><p>当年的代码依赖轮询和阻塞式 <code>delay()<\/code>，今天看确实稚嫩。但这次实践留下的习惯很具体，图纸与实物不一致时，我会先确认器件和电流路径；按键状态不对，就先量导通关系。程序当然要检查，只是从那以后，我不再指望改代码能修好所有接线问题。<\/p>"}, "en": {"before": "<h2>Arduino Breadboard Two-Digit Seven-Segment Counter<\/h2><p class=\"summary\">In my second embedded project, I handled A17&#x27;s breadboard build, decoder wiring, Arduino firmware, and integration. A display-polarity mismatch and an undocumented six-pin switch taught me to measure the hardware before trusting the diagram.<\/p><h3>Grounding the Common Pin Turned the Display into Gibberish<\/h3><p>A friend invited me to join MEC104 Group A17, and this became only my second embedded project. My mental model fit in one line. I would write the counter program, flash it to an Arduino, and it would run like a stopwatch. I handled most of the technical implementation, from breadboard construction and pin research through decoder wiring, Arduino firmware, button debugging, and final integration. Other group members handled the report, video, and general group work.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/breadboard-counter-photo.jpg\" alt=\"Breadboard digital-clock counter prototype\"><figcaption>Breadboard digital-clock counter prototype<\/figcaption><\/figure><\/div><p>The display behavior pushed me to inspect the hardware path. The course slides showed a CD4511 simulation driving a common-cathode display, but our physical display path had to operate as common-anode, with the common pin connected to VCC. Following the slide and grounding that pin produced either darkness or scrambled digits, and the TA could not explain it either. I eventually worked out the direction by moving jumpers and testing individual segment behavior on the breadboard. When we reported the finding to the professor, he announced the issue to the class over the microphone. Other groups were stuck there too.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/course-project-requirement.png\" alt=\"Course project requirement slide\"><figcaption>Course project requirement slide<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/course-basic-requirements.png\" alt=\"Basic two-digit and button requirements\"><figcaption>Basic two-digit and button requirements<\/figcaption><\/figure><\/div><h3>One Count Actually Travels Through Two Display Paths<\/h3><p>Once the displays agreed to light, the hidden path behind a simple counter program became visible. <code>Num % 10<\/code> extracts the units digit, while <code>(Num / 10) % 10<\/code> extracts the tens digit. Each value selects a four-bit BCD row, then passes through its own SN54LS47 to become seven segment signals. The report maps those branches to D9-D12 and D5-D8; on the bench, they spread out beside an Arduino Nano as two decoders, two displays, and a generous quantity of jumper wire.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-two-digit-wiring.png\" alt=\"Two-digit wiring from the homework report\"><figcaption>Two-digit wiring from the homework report<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-digit-split-code.png\" alt=\"Digit split code from the homework report\"><figcaption>Digit split code from the homework report<\/figcaption><\/figure><\/div><h3>The Six-Pin Switch Would Not Reveal Its Wiring<\/h3><p>The two six-pin self-locking switches caused a different kind of trouble. We had no datasheet and did not yet know where to search by part number, so the six pins initially became a guessing exercise. Sometimes a press did nothing; sometimes the readings jumped; occasionally one press registered twice. More code changes left the basic electrical question unanswered. Which pins were connected before and after the switch was pressed?<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-switch-logic-code.png\" alt=\"Switch logic code from the homework report\"><figcaption>Switch logic code from the homework report<\/figcaption><\/figure><\/div><p>I eventually borrowed a multimeter from the instructor and checked continuity across the pins one pair at a time. That gave me a map of the internal connections, which I used to reconnect pause and reset to D2 and D3. Both buttons worked in the final build. The surviving report, however, contradicts itself across <code>HIGH<\/code>, <code>LOW<\/code>, and pull-up descriptions, and the final source is gone. I can stand behind the functional result, but I cannot retrofit a neat polarity or debounce implementation that the record no longer proves.<\/p><h3>Full Marks and an Incomplete Source Archive<\/h3><p>The assessment used two separately flashed programs. One rolled over after the A17 group number, while the other counted through <code>99<\/code> before returning to <code>00<\/code>. After changing the threshold, I flashed each standalone version and the instructor verified them separately; they were not runtime modes. In the final classroom demonstration, the two-digit display, pause, and reset all worked, and the TA awarded full marks.<\/p><p>What survived is less complete. The <a href=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/demo.mp4\" target=\"_blank\" rel=\"noopener\">17-second bench video<\/a> shows the digits changing but contains no button operation, and I did not write the <a href=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/digital-clock-homework-report.pdf\" target=\"_blank\" rel=\"noopener\">A17 report<\/a>. The archived <code>main.c<\/code> is my own early draft that was flashed and run; it preserves the <code>15 -&gt; 16 -&gt; 17 -&gt; 00<\/code> development trace, but its second button is unfinished and some syntax and comments are wrong. It cannot stand in for the final program. Xcode appears in the archive only because macOS used it as the default application for <code>.c<\/code> files after my earlier basic C exercises, not because it was the embedded toolchain.<\/p><p>Looking back, I now read the system as one continuous path. Arduino state becomes two BCD inputs, then active-low decoder outputs, and finally LED current. At the time, I was still assembling that map from the course slides, CSDN posts, and breadboard tests. The firmware relied on polling and blocking <code>delay()<\/code> calls, which looks distinctly beginner-level today. Flashing the program became one step in the task, and the documentation and hardware still had to agree. When they do not, I trace the current before deciding which line of code deserves the blame.<\/p>", "after": "<h2>Arduino Breadboard Two-Digit Seven-Segment Counter<\/h2><p class=\"summary\">For MEC104 Group A17, I handled most of the two-digit counter’s wiring, firmware, and debugging. Testing the display segments and measuring switch contacts resolved faults that code changes had not.<\/p><h3>Two-Digit Counter<\/h3><p>Joining MEC104 Group A17 came just after my Arduino car project, making this my second encounter with embedded development. A counter sounded easier: increment a value at regular intervals and add pause and reset. I handled most of the technical implementation, including the breadboard, pin research, decoder wiring, Arduino program, button debugging, and integration. Other members took care of the report, video, and group administration.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/breadboard-counter-photo.jpg\" alt=\"Breadboard digital-clock counter prototype\"><figcaption>Breadboard digital-clock counter prototype<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/course-project-requirement.png\" alt=\"Course project requirement slide\"><figcaption>Course project requirement slide<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/course-basic-requirements.png\" alt=\"Basic two-digit and button requirements\"><figcaption>Basic two-digit and button requirements<\/figcaption><\/figure><\/div><p>On the bench, an Arduino Nano sat beside two decoders, two displays, and a generous spread of jumper wires. The count had to be separated into tens and units, with each four-bit BCD value sent to an SN54LS47 driving its own digit. The report assigns the two BCD groups to D9 through D12 and D5 through D8. I wrote the digit-splitting and output code, then discovered how little a changing variable guaranteed about the physical display.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-two-digit-wiring.png\" alt=\"Two-digit wiring from the homework report\"><figcaption>Two-digit wiring from the homework report<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-digit-split-code.png\" alt=\"Digit split code from the homework report\"><figcaption>Digit split code from the homework report<\/figcaption><\/figure><\/div><h3>Display Wiring<\/h3><p>Connecting the common pin to GND as shown in the course slides produced either darkness or scrambled digits. I checked my program and wiring first, and the TA could not explain the behavior either. Only after moving wires and testing individual segments at different levels did I establish that our hardware needed a common-anode connection, with the common pin at VCC. The slides used a common-cathode CD4511 simulation, so their device assumptions did not match the parts on our breadboard.<\/p><p>After we reported the finding, the professor announced it to the class over the microphone. Other groups had been stuck at the same point. I could not yet explain the decoder output structure fully, but the physical tests were enough to correct the wiring. It was while organizing this portfolio that I revisited <a href=\"https://www.ti.com/lit/ds/symlink/sn74ls47.pdf\" target=\"_blank\" rel=\"noopener\">TI&#x27;s LS47 documentation<\/a> and connected its active-low, open-collector outputs with common-anode LEDs.<\/p><h3>Button Checks<\/h3><p>The two six-pin latching switches took more work after the displays were running. We had no datasheet, and I did not know how to search for one by part number. Trying different connections produced missed presses, unstable readings, and sometimes two responses to one press. Editing the input conditions left the underlying hardware question open: which contacts actually connected in each switch position?<\/p><p>I borrowed a multimeter from the instructor, checked continuity between pin pairs, and drew the internal connection map. I then connected pause and reset to D2 and D3, and both worked in the finished build.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/arduino-digital-clock-counter/report-switch-logic-code.png\" alt=\"Switch logic code from the homework report\"><figcaption>Switch logic code from the homework report<\/figcaption><\/figure><\/div><h3>Demonstration and Archive<\/h3><p>Assessment required two separately flashed versions. One returned to <code>00<\/code> after our group number, <code>17<\/code>; the other rolled over after <code>99<\/code>. I changed the threshold, flashed each version, and had the instructor check it. Both digits, pause, and reset worked during the classroom demonstration, and the TA awarded full marks.<\/p><p>The firmware relied on polling and blocking <code>delay()<\/code> calls, and it looks distinctly like beginner work today. The debugging habit has lasted better. When a drawing disagrees with the hardware, I identify the actual parts and follow the current path; when a switch behaves strangely, I measure its contacts. Code still needs checking, but I stopped expecting code changes to repair every wiring problem.<\/p>"}}, {"slug": "juanyun-diy-cooling-prototype", "label": "DIY 压风式笔记本散热器", "zh": {"before": "<h2>DIY 压风式散热器：当 Windows 温度变成风扇占空比<\/h2><p class=\"summary\">我把笔记本温度变成蓝牙报文与 ESP32 PWM，并把控制板装进亚克力与泡棉散热器；后来的 STM32 板优化了硬件，却没有重新接回完整的 Windows 控制链。<\/p><h3>点下连接，桌上的风扇动了<\/h3><p>我记得最清楚的不是某个温度数字，而是第一次点下 <strong>Connect<\/strong>。Windows 上位机找到了 <code>ESP32_Bluetooth<\/code>，界面开始显示温度，几个字符穿过蓝牙；没过多久，亚克力机器上的风扇真的变速了。这是我第一次写上位机，也是第一次看见鼠标下面的东西一路碰到桌上的实体电路板。<\/p><p>3 分 57 秒的<a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-desktop-demo.mp4\" target=\"_blank\" rel=\"noopener\">演示视频<\/a>把这条链完整留在了一段录像里。画面从 Windows 和虚拟 COM 口一路来到 ESP32 的 OLED、实体按键、PWM 和风扇。录像里看起来很顺，做的时候却完全不是这回事。毕竟它最早的起点并不优雅，玩 CSGO 玩到电脑高温掉帧。<\/p><p>我已经试过调机器、清灰，普通散热底座还是有一个很直观的问题。风扇明明吹得挺热闹，气流却从笔记本四周跑掉不少。于是这个项目慢慢变成了两条路线，风该往哪里走，温度又该怎样一路走到风扇。<\/p><h3>电脑本来就知道自己有多热<\/h3><p>我先决定不再外挂一颗温度传感器。笔记本内部本来就能给出 CPU 和 GPU 温度，外置探头既要多花钱，又只能隔着外壳间接猜测。<a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">WinForms 上位机<\/a>于是调用 <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor\" target=\"_blank\" rel=\"noopener\">LibreHardwareMonitor<\/a>，再通过 115200 波特率的串口发出 <code>CPU62.7<\/code>、<code>GPU71.3<\/code> 这样的短报文。<\/p><p>此前我没有学过 WinForms、Qt，也不知道上位机该怎么写。我一边看 CSDN，一边借助 AI，把这个目标为 .NET Framework 4.7.2 的 C# 程序一点点拼出来。它做的事情不多，只负责扫描 COM 口、连接、显示温度和自动发送。但这几个按钮很重要，因为另一种用法是让用户打开 VS Code、接 USB-UART、再手敲命令。买个散热器还附送作业，多少有点不合适。<\/p><p>ESP32 端用 <code>BluetoothSerial<\/code> 接收这些报文。Espressif 对 <a href=\"https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-reference/bluetooth/esp_spp.html\" target=\"_blank\" rel=\"noopener\">Bluetooth Classic SPP<\/a> 的定义正是虚拟串行链路，这几乎就是我当时的用法。一套短得不能再短的协议，从 Windows 直接落进嵌入式代码。上位机负责连接和温度发送，五个实体按键负责模式、PWM 频率和手动占空比。我原本想把所有操作都塞进 GUI，最后没有实现完整；反倒是这种分工留下了一个实际优点。通电以后，不必先翻出软件，也能伸手把风扇调快或调慢。<\/p><h3><code>Fan Speed<\/code> 其实只是占空比<\/h3><p><a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 固件<\/a>在 GPIO 5 上输出初始 15 kHz、8 位分辨率的 PWM。上位机每五秒尝试发送一条数据，在 CPU 和 GPU 之间轮换；ESP32 记住 30 秒内两边各自的最高值，再取更高者按模式映射。<code>Quiet<\/code> 乘 0.5，<code>Normal<\/code> 乘 0.7，<code>High Speed<\/code> 原样使用，<code>Manual<\/code> 保留手动占空比。<\/p><p>OLED 上那一栏被我写成了 <code>Fan Speed<\/code>，板子却从来没有测过转速，显示的其实是占空比。现在再看<a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">四线 PWM 风扇的控制与转速监测说明<\/a>，这个区别就很清楚。PWM 是命令，tachometer 才是 RPM 反馈；资料还以 25 kHz 为目标频率，并提醒超出支持范围后的行为取决于具体风扇。我的原型在 15 kHz 下确实能看到转速变化，但现有归档里没有对应风扇的具体数据手册、示波器波形或 tach 读数。因此我验证的是占空比控制，不是 RPM 调节。<\/p><p>这也改变了我现在对那半周 PID 纠结的理解。当时我急着调算法，却还没有锁定具体温度传感器、测量风扇响应、选定目标温度，也没有记录热响应曲线。PID 不是因为三个字母太神秘才失败，而是我还没有把「被控制的系统」定义得足够清楚。最后留下来的比例映射不精巧，但它能让整条链先出现一个看得见的结果。<\/p><h3>占空比再积极，也拦不住四周漏掉的风<\/h3><p>控制做好以后，注意力又绕回了外壳。占空比更大，并不自动等于更多有效气流进入笔记本。现在我会用风扇曲线与系统阻力曲线的交点来理解实际风量，<a href=\"https://www.ebmpapst.com/us/en/support/faq.html\" target=\"_blank\" rel=\"noopener\">ebm-papst 把它称为系统工作点<\/a>。这套原型从来没有计算过这个点；我的做法要粗糙得多。我用亚克力搭出底座，再用泡棉贴住笔记本底部，尽量不让风从进风口旁边那条更轻松的路溜走。<\/p><p>这套亚克力与泡棉版本确实完成了制造、装配和上电，我也实际用了大约两三天。它不是经过验证的静压设计，压力、风量、噪声、功耗和稳态热响应都没有测。它更像一次让结构与控制配合起来的实体尝试。泡棉改变空气可走的路，代码改变风扇收到的命令。<\/p><h3>第二块板更规整，整条链却没再接回来<\/h3><p>真正跑成整机的是 ESP32 版本。我完成了<a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">原理图<\/a>、<a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/easyeda-2024-project.epro\" target=\"_blank\" rel=\"noopener\">EasyEDA 工程<\/a>和 <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/pcb-gerber.zip\" target=\"_blank\" rel=\"noopener\">Gerber<\/a>，再把 PCB 制造、焊接、上电并装入机器。板上有两路风扇接口、电源变换、OLED 和五个按键；我没有在板上另加风扇驱动芯片，风扇通过自身接口接收 ESP32 的 PWM 控制信号。<\/p><p>后来我围绕 <code>STM32F103C8T6<\/code> 重画了控制板。我重新整理并加宽部分走线，收紧布局、缩小体积，再加入 <code>CH340N<\/code> USB-UART。这块 PCB 也不是渲染图，我完成了焊接、上电和固件测试。从 VS Code 经串口发送命令，板子能够回复并改变风扇。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-pcb-3d.png\" alt=\"后续 STM32 控制板渲染\"><figcaption>后续 STM32 控制板渲染<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-schematic.png\" alt=\"后续 STM32 控制板原理图\"><figcaption>后续 STM32 控制板原理图<\/figcaption><\/figure><\/div><p>问题在于，更规整的板卡反而是一套更不完整的系统。我没有把它的外接蓝牙重新连到 Windows 温度上位机，也没有再装进一台亚克力整机。<a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/easyeda-2026-project.epro2\" target=\"_blank\" rel=\"noopener\">后续 EasyEDA 工程<\/a>留下了更紧凑的硬件；真正跑通 Windows 到风扇自动链路的，仍是那块更粗糙的 ESP32 板。这个反差现在比一个漂亮的版本号更有用。优化一块 PCB，并不会自动优化整个产品。<\/p><h3>九块切片板停在屏幕里<\/h3><p>我还为 Bambu Lab A1 mini 建过一版后续外壳。长壳体必须拆件，并在 <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/bambu-a1-mini-auto-slice.3mf\" target=\"_blank\" rel=\"noopener\">3MF<\/a> 里排成九块切片板；自动与手动树状支撑、零件朝向、Brim 和 Skirt 都试过。然后这条路线就停了，没有任何零件真正打印或装配。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-1.jpg\" alt=\"同一组零件的树状自动支撑视图\"><figcaption>同一组零件的树状自动支撑视图<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-2.jpg\" alt=\"同一组零件的 Brim 与 Skirt 设置\"><figcaption>同一组零件的 Brim 与 Skirt 设置<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling-3d-print-preview-3.jpg\" alt=\"树状手动支撑与零件摆放视图\"><figcaption>树状手动支撑与零件摆放视图<\/figcaption><\/figure><\/div><h3>记得的数字，不等于一条温度曲线<\/h3><p>实际使用的两三天里，我确实觉得散热有所改善。按现在还能记住的量级，CSGO 大约多了 20–30 FPS，最高温度从约 92–93°C 到了约 84°C。但我没有保存截图、同步日志，也没有在同一负载下反复做开关对照。因此这些数字只能代表我真实记得的量级，不能当成 benchmark 结果。<\/p><p>第一次点下 Connect，同样没有证明一条温度曲线。它证明的是一件更小、但对当时的我更重要的事。Windows 能读到温度，蓝牙能把它送出去，嵌入式代码能把它变成占空比，而我焊好的板子能让风扇作出反应。屏幕里的温度终于不再只是数字。只是现在的我，能更准确地说清这个数字所能支持的结论边界。<\/p>", "after": "<h2>DIY 压风式笔记本散热器<\/h2><p class=\"summary\">我做了一台亚克力与泡棉散热器，用 Windows 程序读取温度，经蓝牙控制 ESP32 和风扇。后来重画的 STM32 板完成了串口控制，尚未重新接成完整的温控整机。<\/p><h3>风道与温度<\/h3><p>做这个散热器的起因很直接，玩 CSGO 时，笔记本高温掉帧。我已经调过机器、清过灰，再看普通散热底座，总觉得风扇吹得很热闹，进到笔记本底部风口的气流却未必有多少。我想试着把四周封起来，让风少绕一些路，同时让风扇跟着电脑温度调整。<\/p><p>结构上，我做了亚克力底座，用泡棉贴合笔记本底部，减少气流从四周逃走。温度则直接从电脑内部读取，不再加外置探头。外壳附近的温度与 CPU、GPU 的状态隔着一段距离，还要增加器件成本；既然电脑已经能提供内部读数，我就想把它接到自己的控制板上。<\/p><h3>第一套上位机<\/h3><p>此前我没学过 WinForms，也没有写上位机的经验。我边查 CSDN 边借助 AI，做出一个面向 .NET Framework 4.7.2 的 C# 程序。<a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">上位机源码<\/a>调用 <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor\" target=\"_blank\" rel=\"noopener\">LibreHardwareMonitor<\/a> 读取温度，提供 COM 口扫描、连接、显示和自动发送，再把 <code>CPU62.7<\/code>、<code>GPU71.3<\/code> 这样的报文经 115200 波特率的虚拟串口送出去。接收端是使用 <code>BluetoothSerial<\/code> 的 ESP32。<\/p><p>我不想让一个散热底座的使用过程变成打开 VS Code、接 USB-UART、手敲命令。散热器还附送一份操作作业，实在没必要。原本我想把所有操作都放进 GUI，最后只完成了连接与温度发送，模式、PWM 频率和手动占空比交给五个实体按键。这个没做完整的界面方案倒也有实用之处，通电以后，伸手就能调风扇。<\/p><p>第一次在 Windows 点下 Connect，找到 <code>ESP32_Bluetooth<\/code>，看着温度出现在窗口里，随后桌上的风扇真的变速了，我很兴奋。写在电脑里的程序终于控制到了自己焊的板子。<a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-desktop-demo.mp4\" target=\"_blank\" rel=\"noopener\">3 分 57 秒的演示<\/a>保留了 Windows、蓝牙、OLED、按键和风扇之间的完整操作。<\/p><h3>温度与风扇控制<\/h3><p><a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 固件<\/a>用 GPIO 5 输出 PWM，初始频率是 15 kHz，分辨率为 8 位。自动模式采用温度的简单比例映射，另有手动占空比设置。我也花过大约半周尝试 PID，最终没有实现。那时连目标温度、传感器选择和热响应记录都没定义清楚，现在回看，急着调 PID 确实太早。<\/p><p>OLED 上的 <code>Fan Speed<\/code> 也是我后来才意识到的问题，显示变量实际是占空比，程序没有测 RPM。<a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">风扇厂商的 PWM 与转速监测说明<\/a>把控制输入与 tach 反馈明确分开。<\/p><p>上位机每五秒尝试发送一条，CPU、GPU 交替，固件再用 30 秒窗口中的较高峰值更新输出。<\/p><h3>两版硬件<\/h3><p>我为 ESP32 版完成了<a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">原理图<\/a>、<a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/easyeda-2024-project.epro\" target=\"_blank\" rel=\"noopener\">EasyEDA 工程<\/a>与 <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/pcb-gerber.zip\" target=\"_blank\" rel=\"noopener\">Gerber<\/a>，随后制造、焊接、上电并装入亚克力底座。板上有两路风扇接口、电源变换、OLED 和五个按键，没有另加风扇驱动芯片，PWM 接到风扇自身的控制接口。这一版完成了从电脑温度到实体风扇的整机联调，我实际用了大约两三天。<\/p><p>后来我用 STM32F103C8T6 <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/easyeda-2026-project.epro2\" target=\"_blank\" rel=\"noopener\">重画控制板<\/a>，重新整理并加宽部分走线，调整元件布局、缩小板子，再加入 CH340N USB-UART。我也把这块板焊好、上电，并写了固件。从 VS Code 经串口发命令，它能够回复命令，让风扇变速。这一版做到串口控制就停了，外接蓝牙还没连回 Windows 温度程序。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-pcb-3d.png\" alt=\"后续 STM32 控制板渲染\"><figcaption>后续 STM32 控制板渲染<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-schematic.png\" alt=\"后续 STM32 控制板原理图\"><figcaption>后续 STM32 控制板原理图<\/figcaption><\/figure><\/div><p>外壳也试过另一条路线。我为 Bambu Lab A1 mini 建模、拆件，在 <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/bambu-a1-mini-auto-slice.3mf\" target=\"_blank\" rel=\"noopener\">3MF<\/a> 中排成九块切片板，比较过自动与手动树状支撑、零件朝向、Brim 和 Skirt。做到切片预览就停了。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-1.jpg\" alt=\"同一组零件的树状自动支撑视图\"><figcaption>同一组零件的树状自动支撑视图<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-2.jpg\" alt=\"同一组零件的 Brim 与 Skirt 设置\"><figcaption>同一组零件的 Brim 与 Skirt 设置<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling-3d-print-preview-3.jpg\" alt=\"树状手动支撑与零件摆放视图\"><figcaption>树状手动支撑与零件摆放视图<\/figcaption><\/figure><\/div><h3>实际使用<\/h3><p>使用那两三天，我觉得散热有改善。按现在记得的量级，CSGO 大约增加了 20 到 30 FPS，最高温度从约 92 到 93°C 降到约 84°C。<\/p><p>回头看，我把最初那个让风扇跟着电脑温度调整的想法，做成了能放到自己电脑下面使用的散热器。第一次点下 Connect，看着桌上的风扇跟着电脑里的温度读数变速，那种兴奋我到现在还记得。<\/p>"}, "en": {"before": "<h2>DIY Laptop Cooler: When a Windows Temperature Became Fan Duty<\/h2><p class=\"summary\">I turned laptop temperature readings into Bluetooth messages and ESP32 PWM, then built the controller into an acrylic-and-foam cooler; a later STM32 board improved the hardware but never regained the complete Windows control chain.<\/p><h3>The Fan Moved When I Clicked Connect<\/h3><p>The moment I remember most is not a temperature number. It is the first click on <strong>Connect<\/strong>. The Windows application found <code>ESP32_Bluetooth<\/code>, temperatures appeared in the window, and a few characters crossed the Bluetooth link. A moment later, the fan on the acrylic machine changed speed. I had written my first desktop controller, and something under my mouse had finally reached a physical board on the desk.<\/p><p>The 3 min 57 s <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-desktop-demo.mp4\" target=\"_blank\" rel=\"noopener\">demonstration video<\/a> keeps that chain in one shot. It moves from Windows and a virtual COM port to the ESP32 OLED, physical buttons, PWM, and the fan. The recording looks straightforward; building it did not, especially because the project began with CSGO getting hot enough to drop frames.<\/p><p>I had already tuned the laptop and cleaned dust from its cooling system. An ordinary cooling pad still bothered me for a simple reason. Its fans were clearly moving air, but much of that air escaped around the laptop instead of entering the bottom intakes. I wanted to give both the airflow and the temperature signal more deliberate routes.<\/p><h3>The Laptop Already Knew It Was Hot<\/h3><p>My first decision was not to add another temperature probe. The laptop already exposed internal CPU and GPU temperature sensors, while an external probe would cost more and measure the chassis only indirectly. The <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">WinForms application<\/a> therefore uses <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor\" target=\"_blank\" rel=\"noopener\">LibreHardwareMonitor<\/a> and sends lines such as <code>CPU62.7<\/code> and <code>GPU71.3<\/code> through a 115200-baud serial port.<\/p><p>I had never learned WinForms, Qt, or desktop control software. I worked through CSDN material and used AI assistance to assemble a C# application targeting .NET Framework 4.7.2. Its job remained modest. It scanned COM ports, connected, displayed temperatures, and transmitted automatically. That modest window mattered because the alternative was asking a user to open VS Code, attach a USB-UART adapter, and type commands by hand. That would turn a cooling stand into homework.<\/p><p>On the ESP32, <code>BluetoothSerial<\/code> receives those lines through Bluetooth Classic SPP. Espressif describes SPP as a virtual serial link, which is almost exactly how this project used it. A deliberately tiny protocol crossed from Windows into embedded code. The application handled connection and temperature transmission; five physical buttons handled mode, PWM frequency, and manual duty. My original dream was to put everything in the GUI. The unfinished split turned out to have one practical advantage. After power-on, changing the fan no longer required finding and launching the application first.<\/p><h3><code>Fan Speed<\/code> Was Actually a Duty Cycle<\/h3><p>The <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 firmware<\/a> starts PWM on GPIO 5 at 15 kHz with 8-bit resolution. Every five seconds the application attempts one transmission, alternating CPU and GPU. The ESP32 remembers the highest value from each side for 30 seconds, chooses the larger one, and maps it by mode. <code>Quiet<\/code> multiplies it by 0.5, <code>Normal<\/code> by 0.7, <code>High Speed<\/code> uses it directly, and <code>Manual<\/code> keeps the selected duty.<\/p><p>I called the OLED field <code>Fan Speed<\/code>, but the board never measured speed. It displayed duty cycle. Reading a <a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">current four-wire PWM fan guide<\/a> now makes the missing distinction obvious. PWM is the command, while the tachometer line is the RPM feedback. The guide also targets 25 kHz and warns that behavior outside the supported range depends on the fan. My prototype visibly changed speed at 15 kHz, but the archive contains no model-specific fan datasheet, oscilloscope capture, or tach reading. What I proved was duty control, not RPM regulation.<\/p><p>This also changes how I read the PID attempt that consumed roughly half a week. I was trying to tune an algorithm before I had fixed the exact temperature sensor, measured the actuator response, chosen a target temperature, or logged a thermal curve. PID did not fail because three letters were mysterious. I had not yet defined the system tightly enough to give those letters useful work. The simple proportional mapping survived because it could complete one visible chain.<\/p><h3>PWM Could Not Stop Air Escaping Around the Laptop<\/h3><p>The controller brought my attention back to the enclosure. A larger duty command does not guarantee that more useful air enters the laptop. I now understand actual airflow through the intersection of a fan curve and the resistance of the surrounding system; <a href=\"https://www.ebmpapst.com/us/en/support/faq.html\" target=\"_blank\" rel=\"noopener\">ebm-papst calls this the system operating point<\/a>. I never calculated that point for this prototype. My approach was much rougher. I built an acrylic base and pressed foam against the underside of the laptop so less air could take the easy route around the intake.<\/p><p>The acrylic-and-foam version was fabricated, assembled, powered, and used for roughly two or three days. This was not a validated static-pressure design. I measured no pressure, airflow, noise, power, or steady-state thermal response. It was a physical attempt to make structure and control cooperate. The foam changed the route available to the air; the code changed the command sent to the fan.<\/p><h3>The Better PCB Never Regained the Complete Chain<\/h3><p>The ESP32 board was the version that became a complete machine. I drew the <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">schematic<\/a>, organized the <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/easyeda-2024-project.epro\" target=\"_blank\" rel=\"noopener\">EasyEDA project<\/a>, exported the <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/pcb-gerber.zip\" target=\"_blank\" rel=\"noopener\">Gerber package<\/a>, and completed fabrication, assembly, power-up, and installation. The PCB carried two fan interfaces, power conversion, an OLED, and five buttons. There was no separate fan-driver IC on my board; the fan accepted the ESP32 PWM control signal through its own interface.<\/p><p>I later redrew the controller around an <code>STM32F103C8T6<\/code>. I widened and reorganized traces, tightened the placement, reduced the board size, and added a <code>CH340N<\/code> USB-UART path. This second PCB also became real. I soldered it, powered it, wrote the firmware, and sent serial commands from VS Code. It replied and changed the fan.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-pcb-3d.png\" alt=\"Later STM32 control-board render\"><figcaption>Later STM32 control-board render<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-schematic.png\" alt=\"Later STM32 control-board schematic\"><figcaption>Later STM32 control-board schematic<\/figcaption><\/figure><\/div><p>The catch is that the tidier board was a less complete system. I never connected its external Bluetooth path to the Windows temperature application, and I did not install it in another acrylic machine. The <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/easyeda-2026-project.epro2\" target=\"_blank\" rel=\"noopener\">later EasyEDA project<\/a> preserves the improved hardware; the automatic Windows-to-fan chain belongs to the rougher ESP32 board. That contrast is now more useful to me than a clean revision number. Improving one board does not automatically improve the whole product.<\/p><h3>Nine Build Plates Stayed on the Screen<\/h3><p>I also modeled a later enclosure for the Bambu Lab A1 mini. The long body had to be split and arranged across nine plates in the <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/bambu-a1-mini-auto-slice.3mf\" target=\"_blank\" rel=\"noopener\">3MF<\/a>. I compared automatic and manual tree supports, part orientation, brim, and skirt settings. Then that branch stopped. No part was printed or assembled.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-1.jpg\" alt=\"Automatic tree-support view for the same part set\"><figcaption>Automatic tree-support view for the same part set<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-2.jpg\" alt=\"Brim and skirt settings for the same part set\"><figcaption>Brim and skirt settings for the same part set<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling-3d-print-preview-3.jpg\" alt=\"Manual tree-support view and part orientations\"><figcaption>Manual tree-support view and part orientations<\/figcaption><\/figure><\/div><h3>The Numbers I Remember Are Not a Thermal Curve<\/h3><p>During the two or three days of use, I felt that the cooler helped. I remember CSGO gaining roughly 20–30 FPS and the maximum temperature moving from about 92–93°C to around 84°C. I did not save screenshots, synchronize logs, or repeat the same workload with the cooler on and off. Those numbers are an honest memory of the scale I saw, not a benchmark result.<\/p><p>The first click on Connect did not prove a thermal curve either. It proved something smaller and, for me at the time, more important. Windows could observe a temperature, Bluetooth could carry it, embedded code could turn it into duty, and a board I had assembled could make a fan respond. The temperature on the screen was no longer only a number. I now understand much more precisely the limits of what that number proved.<\/p>", "after": "<h2>DIY Laptop Cooler<\/h2><p class=\"summary\">I built an acrylic-and-foam laptop cooler, with a Windows application sending temperatures over Bluetooth to an ESP32 fan controller. A later STM32 board reached serial control but never rejoined the complete system.<\/p><h3>Airflow and Temperature<\/h3><p>This cooler began with my laptop overheating and dropping frames in CSGO. I had already adjusted the machine and cleaned its cooling system. Looking at an ordinary cooling pad, I could see plenty of air moving without knowing how much entered the laptop&#x27;s bottom intake. I wanted to seal the surrounding gaps and make the fan respond to the computer&#x27;s temperature.<\/p><p>I built an acrylic base with foam against the laptop underside to reduce air escaping around it. For temperature, I chose the readings already available inside the computer. An external probe would add cost and measure farther from the CPU and GPU. Using the internal readings meant finding a way to bring them onto my own controller board.<\/p><h3>My First Desktop Controller<\/h3><p>I had no WinForms or desktop-control experience. With CSDN material and AI assistance, I assembled a C# application targeting .NET Framework 4.7.2. The <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">application source<\/a> uses <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor\" target=\"_blank\" rel=\"noopener\">LibreHardwareMonitor<\/a> for temperature monitoring, then provides COM-port scanning, connection, display, and automatic transmission. Lines such as <code>CPU62.7<\/code> and <code>GPU71.3<\/code> leave through a 115200-baud virtual serial port and reach an ESP32 using <code>BluetoothSerial<\/code>.<\/p><p>I did not want using a cooling stand to involve opening VS Code, attaching a USB-UART adapter, and typing commands. A cooler should not come with that much homework. My original plan put every control in the GUI, but I finished only connection and temperature transmission there. Five physical buttons handled mode, PWM frequency, and manual duty. The incomplete GUI plan had one useful consequence: the fan could be adjusted directly after power-on.<\/p><p>The first successful Connect click was exciting. Windows found <code>ESP32_Bluetooth<\/code>, temperatures appeared in the window, and the fan on the desk changed speed. A program on my computer was controlling a board I had soldered. The <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-desktop-demo.mp4\" target=\"_blank\" rel=\"noopener\">3 min 57 s demonstration<\/a> preserves the operation across Windows, Bluetooth, OLED, buttons, and the physical fan.<\/p><h3>Temperature and Fan Control<\/h3><p>The <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 firmware<\/a> generates PWM on GPIO 5, initially at 15 kHz with 8-bit resolution. Automatic modes use simple proportional temperature mapping, alongside manual duty control. I spent roughly half a week trying PID, without completing an implementation. In retrospect, I had reached for tuning before defining a target temperature, selecting the exact sensor, or recording the thermal response.<\/p><p>I also reconsidered the OLED label <code>Fan Speed<\/code>. Its variable was duty cycle; the program never measured RPM. A <a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">fan manufacturer&#x27;s PWM and speed-monitoring guide<\/a> makes the distinction between the command input and tach feedback explicit.<\/p><p>The application attempts one temperature transmission every five seconds, alternating CPU and GPU; the firmware updates its output from the higher peak in a 30-second window.<\/p><h3>Two Hardware Versions<\/h3><p>For the ESP32 version, I completed the <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">schematic<\/a>, <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/easyeda-2024-project.epro\" target=\"_blank\" rel=\"noopener\">EasyEDA project<\/a>, and <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/pcb-gerber.zip\" target=\"_blank\" rel=\"noopener\">Gerber files<\/a>, then had the board fabricated, soldered it, powered it, and installed it in the acrylic base. It carried two fan interfaces, power conversion, an OLED, and five buttons. There was no separate fan-driver IC; PWM went to the fan&#x27;s own control interface. This version completed the computer-temperature-to-fan integration, and I used it for about two or three days.<\/p><p>I later <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/easyeda-2026-project.epro2\" target=\"_blank\" rel=\"noopener\">redrew the controller<\/a> around an STM32F103C8T6, reorganizing and widening some traces, changing placement, reducing board size, and adding a CH340N USB-UART interface. I soldered and powered this board too, and wrote its firmware. Serial commands from VS Code produced replies and changed the fan speed. I stopped this version at serial control, with the external Bluetooth link still awaiting reconnection to the Windows temperature application.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-pcb-3d.png\" alt=\"Later STM32 control-board render\"><figcaption>Later STM32 control-board render<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/diy-cooling-stm32-schematic.png\" alt=\"Later STM32 control-board schematic\"><figcaption>Later STM32 control-board schematic<\/figcaption><\/figure><\/div><p>I explored another enclosure for the Bambu Lab A1 mini, modeling and splitting the body across nine build plates in the <a href=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling/bambu-a1-mini-auto-slice.3mf\" target=\"_blank\" rel=\"noopener\">3MF project<\/a>. I compared automatic and manual tree supports, orientation, brim, and skirt settings. That route stopped at slicing previews.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-1.jpg\" alt=\"Automatic tree-support view for the same part set\"><figcaption>Automatic tree-support view for the same part set<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-tech/diy-cooling-3d-print-preview-2.jpg\" alt=\"Brim and skirt settings for the same part set\"><figcaption>Brim and skirt settings for the same part set<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/juanyun-public/diy-cooling-3d-print-preview-3.jpg\" alt=\"Manual tree-support view and part orientations\"><figcaption>Manual tree-support view and part orientations<\/figcaption><\/figure><\/div><h3>Using the Prototype<\/h3><p>During those two or three days, I felt that cooling improved. I remember roughly 20 to 30 additional FPS in CSGO and a maximum temperature falling from about 92 to 93°C to around 84°C.<\/p><p>Looking back, I had turned the idea of a fan responding to the computer&#x27;s temperature into a cooler I could use under my own laptop. I still remember the excitement of clicking Connect for the first time and seeing the fan on my desk respond to those temperature readings.<\/p>"}}, {"slug": "tianjin-metro-stm32-foundation", "label": "天津津铁 STM32 嵌入式实习", "zh": {"before": "<h2>从 Arduino 高低电平到 STM32 外设：天津津铁通信实习记录<\/h2><p class=\"summary\">在天津津铁通信为期一个月的嵌入式实习里，我从只会调用 Arduino 高低电平函数开始，自行排出 GPIO、EXTI、Timer、PWM、UART 与 ADC 的学习顺序，最后把外接传感器、显示、舵机和 LED 接进一个裸机 demo。<\/p><h3>魔术棒配置完，GPIOC13 才有机会闪<\/h3><p>2025 年 2 月，我以「嵌入式实习生」的岗位进入天津津铁通信有限公司实习。实习证明由津铁通信出具，日常办公地点却在天津轨道交通集团总部；<a href=\"https://static.cninfo.com.cn/finalpage/2024-04-30/1219962825.pdf\" target=\"_blank\" rel=\"noopener\">集团公开披露材料<\/a>把这家公司列为其体系内全资持股的企业。听起来像是离轨道工程很近，落到我桌上的东西却很朴素，只有一块 STM32F103C8T6 Blue Pill、一只 ST-Link，以及工程师发来的一批入门资料。这是培训练习，不是生产轨道系统开发。<\/p><p>工程师没有顺便附上一张逐日课程表。对一个只实习一个月的新人来说，这也很合理。我根据资料、网上教程和自己的理解，把路线排成 GPIO → EXTI → Timer → PWM / UART / ADC → 综合 demo。此前我只在学校项目里用过 Arduino Nano；对单片机的全部理解，差不多就是调用一个函数把端口拉高，再调用另一个函数把它拉低。<\/p><p>真正拦住我的第一关甚至不是 C 代码，而是 Keil 那个「魔术棒」设置页。器件支持包、编译器、库路径、目标地址和 ST-Link 下载配置同时出现时，我连启动地址和下载算法各自负责什么都说不清。工程显示 Build Succeeded，只能证明电脑生成了程序，不能证明程序已经进到板上。于是 GPIOC13 的 300 ms 闪烁成了第一个端到端检查。从工程、编译、下载，一直走到真实引脚，链路中任何一段没接上，它都不会按预期变化。<\/p><p>公开摘录先使能 GPIOB、GPIOC 时钟。GPIOB 的 4、5 号引脚给 OLED 建立供电电平，GPIOC13 再以 300 ms 为间隔翻转。那时我第一次注意到，<code>GPIO_SetBits()<\/code> 之前还有一串不会被 Arduino API 主动讲给我的选择。外设总线时钟要先打开，引脚模式、速度和初始电平也要明确。ST 的<a href=\"https://www.st.com/resource/en/application_note/an3268-stm32vldiscovery-firmware-package-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">标准外设库<\/a>缩短了寄存器写法，却没有替我做掉这些硬件决定。<\/p><p><a href=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/stm32-basic-gpio-oled-loop.c\" target=\"_blank\" rel=\"noopener\">基础 GPIO 与 OLED 循环<\/a>把这条最初链路留在了引脚图旁边。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/stm32f103c8t6-pinout.png\" alt=\"STM32F103C8T6 引脚定义参考\"><figcaption>STM32F103C8T6 引脚定义参考<\/figcaption><\/figure><\/div><h3>一行 SetBits 往下，还有时钟、模式和寄存器<\/h3><p>我学习 GPIO 时有意往函数下面追。以 F103 为例，GPIO、AFIO、ADC 和部分 USART 的时钟开关位于 APB2 侧，TIM2–4、I²C 和另外一些 USART 则在 APB1 侧；引脚随后还要在输入、推挽输出、开漏输出或复用功能等模式间选择。<a href=\"https://www.st.com/resource/en/reference_manual/rm0008-stm32f101xx-stm32f102xx-stm32f103xx-stm32f105xx-and-stm32f107xx-advanced-arm-based-32-bit-mcus-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">RM0008 参考手册<\/a>让我看见了库函数与 RCC、GPIO 配置寄存器之间的对应关系。<code>SetBits<\/code> 不再像一句咒语，它只是整条硬件路径最后露在代码表面的那个动作。<\/p><p>接着学 EXTI 和 Timer，问题又从「现在是高还是低」分成了「哪一个边沿发生了」和「多久以后再发生一次」。编码器需要把引脚变化变成事件；定时器则把时钟经预分频和计数周期变成更新节奏。后面的综合工程里，<code>Encoder_EXTI_Config()<\/code>、<code>TIM3_Config()<\/code> 与 <code>TIM4_PWM_Config()<\/code> 会同时出现，但它们分别处理边沿、任务节奏和 PWM 时基，并不是三个名字不同的 delay。<\/p><p>OLED 还给了我一次更具体的教训。代码能编译、能烧录，接线看起来也对，屏幕却始终不显示。最后我换到另一组普通 GPIO，用软件模拟 I²C 后才恢复。实习当时我只知道「换引脚能用」；现今回看，ST 的 F103x8/xB <a href=\"https://www.st.com/resource/en/errata_sheet/es096-stm32f101x8b-stm32f102x8b-and-stm32f103x8b-mediumdensity-device-limitations-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">芯片勘误<\/a>确实记录过硬件 I²C 的 BUSY 锁死情形，因此它是一个技术上说得通的解释。但当时没有保存 BUSY 位、波形或确切引脚记录，我不能把它写成已经定位的根因。真正确定的只有故障现象、换成软件 I²C 的动作和屏幕恢复的结果。<\/p><h3>16 个点，把 ADC 数字送到 TIM4<\/h3><p>学 PWM、UART 和 ADC 时，我开始把「数据」按用途分开。ADC 把光敏传感器的模拟量变成采样数字；PWM 用定时器的周期与比较值决定 LED 或舵机收到的脉冲；UART 则把光照数据和调试文字送到电脑。它们都在传数，却分别承担采样、执行和观察，不能因为最后都落进变量就混成一类接口。<\/p><p>为了让目标光照数值能对应到 LED 输出，我没有凭感觉写一条直线，而是逐点改变 PWM、读取 ADC，记下 16 组数据。表格里 PWM 从 0 增到 1000，ADC 从 1600 降到 480；目标落在两点之间时，<code>Lookup_PWM_For_Target()<\/code> 做线性插值，再把结果写进 TIM4 通道 1。传感器分压方向使数值呈反向变化，但这里没有换算照度单位，也没有测量拟合误差。标定解决的是这套面包板接法下该写多少比较值，不是计量级光照测量。<\/p><p>这条路径最容易被说成闭环，代码却给出了更诚实的答案。目标值直接查表得到 PWM，实测光照只被读取、显示和通过 UART 打印，没有形成目标减实测的误差，也没有据此继续修正输出。它是一条带实测可观察性的前馈标定路径。我当时确实想过继续做反馈，但没有把那个想法写进最终代码。<\/p><h3>所有外设终于挤进同一个 main()<\/h3><p>前面的 GPIO、OLED、编码器、舵机、DHT11、光敏传感器、PWM 和 UART 都先以独立工程跑通，最后才被接进同一个裸机程序。Blue Pill 周围是面包板和杜邦线，没有定制扩展板。按键切换编码器的控制对象。一种模式改变目标光照，另一种模式改变舵机速度；GPIOC13 留作状态指示；OLED 同时显示实测光照、目标、LED 输出和温湿度；UART 把光照数据与调试信息发到电脑。所有外设在最终 demo 中能够同时工作。<\/p><p>公开的主循环摘录保留了光照这条主线。<code>Get_Encoder_Value()<\/code> 改变目标，flag 到来后读取光敏传感器与 DHT11，OLED 刷新数值，查表结果交给 LED PWM。完整实习工程里还有按键模式、舵机和 UART，当前公开摘录没有把这些分支全部展开。应用层流程、编码器数值映射、标定插值、模式切换和综合主循环由我编写；OLED、DHT11、编码器等驱动则是在 ST 标准库和公开例程基础上理解、修改和接入，不把它们说成从零独立发明。<\/p><p>这个程序没有 RTOS。中断和定时器 flag 负责一部分事件与轮询节奏，主循环串起其余工作，某些延时仍是阻塞式 <code>delay<\/code>。对于温湿度、旋钮和灯光这种低频 demo，它确实能跑；但再加入更严格的实时任务，阻塞延时、共享状态和各分支执行时间都会变成需要重新设计的问题。<\/p><p>这约 20 个工作日的路线由我独立完成，工程师最后看过 demo，也听我讲了对外设的理解，评价是「学得比较扎实」。这是一次非正式检查，不是项目验收。工程师给的材料还引出了 PID、ATP、ATO 和 ATS；我认真读了原理，却没有实现或整定 PID，更没有接触真实列车控制。<a href=\"https://xxgk.mot.gov.cn/jigou/ysfws/202201/P020220121613617393399.pdf\" target=\"_blank\" rel=\"noopener\">交通运输部的城市轨道交通信号系统规范<\/a>把 ATP 的安全防护、ATO 的列车自动运行和 ATS 的监督协调放在远比这块 Blue Pill 更严格的可靠性、冗余与验证约束下。我的 demo 能提供的只是一个缩影。输入、状态、时序、通信和输出如何在控制器里相遇。<\/p><p>这段实习真正延续到后面的地方，是 FOC。到了电机控制项目里，Timer 不再只是周期触发，ADC 不再只是读一个光敏值，PWM 也不再只是调灯；采样时刻要和 PWM 对齐，控制计算要赶在下一次更新前完成。ST 的<a href=\"https://www.st.com/resource/en/user_manual/um1052-stm32f-pmsm-singledual-foc-sdk-v43-stmicroelectronics.pdf\" target=\"_blank\" rel=\"noopener\">电机控制文档<\/a>把这些资源放在同一条同步链路上。天津实习没有把我直接变成电机控制工程师，却让我在后来第一次看到这条链时，不需要再从「单片机为什么不只是几个函数」重新开始。<\/p>", "after": "<h2>天津津铁 STM32 嵌入式实习<\/h2><p class=\"summary\">在天津津铁一个月的基础实习中，我自行安排 STM32 学习顺序，从外设小实验做起，最后把传感器、显示、编码器、舵机与 LED 控制接进同一套裸机演示。<\/p><h3>从 Arduino 到 STM32<\/h3><p>2025 年 2 月，我在天津津铁通信有限公司做了一个月嵌入式实习，日常办公地点在天津轨道交通集团总部。工程师给我一批入门资料，桌上是一块 STM32F103C8T6 Blue Pill、一只 ST-Link 和外接模块，我就从这些基础练起。<\/p><p>此前我在学校用过 Arduino Nano，对单片机的理解大多停在调用函数、输出高低电平。工程师没有给逐日课表，我就结合资料和网上教程安排自己的顺序，先 GPIO，再 EXTI 与 Timer，接着学 PWM、UART、ADC，最后把它们接成一个综合 demo。我想弄明白，以前函数调用后直接出现的现象，在 STM32 上到底要经过哪些配置。<\/p><h3>第一次上板<\/h3><p>Keil 的魔术棒设置页先让我卡了一阵。器件包、编译器、启动文件、库路径、目标地址与下载算法都要配置，我却还不清楚它们分别影响哪一步。后来我把检查分开，电脑先能编译，ST-Link 再能下载，最后看板上有没有明确输出。GPIOC13 每隔 300 ms 翻转，成了第一项贯穿工具链与实物的验证。<\/p><p><a href=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/stm32-basic-gpio-oled-loop.c\" target=\"_blank\" rel=\"noopener\">最初的 GPIO 与 OLED 程序<\/a>还保留着这些配置。先开 GPIOB、GPIOC 时钟，用 PB4、PB5 给 OLED 建立供电电平，再初始化显示并控制 PC13。当时是低功耗面包板练习，用 GPIO 给模块供电也受引脚电流能力约束。我开始主动往 <code>GPIO_SetBits()<\/code> 下面追，核对时钟、引脚模式和寄存器，而不只记函数名。<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/tianjin-metro/stm32f103c8t6-pinout.png\" alt=\"STM32F103C8T6 引脚定义参考\"><figcaption>STM32F103C8T6 引脚定义参考<\/figcaption><\/figure><\/div><p>OLED 曾经编译、下载都正常却不显示。最后我换了一组普通 GPIO，用软件模拟 I²C，屏幕恢复了。<\/p><h3>外设组合<\/h3><p>GPIO、OLED、编码器、舵机、DHT11、光敏传感器、PWM 与 UART，我先在独立工程里逐个跑通，再加入同一套裸机程序，模块靠面包板与杜邦线连接。按键负责切换编码器的控制对象，一种模式调目标光照，另一种调舵机速度；OLED 显示实测光照、目标、LED 输出和温湿度，UART 向电脑发送光照与调试信息，PC13 留作状态灯。<\/p><p>集成时，EXTI 处理编码器事件，TIM3 提供慢任务的触发节奏，TIM4 负责 PWM。温湿度与光敏读取等 flag 到来再执行，旋钮和目标值则在主循环中更新。我编写了应用流程、编码器映射、模式切换与综合主循环，外设驱动是在 ST 标准库和公开例程基础上理解、修改、接入的。<\/p><h3>光照标定<\/h3><p>为了把目标光照数值转换成 LED 输出，我逐点调整 PWM、读取 ADC，在这套面包板上记下 16 组数据，再写了
