0/uploads/projects/sensorless-foc-learning-route/pcb-fabrication-drawing.pdf\" target=\"_blank\" rel=\"noopener\">PCB fabrication drawing<\/a>, <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/compressor-6md030z-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">compressor manual<\/a>, and the <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/drv8301-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">DRV8301<\/a>, <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/hy3010d-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">HY3010D<\/a>, <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/stm32f446re-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">STM32F446<\/a>, and <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/lm358a-datasheet.pdf\" target=\"_blank\" rel=\"noopener\">LM358A<\/a> datasheets.<\/p><h3>Manufacturing Was Part of the Learning<\/h3><p>I did not hand the finished files to someone else and wait for a populated board. I exported Gerber and BOM data, placed the order, loaded the SMT feeders, set the pick-and-place coordinates, operated the machine, then completed rework, hand soldering, assembly, and power-on checks myself. The <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-smt-pick-and-place.mp4\" target=\"_blank\" rel=\"noopener\">onsite SMT recording<\/a> is the manufacturing record for this exact board rather than generic factory footage.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-smt-pick-and-place-poster.jpg\" alt=\"Feeder setup during onsite SMT work\"><figcaption>Feeder setup during onsite SMT work<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-test.jpg\" alt=\"Assembled board and compressor bench\"><figcaption>Assembled board and compressor bench<\/figcaption><\/figure><\/div><p>The design paused over the February holiday and again after term resumed in March. I returned in April and May to a very different kind of work. The board now had to survive real pin mapping, analogue scaling, startup current, driver faults, and a compressor that could not be reasoned about as a frictionless motor model.<\/p><h3>Open Source Was the Starting Line<\/h3><p>The firmware began from an open-source FOC example codebase. I did not write its initial Clarke, Park, current-PI, inverse-Park, SVPWM, and EKF baseline. Its original target was an ordinary three-wire brushless motor, while my board and compressor introduced a different pin map, analogue front end, operating interface, startup load, and fault behaviour.<\/p><p>I led the board adaptation and physical verification. That work covered pin and peripheral mapping, current and voltage conversion, OLED, buttons, EC11 control, compressor startup behaviour, and a protection state machine for voltage, current, driver faults, and restart. The custom hardware eventually proved compatible with the example&#x27;s control chain, but compressor adaptation took much longer than board compatibility alone suggested.<\/p><p>During the later observer investigation, I worked with Codex to inspect the code and implement the RAM trace facility, EKF parameter corrections, and the diagnosis of Kalman-gain values being overwritten. I still set the experiments, handled the hardware, judged the compressor&#x27;s behaviour, and decided which results were safe enough to keep. The <a href=\"https://github.com/Awes0meE/STM32_Sensorless_FOC\" target=\"_blank\" rel=\"noopener\">public firmware repository<\/a> remains unchanged and serves as external code evidence.<\/p><h3>Twelve Volts and an Open Compressor<\/h3><p>The first useful anchor was stable 45 Hz open-loop operation. I then kept 30, 45, and 60 Hz test points because their mechanical response and electrical trends were repeatable enough to compare during debugging. The final low-speed EC11 version exposed a 30-80 Hz command range at a 12 V bus. This is commanded electrical frequency, not a directly measured shaft speed.<\/p><p>The <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/runtime-open-loop.mp4\" target=\"_blank\" rel=\"noopener\">runtime recording<\/a> comes from that final version. I may have set it near 80 Hz, but I no longer have enough evidence to assign an exact value to the clip. Both suction and discharge ports were open. Near the end, I manually restricted the suction inlet and watched the drive continue through the disturbance. The strong perceived suction, low audible noise, and continued operation gave me practical confidence that the open-loop FOC path was doing continuous work.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/runtime-open-loop-poster.jpg\" alt=\"Final low-speed EC11 open-loop demo\"><figcaption>Final low-speed EC11 open-loop demo<\/figcaption><\/figure><\/div><p>I had previously connected the same compressor to a low-cost sensorless controller sold for small fan motors. It had a speed knob, and my oscilloscope showed ordinary six-step square-wave commutation. Under comparable bench conditions, I remember that drive sounding louder, heating the compressor more, and producing weaker suction. The contrast was obvious to me at the bench, yet there is no controlled pressure, flow, acoustic, temperature, or efficiency dataset. I keep it as a first-person observation rather than a numerical comparison or a universal verdict on six-step control.<\/p><p>The ports were never connected to a complete refrigeration loop. Manual inlet restriction is a disturbance observation, not a pressure-difference test under refrigerant load. This stage establishes real assembled-board operation and a bounded open-loop range. It does not establish refrigeration performance or sensorless closed-loop control.<\/p><h3>The Boundary Is Still the Handoff<\/h3><p>Open-loop operation showed that the power stage, sampling path, current loop, SVPWM updates, and compressor could work together. After sign, motor-parameter, and code corrections, the EKF speed estimate also moved close to the imposed frequency. Closed-loop takeover still failed.<\/p><p>That failure changed the question. A plausible speed estimate shows that the observer can see motion. It does not prove that the instantaneous rotor angle is accurate enough, that the internal state has converged, or that control can switch from the imposed angle to the estimated angle without a phase jump. The related note <span title=\"该旧笔记已暂挂\" class=\"paused\">The Speed Estimate Looked Right—Why Couldn&#x27;t the Loop Take Over?<\/span> follows that distinction through the actual code and traces.<\/p><h3>The Route Continues Past This Compressor<\/h3><p>I froze the 30-80 Hz low-speed demo in May 2026 because it was a reproducible and safe endpoint for that round of work. The project itself remains active. The longer goal is general sensorless closed-loop control for brushless and servo motors, then the harder questions around robot-joint motors, force feedback, low-speed startup, and possible high-frequency injection.<\/p><p>None of those future directions is implemented here yet. The compressor&#x27;s open-loop run is the first complete physical checkpoint on a longer route. A real load forced every weak link into view. It also left me with a more precise next step than simply making the motor spin.<\/p>", "after": "<h2>Custom Driver Board and Sensorless FOC<\/h2><p class=\"summary\">I designed and assembled an STM32F446/DRV8301 driver, adapted open-source firmware, and ran a compressor on a 12 V bus with 30 to 80 Hz open-loop commands. Sensorless handoff remains unresolved.<\/p><h3>Building the Driver<\/h3><p>After a PMSM-FOC course, I wanted to make the equations drive a real motor. I had only brushed motors nearby, no suitable three-phase brushless load, and the companion teaching board cost RMB 888. I decided to build the driver myself, gaining an experimental platform while working through the course&#x27;s circuit ideas again.<\/p><p>The PCB silkscreen marks 25 November 2025, the day I started drawing it. Using chip reference circuits, I independently completed the schematic, component selection, layout, and manufacturing files. The design went for fabrication in January 2026.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/board-render-front.png\" alt=\"Front render of the custom FOC board\"><figcaption>Front render of the custom FOC board<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/board-render-back.png\" alt=\"Back render of the custom FOC board\"><figcaption>Back render of the custom FOC board<\/figcaption><\/figure><\/div><p>While I was working on another project, a small compressor arrived in the workshop. Reading its manual and following the three-phase connections showed me that its internal permanent-magnet motor could serve as the load. I had been looking for a brushless motor; the eventual experiment involved compressor startup, sustained operation, and disturbances, considerably more tangible than an ideal course model.<\/p><h3>From Schematic to Hardware<\/h3><p>I chose an STM32F446RET6, DRV8301DCAR, and six HY3010D MOSFETs for the controller, gate driver, and three-phase power stage. Five schematic sheets organize control and timing, connectors, analog sensing, the power stage, and gate-drive interfaces. They allow the path to be followed from <code>Ia<\/code> and <code>Ib<\/code> sensing through six complementary PWM signals to the U/V/W output. Hall and encoder interfaces were retained for later experiments.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-mcu.png\" alt=\"STM32F446 control sheet\"><figcaption>STM32F446 control sheet<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-adc.png\" alt=\"Current and voltage sampling sheet\"><figcaption>Current and voltage sampling sheet<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-mos.png\" alt=\"HY3010D power stage\"><figcaption>HY3010D power stage<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/schematic-driver.png\" alt=\"DRV8301 gate-driver sheet\"><figcaption>DRV8301 gate-driver sheet<\/figcaption><\/figure><\/div><p>After completing the design, I exported Gerber and BOM files, placed the order, and operated the SMT equipment myself, loading feeders, setting placement coordinates, and running the machine. Rework, hand soldering, assembly, and power-on checks followed. The <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-smt-pick-and-place.mp4\" target=\"_blank\" rel=\"noopener\">onsite SMT video<\/a> records this exact board. Component placement and connections that I had handled on the drawing now had to survive assembly and electrical checks.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-smt-pick-and-place-poster.jpg\" alt=\"Feeder setup during onsite SMT work\"><figcaption>Feeder setup during onsite SMT work<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/onsite-test.jpg\" alt=\"Assembled board and compressor bench\"><figcaption>Assembled board and compressor bench<\/figcaption><\/figure><\/div><h3>Board Adaptation<\/h3><p>The work paused over the February holiday and after term resumed in March. I returned to concentrated hardware debugging in April and May. Starting with the Clarke, Park, current PI, inverse Park, SVPWM, and EKF algorithms in an open-source FOC example, I adapted it from an ordinary three-wire brushless motor to my board and this compressor.<\/p><p>I led pin, peripheral, and sensing-scale adaptation, connected the OLED, buttons, and EC11, then worked on compressor startup and the protection state machine. Voltage, current, driver faults, and restart conditions all needed physical checks. Matching pins was still some distance from reliable compressor operation. Startup load and fault behavior could not be explained solely by the example&#x27;s defaults.<\/p><p>During the observer investigation, I reviewed code with Codex. It helped implement RAM tracing, correct EKF parameters, and identify overwritten Kalman-gain values. I selected experiment conditions, operated the hardware, assessed sound and vibration, checked startup behavior, and decided which changes to keep. I carried those changes into the <a href=\"https://github.com/Awes0meE/STM32_Sensorless_FOC\" target=\"_blank\" rel=\"noopener\">firmware repository<\/a>.<\/p><h3>Running the Compressor<\/h3><p>Stable 45 Hz open-loop operation gave me the first repeatable condition for checking changes. I then retained 30, 45, and 60 Hz test points to compare mechanical response and electrical trends. The final low-speed EC11 version exposed a 30 to 80 Hz electrical-frequency command range on a 12 V bus.<\/p><p>The <a href=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/runtime-open-loop.mp4\" target=\"_blank\" rel=\"noopener\">runtime video<\/a> shows that final version. Both suction and discharge ports were open. Near the end I restricted the suction inlet by hand and observed continued operation. At the bench, the suction felt strong and the noise sounded low.<\/p><div class=\"images\"><figure><img loading=\"lazy\" src=\"http://127.0.0.1:3000/uploads/projects/sensorless-foc-learning-route/runtime-open-loop-poster.jpg\" alt=\"Final low-speed EC11 open-loop demo\"><figcaption>Final low-speed EC11 open-loop demo<\/figcaption><\/figure><\/div><p>Earlier, I had tried the same compressor with a low-cost sensorless board intended for small fan motors. It had a speed knob, and I confirmed ordinary six-step commutation with an oscilloscope. Under similar bench conditions, I remember louder sound, more heat, and weaker suction.<\/p><h3>Sensorless Handoff<\/h3><p>Once sustained open-loop operation worked, I continued correcting EKF signs, motor parameters, and code defects until estimated speed approached the imposed frequency. Switching to sensorless control still failed. I reconsidered my approach, shifting my attention from estimated speed to the instantaneous angle produced by the observer.<\/p><p>Reading <a href=\"https://www.st.com/en/applications/industrial-motor-control/3-phase-field-oriented-control-foc.html\" target=\"_blank\" rel=\"noopener\">ST&#x27;s FOC overview<\/a> now reinforces the role of rotor angle in control. Next I want to check angle error, state convergence, and reference continuity at the transition separately to find out why handoff fails.<\/p><p>In May 2026, I kept the repeatable 30 to 80 Hz low-speed demonstration version. I still want to complete sensorless control for brushless and servo motors, then investigate robot joints, force feedback, low-speed startup, and high-frequency injection. The immediate question is how to move the observer from producing a plausible reading to supplying information I can actually use for control.<\/p>"}}];let lang='zh';const select=document.getElementById('project');data.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' · '+p.label;select.append(o)});const requested=Number(location.hash.replace('#project-',''));if(Number.isInteger(requested)&&requested>=0&&requested<data.length)select.value=requested;function show(){const i=Number(select.value),p=data[i];document.getElementById('before').innerHTML=p[lang].before;document.getElementById('after').innerHTML=p[lang].after;document.querySelectorAll('.reader').forEach(el=>el.scrollTop=0);document.getElementById('site').href='http://127.0.0.1:3000/work/'+p.slug;document.getElementById('position').textContent=(i+1)+' / '+data.length;document.getElementById('zh').setAttribute('aria-pressed',lang==='zh');document.getElementById('en').setAttribute('aria-pressed',lang==='en');document.documentElement.lang=lang==='zh'?'zh-CN':'en';history.replaceState(null,'','#project-'+i)}select.onchange=show;document.getElementById('zh').onclick=()=>{lang='zh';show()};document.getElementById('en').onclick=()=>{lang='en';show()};show();</script></html>
