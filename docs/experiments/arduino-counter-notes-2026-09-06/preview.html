.note-picker{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0 12px}.note-picker button{font-size:13px;min-height:44px}.note-picker button[aria-pressed=true]{background:#e6eee5;color:#254d39;border-color:#70997a}.end-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:22px}pre{white-space:pre;overflow-x:auto}pre code{white-space:pre;overflow-wrap:normal} @media(max-width:600px){pre{padding:14px}pre code{font-size:12px}}</style></head><body><header><div class="meta" id="meta"></div><div class="note-picker" aria-label="选择笔记"><button id="note-display" aria-pressed="true">01 · 数码管与 BCD</button><button id="note-switch" aria-pressed="false">02 · 自锁按键与计数</button></div><h1 id="title"></h1><div class="toolbar"><button id="zh" aria-pressed="true">中文</button><button id="en" aria-pressed="false">English</button><a class="home" id="home" href="https://www.66ccff-labs.com/work/arduino-digital-clock-counter" target="_blank" rel="noopener">查看项目主页 ↗</a></div></header><main><nav aria-label="文章目录" id="toc"></nav><article id="article"></article><footer><div id="footer"></div><div class="end-actions"><button id="other-note"></button><a href="#" id="back-top">回到顶部 ↑</a></div></footer></main><script>const data={"display": {"zh": {"title": "共阳数码管与 BCD 译码", "body": "<p>两位数码管显示 <code>17<\/code> 时，看上去只是把程序里的数搬到了面包板上。我现在再看这份计数器程序，想把中间的过程拆开弄明白。Arduino 保存的是一个数，送到译码器的是两组四位输入，最后亮起来的却是几段 LED。数字、引脚电平和发光的灯段之间，每一步都有各自的对应关系。<\/p><h2 id=\"section-1\">十进制数与 BCD<\/h2><p><a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-clock-homework-report.pdf#page=1\" target=\"_blank\" rel=\"noopener\">作业报告<\/a>里的拆位方法很直接，<code>Num % 10<\/code> 取个位，<code>(Num / 10) % 10<\/code> 取十位。把 <code>17<\/code> 代进去，得到个位 <code>7<\/code>、十位 <code>1<\/code>，再分别送给两颗译码器。BCD 用四个二进制位表示一个十进制数字，所以这里是两个独立的数字编码。若把整数 17 直接按二进制展开，得到的是 <code>10001<\/code>，和两位显示所需的 <code>0001 0111<\/code> 不是同一种表示。<\/p><p>我读<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/single-digit-bcd-counter.ino\" target=\"_blank\" rel=\"noopener\">单个位显示示例<\/a>时，反而在最简单的数字 <code>1<\/code> 上停了一下。数组把它写成 <code>{1, 0, 0, 0}<\/code>，而平时写二进制时习惯看到 <code>0001<\/code>。对照引脚定义就明白了，程序按 A、B、C、D 的顺序存储，权重依次为 1、2、4、8；通常书写的二进制数则把最高位放在左边。数组里的第一个元素先发给 A，顺序完全对得上。<\/p><pre><code>Decimal digit    D C B A    Array order A, B, C, D\n      1          0 0 0 1          1, 0, 0, 0\n      7          0 1 1 1          1, 1, 1, 0<\/code><\/pre><p>这个示例还有十六行编码，但主循环用 <code>% 10<\/code> 把索引限制在 0 到 9。四根线能表示十六种组合，十进制的一位只需要其中十种。剩下六种也不能随意当成十六进制字母来显示。<a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">TI 的 LS47 说明<\/a>给它们定义了特定图形，<a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B<\/a> 则会将大于 9 的输入消隐。以后换译码器时，除了看 0 到 9，我也会看看越界输入会让输出变成什么。<\/p><h2 id=\"section-2\">低有效输出<\/h2><p>再往后看，A 到 D 只负责选择数字，译码器的 a 到 g 才对应七段 LED。按常用段位标记，显示 <code>7<\/code> 要点亮顶部的 a、右上的 b 和右下的 c。对项目里的 SN54LS47 来说，这几个输出变低时，相应的灯段才亮。<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/sn54ls47-datasheet.pdf#page=2\" target=\"_blank\" rel=\"noopener\">LS47 数据手册<\/a>把它的输出标为低有效、开集电极，驱动共阳数码管。这里的低电平要放到电流路径里理解。<\/p><p>共阳数码管把各段 LED 的阳极连在一起，公共端接到正电源。选中某一段后，LS47 内部的输出晶体管导通，电流从正电源经过该段 LED 和串联限流电阻，流入译码器，再回到地。输出端电压降低，LED 两端反而得到正向电压，于是发光。沿着这条路径看，输出电平与亮灭的关系就顺了。<\/p><p>开集电极也值得单独看一下。输出晶体管关闭时，芯片松开了这条下拉路径，输出端呈高阻，节点电压由外部电路决定。它不会像普通推挽输出那样主动把引脚推到电源电压。因而，真值表里的不点亮状态、输出引脚上测到的电压，以及能否向外提供电流，要分别理解。我读到这里才更留意数据手册为什么同时写了译码器和驱动器两个身份。<\/p><figure><a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/bcd-decoder-notes.png\" target=\"_blank\" rel=\"noopener\"><img src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/bcd-decoder-notes.png\" alt=\"课程中的译码器引脚与逐段限流说明\"><\/a><figcaption>课程中的译码器引脚与逐段限流说明<\/figcaption><\/figure><h2 id=\"section-3\">每一段的电流<\/h2><p>课件要求每个段输出各串一个限流电阻。我想进一步弄清楚，为什么不在数码管公共端只放一只。假如所有段共用一只电阻，显示 <code>1<\/code> 时只有两条 LED 支路分电流，显示 <code>8<\/code> 时变成七条。亮起的段数改变后，每段分到的电流也会改变，亮度就容易随数字变化。电阻分别放在各段支路，才能分别限制各段电流。<\/p><p>估算某一段时，我会把 LED 的正向压降和驱动器导通后的低电平电压一起扣掉。假设电源为 5 V，某段 LED 在目标电流附近的正向压降为 2.0 V，驱动输出压降按 0.3 V 计算，希望段电流约为 5 mA，那么电阻约为 <code>(5 − 2.0 − 0.3) / 0.005 = 540 Ω<\/code>。换成常见的 560 Ω，按同样假设算出约 4.8 mA。这组数值是一个选值例子，具体数码管和芯片还要按各自的电气参数计算。<\/p><p>这样看，课件里的 330 Ω 就有了可以继续追问的地方。电阻值要和供电、电流、LED 压降放在一起看；同样用 330 Ω，换一种 LED 后电流未必相同。显示 <code>8<\/code> 时七段都亮，还要把七路电流加起来，检查公共端、电源和译码器的负担。选电阻既要让每一段合适，也要看整位显示一起亮时怎样工作。<\/p><h2 id=\"section-4\">译码器的配合<\/h2><p>再对照课件仿真里的 <a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B<\/a>，差别就很具体了。它为共阴 LED 提供段驱动电流，选中的段输出高电平，电流从输出端经过 LED 和限流电阻流向公共阴极，再回到地。同样送入一个数字，两种芯片要求的公共端接法和段输出有效电平不同。它们都能把 BCD 变成七段图形，连接 LED 的方式却要随输出结构一起选。<\/p><p>我还会把视线从四位输入移到测试和消隐脚上。<a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">LS47 的控制说明<\/a>列有灯测试、消隐和零消隐功能，这些控制会参与决定显示状态。如果只查 A 到 D，忽略了这些脚的状态，就可能遇到输入数字正确、显示仍然被关闭的情况。调试单个位时，我会先按真值表设好正常译码条件，再固定送入 <code>1<\/code>、<code>7<\/code> 和 <code>8<\/code>，逐步检查右侧两段、顶部一段和全部七段。<\/p><p>回到最初的 <code>17<\/code>，我现在会分别想到十位和个位的 BCD、被选中的段，以及经过每只 LED 的电流。若某一段始终不亮，可以沿那条支路找；若整位稳定显示成另一个数，就先对照输入位序和译码条件。一个小小的显示结果，终于能和具体引脚、具体电流对应起来了。以后再碰到数码管，我也更知道该从哪里开始看。<\/p>", "toc": [[1, "十进制数与 BCD"], [2, "低有效输出"], [3, "每一段的电流"], [4, "译码器的配合"]]}, "en": {"title": "Common-Anode Displays and BCD Decoding", "body": "<p>When the two-digit display reads <code>17<\/code>, it looks as though the program has simply moved a number onto the breadboard. Reading the counter program again, I want to follow what happens in between. The Arduino holds a number, the decoders receive two groups of four inputs, and a set of LED segments lights up. Numbers, pin levels, and illuminated segments each have a mapping that needs to make sense.<\/p><h2 id=\"section-1\">Decimal Digits and BCD<\/h2><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-clock-homework-report.pdf#page=1\" target=\"_blank\" rel=\"noopener\">project report<\/a> separates the digits with <code>Num % 10<\/code> for units and <code>(Num / 10) % 10<\/code> for tens. Applying those expressions to <code>17<\/code> gives <code>7<\/code> and <code>1<\/code>, which go to separate decoders. BCD represents each decimal digit with four binary bits, so there are two independent digit codes here. The binary representation of the integer 17 is <code>10001<\/code>; the two display digits require the BCD groups <code>0001 0111<\/code>. Those representations serve different purposes.<\/p><p>The number <code>1<\/code> made me pause when I read the <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/single-digit-bcd-counter.ino\" target=\"_blank\" rel=\"noopener\">single-digit example<\/a>. Its array entry is <code>{1, 0, 0, 0}<\/code>, while I normally expect to see <code>0001<\/code> written down. The pin definitions explain the order. The array follows A, B, C, D, with weights of 1, 2, 4, and 8. Written binary usually puts the most significant bit on the left. Here the first array element goes to A, exactly where it belongs.<\/p><pre><code>Decimal digit    D C B A    Array order A, B, C, D\n      1          0 0 0 1          1, 0, 0, 0\n      7          0 1 1 1          1, 1, 1, 0<\/code><\/pre><p>The example contains sixteen array rows, but <code>% 10<\/code> limits the index to 0 through 9 in the loop. Four wires can represent sixteen combinations; one decimal digit uses ten of them. The other six are not automatically hexadecimal characters. <a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">TI defines particular patterns for the LS47<\/a>, whereas the <a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B blanks inputs above 9<\/a>. When comparing decoders, I would now check what happens outside the normal digit range as well.<\/p><h2 id=\"section-2\">Active-Low Outputs<\/h2><p>Inputs A through D select the number; outputs a through g correspond to the seven LED segments. With the usual segment labels, <code>7<\/code> lights the top segment a, upper-right b, and lower-right c. The project&#x27;s SN54LS47 turns those segments on by taking their outputs low. Its <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/sn54ls47-datasheet.pdf#page=2\" target=\"_blank\" rel=\"noopener\">datasheet<\/a> identifies active-low, open-collector outputs for common-anode displays. Following current through the circuit makes that low level easier to interpret.<\/p><p>In a common-anode display, the segment anodes share a connection to the positive supply. Selecting a segment turns on the corresponding output transistor inside the LS47. Current travels from the supply through that LED and its series resistor, into the driver, and back to ground. Lowering the output voltage forward-biases the LED, causing it to emit light. The relationship between a low output and a lit segment becomes straightforward once I follow that path.<\/p><p>I also want to look more closely at open-collector operation. When the output transistor turns off, the chip releases the path to ground. The output is then high impedance, with its voltage determined by the external circuit. It does not actively drive the pin up to the supply as a push-pull output would. A segment-off entry in the truth table, the voltage measured at the pin, and the ability to supply current are consequently different things to examine. This makes me pay more attention to why the datasheet calls the part both a decoder and a driver.<\/p><figure><a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/bcd-decoder-notes.png\" target=\"_blank\" rel=\"noopener\"><img src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/bcd-decoder-notes.png\" alt=\"Course diagram of decoder pins and individual segment resistors\"><\/a><figcaption>Course diagram of decoder pins and individual segment resistors<\/figcaption><\/figure><h2 id=\"section-3\">Current in Each Segment<\/h2><p>The course slide calls for one series resistor per segment output. I want to understand why a single resistor at the display&#x27;s common pin would not do the same job. With a shared resistor, two LED branches divide the current when displaying <code>1<\/code>, and seven do so when displaying <code>8<\/code>. Changing the number of lit segments changes the current available to each, making brightness depend on the displayed digit. Individual branch resistors let each segment&#x27;s current be limited separately.<\/p><p>For one segment, I would subtract both the LED&#x27;s forward drop and the driver&#x27;s on-state low voltage from the supply. Suppose the supply is 5 V, the LED forward drop near the intended current is 2.0 V, and the driver drop is taken as 0.3 V. A target of roughly 5 mA gives <code>(5 − 2.0 − 0.3) / 0.005 = 540 Ω<\/code>. Using a standard 560 Ω resistor gives about 4.8 mA under the same assumptions. This is an example of choosing a value; the calculation for particular parts needs their electrical parameters.<\/p><p>That gives me a useful way to examine the slide&#x27;s 330 Ω value. Supply voltage, current, and LED forward voltage belong in the same calculation. Changing the LED while keeping 330 Ω need not preserve the current. When <code>8<\/code> lights all seven segments, their currents also add at the common connection and place a combined load on the supply and driver. I need to consider both each segment and the full digit operating together.<\/p><h2 id=\"section-4\">Matching the Decoder and Display<\/h2><p>The <a href=\"https://www.ti.com/product/CD4511B\" target=\"_blank\" rel=\"noopener\">CD4511B<\/a> used in the course simulation makes the difference concrete. It supplies segment current for common-cathode LEDs. An active segment output goes high, sending current through the LED and its limiting resistor to the common cathode and ground. The two chips therefore require different common connections and active output levels for the same input digit. Both turn BCD into a seven-segment pattern, but the LED connections have to match the output structure.<\/p><p>I would also look beyond the four data inputs to the test and blanking pins. <a href=\"https://www.ti.com/product/SN74LS47\" target=\"_blank\" rel=\"noopener\">The LS47 controls<\/a> include lamp test, blanking, and zero suppression, all of which affect what appears on the display. A correct value on A through D can still be hidden by those controls. For a single-digit check, I would first establish normal decoding conditions from the truth table, then hold the inputs at <code>1<\/code>, <code>7<\/code>, and <code>8<\/code> in turn. That sequence checks the two right-hand segments, adds the top segment, then exercises all seven.<\/p><p>Returning to <code>17<\/code>, I now think about the BCD code for each digit, the selected segments, and the current through each LED. A segment that never lights leads me along its individual branch; a whole digit that consistently shows the wrong number sends me first to input order and decoding conditions. The small display now connects to specific pins and currents. I have a much clearer starting point the next time I work with one.<\/p>", "toc": [[1, "Decimal Digits and BCD"], [2, "Active-Low Outputs"], [3, "Current in Each Segment"], [4, "Matching the Decoder and Display"]]}}, "switch": {"zh": {"title": "自锁按键与计数控制", "body": "<p>暂停和复位都只需要一只开关，接进程序以后，处理方法却很不一样。暂停时，计数器要保持一种状态；复位则可以约定在某次操作发生时把数字清零。我现在回看这套两位计数器，想先弄明白，开关的机械位置、引脚上的电平，以及程序执行的一次动作，究竟怎样对应。<\/p><h2 id=\"section-1\">开关触点<\/h2><p>课程使用六脚自锁按键。自锁描述的是机械动作，按下一次后保持在一个位置，再按一次切换回来；六只脚怎样连通，则要看内部触点结构。手指松开按钮，并不等于触点已经回到最初的位置。这个区别放到暂停功能里尤其直观，按钮已经松手，计数器仍然可以保持暂停。<\/p><p>要读懂触点，我会先让开关与外部电路断开，给六只脚按固定视角编号，再用通断档分别记录两个稳定位置下的导通关系。如果某只脚在一个位置与左侧脚连通，切换后改为与右侧脚连通，就可以按这个测量结果找出一组转换触点；另一组也单独确认。编号和观察方向一起记下来，才能把画出的关系准确接回实物。我更愿意先画清这些线，再决定哪根接输入、哪根接地。<\/p><figure><a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/button-pullup-notes.png\" target=\"_blank\" rel=\"noopener\"><img src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/button-pullup-notes.png\" alt=\"课程中的六脚自锁按键、上下拉电路与输入测试程序\"><\/a><figcaption>课程中的六脚自锁按键、上下拉电路与输入测试程序<\/figcaption><\/figure><h2 id=\"section-2\">默认输入电平<\/h2><p>开关触点确认以后，接法还要给断开状态安排一个确定的电平。以课件里的上拉电路为例，电阻从输入节点接到 VCC，开关从节点接到地。触点断开时，电阻把输入拉高；闭合时，输入被接地，读成低电平。若选用另一组触点，机械位置与高低电平的对应也可能改变。程序里的 <code>HIGH<\/code> 或 <code>LOW<\/code>，需要按实际连线解释。<\/p><p>这只电阻还有一个容易被略过的作用。闭合时，电源到地之间经过的是电阻和开关，电流受到限制。用 5 V 和 10 kΩ 作例子，电流约为 0.5 mA。若把电阻换成导线，这个连接就会在闭合时直接短接电源。断开时确定电平，闭合时限制电流，两种状态放在一起看，上拉电阻的作用才完整。<\/p><p>我再读<a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-read-key.ino\" target=\"_blank\" rel=\"noopener\">课程测试代码<\/a>，它把输入设为 <code>INPUT<\/code>，然后不断打印读数。<a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Digital%20IO/pinMode.adoc\" target=\"_blank\" rel=\"noopener\">Arduino 的 <code>pinMode()<\/code> 说明<\/a>区分了 <code>INPUT<\/code> 和 <code>INPUT_PULLUP<\/code>，后者才会启用内部上拉。所以照着这段程序接线时，课件中的外部上拉或下拉也要接上。仅把引脚设为输入，并不会自动替电路补好默认电平。<\/p><h2 id=\"section-3\">稳定状态与一次动作<\/h2><p>接下来才轮到消抖。机械触点切换时可能短暂反复接触和分离，一次操作会在输入上形成几次跳变。<a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/Debounce/Debounce.ino\" target=\"_blank\" rel=\"noopener\">Arduino 的 Debounce 示例<\/a>每次发现原始读数改变，就重新记录时间，等它连续稳定一段时间后，才接受为新的按键状态。它给我一个很清楚的区分，原始读数可以先变化，程序认定的稳定状态稍后再变化。<\/p><p>例如，用 20 ms 作为推演中的稳定时间。读数在 0 ms 时变低，4 ms 时又变高，7 ms 时再变低，此后保持不变。计时应从最后一次变化的 7 ms 开始，到约 27 ms 才接受低电平。这里选 20 ms 是为了看清过程，实际时长要结合开关和响应要求确定。等待稳定会增加响应延迟，设得越长，动作被确认得也越晚。<\/p><p>消抖之后，循环仍然会一遍遍读到同一个稳定状态。若每次读到低电平就执行一次计数或切换，一只锁住的按键照样能触发很多次。要把一次操作变成一次动作，还需要比较新旧稳定状态，只在选定的变化方向上触发。<a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/StateChangeDetection/StateChangeDetection.ino\" target=\"_blank\" rel=\"noopener\">Arduino 的状态变化示例<\/a>正是把当前值与上次值比较。到这里，消抖负责确认状态，变化检测负责挑出动作发生的那一刻，两者的作用就分开了。<\/p><p>对这份计数器，我会先给两个功能写下明确约定。暂停跟随消抖后的开关状态，锁在暂停位置就持续停止加数，切回来再继续。复位则选择一个确定的状态变化，例如进入有效位置时清零一次，保持在这个位置不再反复清零。启动程序时，也要先读取并确认初始状态，避免把开机时已经按下的开关误当成刚发生的一次操作。不同交互要求可以采用不同约定，但代码和实际使用方式要一致。<\/p><h2 id=\"section-4\">计时与响应<\/h2><p>再看计数程序里的 <code>delay(1000)<\/code>，前面的问题又多了一层时间关系。程序在主循环里等待一秒时，后面的按键轮询也得等它返回。一次很短的按下和恢复，可能完全落在两次读取之间；自锁开关若保持在新位置，下一次通常还能读到，不过响应会晚。<a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Time/delay.adoc\" target=\"_blank\" rel=\"noopener\">Arduino 的 <code>delay()<\/code> 说明<\/a>也区分了暂停主程序与中断等仍可继续工作的机制。这里影响按键的是主循环多久回来读一次。<\/p><p>我会把一秒理解成两次加数之间的时间条件，让循环继续检查开关。每轮读一次 <code>millis()<\/code>，处理输入和状态变化，再比较距上次计数是否已满一秒，到时才更新数字。<a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/BlinkWithoutDelay/BlinkWithoutDelay.ino\" target=\"_blank\" rel=\"noopener\">Blink Without Delay 示例<\/a>用的就是这种经过时间的判断。显示更新和其他处理也要尽量短，循环能及时回来，前面的消抖与变化检测才有足够频繁的输入。<\/p><p>暂停恢复时还有一个值得提前想清楚的小问题。假设一秒已经走过 700 ms，此时暂停，恢复后是再等 300 ms，还是重新等一秒？这两种行为都能写出来，却对应不同的使用感受。给这个练习重新安排逻辑时，我会约定恢复后重新计满一秒，清零时也重置计时起点；若要保留已走过的 700 ms，就把这部分时间另存下来。这样可以避免恢复后因计时起点太旧而立刻多加一次。<\/p><p>我还会明确同一轮同时遇到复位和计数到期时的顺序，让复位优先，并跳过这一轮的加数。否则刚写入 <code>0<\/code>，后面又满足加数条件，显示马上变成 <code>1<\/code>，从外面看很像复位没生效。这个例子让我更愿意把输入处理、状态更新和计数更新的顺序放在一起推演。遇到异常时，触点抖动和程序执行顺序都值得分别检查。<\/p><p>现在再看暂停和复位，我脑子里会先分清触点接到了哪里，电平什么时候稳定，以及哪一次变化该触发动作。最后还要给主循环留出及时处理它们的机会。把这些关系安排清楚以后，我才更有把握让开关按预期工作；遇到异常时，也知道该去检查接线、输入变化，还是计数程序。<\/p>", "toc": [[1, "开关触点"], [2, "默认输入电平"], [3, "稳定状态与一次动作"], [4, "计时与响应"]]}, "en": {"title": "Latching Switches and Counter Control", "body": "<p>Pause and reset each need only one switch, yet they call for quite different handling in the program. Pausing keeps the counter in a state; resetting can be defined as clearing the number when a particular action occurs. Revisiting this two-digit counter, I want to understand how a switch&#x27;s mechanical position relates to a pin voltage and, eventually, to a single program action.<\/p><h2 id=\"section-1\">Switch Contacts<\/h2><p>The course uses six-pin latching pushbuttons. Latching describes the mechanical action: one push leaves the switch in a position, and another changes it back. The connections among the six pins depend on the contact arrangement inside. Taking a finger off the button does not necessarily return the contacts to their original position. Pause makes this distinction easy to see. The user can let go while the counter stays paused.<\/p><p>To understand the contacts, I would first disconnect the switch from the surrounding circuit, number its pins from a fixed viewing direction, and record continuity in both stable positions. If one pin connects to a neighbour on one side in the first position and to another on the opposite side after switching, that measurement identifies a changeover contact group. A second group needs its own check. Recording the viewing direction with the numbers lets me translate the drawing back to the physical part. I would rather establish those connections before choosing which wire goes to the input and which goes to ground.<\/p><figure><a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/button-pullup-notes.png\" target=\"_blank\" rel=\"noopener\"><img src=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/button-pullup-notes.png\" alt=\"Course slide showing six-pin latching switches, pull-up and pull-down circuits, and an input test sketch\"><\/a><figcaption>Course slide showing six-pin latching switches, pull-up and pull-down circuits, and an input test sketch<\/figcaption><\/figure><h2 id=\"section-2\">The Default Input Level<\/h2><p>After identifying the contacts, the circuit still needs to give an open contact a definite input level. In the course slide&#x27;s pull-up example, a resistor connects the input node to VCC, and the switch connects that node to ground. Opening the contact lets the resistor pull the input high; closing it grounds the input, producing a low reading. Choosing a different contact pair can change how mechanical position maps to voltage. I need to interpret <code>HIGH<\/code> and <code>LOW<\/code> from the actual wiring.<\/p><p>The resistor has another role that is easy to miss. With the contact closed, current flows from the supply through the resistor and switch to ground. A 5 V supply and 10 kΩ resistor give about 0.5 mA. Replacing the resistor with a wire would directly short the supply when the switch closes. Looking at both positions explains its job more fully: establishing the level while open and limiting current while closed.<\/p><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/arduino-digital-clock-counter/digital-read-key.ino\" target=\"_blank\" rel=\"noopener\">course test sketch<\/a> uses <code>INPUT<\/code> and repeatedly prints the readings. <a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Digital%20IO/pinMode.adoc\" target=\"_blank\" rel=\"noopener\">Arduino&#x27;s <code>pinMode()<\/code> reference<\/a> distinguishes that mode from <code>INPUT_PULLUP<\/code>, which enables the internal pull-up. Following this sketch therefore also means providing the external pull-up or pull-down shown in the circuit. Configuring an input alone does not supply the missing default level.<\/p><h2 id=\"section-3\">Stable States and Single Actions<\/h2><p>Debouncing comes next. Mechanical contacts can briefly make and break several times during a transition, producing multiple changes from one operation. <a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/Debounce/Debounce.ino\" target=\"_blank\" rel=\"noopener\">Arduino&#x27;s Debounce example<\/a> restarts a timer whenever the raw reading changes and accepts a new button state only after the reading has remained steady for an interval. That gives me two distinct values to follow. The raw input can change first; the state accepted by the program changes later.<\/p><p>Consider 20 ms as a stability interval for a worked example. The input goes low at 0 ms, returns high at 4 ms, and goes low again at 7 ms, staying there afterwards. Timing begins again at the final transition, so low is accepted at about 27 ms. The 20 ms value makes the sequence easy to follow; an actual interval needs to suit the switch and response requirements. Waiting for stability adds latency, and a longer interval delays acceptance of the action.<\/p><p>Even after debouncing, the loop will read the same stable state repeatedly. Incrementing or toggling something every time it reads low can still produce many actions from a switch left latched in position. A single action needs a comparison between the old and new stable states, triggering only on the chosen transition. <a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/StateChangeDetection/StateChangeDetection.ino\" target=\"_blank\" rel=\"noopener\">Arduino&#x27;s state-change example<\/a> compares the current value with the previous one. I can now separate the two jobs: debouncing establishes the state, while change detection identifies the moment chosen to trigger an action.<\/p><p>For this counter, I would define the two controls explicitly. Pause follows the debounced switch state, stopping increments while latched in the pause position and continuing when switched back. Reset uses a selected transition, such as entering the active position, to clear the number once. Staying there does not repeatedly clear it. At startup, the program should also read and establish the initial state, so a switch already pressed is not mistaken for a new operation. Other interactions can use different rules; the code and the way the controls are used need to agree.<\/p><h2 id=\"section-4\">Timing and Response<\/h2><p>The counter&#x27;s <code>delay(1000)<\/code> introduces another timing question. While the main loop waits for a second, the button polling that follows has to wait too. A brief press and return can fit entirely between two reads. A latching switch that remains in its new position will usually still be read on the next pass, although the response comes later. <a href=\"https://github.com/arduino/reference-en/blob/master/Language/Functions/Time/delay.adoc\" target=\"_blank\" rel=\"noopener\">Arduino&#x27;s <code>delay()<\/code> documentation<\/a> also distinguishes suspension of the main program from mechanisms such as interrupts that can continue. What matters for these buttons is how often the loop returns to read them.<\/p><p>I would treat one second as a condition between increments and let the loop keep checking the switches. On each pass, read <code>millis()<\/code>, process the inputs and state changes, and update the count only when a second has elapsed since the last counting reference. <a href=\"https://github.com/arduino/arduino-examples/blob/main/examples/02.Digital/BlinkWithoutDelay/BlinkWithoutDelay.ino\" target=\"_blank\" rel=\"noopener\">Blink Without Delay<\/a> demonstrates this elapsed-time approach. Display updates and other work also need to stay brief so that debouncing and change detection receive input samples frequently enough.<\/p><p>Resuming from pause raises a small question worth answering before writing the code. If 700 ms of the second has elapsed when I pause, should resuming leave 300 ms or begin a fresh second? Both behaviours are possible, but they feel different to use. For a new version of this exercise, I would start a full second on resume and reset the timing reference when clearing the count. Preserving the elapsed 700 ms would instead require storing that partial interval. Defining the choice avoids an immediate extra increment caused by an old timing reference after resuming.<\/p><p>I would also give reset priority when it arrives in the same loop iteration as an increment becoming due, skipping that increment. Otherwise the program can write <code>0<\/code> and then immediately change it to <code>1<\/code>, making reset appear ineffective. This example makes me want to reason through input handling, state updates, and count updates together. Contact bounce and the order of program operations each deserve their own check when behaviour looks wrong.<\/p><p>I now approach pause and reset by separating the contact connections, the point at which a level becomes stable, and the transition that should trigger an action. The loop also needs time to handle them promptly. With those relationships worked out, I have a better basis for making the switches behave as intended. If they do not, I know to examine the wiring, input changes, or counter program in turn.<\/p>", "toc": [[1, "Switch Contacts"], [2, "The Default Input Level"], [3, "Stable States and Single Actions"], [4, "Timing and Response"]]}}};const params=new URLSearchParams(location.search);let currentNote=params.get('note')==='switch'?'switch':'display';let currentLang=params.get('lang')==='en'?'en':'zh';function show(note,lang,reset=false){currentNote=note;currentLang=lang;const p=data[note][lang],zh=lang==='zh';document.getElementById('title').textContent=p.title;document.getElementById('article').innerHTML=p.body;document.getElementById('toc').innerHTML=p.toc.map(([i,t])=>'<a href="#section-'+i+'">'+t+'</a>').join('');document.documentElement.lang=zh?'zh-CN':'en';for(const l of ['zh','en'])document.getElementById(l).setAttribute('aria-pressed',lang===l);for(const n of ['display','switch'])document.getElementById('note-'+n).setAttribute('aria-pressed',note===n);document.getElementById('meta').textContent=zh?'ARDUINO 两位计数器 · 待审阅 · 2026.09.06':'ARDUINO TWO-DIGIT COUNTER · DRAFT FOR REVIEW · 2026.09.06';document.getElementById('note-display').textContent=zh?'01 · 数码管与 BCD':'01 · Display and BCD';document.getElementById('note-switch').textContent=zh?'02 · 自锁按键与计数':'02 · Switches and Counting';document.querySelector('.note-picker').setAttribute('aria-label',zh?'选择笔记':'Choose a note');document.getElementById('home').textContent=zh?'查看项目主页 ↗':'Project homepage ↗';document.getElementById('footer').textContent=zh?'点击图片可查看原图。两篇均为本地审阅稿。':'Select an image to open the original. Both notes are local drafts for review.';document.getElementById('toc').setAttribute('aria-label',zh?'文章目录':'Article sections');document.getElementById('other-note').textContent=note==='display'?(zh?'阅读第二篇 · 自锁按键与计数控制 →':'Read note 02 · Switches and Counter Control →'):(zh?'← 返回第一篇 · 共阳数码管与 BCD 译码':'← Return to note 01 · Displays and BCD');document.getElementById('back-top').textContent=zh?'回到顶部 ↑':'Back to top ↑';history.replaceState(null,'','?note='+note+'&lang='+lang+(reset?'':location.hash));if(reset)window.scrollTo(0,0)}document.getElementById('note-display').onclick=()=>show('display',currentLang,true);document.getElementById('note-switch').onclick=()=>show('switch',currentLang,true);document.getElementById('other-note').onclick=()=>show(currentNote==='display'?'switch':'display',currentLang,true);document.getElementById('zh').onclick=()=>show(currentNote,'zh',true);document.getElementById('en').onclick=()=>show(currentNote,'en',true);show(currentNote,currentLang);</script></body></html>
