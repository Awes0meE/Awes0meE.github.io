.note-picker{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0 12px}.note-picker button{font-size:13px;min-height:44px}.note-picker button[aria-pressed=true]{background:#e6eee5;color:#254d39;border-color:#70997a}.end-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:22px}pre{white-space:pre;overflow-x:auto}pre code{white-space:pre;overflow-wrap:normal} @media(max-width:600px){pre{padding:14px}pre code{font-size:12px}}</style></head><body><header><div class="meta" id="meta"></div><div class="note-picker" aria-label="选择笔记"><button id="note-sampling" aria-pressed="true">01 · 温度采样与响应</button><button id="note-fan" aria-pressed="false">02 · PWM 与转速反馈</button></div><h1 id="title"></h1><div class="toolbar"><button id="zh" aria-pressed="true">中文</button><button id="en" aria-pressed="false">English</button><a class="home" id="home" href="https://www.66ccff-labs.com/work/juanyun-diy-cooling-prototype" target="_blank" rel="noopener">查看项目主页 ↗</a></div></header><main><nav aria-label="文章目录" id="toc"></nav><article id="article"></article><footer><div id="footer"></div><div class="end-actions"><button id="other-note"></button><a href="#" id="back-top">回到顶部 ↑</a></div></footer></main><script>const data={"sampling":{"zh":{"title":"温度采样与风扇响应","body":"<p>我给这台散热器写的程序，会把电脑里的温度拼成 <code>CPU62.7<\/code> 这样的消息发给 ESP32。短短一行就能把数值送过去，但要解释风扇为什么在某个时刻改变输出，还得知道这个数从哪里来、什么时候读到，又经过了怎样的处理。我想顺着一条温度消息，把这几件事弄清楚。<\/p><h2 id=\"section-1\">传感器的选择<\/h2><p><a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">上位机代码<\/a>用 LibreHardwareMonitor 遍历硬件和传感器。每找到一个 CPU 温度项，就把它的值写进 <code>cpuTemperature<\/code>；GPU 也做同样的处理。如果一轮遍历遇到多个符合条件的温度项，后面的赋值就会覆盖前面的。变量名虽然叫 CPU 温度，具体留下哪一项，却取决于遍历时最后遇到了谁。<\/p><p>这个细节会影响我怎样理解温度变化。假如想跟踪 <code>CPU Package<\/code>，就应该明确选中这一项，持续观察同一个对象。<a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/blob/master/LibreHardwareMonitorLib/Hardware/ISensor.cs\" target=\"_blank\" rel=\"noopener\">LibreHardwareMonitor 的 <code>ISensor<\/code> 接口<\/a>提供了 <code>Name<\/code> 和 <code>Identifier<\/code>，可以用来辨认传感器，再建立固定的选择规则。保留一位小数方便显示，选定读数的来源才方便比较。<\/p><h2 id=\"section-2\">读取和发送的顺序<\/h2><p>来源确定以后，还要看新值能不能赶上这一次发送。上位机的定时器设为 5 秒，但它在一次回调中分别用两个 <code>Task.Run<\/code> 启动测温和发送。代码里先写测温任务，后写发送任务，两项任务之间却没有等待关系。<a href=\"https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/task-based-asynchronous-programming\" target=\"_blank\" rel=\"noopener\">Microsoft 的任务编程说明<\/a>介绍了任务的调度，以及用等待或延续建立执行依赖的方法。按这段程序的写法，发送时完全可能读到上一轮留在字段里的温度。<\/p><p>用一组假设的时刻就能看清这个过程。字段里原来是 60°C；5.000 秒时，程序提交两个任务；发送任务在 5.002 秒取走 60°C；测温任务到 5.080 秒才写入新的 72°C。这次发出去的仍是 60°C。这里相差的几十毫秒只是推演用的数值，关键在于发送没有等本轮读取完成。把定时器改得更快，也不会自动补上这层依赖。<\/p><p>CPU 和 GPU 还轮流占用发送机会。按程序预定的节奏，每 5 秒发其中一种，每种温度大约 10 秒才轮到一次。因此，定时器触发、某个传感器读完，以及它的数值发出，本来就是三个不同的时刻。我会让一次读取返回一个确定的样本，再把这个样本交给发送任务，避免发送时重新去取一个随时可能被别的任务改写的共享字段。<\/p><h2 id=\"section-3\">峰值保留到什么时候<\/h2><p>到了 <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 程序<\/a>，同一条消息又会进入两组变量。<code>cpuValue<\/code> 和 <code>gpuValue<\/code> 保存最近收到的值，供 OLED 显示；<code>maxCpuValue<\/code> 和 <code>maxGpuValue<\/code> 只在收到更高的温度时更新。定时控制部分每隔约 30 秒取两项峰值中较大的一项，存入 <code>maxValue<\/code>，再按当前模式计算占空比。较低的新读数可以马上出现在屏幕上，前面那个高读数却仍然可能参与下一次输出计算。<\/p><p>先假设处于自动调速模式，只有定时更新，中途没有按键操作。一个窗口从 0 秒开始，CPU 温度在第 5 秒到达 80°C，第 15 秒和第 25 秒都到达 60°C，GPU 始终低于这次 CPU 峰值。第 30 秒计算输出时，采用的仍是 80°C；随后峰值变量被清零，输出设置则保留到下一次更新。这样，15 秒时屏幕就可能显示 60°C，30 秒时程序却刚开始采用之前的 80°C。读数变低和输出变低，中间隔着一段程序安排的等待。<\/p><p>我读到 <code>updatePWM()<\/code> 时，最想细看的是清空峰值的两行。下面摘出函数中计算输出和清空峰值的部分。<\/p><pre><code>dutyCycle =processBluetoothValue(maxValue);\nledcWrite(ledChannel, map(dutyCycle, 0, 100, 0, 255));\nmaxCpuValue = 0.0;\nmaxGpuValue = 0.0;<\/code><\/pre><p>这几行把设置 PWM 和清空温度峰值放在了同一个函数里。继续找调用位置，除了 30 秒定时更新，按键处理函数也会调用它。切换模式或调整频率时，累计的峰值因此也会被清掉。按键这条路径仍然使用此前保存的 <code>maxValue<\/code>，没有先取出正在累计的新峰值；它也没有重设 <code>lastUpdateTime<\/code>。<\/p><p>于是，上面的时间线还可以再推一步。假设第 25 秒处理了一次调频按键，刚才保留的 80°C 会被清除，而第 30 秒的定时更新仍照常到来。到时参与计算的，就是按键清空之后收到的那一小段数据。这让我更在意函数之间的关系了。单看 <code>30000<\/code>，很容易把它理解成固定的 30 秒统计窗口；把所有清空位置找出来，才能解释一次操作怎样改变了窗口里的内容。<\/p><h2 id=\"section-4\">给样本留下时间记录<\/h2><p>要继续整理这段程序，我会把写入 PWM 和结算温度窗口分成两个操作。按键可以修改输出设置，温度统计是否重新开始，则由明确的规则决定。比如选择固定周期，就让按键保留正在累计的峰值；如果希望切换模式时重新统计，就同时清空峰值并重设计时起点。两种安排都能说清，混在一个函数里时反而容易忽略。<\/p><p>上位机的样本也可以多带一点信息。我想保留传感器标识、读数、读取完成时间和消息序号，再在 ESP32 一侧记录收到消息和采用样本的时刻。读取完成时间描述的是程序取到值的时刻，传感器自身可能还有更新周期；电脑时间和 ESP32 的 <code>millis()<\/code> 也不能直接相减。先用序号对上同一条消息，再分别检查两端各自的等待时间，会比直接减两个不同来源的时间戳清楚。<\/p><p>这样整理以后，温度降下来了、风扇输出却还没降，就有了可以逐段追查的过程。我能先确认读到了哪一项温度，再看这条消息何时发出、何时收到，以及哪个峰值被用于计算。几秒钟的等待究竟发生在任务之间、发送轮次里，还是峰值保留期间，应该能在记录里找到。把这段时间弄明白，再决定该加快哪一步，调整起来才有依据。<\/p>","toc":[[1,"传感器的选择"],[2,"读取和发送的顺序"],[3,"峰值保留到什么时候"],[4,"给样本留下时间记录"]]},"en":{"title":"Temperature Sampling and Fan Response","body":"<p>To understand a change in this cooler&#x27;s output, I want to follow the temperature reading that led to it. My desktop program sends the ESP32 short messages such as <code>CPU62.7<\/code>. The number travels easily enough, but explaining the response calls for more detail: where the reading came from, when it was obtained, and what happened to it along the way.<\/p><h2 id=\"section-1\">Sensor Selection<\/h2><p>In the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/desktop-form1.cs\" target=\"_blank\" rel=\"noopener\">desktop source<\/a>, LibreHardwareMonitor is used to walk through the hardware and its sensors. Each matching CPU temperature overwrites <code>cpuTemperature<\/code>, with the same approach used for GPU readings. When several temperature entries match during a pass, later assignments replace earlier ones. The name CPU temperature sounds specific, yet the value left in that field depends on which matching entry the traversal reaches last.<\/p><p>That affects how I interpret a temperature change. To follow <code>CPU Package<\/code>, for example, I would select that entry explicitly and keep observing it. LibreHardwareMonitor exposes <code>Name<\/code> and <code>Identifier<\/code> through its <a href=\"https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/blob/master/LibreHardwareMonitorLib/Hardware/ISensor.cs\" target=\"_blank\" rel=\"noopener\"><code>ISensor<\/code> interface<\/a>, giving me a way to identify sensors and define a consistent selection rule. One decimal place makes the number convenient to display. A consistent source makes successive readings useful to compare.<\/p><h2 id=\"section-2\">Reading and Sending<\/h2><p>Even with a sensor selected, a new reading still has to be ready for transmission. The desktop timer is set to five seconds. Within one callback, however, it starts monitoring and sending through separate <code>Task.Run<\/code> calls. Monitoring appears first in the source, but there is no dependency making transmission wait for it to finish. <a href=\"https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/task-based-asynchronous-programming\" target=\"_blank\" rel=\"noopener\">Microsoft&#x27;s task programming guide<\/a> covers scheduling and the use of waits or continuations to establish dependencies. As written, the sender can pick up a temperature left in the field by a previous pass.<\/p><p>A hypothetical sequence makes the ordering easier to follow. Start with 60°C in the field. At 5.000 seconds, the program submits both tasks; at 5.002, the sender takes 60°C; only at 5.080 does monitoring write a new value of 72°C. The transmitted value is still 60°C. Those millisecond offsets are chosen for the example. What matters is the missing wait for the current read to complete. Shortening the timer interval would leave that dependency unresolved.<\/p><p>CPU and GPU also take turns using the sending opportunity. At the intended cadence, one type is sent every five seconds, so each type gets a turn roughly every ten seconds. A timer tick, completion of a sensor read, and transmission of its value are therefore separate events. I would have a read return a definite sample and pass that sample to the sender. That avoids looking up a shared field again at send time while another task may be changing it.<\/p><h2 id=\"section-3\">The Peak Window<\/h2><p>The <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">ESP32 program<\/a> handles an arriving message in two ways. It stores the most recently received readings in <code>cpuValue<\/code> and <code>gpuValue<\/code> for the OLED. It updates <code>maxCpuValue<\/code> and <code>maxGpuValue<\/code> only when a higher reading arrives. About every 30 seconds, the periodic control path saves the larger of those peaks in <code>maxValue<\/code> and calculates duty according to the current mode. A lower new reading can reach the screen immediately while an earlier high reading remains available for the next output calculation.<\/p><p>Consider an automatic mode with periodic updates only and no button activity. A window begins at zero seconds. A CPU reading of 80°C arrives at five seconds, followed by 60°C at both 15 and 25 seconds, while the GPU stays below that CPU peak. At 30 seconds, the output calculation still uses 80°C. The retained peaks are then cleared, and the output setting stays in place until the next update. The screen could thus show 60°C from 15 seconds onwards, even as the program starts applying the earlier 80°C at 30 seconds. The software has arranged a wait between a falling reading and a falling output.<\/p><p>The two assignments clearing the peaks in <code>updatePWM()<\/code> caught my attention. This excerpt includes the output calculation and peak reset.<\/p><pre><code>dutyCycle =processBluetoothValue(maxValue);\nledcWrite(ledChannel, map(dutyCycle, 0, 100, 0, 255));\nmaxCpuValue = 0.0;\nmaxGpuValue = 0.0;<\/code><\/pre><p>Setting PWM and clearing the temperature peaks happen inside the same function. Following its callers, I found that the button handler calls it as well as the 30-second update path. Changing mode or adjusting frequency therefore clears the accumulated peaks too. The button path still uses the previously saved <code>maxValue<\/code>, without first selecting the new peaks being accumulated, and it leaves <code>lastUpdateTime<\/code> unchanged.<\/p><p>That allows another variation on the timeline. Suppose a frequency-button event is handled at 25 seconds. The retained 80°C is cleared, but the periodic update still arrives at 30 seconds. Its calculation now draws on the short stretch of data received after the button reset. This makes the relationship between functions much more interesting to me. Reading <code>30000<\/code> alone suggests a fixed 30-second collection window. Following every reset explains how an operation can change what remains inside it.<\/p><h2 id=\"section-4\">Timing Each Sample<\/h2><p>To reorganize this code, I would separate writing PWM from closing out a temperature window. A button could change the output setting, with an explicit rule deciding whether temperature collection starts again. A fixed-period policy could retain the accumulated peaks through a button event. A policy that restarts collection on a mode change could clear the peaks and reset the timing origin together. Either is straightforward to describe; combining the operations in one function makes the choice easier to overlook.<\/p><p>I would also keep a little more information with each desktop sample: its sensor identifier, value, read-completion time, and message sequence number. On the ESP32, I could record when the message arrived and when its sample was used. Read completion describes when the program obtained the value; the sensor may have an update cycle of its own. A computer timestamp and ESP32 <code>millis()<\/code> also cannot be subtracted directly. Matching a message by sequence number and examining the waits on each device separately would give me a clearer account than subtracting timestamps from different clocks.<\/p><p>A lower temperature with an unchanged fan output would then be something I could trace through the program. I could identify the sensor first, follow the message&#x27;s departure and arrival, and check which peak entered the calculation. The records should locate those seconds of waiting between tasks, between sending turns, or within peak retention. Once I understand where that time is spent, I have a reason for choosing which part to speed up.<\/p>","toc":[[1,"Sensor Selection"],[2,"Reading and Sending"],[3,"The Peak Window"],[4,"Timing Each Sample"]]}},"fan":{"zh":{"title":"PWM 风扇控制与转速反馈","body":"<p>这台散热器的 OLED 上有一项 <code>Fan Speed<\/code>，后面显示百分数。我顺着<a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">程序里的显示函数<\/a>往下找，它取的是 <code>dutyCycle<\/code>，也就是发给风扇的 PWM 占空比。这个名字把我想研究的问题引了出来：一个占空比设置怎样作用于风扇，又要从哪里得到风扇实际转了多快的消息？<\/p><h2 id=\"section-1\">风扇接口的连线<\/h2><p>在这版 <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">ESP32 控制板原理图<\/a>上，D5 接到 <code>PWM<\/code> 网络，风扇输出接口使用 <code>12V+<\/code>、<code>12V−<\/code> 和 <code>PWM<\/code> 三种信号。两个四针接口也只接了这三种信号，各留一针未连接。顺着连线看，比数接口有几只脚更直接，电源与控制各自走哪根线，一眼就能对上。<\/p><figure><a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABqEAAASwCAIAAAD0Q3ePAAEAAElEQVR4nOzdB1QU5/c38J3ZBZbeO1JFmiKIDXvvNdEo9t6jxt57TyyxxVhjxB4LGiuCDQUsgFKkV0F6L7vs7ux74Mk7v/2DIAIW9Ps5OTns7Ozs7APO7Ny5z72UVCrlAAAAAAAAAAAAQINFf+kdAAAAAAAAAAAAgDpBjA8AAAAAAAAAAKBhQ4wPAAAAAAAAAACgYUOMDwAAAAAAAAAAoGHjVXh8XkdHmJPDVVD4QvsD8N1hRCKOVErLy3/pHQFo+P+UOBxaTu5L7whAw8aUlnJomuZV/IoIAB9FIhRSXC7+KQHUkUQopHk8isvFSAJUIBEKFbS0RmRkyC6s+AVOmJMjr65uv3BhxVcDwKeRcPGiID3dZvZsDDBAXUSfOEHRtNX48RhGgLoI37dP0cjI7McfMYwAdRGybZ ERXT0oALqf0NmzhWFh+pwcwmYb8dNPLKGwq0cEQDeG4Xjkgw/6jRzJDwrq6rEA0P3gTOawr7+uPnvWVFoqiY8f/MUXODSxAaBDvBISJu/dW3HkCEkQ4zZv5ikUcCBvu4zPabWmLV+OSLKLxgNAr6O9csVSVXX53Xe7eiAAdG/6vDyMwYA/pducIT9fefRoV48CtMRSWalOTYU/pW4h86uvunoIoFkOg6HqxAn4U7rN6XNySrZv7+pRgBaRZPnevU6zGQ7TbU575UpXD6HXSVu+nLBaG12JkQ3jvN98fW0aDc7h3NqxAdB7EXY7Ikmcze7qgQDQvRE2G/XhPPwpAXDjf0oYhrNYcCABuKE/JasVMRg4E2ZNAXBDnBYLzmJRs2oAAA0RVitbKv2XUtlSxgcAAAAAAAAAAAAAAOheoK8uAAAAAAAAAAAAAADdG2R8AAAAAAAAAAAAAAB0b5DxAQAAAAAAAAAAAADQvUHGBwAAAAAAAAAAAAAA6tb+H+69ViqLjJnUAAAAAElFTkSuQmCC\" alt=\"ESP32 控制板原理图中的风扇电源与 PWM 接口\"><\/a><figcaption>ESP32 控制板原理图中的风扇电源与 PWM 接口<\/figcaption><\/figure><p>查四线 PWM 风扇的原理时，我才把风扇内部的驱动电路也放进考虑。它有供电、地、PWM 输入和测速输出这四条连接。电机所需的能量由电源线提供，控制器从 PWM 输入给出指令，风扇内部电路负责驱动电机。<a href=\"https://www.analog.com/en/resources/analog-dialogue/articles/how-to-control-fan-speed.html\" target=\"_blank\" rel=\"noopener\">Analog Devices 的风扇控制说明<\/a>还讲到，把 PWM 放在专用控制线上，可以让风扇电子电路持续供电；若用开关反复切断整只风扇的电源，测速输出也可能随供电中断。<\/p><p>这也解释了我在接线时应该分别考虑的两件事。12 V 供电负责提供电机运行所需的能量，GPIO 提供的是逻辑信号。控制信号的电平和参考地要与风扇接口相容，不能按电机的供电电压去理解 PWM 引脚。具体接插件的脚序仍要按图纸和风扇定义逐根对应，四针的外形本身并没有把这些关系说明白。<\/p><h2 id=\"section-2\">频率、占空比和转速<\/h2><p>程序最初把 PWM 设为 15 kHz，使用 8 位分辨率。按这个频率计算，一个周期约为 66.7 μs；理想的 50% 占空比，就是每个周期约有 33.3 μs 为高电平。代码把百分数映射到 0 至 255，50 会得到整数 127，对应接近一半的输出比例。这里算的都是引脚上的波形，还没有涉及叶片每分钟转多少圈。<\/p><p>15 kHz 的脉冲也不需要主循环逐个翻转引脚。<a href=\"https://docs.espressif.com/projects/esp-idf/en/v4.4.8/esp32/api-reference/peripherals/ledc.html\" target=\"_blank\" rel=\"noopener\">ESP32 的 LEDC 文档<\/a>说明，通道配置好以后，就按设定的频率和占空比产生 PWM。程序可以隔一段时间才写入新的占空比，期间外设继续输出原来的波形。温度处理多久改变一次设置，与 PWM 一个周期有多长，分属两种时间尺度。<\/p><p>频率该选多少，我会先查具体风扇的接口要求。以 <a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">Noctua 的微控制器接线说明<\/a>为例，它给出的目标值是 25 kHz，接受范围为 21 至 28 kHz。这是厂商对其风扇的要求，可以拿来学习怎样核对接口。原程序里按键每次把频率加减 200 Hz，只是在改变波形的重复频率；把频率数值调高，并不等于给风扇增加了同样比例的转速。<\/p><h2 id=\"section-3\">测速信号怎样回到主控<\/h2><p>实际转速需要从另一个方向传回来。<a href=\"https://cdn.noctua.at/media/Noctua_PWM_specifications_white_paper.pdf\" target=\"_blank\" rel=\"noopener\">Noctua 的 PWM 技术白皮书<\/a>说明，其风扇使用开集电极测速输出，每转一圈产生两个脉冲。风扇内部的输出晶体管导通时，把信号线拉低；关断时，信号线靠外部上拉电阻回到高电平。控制器接在这个节点上，就能数到随转动产生的脉冲。<\/p><p>我会按主控的逻辑电压选择上拉电源，并让测速输出与主控共用参考地。假设上拉到 3.3 V，电阻取 10 kΩ，输出拉低时的电流约为 0.33 mA。这个计算方便检查电流大小，实际选值还要兼顾输出允许的灌电流和信号上升速度。电阻太大，信号线上的电容充电会更慢；到主控引脚处观察高低电平和边沿，才能知道它能否被可靠识别。<\/p><p>每圈脉冲数确定以后，计算就很短。按两脉冲一圈举例，100 Hz 的测速信号对应每秒 50 圈，也就是 3000 rpm。我之前在<a href=\"http://127.0.0.1:8767/preview.html\" target=\"_blank\" rel=\"noopener\">小车电源与速度反馈笔记<\/a>里研究过脉冲计时，这里沿用同一个计数思路。要换成风扇自己的每圈脉冲数，并把测速频率与前面控制端的 15 kHz 分开。<\/p><p>两个风扇还会多出一个接线问题。原理图上的两路风扇输出共用 <code>PWM<\/code>，所以会收到同一个控制波形。若希望知道两只风扇各自的转速，就需要分别接收测速信号。按开集电极的工作方式推下去，把两个测速输出并在一起，任意一边拉低都会让公共节点变低，重叠的脉冲便无法分清来自哪一只。共享控制指令很方便，分别观察每只风扇还需要各自的反馈。<\/p><h2 id=\"section-4\">占空比与实际响应<\/h2><p>有了测速读数，占空比与转速的关系才方便放到一起比较。我想固定供电电压和 PWM 频率，逐档改变占空比，等转速稳定后记录下来，画出这只风扇的响应曲线。低占空比处尤其值得单独试，从静止开始能否启动，以及已经转起来后能否继续降低占空比，可以分别记录。这样得到的曲线，也就包含了实际使用时关心的启动和低速运行情况。<\/p><p>这版程序目前把占空比显示在 <code>Fan Speed<\/code> 后面，没有读取测速输入。我更愿意让界面直接显示 <code>PWM<\/code> 百分数，接入测速后再单独显示 <code>RPM<\/code>。一项告诉我发出了什么设置，一项告诉我风扇怎样响应。调节时就能同时看到设置和响应，也能单独检查两只风扇的运行情况。<\/p>","toc":[[1,"风扇接口的连线"],[2,"频率、占空比和转速"],[3,"测速信号怎样回到主控"],[4,"占空比与实际响应"]]},"en":{"title":"PWM Fan Control and Speed Feedback","body":"<p>The cooler&#x27;s OLED labels a percentage as <code>Fan Speed<\/code>. Following the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/esp32-platformio-main.cpp\" target=\"_blank\" rel=\"noopener\">display function<\/a>, I find that it reads <code>dutyCycle<\/code>, the PWM duty sent to the fan. That label gives me a useful question to pursue. How does a duty setting act on a fan, and where would I get a reading of how fast the fan actually turns?<\/p><h2 id=\"section-1\">Fan Interface Wiring<\/h2><p>On this version of the <a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\">ESP32 controller schematic<\/a>, D5 connects to the <code>PWM<\/code> net. The fan outputs use three signals, <code>12V+<\/code>, <code>12V−<\/code>, and <code>PWM<\/code>. The two four-pin connectors also carry only those three signals, leaving one pin unconnected on each. Following the nets tells me more directly where power and control go than counting the connector pins does.<\/p><figure><a href=\"https://www.66ccff-labs.com/uploads/projects/juanyun-public/diy-cooling/pcb-schematic.pdf\" target=\"_blank\" rel=\"noopener\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABqEAAASwCAIAAAD0Q3ePAAEAAElEQVR4nOzdB1QU5/c38J3ZBZbeO1JFmiKIDXvvNdEo9t6jxt57TyyxxVhjxB4LGiuCDQUsgFKkV0F6L7vs7ux74Mk7v/2DIAIW9Ps5OTns7Ozs7APO7Ny5z72UVCrlAAAAAAAAAAAAQINFf+kdAAAAAAAAAAAAgDpBjA8AAAAAAAAAAKBhQ4wPAAAAAAAAAACgYUOMDwAAAAAAAAAAoGHjVXh8XkdHmJPDVVD4QvsD8N1hRCKOVErLy3/pHQFo+P+UOBxaTu5L7whAw8aUlnJomuZV/IoIAB9FIhRSXC7+KQHUkUQopHk8isvFSAJUIBEKFbS0RmRkyC6s+AVOmJMjr65uv3BhxVcDwKeRcPGiID3dZvZsDDBAXUSfOEHRtNX48RhGgLoI37dP0cjI7McfMYwAdRGybZuWs7NR794YRoC6CFq1yqBbN70OHTCMABWE/vZbaU5OhYUVY3xcBQX7hQsdV66s+GoA+DTy3rzJe/MG/+gA6ijtwQNKTg7/lADqKP7CBS1HR/xTAqij8P37dV1d8U8JoI6CVq827NHDAUlIAJVJpcFbt1ZYhnp8AAAAAAANjJRhvvQuAHwLxMXFJenpX3ovAL4FODF9DRDj+5Zlv3p1t1evxGvXvvSOADRgiR4eHs2anVJUvO7i8vbmzS+9OwANVV5k5N2ePU/x+R5Nm6Z4en7p3QFo2LJfvbrduXNOcPCX3hGABkkiFD6ZNOmiqelFU9NLFhZvr1//0nsE0IAJs7NDdux4vmBBYXz8l94XQIzvGyUqKHizf3/g6tWZ/v4cqfRL7w5AQ5UTEpJy506ns2d73rolLiwMWL68OCXlS+8UQMMjEQiSb95svmZN5/PnS3NzY8+cYSSSL71TAA2VMCcnYOXKwri4L70jAA0VU1rKU1ExHTLE7IcfLMeM0XJy+tJ7BNBQZQcFeQ0YIBEIWmzdqmpp+aV3ByrV44Nvg6iw0KBLFwUtrbTHj7/0vgA0YIL0dKvx4zWbNmUkEr327d95e4uLi7/0TgE0QDTdeOJEeXX1ktRUjaZNzX78kUaDPIBaYSSSmJMni5OSMH4AtcaIRDqtW1u4ueFkBFAXRcnJvjNnajg4NF26lKuggMH8GmCu7rdJydBQs2nTL70XAA2eYbduum3alGUhlZQUv3un7eKiaGj4pXcKoOHhysvLq6uLCgtDd+/WadNGH93xAGor5c4dqVSqU35uAoDaYUpL33l6evbqdbdXrzf79omKijCSALUQf+5cYWyspZtbSVqaqLAQY/g1QIwPAODDEi5dEuXnO2/cKKesjPECqAVBVtarjRvzw8Pf7N3rNXBgUXIyhhHgY+XHxKQ9emQ1ZgyFTFiAOpAyDC0vr+3iwpFKXyxeHLx5M4YT nd through the PWM input, and circuitry inside the fan drives the motor. <a href=\"https://www.analog.com/en/resources/analog-dialogue/articles/how-to-control-fan-speed.html\" target=\"_blank\" rel=\"noopener\">Analog Devices&#x27; explanation of fan control<\/a> also describes why a dedicated PWM input matters. It lets the fan electronics remain powered; repeatedly switching the entire fan supply can interrupt the tachometer output along with it.<\/p><p>I can now consider the two wiring jobs separately. The 12 V supply provides energy for the motor, while the GPIO provides a logic signal. That signal needs a compatible voltage level and ground reference at the fan interface. The motor supply voltage does not define the PWM pin&#x27;s logic level. I would map each connector pin against the schematic and the fan&#x27;s pin definitions; a four-pin housing alone leaves those connections unspecified.<\/p><h2 id=\"section-2\">Frequency, Duty, and Speed<\/h2><p>The program initially configures PWM at 15 kHz with 8-bit resolution. A cycle at that frequency lasts about 66.7 μs. An ideal 50% duty keeps the signal high for about 33.3 μs of each cycle. The code maps percentages to integers from 0 to 255, so 50 becomes 127, producing approximately half duty. All of these quantities describe the pin waveform. None yet tells me how many revolutions the blades make per minute.<\/p><p>The main loop also does not have to toggle the pin for every 15 kHz pulse. As the <a href=\"https://docs.espressif.com/projects/esp-idf/en/v4.4.8/esp32/api-reference/peripherals/ledc.html\" target=\"_blank\" rel=\"noopener\">ESP32 LEDC documentation<\/a> explains, a configured channel generates PWM at the selected frequency and duty. The program can wait before writing a new duty while the peripheral continues producing the previous waveform. How often temperature processing changes a setting and how long one PWM cycle lasts are two different time scales.<\/p><p>For the frequency itself, I would start with the particular fan&#x27;s interface requirements. <a href=\"https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring\" target=\"_blank\" rel=\"noopener\">Noctua&#x27;s microcontroller guide<\/a>, for example, specifies a 25 kHz target and an accepted range of 21 to 28 kHz for its fans. It is a useful manufacturer example of what to check. The original program lets buttons change frequency in 200 Hz steps. Those steps change how often the waveform repeats; a proportional increase in fan speed does not follow from increasing that number.<\/p><h2 id=\"section-3\">Receiving a Speed Signal<\/h2><p>An actual speed reading has to travel back from the fan. <a href=\"https://cdn.noctua.at/media/Noctua_PWM_specifications_white_paper.pdf\" target=\"_blank\" rel=\"noopener\">Noctua&#x27;s PWM white paper<\/a> describes an open-collector tachometer output producing two pulses per revolution on its fans. The internal output transistor pulls the signal low when it conducts. When it switches off, an external pull-up resistor brings the line high. A controller connected to that node can count the pulses produced as the fan rotates.<\/p><p>I would choose the pull-up supply for the controller&#x27;s logic voltage and give the tachometer output and controller a common ground reference. For a worked example, a 10 kΩ resistor to 3.3 V gives approximately 0.33 mA while the output is low. That calculation helps check the current, but resistor selection also depends on the allowed sink current and the signal&#x27;s rise time. A larger resistance charges the line capacitance more slowly. Inspecting the levels and edges at the controller input would establish whether the signal can be read reliably.<\/p><p>Once the pulse count per revolution is known, the conversion is short. At two pulses per revolution, a 100 Hz tachometer signal represents 50 revolutions per second, or 3000 rpm. I explored pulse timing in the <a href=\"http://127.0.0.1:8767/preview.html?lang=en\" target=\"_blank\" rel=\"noopener\">car power and speed-feedback note<\/a>; the same counting idea applies here. I need the fan&#x27;s own pulses-per-revolution value and must keep the tachometer frequency separate from the 15 kHz control waveform.<\/p><p>Two fans introduce another wiring question. Both fan outputs in the schematic share <code>PWM<\/code>, so they receive the same control waveform. Reading each fan&#x27;s speed would require separate tachometer inputs. Reasoning from the open-collector circuit, joining both outputs would let either one pull the shared node low. Overlapping pulses would no longer identify which fan produced them. Sharing a command is convenient, while observing each fan individually requires its own feedback.<\/p><h2 id=\"section-4\">Duty and Actual Response<\/h2><p>With a speed reading available, I could compare duty and rotation directly. I would hold supply voltage and PWM frequency constant, step through duty settings, and record speed after it settles to build a response curve for that fan. Low duty deserves a closer check. Starting from rest and reducing duty on a fan that is already turning can be recorded separately, so the curve also captures the starting and low-speed behaviour that matter in use.<\/p><p>The current program displays duty after <code>Fan Speed<\/code> and does not read a tachometer input. I would label that percentage <code>PWM<\/code> and add a separate <code>RPM<\/code> reading when speed sensing is connected. One shows the setting I sent; the other shows the fan&#x27;s response. Both would be visible while adjusting the cooler, with each fan&#x27;s operation available to check individually.<\/p>","toc":[[1,"Fan Interface Wiring"],[2,"Frequency, Duty, and Speed"],[3,"Receiving a Speed Signal"],[4,"Duty and Actual Response"]]}}};
